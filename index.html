:root{--bg:#022c22;--bg2:#064e3b;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--ink:#ecfdf5;--mut:#a7f3d0;--gold:#fcd34d;--rose:#fb7185;--green:#6ee7b7;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;font-weight:700;padding:10px 18px;border-radius:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.ghost[aria-pressed="true"]{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.55);color:#fde68a}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d1fae5;border:1px solid var(--line)}
.pill.gold{background:rgba(252,211,77,.15);color:#fde68a;border-color:rgba(252,211,77,.3)}
.pill.green{background:rgba(110,231,183,.15);color:#a7f3d0;border-color:rgba(110,231,183,.3)}
.pill.rose{background:rgba(251,113,133,.15);color:#fecdd3;border-color:rgba(251,113,133,.3)}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px}
.mut{color:var(--mut)}
.small{font-size:12px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;transition:background .15s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.sel{border-color:var(--gold);background:rgba(252,211,77,.18)}
.opt.ok{border-color:var(--green);background:rgba(110,231,183,.15)}
.opt.bad{border-color:var(--rose);background:rgba(251,113,133,.15)}
.opt.locked{opacity:.4}
.translation{color:#bfdbfe;font-style:italic;font-size:14px;margin-top:6px;padding:8px 10px;background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;border-radius:6px;white-space:pre-wrap}
.translation.fa{direction:rtl;text-align:right;font-style:normal;font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.8;border-left:0;border-right:3px solid #3b82f6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tab.on{background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:24px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#fcd34d,#fb7185);border-radius:999px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loginbox{max-width:420px;margin:8vh auto}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;margin:6px 0 12px}
textarea.field{min-height:120px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.passage{max-height:46vh;overflow:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.55}
#flashcard{margin:20px 0}
.qtext{font-size:19px;font-weight:700;line-height:1.4;margin:12px 0}
.footer{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}
.marker{color:#34d399;font-weight:700}
.badmark{color:#fda4af;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.badge.ok{background:rgba(110,231,183,.18);color:#6ee7b7}
.badge.no{background:rgba(251,113,133,.18);color:#fb7185}
</style>

 celebración?", "options": ["el evento más alegre", "el evento más antiguo", "el evento más significativo", "el evento más colorido"], "correct": 2}, {"id": 51704, "question": "¿Qué día ocurre la alumbrada?", "options": ["el 2 de noviembre", "el 1 de noviembre", "el 31 de octubre", "el 12 de diciembre"], "correct": 0}, {"id": 51705, "question": "¿A partir de qué hora comienza la alumbrada?", "options": ["a partir de las 18:00 horas", "a partir de las 12:00 horas", "a partir de las 20:00 horas", "a partir de las 22:00 horas"], "correct": 0}, {"id": 51706, "question": "¿Quiénes se encaminan hacia el panteón?", "options": ["los visitantes del centro", "los habitantes de Mixquic", "los sacerdotes de la delegación", "los turistas extranjeros"], "correct": 1}, {"id": 51707, "question": "¿Hacia dónde se encaminan los habitantes de Mixquic?", "options": ["hacia el panteón", "hacia el río", "hacia la iglesia", "hacia la plaza"], "correct": 0}, {"id": 51708, "question": "¿Con qué se encaminan al panteón los habitantes?", "options": ["con coronas, listones y fotos", "con faroles, campanas y rezos", "con velas, incienso y flores", "con comida, bebida y música"], "correct": 2}, {"id": 51709, "question": "¿Dónde son iluminadas todas las tumbas?", "options": ["En la plaza del pueblo", "En el cementerio", "En las casas", "En la iglesia"], "correct": 1}, {"id": 51710, "question": "¿Qué es iluminado con velas en el cementerio?", "options": ["todas las tumbas", "todos los altares", "todas las casas", "todas las cruces"], "correct": 0}, {"id": 51711, "question": "¿Con qué son iluminadas las tumbas?", "options": ["con lámparas", "con velas", "con antorchas", "con faroles"], "correct": 1}, {"id": 51712, "question": "¿Qué se hace arder en el cementerio?", "options": ["la cera", "el copal", "el incienso", "la leña"], "correct": 2}, {"id": 51713, "question": "¿Qué crean las velas y el incienso en el cementerio?", "options": ["un ambiente festivo", "un ambiente místico", "un ambiente solemne siera vivir allí, enamorado de su belleza. Entonces creó El Mayab, la tierra de los elegidos, y sembró en ella las más bellas flores que adornaran los caminos, creó enormes cenotes cuyas aguas cristalinas reflejaran la luz del sol y también profundas cavernas llenas de misterio.", "questions": [{"id": 51900, "question": "¿Cuándo decidió Itzamná crear una tierra tan hermosa?", "options": ["Hace pocos años", "Hace mucho, pero mucho tiempo", "Al llegar los españoles", "Durante el imperio maya"], "correct": 1}, {"id": 51901, "question": "¿Quién decidió crear una tierra tan hermosa?", "options": ["Chaac", "Kukulkán", "Itzamná", "Quetzalcóatl"], "correct": 2}, {"id": 51902, "question": "¿Qué decidió crear Itzamná?", "options": ["una ciudad de piedra", "un reino de guerreros", "un mar de aguas tibias", "una tierra"], "correct": 3}, {"id": 51903, "question": "¿Cómo debía ser la tierra que quiso crear Itzamná?", "options": ["tan alta que tocara las nubes", "tan rica que tuviera oro y jade", "tan grande que abarcara todo el sur", "tan hermosa que todo aquél que la conociera quisiera vivir allí"], "correct": 3}, {"id": 51904, "question": "¿De qué se enamoraría quien conociera la tierra creada por Itzamná?", "options": ["de sus selvas", "de sus lagos", "de su belleza", "de sus riquezas"], "correct": 2}, {"id": 51905, "question": "¿Qué creó Itzamná entonces?", "options": ["El Mayab", "El Anáhuac", "El Tamoanchan", "El Xibalbá"], "correct": 0}, {"id": 51906, "question": "¿Cómo llama el texto a El Mayab?", "options": ["la tierra prometida", "la tierra de los elegidos", "la tierra del sol", "la tierra de los mayas"], "correct": 1}, {"id": 51907, "question": "¿Qué sembró Itzamná en El Mayab?", "options": ["las más dulces frutas", "las más verdes plantas", "los más altos árboles", "las más bellas flores"], "correct": 3}, {"id": 51908, "question": "¿Para qué sembró Itzamná las más bellas flores?", "options": ["perfumaran los templos", "adornaran los caminos", "cubrieran las montañas", ", "el venado", "los chilam"], "correct": 0}, {"id": 52411, "question": "¿Qué le pasó a la serpiente de cascabel al saber de la conquista?", "options": ["se entristeció", "se alegró", "se escondió", "se enojó"], "correct": 3}, {"id": 52412, "question": "¿Al saber de qué se enojó la serpiente de cascabel?", "options": ["de la conquista", "de la tristeza del venado", "de la huida del faisán", "de las palabras de los mayas"], "correct": 0}, {"id": 52413, "question": "¿Qué decidió olvidar la serpiente de cascabel?", "options": ["sus cascabeles", "su tierra", "su música", "su veneno"], "correct": 2}, {"id": 52414, "question": "¿Quién decidió luchar con los enemigos?", "options": ["el faisán", "el venado", "la serpiente de cascabel", "los chilam"], "correct": 2}, {"id": 52415, "question": "¿Qué creó la serpiente de cascabel?", "options": ["una nueva música", "un nuevo veneno", "un nuevo sonido", "un nuevo cascabel"], "correct": 2}, {"id": 52416, "question": "¿Cuándo produce la serpiente de cascabel el nuevo sonido?", "options": ["al esconderse", "al respirar", "al mover la cola", "al enrollarse"], "correct": 2}, {"id": 52417, "question": "¿Cuándo usa la serpiente de cascabel su nuevo sonido?", "options": ["al dormir", "antes de atacar", "después de comer", "al huir"], "correct": 1}, {"id": 52418, "question": "Además de olvidar su música, ¿qué decidió hacer la serpiente de cascabel?", "options": ["luchar con los enemigos", "escapar de la tierra", "avisar a los habitantes", "esconderse en la selva"], "correct": 0}]}, {"id": 25, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 7, "title": "Párrafo 7 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Como dijeron los chilam, los extranjeros conquistaron El Mayab. Pero aún así, un famoso adivino maya anunció que los tres animales elegidos por Itzamná cumplirán una importante misión en su tierra. Los mayas aún recuerdan las palabras que una vez dijo:", "questions": [{"id": 52500, "question": "¿Quiénes conquistaron El Mayab?", "options": ["los aztecas", "los extranjeros", "los olmecas", "los toltecas"], "correct": 1}, {"id": 52501, "question": "¿Qué conquistaron los extranjeros?", "options": ["los cenotes", "El Mayab", "las ciudades de piedra", "El Anáhuac"], "correct": 1}, {"id": 52502, "question": "¿Qué ocurrió tal como dijeron los chilam?", "options": ["los mayas vencieron a los extranjeros", "los animales huyeron de la tierra", "los extranjeros conquistaron El Mayab", "los dioses abandonaron El Mayab"], "correct": 2}, {"id": 52503, "question": "¿Quiénes habían dicho lo que ocurrió con El Mayab?", "options": ["los guerreros", "los caciques", "los sacerdotes", "los chilam"], "correct": 3}, {"id": 52504, "question": "¿Quién anunció la importante misión de los tres animales?", "options": ["un sacerdote de los templos", "un antiguo cacique maya", "un famoso adivino maya", "un guerrero de las ciudades"], "correct": 2}, {"id": 52505, "question": "¿Qué anunció el famoso adivino maya?", "options": ["que los dioses volverían a crear la tierra", "que los animales desaparecerían para siempre", "que los tres animales elegidos por Itzamná cumplirán una importante misión en su tierra", "que los extranjeros se irían pronto"], "correct": 2}, {"id": 52506, "question": "¿Quiénes cumplirán una importante misión según el adivino maya?", "options": ["los tres animales elegidos por Itzamná", "los chilam de El Mayab", "los mayas de las ciudades", "los dioses de las cavernas"], "correct": 0}, {"id": 52507, "question": "¿Qué cumplirán en su tierra los tres animales elegidos por Itzamná?", "options": ["una larga espera", "una dura batalla", "una antigua promesa", "una importante misión"], "correct": 3}, {"id": 52508, "question": "¿Quién eligió a los tres animales de la importante misión?", "options": ["el adivino", "los chilam", "Itzamná", "los mayas"], "correct": 2}, {"id": 52509, "question": "¿Qué recuerdan aún los mayas?", "options": ["las historias de los dioses", "las palabras que una vez dijo", "las canciones de los templos", "las voces de los ancianos"], "correct": 1}, {"id": 52510, "question": "¿Quiénes aún recuerdan las palabras que una vez dijo el adivino?", "options": ["Los aztecas", "Los extranjeros", "Los toltecas", "Los mayas"], "correct": 3}]}, {"id": 26, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 8, "title": "Párrafo 8 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "—Mientras las ceibas estén en pie y las cavernas de El Mayab sigan abiertas, habrá esperanza. Llegará el día en que recobraremos nuestra tierra, entonces los mayas deberán reunirse y combatir. Sabrán que la fecha ha llegado cuando reciban tres señales. La primera será del faisán, quien volará sobre los árboles más altos y su sombra podrá verse en todo El Mayab. La segunda señal la traerá el venado, pues atravesará esta tierra de un solo salto. La tercera mensajera será la serpiente de cascabel, que producirá música de nuevo y ésta se oirá por todas partes. Con estas tres señales, los animales avisarán a los mayas que es tiempo de recuperar la tierra que les quitaron.", "questions": [{"id": 52600, "question": "¿Qué árboles deben seguir en pie para que haya esperanza?", "options": ["los encinos", "los cedros", "las palmas", "las ceibas"], "correct": 3}, {"id": 52601, "question": "¿Qué debe pasar con las ceibas para que haya esperanza?", "options": ["florezcan cada año", "crezcan muy altas", "den buenos frutos", "estén en pie"], "correct": 3}, {"id": 52602, "question": "Además de las ceibas, ¿qué debe seguir abierto en El Mayab?", "options": ["los caminos", "las cavernas", "los templos", "los cenotes"], "correct": 1}, {"id": 52603, "question": "¿Qué deberá seguir abierto según las palabras del anuncio?", "options": ["los cenotes del Mayab", "las cavernas de El Mayab", "los caminos de la selva", "los templos de los mayas"], "correct": 1}, {"id": 52604, "question": "¿Qué habrá mientras las ceibas estén en pie y las cavernas sigan abiertas?", "options": ["esperanza", "miedo", "guerra", "tristeza"], "correct": 0}, {"id": 52605, "question": "Según el anuncio, ¿qué recobrarán los mayas cuando llegue el día?", "options": ["sus cenotes", "sus ciudades", "sus templos", "nuestra tierra"], "correct": 3}, {"id": 52606, "question": "¿Qué deberán hacer los mayas según el anuncio?", "options": ["esconderse y esperar", "sembrar y cosechar", "reunirse y combatir", "huir y ocultarse"], "correct": 2}, {"id": 52607, "question": "¿Cuántas señales recibirán los mayas?", "options": ["dos señales", "cuatro señales", "siete señales", "tres señales"], "correct": 3}, {"id": 52608, "question": "¿Cómo sabrán los mayas que la fecha ha llegado?", "options": ["cuando reciban tres señales", "cuando florezcan las ceibas", "cuando canten los pájaros", "cuando se sequen los cenotes"], "correct": 0}, {"id": 52609, "question": "¿De qué animal será la primera señal?", "options": ["de la serpiente", "del faisán", "del águila", "del venado"], "correct": 1}, {"id": 52610, "question": "¿Sobre qué volará el faisán en la primera señal?", "options": ["sobre los árboles más altos", "sobre los cenotes del Mayab", "sobre las cavernas abiertas", "sobre las ciudades de piedra"], "correct": 0}, {"id": 52611, "question": "¿Qué podrá verse del faisán cuando vuele en la primera señal?", "options": ["su sombra", "su figura", "su vuelo", "su color"], "correct": 0}, {"id": 52612, "question": "¿Dónde podrá verse la sombra del faisán?", "options": ["en todas las ciudades", "en todo El Mayab", "en toda la selva", "en todas las cavernas"], "correct": 1}, {"id": 52613, "question": "¿Qué animal traerá la segunda señal?", "options": ["el faisán", "el venado", "la serpiente", "el jaguar"], "correct": 1}, {"id": 52614, "question": "¿Cómo atravesará el venado la tierra en la segunda señal?", "options": ["de un solo golpe", "de un solo vuelo", "en una sola noche", "de un solo salto"], "correct": 3}, {"id": 52615, "question": "¿Qué atravesará el venado de un solo salto?", "options": ["el río", "las montañas", "esta tierra", "la selva"], "correct": 2}, {"id": 52616, "question": "¿Qué animal será la tercera mensajera?", "options": ["la serpiente de cascabel", "la iguana", "la araña", "la tortuga"], "correct": 0}, {"id": 52617, "question": "¿Qué producirá de nuevo la serpiente de cascabel?", "options": ["música", "su cascabel", "su veneno", "su ataque"], "correct": 0}, {"id": 52618, "question": "¿Dónde se oirá la música que producirá de nuevo la serpiente?", "options": ["en la selva", "en los pueblos", "por todas partes", "en las cavernas"], "correct": 2}, {"id": 52619, "question": "¿Quiénes avisarán a los mayas con las tres señales?", "options": ["los chilam", "los animales", "los dioses", "los adivinos"], "correct": 1}, {"id": 52620, "question": "¿A quiénes avisarán los animales con las tres señales?", "options": ["a los mayas", "a los invasores", "a los extranjeros", "a los sacerdotes"], "correct": 0}, {"id": 52621, "question": "Con las tres señales, ¿de qué será tiempo según el aviso a los mayas?", "options": ["de recuperar la tierra que les quitaron", "de abandonar El Mayab", "de sembrar nuevas flores", "de construir nuevas ciudades"], "correct": 0}, {"id": 52622, "question": "Según el aviso a los mayas, ¿qué les quitaron?", "options": ["los animales", "las cavernas", "las ceibas", "la tierra"], "correct": 3}, {"id": 52623, "question": "¿Qué será la serpiente de cascabel en las señales anunciadas?", "options": ["La última esperanza", "La guardiana de las ceibas", "La tercera mensajera", "La primera señal"], "correct": 2}, {"id": 52624, "question": "¿Qué señal traerá el venado según el anuncio?", "options": ["La tercera señal", "La última señal", "La primera señal", "La segunda señal"], "correct": 3}]}, {"id": 27, "passage_id": 5, "passage": "Los volcanes", "paragraph": 1, "title": "Párrafo 1 · Los volcanes", "topic": "Leyendas y geografía", "text": "Hace ya miles de lunas, existió en nuestro mundo un joven destacado en las artes de la guerra, famoso por sus hazañas, quien un día en su caminar se encontró con una hermosa joven de la que quedó inmediatamente enamorado. Decidió ir para con el padre de ella y poder unir sus vidas para siempre, sin embargo, el padre de ella era un hombre poco destacado en la guerra y toma una decisión a su favor.", "questions": [{"id": 52700, "question": "¿Cuándo existió un joven destacado en las artes de la guerra?", "options": ["Hace ya cientos de años", "Hace ya pocos años", "Hace ya miles de lunas", "Hace ya muchos siglos"], "correct": 2}, {"id": 52701, "question": "¿En qué era destacado el joven?", "options": ["en la música", "en las artes de la guerra", "en la agricultura", "en el arte de la pintura"], "correct": 1}, {"id": 52702, "question": "¿Qué lo hacía famoso?", "options": ["sus riquezas", "su belleza", "sus hazañas", "su sabiduría"], "correct": 2}, {"id": 52703, "question": "¿Qué sucedió un día en su caminar?", "options": ["se encontró con un guerrero enemigo", "se encontró con un mercader extranjero", "se encontró con una hermosa joven", "se encontró con un viejo sacerdote"], "correct": 2}, {"id": 52704, "question": "¿Cómo era la joven que encontró el joven?", "options": ["triste", "extranjera", "hermosa", "pobre"], "correct": 2}, {"id": 52705, "question": "¿Qué quedó el joven al encontrar a la joven?", "options": ["muy confundido", "inmediatamente enamorado", "muy triste", "muy enojado"], "correct": 1}, {"id": 52706, "question": "¿Quién decidió ir para con el padre de ella?", "options": ["un joven destacado en las artes de la guerra", "un sacerdote del templo", "un comerciante de la costa", "un anciano sabio del pueblo"], "correct": 0}, {"id": 52707, "question": "¿Qué quería el joven al ir con el padre de la joven?", "options": ["poder unir sus vidas para siempre", "pedir perdón", "obtener riquezas", "conseguir tierras"], "correct": 0}, {"id": 52708, "question": "¿En qué era poco destacado el padre de ella?", "options": ["en el comercio", "en la guerra", "en la agricultura", "en la caza"], "correct": 1}, {"id": 52709, "question": "¿Qué tomó el padre de la joven?", "options": ["una decisión sin consultar a nadie", "una decisión de huir de la guerra", "una decisión en contra del pueblo", "una decisión a su favor"], "correct": 3}, {"id": 52710, "question": "¿Quién era poco destacado en la guerra?", "options": ["el padre de ella", "el jefe del pueblo", "el joven guerrero", "el sacerdote del templo"], "correct": 0}, {"id": 52711, "question": "¿Qué palabra introduce el contraste sobre el padre?", "options": ["después", "además", "por eso", "sin embargo"], "correct": 3}, {"id": 52712, "question": "¿Por cuánto tiempo querían unir sus vidas?", "options": ["por unas lunas", "para siempre", "por un año", "hasta la guerra"], "correct": 1}]}, {"id": 28, "passage_id": 5, "passage": "Los volcanes", "paragraph": 2, "title": "Párrafo 2 · Los volcanes", "topic": "Leyendas y geografía", "text": "Daría la mano de su hija a aquel joven guerrero a cambio de que luchara en favor de su guerra; él decidió aceptar, pues lo prometido era regresar victoriosos y obtener el amor de aquella joven. Fue una guerra prolongada y no se veía la llegada del guerrero, la joven comenzó a angustiarse y a sufrir por amor.", "questions": [{"id": 52800, "question": "¿Qué daría el padre a aquel joven guerrero?", "options": ["la mano de su hija", "la mitad de sus tierras", "una casa en el valle", "sus mejores armas"], "correct": 0}, {"id": 52801, "question": "¿A cambio de qué daría el padre la mano de su hija?", "options": ["a cambio de tierras fértiles", "a cambio de que luchara en favor de su guerra", "a cambio de un tributo anual", "a cambio de oro y plata"], "correct": 1}, {"id": 52802, "question": "¿Qué decidió hacer el joven guerrero?", "options": ["decidió olvidar a la joven", "decidió aceptar", "decidió casarse en secreto", "decidió escapar"], "correct": 1}, {"id": 52803, "question": "¿Qué era lo prometido por el joven guerrero?", "options": ["regresar victoriosos", "regresar con riquezas", "regresar sin heridas", "regresar al templo"], "correct": 0}, {"id": 52804, "question": "¿Qué obtendría el joven al regresar?", "options": ["un puesto en el templo", "el amor de aquella joven", "el perdón del padre", "la tierra del cacique"], "correct": 1}, {"id": 52805, "question": "¿Cómo fue la guerra en la que luchaba el joven?", "options": ["una guerra sin batallas", "una guerra sangrienta", "una guerra prolongada", "una guerra breve"], "correct": 2}, {"id": 52806, "question": "¿Qué no se veía en la guerra?", "options": ["el fin de la batalla", "la llegada de los refuerzos", "la llegada de los mensajeros", "la llegada del guerrero"], "correct": 3}, {"id": 52807, "question": "¿Qué comenzó a hacer la joven mientras esperaba?", "options": ["a cantar en el templo", "a viajar al sur", "a bailar en la plaza", "a angustiarse"], "correct": 3}, {"id": 52808, "question": "¿Por qué sufría la joven?", "options": ["por amor", "por hambre", "por el frío", "por una enfermedad"], "correct": 0}, {"id": 52809, "question": "¿Qué debía hacer el joven a cambio de la mano de la joven?", "options": ["construyera un templo", "luchara en favor de su guerra", "abandonara su pueblo", "entregara sus tierras"], "correct": 1}, {"id": 52810, "question": "¿Qué hacía la joven mientras el guerrero no llegaba?", "options": ["cantar en el templo", "sufrir por amor", "luchar en la guerra", "viajar al sur"], "correct": 1}]}, {"id": 29, "passage_id": 5, "passage": "Los volcanes", "paragraph": 3, "title": "Párrafo 3 · Los volcanes", "topic": "Leyendas y geografía", "text": "Llegó a sus oídos la versión de que el joven guerrero había muerto en batalla y la joven se enferma de dolor del alma, angustiadas noches pasó hasta que una mañana su padre entristecido la encontró sumida en el sueño eterno. La mañana siguiente el sol relumbraba el valle y se escucharon llegar sonidos de victoria, era el ejército de su pueblo acercándose a sus hogares; frente a los guerreros, avanzaba fuertemente el joven con una enorme alegría de que ahora sí podría ser feliz a lado de su amada.", "questions": [{"id": 52900, "question": "¿Qué llegó a oídos de la joven?", "options": ["la versión de que la guerra había terminado", "la versión de que el joven guerrero había muerto en batalla", "la versión de que el joven guerrero había sido capturado", "la versión de que el padre había enfermado"], "correct": 1}, {"id": 52901, "question": "¿De qué se enfermó la joven?", "options": ["de dolor del alma", "de una herida profunda", "de fiebre alta", "de mal de ojo"], "correct": 0}, {"id": 52902, "question": "¿Quién encontró a la joven una mañana?", "options": ["su abuela", "su padre entristecido", "un sacerdote del templo", "un vecino del pueblo"], "correct": 1}, {"id": 52903, "question": "¿Cómo encontró su padre a la joven?", "options": ["sumida en el sueño eterno", "despierta y alegre", "en plena fiesta", "recuperada de su enfermedad"], "correct": 0}, {"id": 52904, "question": "¿Qué relumbraba el valle la mañana siguiente?", "options": ["la nieve", "la luna", "el sol", "el fuego"], "correct": 2}, {"id": 52905, "question": "¿Qué se escuchó llegar la mañana siguiente?", "options": ["sonidos de victoria", "sonidos de campanas", "sonidos de tambores", "sonidos de lamento"], "correct": 0}, {"id": 52906, "question": "¿Qué era el ejército que se acercaba?", "options": ["el ejército de su pueblo", "una caravana de mercaderes", "un grupo de peregrinos", "un ejército enemigo"], "correct": 0}, {"id": 52907, "question": "¿A dónde se acercaba el ejército de su pueblo?", "options": ["al templo del valle", "al mercado de la ciudad", "a la frontera del norte", "a sus hogares"], "correct": 3}, {"id": 52908, "question": "¿Quién avanzaba frente a los guerreros?", "options": ["el padre", "el sacerdote", "el cacique", "el joven"], "correct": 3}, {"id": 52909, "question": "¿Con qué sentimiento avanzaba el joven?", "options": ["miedo", "tristeza", "enojo", "una enorme alegría"], "correct": 3}, {"id": 52910, "question": "¿Qué esperaba el joven poder ser?", "options": ["libre", "rico", "famoso", "feliz"], "correct": 3}, {"id": 52911, "question": "¿Con quién quería ser feliz el joven?", "options": ["en el templo", "en el palacio", "en el valle", "a lado de su amada"], "correct": 3}, {"id": 52912, "question": "¿Qué pasó la mañana siguiente en el valle?", "options": ["se apagó el fuego sagrado", "el sol relumbraba el valle", "llegó un ejército enemigo", "llovió sobre el pueblo"], "correct": 1}]}, {"id": 30, "passage_id": 5, "passage": "Los volcanes", "paragraph": 4, "title": "Párrafo 4 · Los volcanes", "topic": "Leyendas y geografía", "text": "Su corazón se rompió al encontrarse tan lamentable noticia. El enamorado gritó al cielo pidiendo explicaciones a los dioses, y tomó el cuerpo de su amada y subió al valle, ahí la recostó en la cima y decidió velar su sueño eterno con una antorcha encendida.", "questions": [{"id": 53000, "question": "¿Qué se rompió al enterarse de la noticia?", "options": ["Su lanza", "Su voz", "Su corazón", "Su escudo"], "correct": 2}, {"id": 53001, "question": "¿A quién le pidió explicaciones el enamorado?", "options": ["al cacique del pueblo", "a los dioses", "a los sacerdotes", "a su padre"], "correct": 1}, {"id": 53002, "question": "¿Qué gritó el enamorado al cielo?", "options": ["pidiendo ayuda a sus soldados", "pidiendo perdón por sus pecados", "pidiendo la lluvia para el valle", "pidiendo explicaciones a los dioses"], "correct": 3}, {"id": 53003, "question": "¿Qué tomó el enamorado?", "options": ["la antorcha de su padre", "las armas de sus soldados", "el escudo del guerrero", "el cuerpo de su amada"], "correct": 3}, {"id": 53004, "question": "¿A dónde subió el enamorado?", "options": ["subió a la montaña del norte", "subió al templo del pueblo", "subió al valle", "subió a la playa"], "correct": 2}, {"id": 53005, "question": "¿Dónde recostó el enamorado a su amada?", "options": ["en la plaza del pueblo", "en el templo", "en la cima", "en la playa"], "correct": 2}, {"id": 53006, "question": "¿Qué decidió velar el enamorado?", "options": ["su nombre", "su herida", "su sueño eterno", "su tristeza"], "correct": 2}, {"id": 53007, "question": "¿Con qué velaba el enamorado el sueño de su amada?", "options": ["con un fuego de leña", "con una antorcha encendida", "con flores de cempasúchil", "con una vela blanca"], "correct": 1}]}, {"id": 31, "passage_id": 5, "passage": "Los volcanes", "paragraph": 5, "title": "Párrafo 5 · Los volcanes", "topic": "Leyendas y geografía", "text": "Los dioses al ver aquel acto de amor, decidieron eternizar a la pareja cubriendo de nieve sus cuerpos y petrificándolos por la eternidad. Y ahí sigue la mujer dormida y a un lado su guerrero enamorado con su antorcha de fuego. Con el paso de los siglos aún podemos observar a esos dos enamorados, en dos grandes montañas conocidas como Iztaccíhuatl y Popocatépetl.", "questions": [{"id": 53100, "question": "¿Qué decidieron hacer los dioses al ver aquel acto de amor?", "options": ["separar a la pareja", "castigar al enamorado", "eternizar a la pareja", "revivir a la joven"], "correct": 2}, {"id": 53101, "question": "¿Qué cubrieron de nieve los dioses?", "options": ["el valle entero", "las montañas del norte", "el templo del pueblo", "sus cuerpos"], "correct": 3}, {"id": 53102, "question": "¿Cómo quedaron los cuerpos de la pareja?", "options": ["enterrados bajo el templo", "convertidos en árboles", "petrificándolos por la eternidad", "llevados al cielo entre nubes"], "correct": 2}, {"id": 53103, "question": "¿Por cuánto tiempo fueron petrificados los cuerpos?", "options": ["hasta el próximo eclipse", "por la eternidad", "por unos cuantos años", "por varios siglos"], "correct": 1}, {"id": 53104, "question": "¿Quién sigue dormida?", "options": ["el cacique del pueblo", "la mujer dormida", "el sacerdote del templo", "el guerrero enamorado"], "correct": 1}, {"id": 53105, "question": "¿Con qué sostiene su antorcha el guerrero enamorado?", "options": ["con su antorcha de fuego", "con un escudo de madera", "con una flor blanca", "con una lanza de obsidiana"], "correct": 0}, {"id": 53106, "question": "¿Dónde está el guerrero enamorado respecto a la mujer dormida?", "options": ["a un lado", "frente a ella", "encima de ella", "detrás de ella"], "correct": 0}, {"id": 53107, "question": "¿Con el paso de qué se pueden observar a los dos enamorados?", "options": ["Con el paso de los eclipses", "Con el paso de los siglos", "Con el paso de los años", "Con el paso de las estaciones"], "correct": 1}, {"id": 53108, "question": "¿En qué se pueden observar a esos dos enamorados?", "options": ["en dos grandes montañas", "en dos grandes valles", "en dos grandes lagos", "en dos grandes cuevas"], "correct": 0}, {"id": 53109, "question": "¿Cómo se conocen esas dos grandes montañas?", "options": ["Nevado de Toluca y Malinche", "Ajusco y Tláloc", "Iztaccíhuatl y Popocatépetl", "Cofre de Perote y Pico de Orizaba"], "correct": 2}, {"id": 53110, "question": "¿Qué acto observaron los dioses?", "options": ["aquella batalla feroz", "aquel acto de amor", "aquella fiesta del valle", "aquel sacrificio en el templo"], "correct": 1}]}, {"id": 32, "passage_id": 5, "passage": "Los volcanes", "paragraph": 6, "title": "Párrafo 6 · Los volcanes", "topic": "Leyendas y geografía", "text": "Nota: El Popocatépetl e Iztaccíhuatl son icónicos por su forma que asemeja una pareja de enamorados. El guerrero lleva por nombre Popocatépetl del náhuatl popo-ca ‘que humea’ y te-petl ‘montaña o monte’, debido a que desde tiempos prehispánicos permanece activo. Mientras que la princesa llamada Iztaccíhuatl, del náhuatl Iztac, ‘blanco’ y ‘cihuatl ‘mujer’, porque asemeja a la figura de una mujer dormida cubierta de un manto blanco. Ubicados en los límites de la Ciudad de México y Puebla. La pareja de volcanes están unidos por la parte norte, mediante un paso montañoso conocido como Paso de Cortés.", "questions": [{"id": 53200, "question": "¿Por qué son icónicos el Popocatépetl e Iztaccíhuatl?", "options": ["por las nieves que los cubren todo el año", "por su forma que asemeja una pareja de enamorados", "por su altura sobre el nivel del mar", "por los templos que tienen en sus laderas"], "correct": 1}, {"id": 53201, "question": "¿Qué asemeja la forma de los volcanes?", "options": ["un grupo de guerreros", "un par de templos", "una familia de cazadores", "una pareja de enamorados"], "correct": 3}, {"id": 53202, "question": "¿Qué significa popo-ca según la nota?", "options": ["‘que cae’", "‘que brilla’", "‘que duerme’", "‘que humea’"], "correct": 3}, {"id": 53203, "question": "¿Qué significa te-petl según la nota?", "options": ["‘cueva o caverna’", "‘valle o llanura’", "‘río o lago’", "‘montaña o monte’"], "correct": 3}, {"id": 53204, "question": "¿Por qué se llama Popocatépetl?", "options": ["debido a que surgió de un lago", "debido a que está cubierto de nieve", "debido a que tiene forma de guerrero", "debido a que desde tiempos prehispánicos permanece activo"], "correct": 3}, {"id": 53205, "question": "¿Qué significa Iztac según la nota?", "options": ["‘alto’", "‘blanco’", "‘dulce’", "‘frío’"], "correct": 1}, {"id": 53206, "question": "¿Qué significa cihuatl según la nota?", "options": ["‘montaña’", "‘niña’", "‘guerrero’", "‘mujer’"], "correct": 3}, {"id": 53207, "question": "¿Por qué se asemeja la princesa a una figura?", "options": ["porque asemeja a la figura de un guerrero armado", "porque asemeja a la figura de un sacerdote", "porque asemeja a la figura de una mujer dormida cubierta de un manto blanco", "porque asemeja a la figura de una diosa de la lluvia"], "correct": 2}, {"id": 53208, "question": "¿Dónde están ubicados los volcanes?", "options": ["en los límites de Oaxaca y Morelos", "en los límites de Veracruz y Tlaxcala", "en los límites de Hidalgo y Estado de México", "en los límites de la Ciudad de México y Puebla"], "correct": 3}, {"id": 53209, "question": "¿Por qué parte están unidos los volcanes?", "options": ["por la parte este", "por la parte oeste", "por la parte sur", "por la parte norte"], "correct": 3}, {"id": 53210, "question": "¿Qué paso montañoso une a los volcanes?", "options": ["Paso del Águila", "Paso de Piedra", "Paso de Cortés", "Paso de Tlamacas"], "correct": 2}, {"id": 53211, "question": "¿Mediante qué paso montañoso están unidos los volcanes?", "options": ["un paso montañoso conocido como Paso de Cortés", "un paso montañoso conocido como Paso del Águila", "un paso montañoso conocido como Paso de Piedra", "un paso montañoso conocido como Paso de Tlamacas"], "correct": 0}, {"id": 53212, "question": "¿Desde cuándo permanece activo el Popocatépetl?", "options": ["desde el siglo pasado", "desde tiempos prehispánicos", "desde la conquista española", "desde el año 1543"], "correct": 1}]}, {"id": 33, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 1, "title": "Párrafo 1 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "¿Qué es un cenote? Es un pozo de agua dulce que se forma por el desgaste o erosión de las rocas calizas.", "questions": [{"id": 53300, "question": "¿Qué es un cenote según el texto?", "options": ["una cueva sin agua", "un pozo de agua dulce", "un lago de agua salada", "un río subterráneo"], "correct": 1}, {"id": 53301, "question": "¿Qué tipo de agua tiene un cenote?", "options": ["agua dulce", "agua termal", "agua de lluvia", "agua salada"], "correct": 0}, {"id": 53302, "question": "¿Qué fenómeno hace que se forme un cenote?", "options": ["erosión", "volcanismo", "terremoto", "inundación"], "correct": 0}, {"id": 53303, "question": "¿Por qué se forma un cenote?", "options": ["por el desgaste o erosión de las rocas calizas", "por la construcción de presas", "por el choque de dos placas", "por la actividad de un volcán"], "correct": 0}, {"id": 53304, "question": "¿Qué tipo de rocas forman un cenote?", "options": ["rocas calizas", "rocas volcánicas", "rocas graníticas", "rocas de arcilla"], "correct": 0}, {"id": 53305, "question": "¿Qué se forma por el desgaste o erosión de las rocas calizas?", "options": ["una montaña de piedra", "un río de agua salada", "un pozo de agua dulce", "una playa de arena"], "correct": 2}]}, {"id": 34, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 2, "title": "Párrafo 2 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Ubicado en el interior de la ciudad de Valladolid, Yucatán el cenote Zací es una impresionante caverna, parcialmente colapsada, de unos 45 metros de diámetro.", "questions": [{"id": 53400, "question": "¿Dónde está ubicado el cenote Zací?", "options": ["en las afueras de Campeche", "en el interior de la ciudad de Valladolid, Yucatán", "en la costa de Quintana Roo", "en el centro de la ciudad de Mérida"], "correct": 1}, {"id": 53401, "question": "¿Qué es el cenote Zací?", "options": ["un lago artificial", "un río subterráneo", "un templo maya", "una impresionante caverna"], "correct": 3}, {"id": 53402, "question": "¿Cómo está la caverna del cenote Zací?", "options": ["parcialmente colapsada", "recién construida", "completamente seca", "totalmente cubierta de agua"], "correct": 0}, {"id": 53403, "question": "¿Cuál es el diámetro aproximado del cenote Zací?", "options": ["unos 100 metros de diámetro", "unos 5 metros de diámetro", "unos 15 metros de diámetro", "unos 45 metros de diámetro"], "correct": 3}, {"id": 53404, "question": "¿En qué estado se encuentra Valladolid?", "options": ["Yucatán", "Quintana Roo", "Tabasco", "Campeche"], "correct": 0}, {"id": 53405, "question": "¿Cómo describe el texto la caverna del cenote Zací?", "options": ["pequeña", "impresionante", "oscura", "abandonada"], "correct": 1}, {"id": 53406, "question": "¿En qué ciudad está el cenote Zací?", "options": ["Campeche", "Valladolid", "Mérida", "Tulum"], "correct": 1}]}, {"id": 35, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 3, "title": "Párrafo 3 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Durante el imperio de los Cupules y los Cocomes se fundó, en 1543, la ciudad maya de Zací (gavilán blanco) en lo que en la actualidad es la ciudad de Valladolid, Yucatán. Dentro de la ciudad se encontraba este cenote, y sobre su bóveda se encontraba la vivienda de la curandera y hechicera del pueblo. Era la patrona de la familia Cocom; una anciana poderosa e influyente. Desde siempre, habían existido en Zací dos familias que se disputaban permanentemente el poder. El cacique Halach-Huinic (el hombre verdadero) era el que gobernaba en ese tiempo, y tenía un hijo llamado Hul-Kin (rayo de sol), perteneciente a la familia de los cupules.", "questions": [{"id": 53500, "question": "¿Durante qué imperio se fundó la ciudad maya de Zací?", "options": ["el imperio de los Itzá", "el imperio de los Tutul Xiú", "el imperio de los Mexicas", "el imperio de los Cupules y los Cocomes"], "correct": 3}, {"id": 53501, "question": "¿En qué año se fundó la ciudad maya de Zací?", "options": ["en 1600", "en 1492", "en 1543", "en 1521"], "correct": 2}, {"id": 53502, "question": "¿Qué significa Zací según el texto?", "options": ["pueblo de piedra", "valle del agua", "ciudad sagrada", "gavilán blanco"], "correct": 3}, {"id": 53503, "question": "¿En qué ciudad actual se encuentra Zací?", "options": ["la ciudad de Campeche", "la ciudad de Tulum", "la ciudad de Mérida, Yucatán", "la ciudad de Valladolid, Yucatán"], "correct": 3}, {"id": 53504, "question": "¿Dónde se encontraba la vivienda de la curandera?", "options": ["en las afueras de la ciudad", "sobre su bóveda", "junto a la plaza principal", "dentro del templo mayor"], "correct": 1}, {"id": 53505, "question": "¿Qué era la anciana del pueblo?", "options": ["sacerdotisa del templo", "cacique de la ciudad", "guerrera de la familia", "curandera y hechicera"], "correct": 3}, {"id": 53506, "question": "¿De qué familia era patrona la anciana?", "options": ["la familia Cupul", "la familia Xiú", "la familia Cocom", "la familia Canul"], "correct": 2}, {"id": 53507, "question": "¿Cómo describe el texto a la anciana?", "options": ["una anciana sabia y tranquila", "una anciana pobre y olvidada", "una anciana enferma y débil", "una anciana poderosa e influyente"], "correct": 3}, {"id": 53508, "question": "¿Qué existía desde siempre en Zací?", "options": ["una alianza entre todas las familias", "dos familias que se disputaban permanentemente el poder", "un consejo de ancianos sabios", "una sola familia que gobernaba"], "correct": 1}, {"id": 53509, "question": "¿Qué se disputaban permanentemente las dos familias?", "options": ["el poder", "las tierras", "el comercio", "el agua del cenote"], "correct": 0}, {"id": 53510, "question": "¿Quién gobernaba Zací en ese tiempo?", "options": ["El sacerdote mayor", "El cacique Hul-Kin", "El cacique Halach-Huinic", "La hechicera"], "correct": 2}, {"id": 53511, "question": "¿Quién era el hijo del cacique Halach-Huinic?", "options": ["Popocatépetl", "Hul-Kin", "Iztac", "Sac-Nicte"], "correct": 1}, {"id": 53512, "question": "¿A qué familia pertenecía Hul-Kin?", "options": ["la familia de los cocomes", "la familia de los cupules", "la familia de los canules", "la familia de los xiúes"], "correct": 1}, {"id": 53513, "question": "¿Qué significa Hul-Kin según el texto?", "options": ["flor blanca", "gavilán blanco", "rayo de sol", "el hombre verdadero"], "correct": 2}, {"id": 53514, "question": "¿Qué significa Halach-Huinic según el texto?", "options": ["flor blanca", "rayo de sol", "el hombre verdadero", "gavilán blanco"], "correct": 2}]}, {"id": 36, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 4, "title": "Párrafo 4 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "La nieta de la hechicera se había quedado huérfana al nacer, y por ello la abuela la quería doblemente, ya que en ella cifraba el amor a su hija y a su propia nieta, la hermosa “Sac-Nicte” (flor blanca), quien le habría de alegrar la vida en su ancianidad.", "questions": [{"id": 53600, "question": "¿Por qué se quedó huérfana la nieta de la hechicera?", "options": ["al nacer", "en la guerra", "por una enfermedad", "por un accidente en el cenote"], "correct": 0}, {"id": 53601, "question": "¿Cómo quería la abuela a su nieta?", "options": ["igual que a los demás", "menos que a su hija", "con indiferencia", "doblemente"], "correct": 3}, {"id": 53602, "question": "¿Qué cifraba la abuela en su nieta?", "options": ["el poder del cenote", "la riqueza de la familia", "el amor a su hija", "la esperanza de un nuevo templo"], "correct": 2}, {"id": 53603, "question": "¿Cómo se llamaba la nieta de la hechicera?", "options": ["Sac-Nicte", "Zací", "Iztac", "Hul-Kin"], "correct": 0}, {"id": 53604, "question": "¿Qué significa Sac-Nicte según el texto?", "options": ["flor blanca", "rayo de sol", "gavilán blanco", "el hombre verdadero"], "correct": 0}, {"id": 53605, "question": "¿Qué le habría de alegrar a la abuela?", "options": ["la llegada de la primavera", "la vida en su ancianidad", "la boda de su nieta", "la vida en la ciudad"], "correct": 1}, {"id": 53606, "question": "¿En qué etapa de la vida de la abuela le habría de alegrar la vida Sac-Nicte?", "options": ["en su juventud", "en su madurez", "en su niñez", "en su ancianidad"], "correct": 3}]}, {"id": 37, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 5, "title": "Párrafo 5 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Al principio, Hul-Kin y Sac-Nicte parecían odiarse y peleaban constantemente. Sin embargo, al llegar a su juventud, surgió entre ellos una amistad que más tarde se convirtió en un apasionado amor, siendo más grande y avasallador el sentimiento de ella hacia al príncipe, pues Sac-Nicte era inocente y pura. Sin saberlo ni la hechicera ni el cacique, ellos se veían a escondidas, y al cabo de unos meses ella entrego su virginidad y pureza. A pesar de que guardaban en secreto su amor, el cacique se enteró y, enfurecido, envió a su hijo a un pueblo del sur de la península, con cuyo cacique ya había tratado una alianza: casar a Hul-Kin con la princesa de aquel lugar.", "questions": [{"id": 53700, "question": "¿Cómo parecían al principio Hul-Kin y Sac-Nicte?", "options": ["parecían odiarse", "parecían enamorados", "parecían indiferentes", "parecían amigos desde niños"], "correct": 0}, {"id": 53701, "question": "¿Qué surgió entre ellos al llegar a su juventud?", "options": ["una amistad", "una rivalidad comercial", "una enemistad profunda", "una alianza familiar"], "correct": 0}, {"id": 53702, "question": "¿En qué se convirtió la amistad entre ellos?", "options": ["un odio eterno", "una simple costumbre", "una alianza política", "un apasionado amor"], "correct": 3}, {"id": 53703, "question": "¿Cuál era el sentimiento más grande y avasallador?", "options": ["el sentimiento de los pueblos hacia el cenote", "el sentimiento de ella hacia al príncipe", "el sentimiento de él hacia la hechicera", "el sentimiento del cacique hacia su hijo"], "correct": 1}, {"id": 53704, "question": "¿Cómo era Sac-Nicte?", "options": ["inocente y pura", "fría y calculadora", "cruel y ambiciosa", "orgullosa y altiva"], "correct": 0}, {"id": 53705, "question": "¿Quiénes no sabían que se veían?", "options": ["los vecinos del pueblo", "los guerreros de Zací", "los sacerdotes del templo", "la hechicera ni el cacique"], "correct": 3}, {"id": 53706, "question": "¿Dónde se veían Hul-Kin y Sac-Nicte?", "options": ["junto al cenote a la luz del día", "en el templo", "a escondidas", "en la plaza del pueblo"], "correct": 2}, {"id": 53707, "question": "¿Qué entregó Sac-Nicte a Hul-Kin?", "options": ["su herencia familiar", "su virginidad y pureza", "su promesa de matrimonio", "sus joyas de jade"], "correct": 1}, {"id": 53708, "qu </script>
<script>
(function(){
"use strict";
var D = window.__APP_DATA__;
var APP_VERSION = "2026-10-09-683q-474l-8d36d6fae3"; // inyectado por build_standalone.py
var HIST = D.hist;       // Spanish questions with _en and _fa translation fields
var LEC = D.lectura;     // 39 párrafos de lectura, cada uno con sus preguntas (sin traducción todavía)
var LEC_Q = {};          // id de pregunta -> pregunta de lectura
var LEC_PARA = {};       // id de pregunta -> párrafo al que pertenece
LEC.forEach(function(p){ p.questions.forEach(function(q){ LEC_Q[q.id]=q; LEC_PARA[q.id]=p; }); });
var IW = D.iw;           // {interview:[{question,tip}], writing:[], writingChecklist:[], writingWordRange:[]}
var TRANSLATION = "";   // "", "en", or "fa"
var FA_CACHE = loadFarsiCache();
var FA_LOADING = false;
var FA_ERROR = "";
var FA_LAST_VIEW = "";
var phone = localStorage.getItem("nmx_phone") || "";
var DB = loadDB();
// {id_antiguo: id_conservado, ...} — inyectado por build_standalone.py a partir
// de data/dedupe_remap.json. Se define ANTES de migrateDataVersion() porque
// con var se usa después de la asignación.
var FC_REMAP = {"74": 73, "99": 719, "104": 17, "122": 630, "129": 632, "135": 628, "139": 638, "164": 607, "185": 622, "223": 1, "259": 5, "347": 562, "510": 20, "584": 621, "599": 53, "635": 134, "639": 141, "640": 142, "643": 146, "646": 155, "649": 158, "650": 159, "655": 149, "657": 227, "658": 567, "659": 594, "666": 244, "668": 252, "670": 263, "671": 268, "672": 270, "677": 303, "679": 329, "683": 334, "686": 344, "690": 588, "694": 364, "695": 427, "699": 445, "702": 499, "708": 53, "709": 61, "717": 92, "718": 94, "724": 115};
// ¿Cambió la versión de datos desde la última visita? Las migraciones que se
// aplican una sola vez (p. ej. desbloquear tarjetas bloqueadas por builds
// anteriores) deben correr únicamente cuando esto es verdadero: si se repiten en
// cada carga borran el historial recién guardado y la misma tarjeta vuelve a
// salir todos los días aunque se responda bien.
var DATA_VERSION_CHANGED = DB.dataVersion !== APP_VERSION;
// Se declara aquí (antes de las migraciones, que ya guardan) para no perder el
// error de un guardado fallido; saveDB() vive más abajo.
var DB_SAVE_ERROR = "";
migrateDataVersion();
migrateFlashcards();

function key(){ return "nmx_db_" + (phone||"").trim(); }
function loadDB(){
  try {
    var db = JSON.parse(localStorage.getItem(key()) || "{}") || {};
    if(!db.flashcards || typeof db.flashcards !== "object") db.flashcards={};
    if(!db.simSeen || typeof db.simSeen !== "object") db.simSeen={};
    if(!db.bankAdded || typeof db.bankAdded !== "object") db.bankAdded={};
    if(!db.correctDays || typeof db.correctDays !== "object") db.correctDays={};
    if(!Array.isArray(db.attempts)) db.attempts=[];
    if(!db.daily || typeof db.daily !== "object") db.daily={};
    if(!db.lecParas || typeof db.lecParas !== "object") db.lecParas={};
    if(!db.lecQ || typeof db.lecQ !== "object") db.lecQ={};
    return db;
  }
  catch(e){ return {flashcards:{},simSeen:{},bankAdded:{},correctDays:{},attempts:[],daily:{},lecParas:{},lecQ:{}}; }
}
// Error del último guardado ("" si todo salió bien). Se muestra en Flashcards:
// si localStorage está lleno o el navegador está en modo privado, el progreso se
// perdía en silencio y las tarjetas respondidas volvían al día siguiente con el
// contador sin cambios.
function saveDB(){
  try {
    localStorage.setItem(key(), JSON.stringify(DB));
    DB_SAVE_ERROR = "";
  } catch(e){
    DB_SAVE_ERROR = String(e && e.message || e);
    if(typeof console !== "undefined") console.error("No se pudo guardar el progreso", e);
  }
}
function loadFarsiCache(){
  try { return JSON.parse(localStorage.getItem("nmx_farsi_translations") || "{}") || {}; }
  catch(e){ return {}; }
}
function saveFarsiCache(){
  try { localStorage.setItem("nmx_farsi_translations",JSON.stringify(FA_CACHE)); }
  catch(e){ /* Translation still works for this session if storage is full. */ }
}
function user(){ return DB.user || {id:1,name:"",practiceSession:0,totalCorrect:0,totalAnswered:0,masteredCount:0,simuladorApproved:false,lecturaApproved:false}; }
function isHistoryId(qid){ qid=+qid; for(var i=0;i<HIST.length;i++){ if(HIST[i].id===qid) return true; } return false; }
// Una tarjeta es válida si la pregunta fue respondida en el simulador
// (DB.simSeen o DB.correctDays) o se añadió a mano desde el banco (DB.bankAdded).
function cardAllowed(qid){
  qid=+qid;
  var seen=DB.simSeen||{}, added=DB.bankAdded||{};
  return !!seen[qid] || !!added[qid] || wasAnswered(qid);
}
// Historial antiguo: antes de DB.simSeen solo quedaba registro de las preguntas
// contestadas correctamente (DB.correctDays). Eso también prueba que la pregunta
// se respondió en el simulador, así que cuenta como "respondida".
function wasAnswered(qid){
  var arr=(DB.correctDays||{})[qid];
  return Array.isArray(arr) && arr.length>0;
}
// Al eliminar preguntas duplicadas del banco (mismo concepto en dos ids), el
// progreso guardado bajo el id viejo se reasigna al id que se conservó; los ids
// que ya no existen en el banco se descartan. Es importante NO purgar por rango
// de id en cada build: purgar a diario reiniciaba el progreso (contador en 0)
// de las preguntas del lote 605+ y hacía que siempre se repitieran las mismas
// 8-10 preguntas sin que el contador avanzara.
function migrateDataVersion(){
  var changed = false;
  ["flashcards","simSeen","bankAdded","correctDays"].forEach(function(mapName){
    var map = DB[mapName];
    if(!map || typeof map !== "object") return;
    for(var k in map){
      var old = +k;
      var target = (FC_REMAP || {})[old];
      if(target){
        if(mapName === "correctDays"){
          var src = Array.isArray(map[k]) ? map[k] : [];
          var dst = Array.isArray(map[target]) ? map[target] : [];
          var seen = {};
          dst.forEach(function(d){ seen[d] = true; });
          src.forEach(function(d){ if(!seen[d]){ dst.push(d); seen[d] = true; } });
          dst.sort(function(a,b){ return a-b; });
          map[target] = dst;
        } else if(mapName === "flashcards" && map[k] && typeof map[k] === "object" && map[target] && typeof map[target] === "object"){
          var a = map[k], b = map[target];
          var last = [b.lastReviewedAt, a.lastReviewedAt].filter(Boolean).sort().pop() || null;
          map[target] = {
            correctCount: Math.max(b.correctCount||0, a.correctCount||0),
            learned: !!(b.learned || a.learned),
            lastReviewedAt: last,
            wrong: false,
          };
        } else {
          map[target] = map[k]; // booleans de simSeen / bankAdded
        }
        delete map[k];
        changed = true;
      } else if(!isHistoryId(old)){
        delete map[k];
        changed = true;
      }
    }
  });
  DB.dataVersion = APP_VERSION;
  saveDB();
  if(changed) saveDB();
}
function migrateFlashcards(){
  var fc=DB.flashcards||{};
  var seen=DB.simSeen||{};
  var added=DB.bankAdded||{};
  var changed=false;
  for(var qid in fc){
    var val=fc[qid];
    if(Array.isArray(val)){
      // Migrate from old format (array of marks) to new format (object)
      var correctCount=val.filter(function(x){return x==="facil";}).length;
      fc[qid]={correctCount:correctCount,learned:correctCount>=5,lastReviewedAt:null};
      changed=true;
      val=fc[qid];
    }
    // Solo preguntas de Historia/Cultura (del simulador o agregadas desde el
    // banco) pertenecen a flashcards. Se elimina lo de otras secciones (lectura).
    if(!isHistoryId(qid)){
      delete fc[qid];
      changed=true;
      continue;
    }
    // ...y solo si viene del simulador o se añadió desde el banco.
    if(wasAnswered(qid) && !seen[qid]){ seen[qid]=true; changed=true; }
    if(!cardAllowed(qid)){
      delete fc[qid];
      delete seen[qid];
      changed=true;
      continue;
    }
    // Una sola vez por versión de datos: si una tarjeta nueva o pendiente quedó
    // bloqueada con fecha por versiones anteriores, desbloquearla para que esté
    // disponible de inmediato. NO debe correr en cada carga: borraba el
    // lastReviewedAt de toda tarjeta con <=1 acierto, así que su historial nunca
    // cambiaba y volvía a salir todos los días aunque se respondiera bien.
    if(DATA_VERSION_CHANGED && val && !val.learned && (val.correctCount||0) <= 1 && val.lastReviewedAt){
      val.lastReviewedAt = null;
      changed = true;
    }
  }
  for(var sid in seen){
    if(!isHistoryId(sid)){ delete seen[sid]; changed=true; }
  }
  for(var aid in added){
    if(!isHistoryId(aid)){ delete added[aid]; changed=true; continue; }
    // Una pregunta añadida desde el banco siempre tiene su tarjeta (disponible para repasar).
    if(!fc[aid]){ fc[aid]={correctCount:0,learned:false,lastReviewedAt:null}; changed=true; }
  }
  DB.simSeen=seen;
  DB.bankAdded=added;
  DB.flashcards=fc;
  // Keep the displayed mastered count in sync after the cleanup.
  var u=user();
  var newCount=learnedIds().length;
  if(u.masteredCount!==newCount){ u.masteredCount=newCount; DB.user=u; changed=true; }
  if(changed){ saveDB(); }

function currentFarsiWork(){
  var out=[],signature=STATE.tab;
  if(STATE.tab==="sim"&&STATE.view){
    var sv=STATE.view;
    var simqs=sv.phase==="review"?sv.qs:[sv.qs[sv.idx]];
    simqs.forEach(function(q){addHistoryFarsiSources(out,q);});
    signature+="-"+sv.phase+"-"+(sv.phase==="review"?"all":sv.qs[sv.idx].id);
  } else if(STATE.tab==="lec"&&STATE.view){
    var lv=STATE.view;
    addFarsiSource(out,lv.p.text_en,lv.p.text_fa);
    lv.qs.forEach(function(q){addReadingFarsiSources(out,q);});
    signature+="-"+lv.p.id;
  } else if(STATE.tab==="fl"&&STATE.flash){

  } else if(STATE.tab==="ban"){
    var mode=STATE.sel.banmode||"hist";
    var query=(STATE.sel.banq||"").toLowerCase();
    if(mode==="hist"){
      HIST.filter(function(x){if(!query)return true;return (x.pregunta+" "+(x.pregunta_en||"")+" "+(x.subtema||"")).toLowerCase().indexOf(query)>=0;}).slice(0,10).forEach(function(q){addHistoryFarsiSources(out,q);});
    } else if(mode==="lec"){
      /* Lectura: aún sin traducciones (text_en/text_fa). */
    }
    signature+="-"+mode+"-"+query;
  }
  return {sources:out,signature:signature};
}
function splitTranslationText(text){
  if(encodeURIComponent(text).length<=430) return [text];
  var words=text.split(/\s+/),chunks=[],current="";
  words.forEach(function(word){
    var next=current?current+" "+word:word;
    if(current&&encodeURIComponent(next).length>430){chunks.push(current);current=word;}
    else current=next;
  });
  if(current)chunks.push(current);
  return chunks;
}
function decodeTranslationEntities(text){
  var area=document.createElement("textarea"); area.innerHTML=text; return area.value;
}
function requestFarsi(text){
  var url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=en%7Cfa&mt=1";
  return fetch(url,{method:"GET",mode:"cors"}).then(function(response){
    if(!response.ok)throw new Error("Translation HTTP "+response.status);
    return response.json();
  }).then(function(data){
    if(!data.responseData||Number(data.responseStatus)!==200||data.quotaFinished)throw new Error(data.responseDetails||"Translation quota unavailable");
    var text=decodeTranslationEntities(data.responseData.translatedText||"").trim();
    if(!text)throw new Error("Empty translation");
    return text;
  });
}
function translateFarsiSource(source){
  var chunks=splitTranslationText(source);
  return Promise.all(chunks.map(requestFarsi)).then(function(parts){return parts.join(" ");});
}
function ensureFarsiForView(){
  if(TRANSLATION!=="fa"||FA_LOADING||FA_ERROR)return;
  var work=currentFarsiWork();
  if(work.signature===FA_LAST_VIEW)return;
  FA_LAST_VIEW=work.signature;
  if(!work.sources.length)return;
  FA_LOADING=true;
  var button=document.getElementById("fa"); if(button)button.textContent="FA …";
  var cursor=0;
  function worker(){
    var index=cursor++; if(index>=work.sources.length)return Promise.resolve();
    var source=work.sources[index];
    return translateFarsiSource(source).then(function(result){FA_CACHE[source]=result;}).then(worker);
  }
  var workers=[];
  for(var i=0;i<Math.min(4,work.sources.length);i++)workers.push(worker());
  Promise.all(workers).then(function(){
    saveFarsiCache(); FA_LOADING=false; render();
  }).catch(function(error){
    console.error("Farsi translation failed",error); saveFarsiCache(); FA_LOADING=false; FA_ERROR=String(error&&error.message||error); render();
  });
}

function submitSim(force){
  var v=STATE.view; if(!v||v.phase!=="active") return;
  clearInterval(STATE.timer);
  var list=v.qs.map(function(q){return {id:q.id, ans:v.ans[q.id], correct:q.correct};});
  var correct=list.filter(function(x){return x.ans===x.correct;}).length;
  var total=v.qs.length;
  var passed=correct>=8;
  recordAnswers(list,"simulador");
  recordAttempt("simulador",correct,total,passed);
  if(passed) setUser({simuladorApproved:true});
  v.phase="review"; v.correct=correct; v.total=total; v.passed=passed; v.list=list;

function recordAnswers(list,type){
  var day=sessionDay();
  var cd=DB.correctDays||{};
  // Lectura usa su propio progreso (DB.lecQ): no toca correctDays ni el mazo de Historia.
  if(type==="lectura") list.forEach(function(x){ if(x.ans!=null) lecMark(x.id,x.ans===x.correct); });
  list.forEach(function(x){ if(type!=="lectura" && x.ans===x.correct){ var arr=cd[x.id]||[]; if(arr.indexOf(day)<0){arr.push(day); arr.sort(function(a,b){return a-b;});} cd[x.id]=arr; } });
  DB.correctDays=cd;
  var u=user(); u.totalAnswered+=(list.filter(function(x){return x.ans!=null;}).length); u.totalCorrect+=(list.filter(function(x){return x.ans===x.correct;}).length); u.practiceSession=day;
  // El simulador agrega a flashcards de forma automática SOLO las preguntas
  // que aún no están en la lista; el banco lo hace de forma manual con
  // addFromBank(). Lectura y otras secciones nunca aparecen.
  if(type==="simulador"){
    var seen=DB.simSeen=DB.simSeen||{};
    var fc=DB.flashcards=DB.flashcards||{};
    list.forEach(function(x){
      if(!isHistoryId(x.id)) return;
      if(x.ans==null) return; // only questions actually answered in the simulator
      seen[x.id]=true;
      if(fc[x.id]) return; // ya está en flashcards: su progreso solo se toca desde Flashcards
      // Nueva tarjeta: disponible de inmediato para repasar (lastReviewedAt null)
      // a diferencia de antes, donde se registraba la fecha y la tarjeta no
      // podía repasarse hasta pasado el intervalo.
      var card={correctCount:0,learned:false,lastReviewedAt:null};
      if(x.ans===x.correct){
        card.correctCount=1;
        card.wrong=false;
      } else {
        card.wrong=true; // fallada en el simulador: repasar al día siguiente
      }
      fc[x.id]=card;
    });
  }
  u.masteredCount=learnedIds().length;
  setUser(u);
  var d=DB.daily[today()]||{flashcards:0,simulador:false,lectura:false};
  d.simulador=type==="simulador";
  d.lectura=type==="lectura";
  DB.daily[today()]=d; saveDB();
}

function byLecId(id){ return LEC_Q[+id]||{question:"",options:[],correct:0}; }

// Progreso de lectura. DB.lecParas = {id_párrafo: true} (párrafos en flashcards de
// lectura) y DB.lecQ = {id_pregunta: {ok, last, wrong}}. Una pregunta se aprende con
// UNA respuesta correcta (en flashcards o en el examen); un párrafo se aprende cuando
// todas sus preguntas están ok. Una respuesta fallada vuelve al día siguiente.
function lecMark(qid,isCorrect){
  var lq=DB.lecQ=DB.lecQ||{};
  var c=lq[qid]||{ok:false,last:null,wrong:false};
  if(isCorrect){ c.ok=true; c.wrong=false; } else { c.wrong=true; }
  c.last=new Date().toISOString();
  lq[qid]=c;
}
function lecInDeck(pid){ return !!(DB.lecParas||{})[pid]; }
function lecCard(qid){ return (DB.lecQ||{})[qid]||null; }
function lecOk(qid){ var c=lecCard(qid); return !!(c&&c.ok); }
function lecDue(qid){
  var c=lecCard(qid);
  if(!c) return true;
  if(c.ok) return false;
  if(!c.last) return true;
  return daysSince(c.last) >= (c.wrong?1:FLASHCARD_MIN_DAYS);
}
function lecDeckParas(){ return LEC.filter(function(p){ return lecInDeck(p.id); }); }
function lecDeckQuestions(){
  var out=[];
  lecDeckParas().forEach(function(p){ p.questions.forEach(function(q){ out.push(q); }); });
  return out;
}
function lecPending(){ return lecDeckQuestions().filter(function(q){ return !lecOk(q.id); }); }
function lecAvailable(){ return lecPending().filter(function(q){ return lecDue(q.id); }); }
function lecParaLearned(p){ return p.questions.length>0 && p.questions.every(function(q){ return lecOk(q.id); }); }
function lecParaProgress(p){ return {ok:p.questions.filter(function(q){return lecOk(q.id);}).length, total:p.questions.length}; }
function lecLearnedParas(){ return lecDeckParas().filter(lecParaLearned); }
// Selecciona un párrafo: todas sus preguntas pasan a flashcards de lectura.
function addLecParagraph(pid){
  var p=null; for(var i=0;i<LEC.length;i++){ if(LEC[i].id===pid){ p=LEC[i]; break; } }
  if(!p) return;
  var dp=DB.lecParas=DB.lecParas||{}; dp[pid]=true;
  var lq=DB.lecQ=DB.lecQ||{};
  p.questions.forEach(function(q){ if(!lq[q.id]) lq[q.id]={ok:false,last:null,wrong:false}; });
  saveDB(); render();
}

/* ---------- Flashcards ---------- */
var FLASHCARD_LEARN_COUNT=5;
// Días mínimos entre repasos: con 1, una tarjeta respondida hoy vuelve a estar
// disponible al día siguiente (antes eran 5 días).
var FLASHCARD_MIN_DAYS=1;
// Texto para la UI, para que no se lea "cada 1 días" (y siga siendo correcto si
// el intervalo vuelve a subir).
var FLASHCARD_INTERVAL_LABEL=FLASHCARD_MIN_DAYS===1?"al día siguiente":("cada "+FLASHCARD_MIN_DAYS+" días");
var FL_MODE="reveal"; // "reveal" or "choice"
// Las flashcards provienen del simulador (automático) o del banco (manual).
function learnedIds(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push(+qid); }
  return out;
}
function pendingCards(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&!card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push({id:+qid,correctCount:card.correctCount||0,lastReviewedAt:card.lastReviewedAt||null}); }
  return out;
}
// Día (local) en que se repasó una tarjeta. Las marcas ISO llevan hora y zona,
// así que se convierten al día local; las fechas sueltas legacy ("YYYY-MM-DD")
// ya son un día local.
function reviewDay(dateStr){
  var s = String(dateStr);
  return s.indexOf("T") >= 0 ? localDay(new Date(s)) : s.slice(0,10);
}
function daysSince(dateStr){
  if(!dateStr) return 9999;
  var d1=new Date(reviewDay(dateStr)+"T00:00:00");
  var d2=new Date(today()+"T00:00:00");
  return Math.round((d2.getTime()-d1.getTime())/86400000);
}
// Filtros por categoría para la sección Flashcards: separar por tema
// (Historia / Cultura / Cívica / Geografía) igual que en el Banco.
var FL_CATS=[["all","Todas"],["Historia","Historia"],["Cultura","Cultura"],["Cívica","Cívica"],["Geografía","Geografía"]];
function availablePool(cat){
  cat=cat||STATE.sel.flcat||"all";
  var fc=DB.flashcards||{};
  var pool=HIST.filter(function(q){
    var card=fc[q.id];
    if(!card) return false;              // must have been added (simulator or bank)
    if(!cardAllowed(q.id)) return false; // only simulator-answered or bank-added
    if(card.learned) return false;
    if(cat!=="all" && q.categoria!==cat) return false;
    if(!card.lastReviewedAt) return true; // not reviewed yet
    // Si fallaste, la tarjeta vuelve al día siguiente; si acertaste, espera el
    // intervalo completo de repetición espaciada.
    var minDays = card.wrong ? 1 : FLASHCARD_MIN_DAYS;
    return daysSince(card.lastReviewedAt) >= minDays;
  });
  return pool;
}

  return flDeckBar()+(STATE.sel.fldeck==="lec"?flLecHTML():flHistHTML());
}

      '<div id="flashcard">'+(v.revealed?('<div class="card" style="background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.3)"><b>Respuesta:</b> '+esc(q.opciones[q.correct])+trOption(q.opciones_en,q.opciones_fa,q.correct)+(q.explicacion?'<p class="small mut">'+esc(q.explicacion)+'</p>':'')+tr(q.explicacion_en,q.explicacion_fa)+'</div>'):'')+'</div>'+
      '<div class="row">'+(v.answered?'<p class="small mut">¡Respuesta registrada! Cargando siguiente...</p>':(v.revealed?
        '<button class="btn" id="flcorrect">✅ Correcta</button><button class="btn ghost" id="flwrong">❌ Incorrecta</button>'
        :'<button class="btn ghost" id="flshow">Mostrar respuesta</button>'))+
      '</div>';
  } else {
    body=qpills(q)+'<div class="qtext">'+esc(q.pregunta)+progressText+'</div>'+tr(q.pregunta_en,q.pregunta_fa)+
      (v.answered?'<div style="text-align:center;margin-bottom:8px;font-weight:700" class="'+(v.selectedOption===q.correct?'marker':'badmark')+'">'+(v.selectedOption===q.correct?'¡Correcta! ✅':'Incorrecta ❌')+'</div>':'')+

        if(v.selectedOption!=null){
          if(i===q.correct) cls="opt ok";
          else if(i===v.selectedOption) cls="opt bad";
          else cls="opt locked";
        }
        return '<button class="'+cls+'" data-fli="'+i+'"'+(v.selectedOption!=null?' disabled':'')+'>'+
          '<b style="color:#fcd34d">'+String.fromCharCode(65+i)+'.</b> '+esc(o)+
          (v.selectedOption!=null&&i===q.correct?' <span class="marker">✓</span>':'')+
          (v.selectedOption!=null&&i===v.selectedOption&&i!==q.correct?' <span class="badmark">✗</span>':'')+
          trOption(q.opciones_en,q.opciones_fa,i)+'</button>';
      }).join("")+'</div>'+
      (v.selectedOption==null?'<p class="small mut">Selecciona la opción correcta</p>':'');
  }
  return saveWarn+'<div class="card">'+header+body+
    '<p class="small mut" style="margin-top:8px">Modo '+(FL_MODE==="reveal"?"autoevaluación":"opciones múltiples")+' · Repetición espaciada: '+(FLASHCARD_MIN_DAYS<=1?'una tarjeta respondida hoy vuelve <b>al día siguiente</b>':'una tarjeta acertada vuelve en <b>'+FLASHCARD_MIN_DAYS+' días</b> y una fallada, <b>al día siguiente</b>')+'. Responde correctamente '+FLASHCARD_LEARN_COUNT+' veces seguidas para aprenderla; si fallas, el contador vuelve a 0.</p></div>';
