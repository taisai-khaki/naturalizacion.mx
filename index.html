ue ya había tratado una alianza: casar a Hul-Kin con la princesa de aquel lugar.", "questions": [{"id": 53700, "question": "¿Cómo se trataban Hul-Kin y Sac-Nicte al principio?", "options": ["Eran grandes amigos desde la niñez", "Parecían odiarse y peleaban constantemente", "Se ignoraban por completo", "Eran hermanos de sangre"], "correct": 1}, {"id": 53701, "question": "¿Qué surgió entre ellos al llegar a su juventud?", "options": ["Una enemistad que se volvió odio mortal", "Una amistad que se convirtió en amor", "Un pacto comercial entre familias", "Un interés por la política del pueblo"], "correct": 1}, {"id": 53702, "question": "¿Quién tenía el sentimiento más grande y avasallador?", "options": ["El cacique Halach-Huinic", "Sac-Nicte", "La hechicera", "Hul-Kin"], "correct": 1}, {"id": 53703, "question": "¿Cómo era Sac-Nicte según el quinto párrafo?", "options": ["Cruel y ambiciosa", "Inocente y pura", "Rica y poderosa", "Vieja y enferma"], "correct": 1}, {"id": 53704, "question": "¿Dónde se veían los jóvenes?", "options": ["A escondidas", "En la plaza del pueblo", "En la casa del cacique", "En el mercado público"], "correct": 0}, {"id": 53705, "question": "¿Qué entregó Sac-Nicte a Hul-Kin?", "options": ["Un mapa del cenote", "Una joya de oro", "Su virginidad y su pureza", "Un mensaje secreto"], "correct": 2}, {"id": 53706, "question": "¿Quién se enteró de la relación entre los jóvenes?", "options": ["El cacique", "Todo el pueblo de Zací", "Los sacerdotes del templo", "Solo la hechicera"], "correct": 0}, {"id": 53707, "question": "¿Cómo reaccionó el cacique al enterarse?", "options": ["Desterró a la hechicera de la ciudad", "Se enfureció y envió a su hijo al sur de la península", "Los bendijo y organizó una boda inmediata", "Los dejó en paz sin decir nada"], "correct": 1}, {"id": 53708, "question": "¿A dónde envió el cacique a su hijo?", "options": ["A un pueblo del sur de la península", "A la ciudad de Mérida", "A las montañas del norte", "A la costa del golfo de México"], "correct": 0}, {"id": 53709, "question": "¿Con qué propósito envió el cacique a Hul-Kin al sur?", "options": ["Para pedir ayuda militar al rey", "Para construir un cenote nuevo", "Para casarlo con la princesa de aquel lugar", "Para aprender el arte de la guerra"], "correct": 2}, {"id": 53710, "question": "¿Con qué cacique del sur ya había tratado una alianza el padre?", "options": ["Con el cacique de Zací", "Con la hechicera de la familia Cocom", "Con los sacerdotes del templo", "Con el cacique de aquel pueblo del sur"], "correct": 3}, {"id": 53711, "question": "¿Qué significa «avasallador» en el texto?", "options": ["Silencioso y tímido", "Abrumador, que domina por completo", "Pequeño y frágil", "Ligero y pasajero"], "correct": 1}, {"id": 53712, "question": "¿Qué significa «enfurecido» en el texto?", "options": ["Lleno de ira y furia", "Cansado y sin fuerzas", "Triste y resignado", "Muy contento y tranquilo"], "correct": 0}, {"id": 53713, "question": "¿Qué quiere decir «a pesar de que guardaban en secreto su amor»?", "options": ["Que la pareja nunca se amó de verdad", "Que el amor fue público desde el principio", "Que el amor terminó antes de empezar", "Que el amor se mantenía oculto, aunque el cacique lo descubrió"], "correct": 3}, {"id": 53714, "question": "¿Cuál era la alianza que motivó la separación?", "options": ["Entregar Zací a los enemigos", "Casar a Hul-Kin con la princesa del sur", "Intercambiar tierras de cultivo", "Unir los cenotes de dos ciudades"], "correct": 1}, {"id": 53715, "question": "¿Qué tipo de relación se describe al inicio entre Hul-Kin y Sac-Nicte?", "options": ["Una relación hostil que luego cambió", "Una relación de comercio", "Una relación de maestro y alumna", "Una relación de familia"], "correct": 0}, {"id": 53716, "question": "¿Qué provocó el cambio de sentimientos entre los jóvenes?", "options": ["La llegada de un ejército extranjero", "La muerte de la hechicera", "Un viaje a otra ciudad", "El trato y la convivencia que los hizo amarse"], "correct": 3}, {"id": 53717, "question": "¿Por qué ella entregó su virginidad a Hul-Kin?", "options": ["Porque se lo ordenaron los dioses", "Por obligación de la hechicera", "Porque lo amaba, según el texto", "Por dinero que le ofreció el cacique"], "correct": 2}, {"id": 53718, "question": "¿Qué sucedió con los encuentros de los jóvenes al final del párrafo?", "options": ["Terminaron por voluntad de Sac-Nicte", "Continuaron sin ser descubiertos", "Se volvieron públicos y celebrados", "El cacique los descubrió y los separó"], "correct": 3}, {"id": 53719, "question": "¿Qué se refiere la expresión «al cabo de unos meses»?", "options": ["Al día siguiente", "Después de muchos años", "Después de algunos meses", "En el mismo instante"], "correct": 2}, {"id": 53720, "question": "¿Qué idea central transmite el quinto párrafo?", "options": ["La llegada de nuevos gobernantes", "Un amor prohibido que terminó en separación por decisión del cacique", "Una alianza exitosa entre dos pueblos", "La historia de la fundación de una ciudad"], "correct": 1}, {"id": 53721, "question": "¿Qué sentimiento se volvió apasionado entre los jóvenes?", "options": ["La envidia", "La ira", "La indiferencia", "El amor"], "correct": 3}, {"id": 53722, "question": "¿Qué motivo tenía el cacique para enviar a su hijo al sur?", "options": ["Cumplir una alianza ya acordada con el cacique del sur", "Organizar una guerra contra los cocomes", "Protegerlo de los peligros del cenote", "Llevarlo a estudiar a otra ciudad"], "correct": 0}, {"id": 53723, "question": "¿Qué significa «enterarse» en el texto?", "options": ["Llegar a saber algo", "Ocultar algo", "Olvidar algo", "Enseñar algo"], "correct": 0}, {"id": 53724, "question": "¿Qué idea expresa «sin saberlo ni la hechicera ni el cacique»?", "options": ["Que ambos ignoraban la relación secreta", "Que ambos aprobaban la relación", "Que ambos estaban de acuerdo con la boda", "Que ambos amaban a Sac-Nicte"], "correct": 0}, {"id": 53725, "question": "¿Qué relación tenía el cacique con el cacique del sur?", "options": ["Eran enemigos mortales", "No se conocían", "Eran hermanos", "Tenían una alianza ya acordada"], "correct": 3}, {"id": 53726, "question": "¿A qué se refiere «aquel lugar» en la frase «la princesa de aquel lugar»?", "options": ["A la ciudad de Zací", "Al templo del norte", "Al cenote sagrado", "Al pueblo del sur de la península"], "correct": 3}, {"id": 53727, "question": "¿Qué significa «apasionado» en el texto?", "options": ["Frío y distante", "Intenso y lleno de pasión", "Pequeño y frágil", "Efímero y breve"], "correct": 1}, {"id": 53728, "question": "¿Cuánto tiempo pasó entre el inicio de los encuentros y la entrega de la joven?", "options": ["Varios años", "Unos meses", "Un solo día", "Una semana"], "correct": 1}, {"id": 53729, "question": "¿Cuál era el estado de ánimo del cacique al enterarse?", "options": ["Indiferente", "Enfurecido", "Preocupado por el clima", "Feliz"], "correct": 1}, {"id": 53730, "question": "¿Qué quiere decir «a escondidas»?", "options": ["En público y con permiso", "En secreto, sin que nadie lo viera", "Con la presencia del padre", "En la iglesia del pueblo"], "correct": 1}]}, {"id": 38, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 6, "title": "Párrafo 6 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Desde su separación, la alegría escapó del alma de Sac-Nicte. Sus ojos perdieron el brillo de la ilusión y entre llantos le contó a su amada abuela el secreto. Estaba embarazada y no quería vivir más. La abuela, afligida y preocupada, le prometió que con la ayuda de los dioses y sus hechizos le traería de vuelta a Hul-Kin.", "questions": [{"id": 53800, "question": "¿Qué le pasó a la alegría de Sac-Nicte tras la separación?", "options": ["Escapó de su alma", "Se trasladó a su abuela", "Se multiplicó con los años", "Se mantuvo igual de intensa"], "correct": 0}, {"id": 53801, "question": "¿Qué perdieron los ojos de Sac-Nicte?", "options": ["El color original", "El brillo de la ilusión", "La capacidad de ver", "La luz del día"], "correct": 1}, {"id": 53802, "question": "¿A quién le contó Sac-Nicte el secreto?", "options": ["A su abuela", "A Hul-Kin", "Al cacique", "A su madre"], "correct": 0}, {"id": 53803, "question": "¿Qué secreto reveló Sac-Nicte a su abuela?", "options": ["Que se iba a casar con otro hombre", "Que quería huir del pueblo", "Que estaba embarazada", "Que había perdido su piedra preciosa"], "correct": 2}, {"id": 53804, "question": "¿Qué sentimiento provocó en Sac-Nicte la noticia de su embarazo?", "options": ["Una alegría enorme que la hizo celebrar", "Una gran tristeza que la llevó a no querer vivir", "Indiferencia ante su situación", "Una valentía para enfrentar al cacique"], "correct": 1}, {"id": 53805, "question": "¿Cómo reaccionó la abuela al oír el secreto?", "options": ["Con alegría y celebración", "Afligida y preocupada", "Con indiferencia total", "Con enojo contra los dioses"], "correct": 1}, {"id": 53806, "question": "¿Qué prometió la abuela a Sac-Nicte?", "options": ["Casarla con un comerciante rico", "Enviarla a vivir a otro pueblo", "Traerle de vuelta a Hul-Kin con la ayuda de los dioses y sus hechizos", "Ocultarle el embarazo a todos"], "correct": 2}, {"id": 53807, "question": "¿Qué significa «afligida» en el texto?", "options": ["Enojada y violenta", "Triste y preocupada", "Cansada y dormida", "Contenta y animada"], "correct": 1}, {"id": 53808, "question": "¿Qué medios usaría la abuela para traer de vuelta a Hul-Kin?", "options": ["El dinero del cacique", "Las armas de los guerreros", "Un viaje al sur de la península", "Los dioses y sus hechizos"], "correct": 3}, {"id": 53809, "question": "¿Qué significa «desde su separación» al inicio del párrafo?", "options": ["A partir del momento en que se separaron", "Después de la maldición del cenote", "Durante la boda de Hul-Kin", "Antes de conocerse"], "correct": 0}, {"id": 53810, "question": "¿Qué significaba para Sac-Nicte haber perdido su alegría?", "options": ["Que dejó de sentir ilusión por la vida", "Que se mudó a otra ciudad", "Que empezó a trabajar en el templo", "Que dejó de hablar con su abuela"], "correct": 0}, {"id": 53811, "question": "¿Qué significa «entre llantos» en el texto?", "options": ["Mientras lloraba", "Mientras reía a carcajadas", "Mientras cantaba", "Mientras dormía"], "correct": 0}, {"id": 53812, "question": "¿Qué ocurrió con la alegría y la ilusión de Sac-Nicte después de la separación?", "options": ["Siguieron igual que antes", "Desaparecieron de su vida", "Aumentaron con la noticia del embarazo", "Se trasladaron a Hul-Kin"], "correct": 1}, {"id": 53813, "question": "¿Qué significa «ilusión» en la frase «el brillo de la ilusión»?", "options": ["Engaño visual", "Sueño nocturno", "Esperanza y deseo", "Mentira"], "correct": 2}, {"id": 53814, "question": "¿Cómo describe el texto a Sac-Nicte al contar su secreto?", "options": ["Con enojo", "Con calma", "Con alegría", "Entre llantos"], "correct": 3}]}, {"id": 39, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 7, "title": "Párrafo 7 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Un día, Sac-Nicte se enteró de que Hul-Kin se casaba. Tomó entonces una terrible decisión y la noche antes de la boda amarró una piedra a su larga cabellera y se arrojó a las aguas del cenote. En ese preciso momento, Hul-Kin sufrió un fuerte dolor en el pecho y tuvo un atroz presentimiento que lo obligó a regresar a Zací esa misma noche para averiguar qué había ocurrido. Al llegar, encontró a la hechicera llorando y maldiciendo enloquecida. Al enterarse de todo, Hul-Kin se arrojó al cenote para morir con su verdadero amor: Sac-Nicte. La hechicera se acercó al borde de la bóveda y, tirando una flor blanca, gritó sollozando: “Sac-Nicte, ¡te he cumplido! Te he traído a Hul-Kin, y ¡estará contigo para siempre!”. Finalmente, en un arranque de ira, la hechicera puso una maldición (function(){
"use strict";
var D = window.__APP_DATA__;
var APP_VERSION = "2026-10-08-683q-600l-ccbf39457d"; // inyectado por build_standalone.py
var HIST = D.hist;       // Spanish questions with _en and _fa translation fields

// {id_antiguo: id_conservado, ...} — inyectado por build_standalone.py a partir
// de data/dedupe_remap.json. Se define ANTES de migrateDataVersion() porque
// con var se usa después de la asignación.
var FC_REMAP = {"74": 73, "99": 719, "104": 17, "122": 630, "129": 632, "135": 628, "139": 638, "164": 607, "185": 622, "223": 1, "259": 5, "347": 562, "510": 20, "584": 621, "599": 53, "635": 134, "639": 141, "640": 142, "643": 146, "646": 155, "649": 158, "650": 159, "655": 149, "657": 227, "658": 567, "659": 594, "666": 244, "668": 252, "670": 263, "671": 268, "672": 270, "677": 303, "679": 329, "683": 334, "686": 344, "690": 588, "694": 364, "695": 427, "699": 445, "702": 499, "708": 53, "709": 61, "717": 92, "718": 94, "724": 115};
// ¿Cambió la versión de datos desde la última visita? Las migraciones que se
// aplican una sola vez (p. ej. desbloquear tarjetas bloqueadas por builds
// anteriores) deben correr únicamente cuando esto es verdadero: si se repiten en
// cada carga borran el historial recién guardado y la misma tarjeta vuelve a
// salir todos los días aunque se responda bien.
var DATA_VERSION_CHANGED = DB.dataVersion !== APP_VERSION;
// Se declara aquí (antes de las migraciones, que ya guardan) para no perder el
// error de un guardado fallido; saveDB() vive más abajo.
var DB_SAVE_ERROR = "";
migrateDataVersion();
migrateFlashcards();

function key(){ return "nmx_db_" + (phone||"").trim(); }
function loadDB(){
  try {
    var db = JSON.parse(localStorage.getItem(key()) || "{}") || {};
    if(!db.flashcards || typeof db.flashcards !== "object") db.flashcards={};
    if(!db.simSeen || typeof db.simSeen !== "object") db.simSeen={};
    if(!db.bankAdded || typeof db.bankAdded !== "object") db.bankAdded={};
    if(!db.correctDays || typeof db.correctDays !== "object") db.correctDays={};
    if(!Array.isArray(db.attempts)) db.attempts=[];
    if(!db.daily || typeof db.daily !== "object") db.daily={};
    if(!db.lecParas || typeof db.lecParas !== "object") db.lecParas={};
    if(!db.lecQ || typeof db.lecQ !== "object") db.lecQ={};
    return db;
  }
  catch(e){ return {flashcards:{},simSeen:{},bankAdded:{},correctDays:{},attempts:[],daily:{},lecParas:{},lecQ:{}}; }
}
// Error del último guardado ("" si todo salió bien). Se muestra en Flashcards:
// si localStorage está lleno o el navegador está en modo privado, el progreso se
// perdía en silencio y las tarjetas respondidas volvían al día siguiente con el
// contador sin cambios.
function saveDB(){
  try {
    localStorage.setItem(key(), JSON.stringify(DB));
    DB_SAVE_ERROR = "";
  } catch(e){
    DB_SAVE_ERROR = String(e && e.message || e);
    if(typeof console !== "undefined") console.error("No se pudo guardar el progreso", e);
  }
}
function loadFarsiCache(){
  try { return JSON.parse(localStorage.getItem("nmx_farsi_translations") || "{}") || {}; }
  catch(e){ return {}; }
}
function saveFarsiCache(){
  try { localStorage.setItem("nmx_farsi_translations",JSON.stringify(FA_CACHE)); }
  catch(e){ /* Translation still works for this session if storage is full. */ }
}
function user(){ return DB.user || {id:1,name:"",practiceSession:0,totalCorrect:0,totalAnswered:0,masteredCount:0,simuladorApproved:false,lecturaApproved:false}; }
function isHistoryId(qid){ qid=+qid; for(var i=0;i<HIST.length;i++){ if(HIST[i].id===qid) return true; } return false; }
// Una tarjeta es válida si la pregunta fue respondida en el simulador
// (DB.simSeen o DB.correctDays) o se añadió a mano desde el banco (DB.bankAdded).
function cardAllowed(qid){
  qid=+qid;
  var seen=DB.simSeen||{}, added=DB.bankAdded||{};
  return !!seen[qid] || !!added[qid] || wasAnswered(qid);
}
// Historial antiguo: antes de DB.simSeen solo quedaba registro de las preguntas
// contestadas correctamente (DB.correctDays). Eso también prueba que la pregunta
// se respondió en el simulador, así que cuenta como "respondida".
function wasAnswered(qid){
  var arr=(DB.correctDays||{})[qid];
  return Array.isArray(arr) && arr.length>0;
}
// Al eliminar preguntas duplicadas del banco (mismo concepto en dos ids), el
// progreso guardado bajo el id viejo se reasigna al id que se conservó; los ids
// que ya no existen en el banco se descartan. Es importante NO purgar por rango
// de id en cada build: purgar a diario reiniciaba el progreso (contador en 0)
// de las preguntas del lote 605+ y hacía que siempre se repitieran las mismas
// 8-10 preguntas sin que el contador avanzara.
function migrateDataVersion(){
  var changed = false;
  ["flashcards","simSeen","bankAdded","correctDays"].forEach(function(mapName){
    var map = DB[mapName];
    if(!map || typeof map !== "object") return;
    for(var k in map){
      var old = +k;
      var target = (FC_REMAP || {})[old];
      if(target){
        if(mapName === "correctDays"){
          var src = Array.isArray(map[k]) ? map[k] : [];
          var dst = Array.isArray(map[target]) ? map[target] : [];
          var seen = {};
          dst.forEach(function(d){ seen[d] = true; });
          src.forEach(function(d){ if(!seen[d]){ dst.push(d); seen[d] = true; } });
          dst.sort(function(a,b){ return a-b; });
          map[target] = dst;
        } else if(mapName === "flashcards" && map[k] && typeof map[k] === "object" && map[target] && typeof map[target] === "object"){
          var a = map[k], b = map[target];
          var last = [b.lastReviewedAt, a.lastReviewedAt].filter(Boolean).sort().pop() || null;
          map[target] = {
            correctCount: Math.max(b.correctCount||0, a.correctCount||0),
            learned: !!(b.learned || a.learned),
            lastReviewedAt: last,
            wrong: false,
          };
        } else {
          map[target] = map[k]; // booleans de simSeen / bankAdded
        }
        delete map[k];
        changed = true;
      } else if(!isHistoryId(old)){
        delete map[k];
        changed = true;
      }
    }
  });
  DB.dataVersion = APP_VERSION;
  saveDB();
  if(changed) saveDB();
}
function migrateFlashcards(){
  var fc=DB.flashcards||{};
  var seen=DB.simSeen||{};
  var added=DB.bankAdded||{};
  var changed=false;
  for(var qid in fc){
    var val=fc[qid];
    if(Array.isArray(val)){
      // Migrate from old format (array of marks) to new format (object)
      var correctCount=val.filter(function(x){return x==="facil";}).length;
      fc[qid]={correctCount:correctCount,learned:correctCount>=5,lastReviewedAt:null};
      changed=true;
      val=fc[qid];
    }
    // Solo preguntas de Historia/Cultura (del simulador o agregadas desde el
    // banco) pertenecen a flashcards. Se elimina lo de otras secciones (lectura).
    if(!isHistoryId(qid)){
      delete fc[qid];
      changed=true;
      continue;
    }
    // ...y solo si viene del simulador o se añadió desde el banco.
    if(wasAnswered(qid) && !seen[qid]){ seen[qid]=true; changed=true; }
    if(!cardAllowed(qid)){
      delete fc[qid];
      delete seen[qid];
      changed=true;
      continue;
    }
    // Una sola vez por versión de datos: si una tarjeta nueva o pendiente quedó
    // bloqueada con fecha por versiones anteriores, desbloquearla para que esté
    // disponible de inmediato. NO debe correr en cada carga: borraba el
    // lastReviewedAt de toda tarjeta con <=1 acierto, así que su historial nunca
    // cambiaba y volvía a salir todos los días aunque se respondiera bien.
    if(DATA_VERSION_CHANGED && val && !val.learned && (val.correctCount||0) <= 1 && val.lastReviewedAt){
      val.lastReviewedAt = null;
      changed = true;
    }
  }
  for(var sid in seen){
    if(!isHistoryId(sid)){ delete seen[sid]; changed=true; }
  }
  for(var aid in added){
    if(!isHistoryId(aid)){ delete added[aid]; changed=true; continue; }
    // Una pregunta añadida desde el banco siempre tiene su tarjeta (disponible para repasar).
    if(!fc[aid]){ fc[aid]={correctCount:0,learned:false,lastReviewedAt:null}; changed=true; }
  }
  DB.simSeen=seen;
  DB.bankAdded=added;
  DB.flashcards=fc;
  // Keep the displayed mastered count in sync after the cleanup.
  var u=user();
  var newCount=learnedIds().length;
  if(u.masteredCount!==newCount){ u.masteredCount=newCount; DB.user=u; changed=true; }
  if(changed){ saveDB(); }
}
// Día local del usuario (antes se usaba toISOString(), que es UTC: para UTC-6
// el día cambiaba a las 18:00 y una tarjeta fallada por la tarde volvía a salir
// a las pocas horas en vez de al día siguiente).
function localDay(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function today(){ return localDay(); }
function setUser(patch){ DB.user = Object.assign({}, user(), patch); saveDB(); }
function correctDays(){
  var m = {};
  (DB.correctDays || {}).forEach ? null : null;
  var cd = DB.correctDays || {};
  for(var qid in cd){ m[qid] = (cd[qid]||[]).length; }
  return {map:m, cd:cd};
}

  (q.opciones_en||[]).forEach(function(txt,i){addFarsiSource(out,txt,q.opciones_fa&&q.opciones_fa[i]);});

}
function addReadingFarsiSources(out,q){

}
function currentFarsiWork(){
  var out=[],signature=STATE.tab;
  if(STATE.tab==="sim"&&STATE.view){
    var sv=STATE.view;
    var simqs=sv.phase==="review"?sv.qs:[sv.qs[sv.idx]];
    simqs.forEach(function(q){addHistoryFarsiSources(out,q);});
    signature+="-"+sv.phase+"-"+(sv.phase==="review"?"all":sv.qs[sv.idx].id);
  } else if(STATE.tab==="lec"&&STATE.view){
    var lv=STATE.view;
    addFarsiSource(out,lv.p.text_en,lv.p.text_fa);
    lv.qs.forEach(function(q){addReadingFarsiSources(out,q);});
    signature+="-"+lv.p.id;
  } else if(STATE.tab==="fl"&&STATE.flash){
    addHistoryFarsiSources(out,STATE.flash.q);
    signature+="-"+STATE.flash.q.id+"-"+STATE.flash.revealed;
  } else if(STATE.tab==="ban"){
    var mode=STATE.sel.banmode||"hist";
    var query=(STATE.sel.banq||"").toLowerCase();
    if(mode==="hist"){
      HIST.filter(function(x){if(!query)return true;return (x.pregunta+" "+(x.pregunta_en||"")+" "+(x.subtema||"")).toLowerCase().indexOf(query)>=0;}).slice(0,10).forEach(function(q){addHistoryFarsiSources(out,q);});
    } else if(mode==="lec"){
      /* Lectura: aún sin traducciones (text_en/text_fa). */
    }
    signature+="-"+mode+"-"+query;
  }
  return {sources:out,signature:signature};
}
function splitTranslationText(text){
  if(encodeURIComponent(text).length<=430) return [text];
  var words=text.split(/\s+/),chunks=[],current="";
  words.forEach(function(word){
    var next=current?current+" "+word:word;
    if(current&&encodeURIComponent(next).length>430){chunks.push(current);current=word;}
    else current=next;
  });
  if(current)chunks.push(current);
  return chunks;
}
function decodeTranslationEntities(text){
  var area=document.createElement("textarea"); area.innerHTML=text; return area.value;
}
function requestFarsi(text){
  var url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=en%7Cfa&mt=1";
  return fetch(url,{method:"GET",mode:"cors"}).then(function(response){
    if(!response.ok)throw new Error("Translation HTTP "+response.status);
    return response.json();
  }).then(function(data){
    if(!data.responseData||Number(data.responseStatus)!==200||data.quotaFinished)throw new Error(data.responseDetails||"Translation quota unavailable");
    var text=decodeTranslationEntities(data.responseData.translatedText||"").trim();
    if(!text)throw new Error("Empty translation");
    return text;
  });
}
function translateFarsiSource(source){
  var chunks=splitTranslationText(source);
  return Promise.all(chunks.map(requestFarsi)).then(function(parts){return parts.join(" ");});
}
function ensureFarsiForView(){
  if(TRANSLATION!=="fa"||FA_LOADING||FA_ERROR)return;
  var work=currentFarsiWork();
  if(work.signature===FA_LAST_VIEW)return;
  FA_LAST_VIEW=work.signature;
  if(!work.sources.length)return;
  FA_LOADING=true;
  var button=document.getElementById("fa"); if(button)button.textContent="FA …";
  var cursor=0;
  function worker(){
    var index=cursor++; if(index>=work.sources.length)return Promise.resolve();
    var source=work.sources[index];
    return translateFarsiSource(source).then(function(result){FA_CACHE[source]=result;}).then(worker);
  }
  var workers=[];
  for(var i=0;i<Math.min(4,work.sources.length);i++)workers.push(worker());
  Promise.all(workers).then(function(){
    saveFarsiCache(); FA_LOADING=false; render();
  }).catch(function(error){
    console.error("Farsi translation failed",error); saveFarsiCache(); FA_LOADING=false; FA_ERROR=String(error&&error.message||error); render();
  });
}

function simHTML(){
  if(!STATE.view){

    // (Antes se excluían solo las "aprendidas", así que las pendientes se

    var simPool=HIST.filter(function(q){ return !fc[q.id]; });

    }
    if(simPool.length<10) simPool=HIST; // último recurso para que el examen siga funcionando
    STATE.view={qs:shuffle(simPool).slice(0,10),idx:0,ans:{},left:600,phase:"active"}; startTimer();
  }

  var q=v.qs[v.idx];
  return '<div class="card"><div class="top"><div>'+qpills(q)+'<div class="qtext">'+(v.idx+1)+'. '+esc(q.pregunta)+'</div>'+tr(q.pregunta_en,q.pregunta_fa)+'</div>'+

function startTimer(){
  clearInterval(STATE.timer);
  STATE.timer=setInterval(function(){
    var v=STATE.view; if(!v) return;
    if(v.phase==="active"&&v.left>0){ v.left--; var el=document.querySelector(".timer"); if(el)el.textContent=fmt(v.left); if(v.left<=0){ clearInterval(STATE.timer); if(v.kind==="lec") submitLec(); else submitSim(true); } }
  },1000);
}
function submitSim(force){
  var v=STATE.view; if(!v||v.phase!=="active") return;
  clearInterval(STATE.timer);
  var list=v.qs.map(function(q){return {id:q.id, ans:v.ans[q.id], correct:q.correct};});
  var correct=list.filter(function(x){return x.ans===x.correct;}).length;
  var total=v.qs.length;
  var passed=correct>=8;
  recordAnswers(list,"simulador");
  recordAttempt("simulador",correct,total,passed);
  if(passed) setUser({simuladorApproved:true});
  v.phase="review"; v.correct=correct; v.total=total; v.passed=passed; v.list=list;
  render();
}
function recordAnswers(list,type){
  var day=sessionDay();
  var cd=DB.correctDays||{};
  // Lectura usa su propio progreso (DB.lecQ): no toca correctDays ni el mazo de Historia.
  if(type==="lectura") list.forEach(function(x){ if(x.ans!=null) lecMark(x.id,x.ans===x.correct); });
  list.forEach(function(x){ if(type!=="lectura" && x.ans===x.correct){ var arr=cd[x.id]||[]; if(arr.indexOf(day)<0){arr.push(day); arr.sort(function(a,b){return a-b;});} cd[x.id]=arr; } });
  DB.correctDays=cd;
  var u=user(); u.totalAnswered+=(list.filter(function(x){return x.ans!=null;}).length); u.totalCorrect+=(list.filter(function(x){return x.ans===x.correct;}).length); u.practiceSession=day;
  // El simulador agrega a flashcards de forma automática SOLO las preguntas
  // que aún no están en la lista; el banco lo hace de forma manual con
  // addFromBank(). Lectura y otras secciones nunca aparecen.
  if(type==="simulador"){
    var seen=DB.simSeen=DB.simSeen||{};
    var fc=DB.flashcards=DB.flashcards||{};
    list.forEach(function(x){
      if(!isHistoryId(x.id)) return;
      if(x.ans==null) return; // only questions actually answered in the simulator
      seen[x.id]=true;
      if(fc[x.id]) return; // ya está en flashcards: su progreso solo se toca desde Flashcards
      // Nueva tarjeta: disponible de inmediato para repasar (lastReviewedAt null)
      // a diferencia de antes, donde se registraba la fecha y la tarjeta no
      // podía repasarse hasta pasado el intervalo.
      var card={correctCount:0,learned:false,lastReviewedAt:null};
      if(x.ans===x.correct){
        card.correctCount=1;
        card.wrong=false;
      } else {
        card.wrong=true; // fallada en el simulador: repasar al día siguiente
      }
      fc[x.id]=card;
    });
  }
  u.masteredCount=learnedIds().length;
  setUser(u);
  var d=DB.daily[today()]||{flashcards:0,simulador:false,lectura:false};
  d.simulador=type==="simulador";
  d.lectura=type==="lectura";
  DB.daily[today()]=d; saveDB();
}

// Progreso de lectura. DB.lecParas = {id_párrafo: true} (párrafos en flashcards de
// lectura) y DB.lecQ = {id_pregunta: {ok, last, wrong}}. Una pregunta se aprende con
// UNA respuesta correcta (en flashcards o en el examen); un párrafo se aprende cuando
// todas sus preguntas están ok. Una respuesta fallada vuelve al día siguiente.
function lecMark(qid,isCorrect){
  var lq=DB.lecQ=DB.lecQ||{};
  var c=lq[qid]||{ok:false,last:null,wrong:false};
  if(isCorrect){ c.ok=true; c.wrong=false; } else { c.wrong=true; }
  c.last=new Date().toISOString();
  lq[qid]=c;
}
function lecInDeck(pid){ return !!(DB.lecParas||{})[pid]; }
function lecCard(qid){ return (DB.lecQ||{})[qid]||null; }
function lecOk(qid){ var c=lecCard(qid); return !!(c&&c.ok); }
function lecDue(qid){
  var c=lecCard(qid);
  if(!c) return true;
  if(c.ok) return false;
  if(!c.last) return true;
  return daysSince(c.last) >= (c.wrong?1:FLASHCARD_MIN_DAYS);
}
function lecDeckParas(){ return LEC.filter(function(p){ return lecInDeck(p.id); }); }
function lecDeckQuestions(){
  var out=[];
  lecDeckParas().forEach(function(p){ p.questions.forEach(function(q){ out.push(q); }); });
  return out;
}
function lecPending(){ return lecDeckQuestions().filter(function(q){ return !lecOk(q.id); }); }
function lecAvailable(){ return lecPending().filter(function(q){ return lecDue(q.id); }); }
function lecParaLearned(p){ return p.questions.length>0 && p.questions.every(function(q){ return lecOk(q.id); }); }
function lecParaProgress(p){ return {ok:p.questions.filter(function(q){return lecOk(q.id);}).length, total:p.questions.length}; }
function lecLearnedParas(){ return lecDeckParas().filter(lecParaLearned); }
// Selecciona un párrafo: todas sus preguntas pasan a flashcards de lectura.
function addLecParagraph(pid){
  var p=null; for(var i=0;i<LEC.length;i++){ if(LEC[i].id===pid){ p=LEC[i]; break; } }
  if(!p) return;
  var dp=DB.lecParas=DB.lecParas||{}; dp[pid]=true;
  var lq=DB.lecQ=DB.lecQ||{};
  p.questions.forEach(function(q){ if(!lq[q.id]) lq[q.id]={ok:false,last:null,wrong:false}; });
  saveDB(); render();
}

  var rows=LEC.map(function(p){

/* ---------- Flashcards ---------- */
var FLASHCARD_LEARN_COUNT=5;
// Días mínimos entre repasos: con 1, una tarjeta respondida hoy vuelve a estar
// disponible al día siguiente (antes eran 5 días).
var FLASHCARD_MIN_DAYS=1;
// Texto para la UI, para que no se lea "cada 1 días" (y siga siendo correcto si
// el intervalo vuelve a subir).
var FLASHCARD_INTERVAL_LABEL=FLASHCARD_MIN_DAYS===1?"al día siguiente":("cada "+FLASHCARD_MIN_DAYS+" días");
var FL_MODE="reveal"; // "reveal" or "choice"
// Las flashcards provienen del simulador (automático) o del banco (manual).
function learnedIds(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push(+qid); }
  return out;
}
function pendingCards(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&!card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push({id:+qid,correctCount:card.correctCount||0,lastReviewedAt:card.lastReviewedAt||null}); }
  return out;
}
// Día (local) en que se repasó una tarjeta. Las marcas ISO llevan hora y zona,
// así que se convierten al día local; las fechas sueltas legacy ("YYYY-MM-DD")
// ya son un día local.
function reviewDay(dateStr){
  var s = String(dateStr);
  return s.indexOf("T") >= 0 ? localDay(new Date(s)) : s.slice(0,10);
}
function daysSince(dateStr){
  if(!dateStr) return 9999;
  var d1=new Date(reviewDay(dateStr)+"T00:00:00");
  var d2=new Date(today()+"T00:00:00");
  return Math.round((d2.getTime()-d1.getTime())/86400000);
}
// Filtros por categoría para la sección Flashcards: separar por tema
// (Historia / Cultura / Cívica / Geografía) igual que en el Banco.
var FL_CATS=[["all","Todas"],["Historia","Historia"],["Cultura","Cultura"],["Cívica","Cívica"],["Geografía","Geografía"]];
function availablePool(cat){
  cat=cat||STATE.sel.flcat||"all";
  var fc=DB.flashcards||{};
  var pool=HIST.filter(function(q){
    var card=fc[q.id];
    if(!card) return false;              // must have been added (simulator or bank)
    if(!cardAllowed(q.id)) return false; // only simulator-answered or bank-added
    if(card.learned) return false;
    if(cat!=="all" && q.categoria!==cat) return false;
    if(!card.lastReviewedAt) return true; // not reviewed yet
    // Si fallaste, la tarjeta vuelve al día siguiente; si acertaste, espera el
    // intervalo completo de repetición espaciada.
    var minDays = card.wrong ? 1 : FLASHCARD_MIN_DAYS;
    return daysSince(card.lastReviewedAt) >= minDays;
  });
  return pool;
}
function flHTML(){
  return flDeckBar()+(STATE.sel.fldeck==="lec"?flLecHTML():flHistHTML());
}

      '<div id="flashcard">'+(v.revealed?('<div class="card" style="background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.3)"><b>Respuesta:</b> '+esc(q.opciones[q.correct])+trOption(q.opciones_en,q.opciones_fa,q.correct)+(q.explicacion?'<p class="small mut">'+esc(q.explicacion)+'</p>':'')+tr(q.explicacion_en,q.explicacion_fa)+'</div>'):'')+'</div>'+
      '<div class="row">'+(v.answered?'<p class="small mut">¡Respuesta registrada! Cargando siguiente...</p>':(v.revealed?
        '<button class="btn" id="flcorrect">✅ Correcta</button><button class="btn ghost" id="flwrong">❌ Incorrecta</button>'
        :'<button class="btn ghost" id="flshow">Mostrar respuesta</button>'))+
      '</div>';
  } else {
    body=qpills(q)+'<div class="qtext">'+esc(q.pregunta)+progressText+'</div>'+tr(q.pregunta_en,q.pregunta_fa)+
      (v.answered?'<div style="text-align:center;margin-bottom:8px;font-weight:700" class="'+(v.selectedOption===q.correct?'marker':'badmark')+'">'+(v.selectedOption===q.correct?'¡Correcta! ✅':'Incorrecta ❌')+'</div>':'')+
      '<div id="flashcard">'+q.opciones.map(function(o,i){
        var cls="opt";
        if(v.selectedOption!=null){
          if(i===q.correct) cls="opt ok";
          else if(i===v.selectedOption) cls="opt bad";
          else cls="opt locked";
        }
        return '<button class="'+cls+'" data-fli="'+i+'"'+(v.selectedOption!=null?' disabled':'')+'>'+
          '<b style="color:#fcd34d">'+String.fromCharCode(65+i)+'.</b> '+esc(o)+
          (v.selectedOption!=null&&i===q.correct?' <span class="marker">✓</span>':'')+
          (v.selectedOption!=null&&i===v.selectedOption&&i!==q.correct?' <span class="badmark">✗</span>':'')+
          trOption(q.opciones_en,q.opciones_fa,i)+'</button>';
      }).join("")+'</div>'+
      (v.selectedOption==null?'<p class="small mut">Selecciona la opción correcta</p>':'');
  }
  return saveWarn+'<div class="card">'+header+body+
    '<p class="small mut" style="margin-top:8px">Modo '+(FL_MODE==="reveal"?"autoevaluación":"opciones múltiples")+' · Repetición espaciada: '+(FLASHCARD_MIN_DAYS<=1?'una tarjeta respondida hoy vuelve <b>al día siguiente</b>':'una tarjeta acertada vuelve en <b>'+FLASHCARD_MIN_DAYS+' días</b> y una fallada, <b>al día siguiente</b>')+'. Responde correctamente '+FLASHCARD_LEARN_COUNT+' veces seguidas para aprenderla; si fallas, el contador vuelve a 0.</p></div>';

function getFlashcardInfo(qid){
  var fc=DB.flashcards||{};
  return fc[qid]||null;
}
function markFlashCorrect(isCorrect){
  if(STATE.flash&&STATE.flash.lec) return lecFlashMark(isCorrect);
  var v=STATE.flash,q=v.q;
  var fc=DB.flashcards=DB.flashcards||{};
  var card=fc[q.id]||{correctCount:0,learned:false,lastReviewedAt:null};
  if(isCorrect){ card.correctCount=(card.correctCount||0)+1; card.wrong=false; }
  else { card.correctCount=0; card.wrong=true; } // fallada: contador a 0, se reprograma para el día siguiente
  card.lastReviewedAt=new Date().toISOString();
  if(card.correctCount>=FLASHCARD_LEARN_COUNT) card.learned=true;
  fc[q.id]=card;
  // Update daily stats
  var d=DB.daily[today()]||{flashcards:0,simulador:false,lectura:false};
  d.flashcards=(d.flashcards||0)+1; DB.daily[today()]=d;
  // Update masteredCount
  var u=user(); u.masteredCount=learnedIds().length; setUser(u);
  saveDB();
  v.answered=true; render();
  setTimeout(function(){ STATE.flash=null; render(); },1500);
}
// Agregar manualmente una pregunta del banco a las flashcards del usuario.
function addFromBank(qid){
  qid=+qid;
  if(!isHistoryId(qid)) return;
  var fc=DB.flashcards=DB.flashcards||{};
  var added=DB.bankAdded=DB.bankAdded||{};
  added[qid]=true; // elegida a mano desde el banco: siempre puede repasarla
  if(!fc[qid]) fc[qid]={correctCount:0,learned:false,lastReviewedAt:null};
  var u=user(); u.masteredCount=learnedIds().length; setUser(u);
  saveDB();
  render();
}

/* ---------- Banco ---------- */
function banHTML(){
  var q=(STATE.sel.banq||"").toLowerCase();
  var mode=STATE.sel.banmode||"hist";
  var fcf=STATE.sel.banfc||"all";
  var hits=[];
  var lechits=[];
  if(mode==="hist"){ hits=HIST.filter(function(x){ if(!q) return true; var hay=x.pregunta+" "+(x.pregunta_en||"")+" "+(x.pregunta_fa||"")+" "+(x.subtema||"")+" "+(x.categoria||"")+" "+x.opciones.join(" ")+" "+(x.opciones_en||[]).join(" ")+" "+(x.opciones_fa||[]).join(" "); return hay.toLowerCase().indexOf(q)>=0; }); }
  if(fcf!=="all"){ hits=hits.filter(function(x){ var inC=cardAllowed(x.id)&&!!((DB.flashcards||{})[x.id]); return fcf==="in"?inC:!inC; }); }
  if(mode==="lec"){
    lechits=LEC.filter(function(p){
      if(fcf==="in"&&!lecInDeck(p.id)) return false;
      if(fcf==="out"&&lecInDeck(p.id)) return false;
      if(!q) return true;
      var hay=p.title+" "+(p.topic||"")+" "+p.text+" "+p.questions.map(function(x){return x.question+" "+x.options.join(" ");}).join(" ");
      return hay.toLowerCase().indexOf(q)>=0;
    });
  }
  var modes=[["hist","Historia y cultura"],["lec","Lecturas"],["conv","Conversación"]];
  var m=modes.map(function(x){return '<button class="tab'+(mode===x[0]?' on':'')+'" data-banmode="'+x[0]+'">'+x[1]+'</button>';}).join("");
  var filtro='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px"><span class="small mut" style="font-size:11px;font-weight:700;letter-spacing:.06em">FLASHCARDS:</span>'+
    [["all","Todas"],["in","En flashcards"],["out","Sin agregar"]].map(function(f){return '<button class="tab'+(fcf===f[0]?' on':'')+'" data-banfc="'+f[0]+'" style="font-size:12px;padding:6px 12px">'+f[1]+'</button>';}).join("")+
    '</div>';
  var body="";
  if(mode==="hist"){
    body=filtro+
    '<p class="small mut">'+hits.length+' pregunta(s) encontradas · total del banco: <b>'+HIST.length+'</b>.</p>'+
    '<p class="small mut" style="background:rgba(2,132,199,.12);border:1px solid rgba(56,189,248,.25);border-radius:10px;padding:8px 10px;margin-bottom:10px">Las preguntas del simulador se agregan solas a tus flashcards y, a partir de ese momento, <b>ya no vuelven a salir en el simulador</b>: se estudian desde Flashcards. Si quieres, también puedes añadir cualquier otra pregunta del banco con “Agregar a flashcards”.</p>'+
    hits.map(function(x){var inCards=cardAllowed(x.id)&&!!((DB.flashcards||{})[x.id]); return '<div class="card"><div class="row">'+qpills(x)+'</div><div class="qtext" style="font-size:16px">'+esc(x.pregunta)+'</div>'+tr(x.pregunta_en,x.pregunta_fa)+
    x.opciones.map(function(o,i){return '<div class="opt locked">'+esc(o)+(i===x.correct?' <span class="marker">[CORRECTA]</span>':'')+trOption(x.opciones_en,x.opciones_fa,i)+'</div>';}).join("")+
    (x.explicacion?'<p class="small mut">'+esc(x.explicacion)+'</p>':'')+tr(x.explicacion_en,x.explicacion_fa)+
    (inCards?'<div style="margin-top:10px"><span class="pill green">✓ En tus tarjetas</span></div>':'<div style="margin-top:10px"><button class="btn ghost" style="font-size:12px;padding:6px 12px" data-addfl="'+x.id+'">+ Agregar a flashcards</button></div>')+
    '</div>';}).join("");
  }
  else if(mode==="lec"){
    body=filtro+
    '<p class="small mut">'+lechits.length+' párrafo(s) encontrado(s) · total: <b>'+LEC.length+'</b>. Al agregar un párrafo, todas sus preguntas pasan a tus flashcards de Lectura.</p>'+
    lechits.map(function(p){
      var inDeck=lecInDeck(p.id), pr=lecParaProgress(p);
      return '<div class="card"><div class="row" style="justify-content:space-between">'+
        '<div><h2 style="font-size:18px">'+esc(p.title)+'</h2>'+(p.topic?'<span class="pill gold">'+esc(p.topic)+'</span> ':'')+'<span class="pill">'+p.questions.length+' preguntas</span></div>'+
        (inDeck?'<span class="pill green">✓ En flashcards · '+pr.ok+'/'+pr.total+'</span>':'<button class="btn ghost" style="font-size:12px;padding:6px 12px" data-addlec="'+p.id+'">+ Agregar a flashcards</button>')+'</div>'+
        '<div class="passage" style="margin:10px 0">'+esc(p.text)+'</div>'+
        p.questions.map(function(x,i){return '<div style="margin:8px 0"><b>'+(i+1)+'. '+esc(x.question)+'</b>'+x.options.map(function(o,oi){return '<div class="opt locked">'+esc(o)+(oi===x.correct?' <span class="marker">[CORRECTA]</span>':'')+'</div>';}).join("")+'</div>';}).join("")+
        '</div>';
    }).join("");
  }
  else { body='<div class="grid" style="grid-template-columns:1fr 1fr;gap:16px"><div class="card"><h2 style="margin-bottom:8px">Conversación</h2>'+IW.interview.map(function(x,i){return '<div style="margin:8px 0"><b>'+(i+1)+'. '+esc(x.question)+'</b><div class="small mut">Sugerencia: '+esc(x.tip)+'</div></div>';}).join("")+'</div><div class="card"><h2 style="margin-bottom:8px">Redacción</h2>'+IW.writing.map(function(w,i){return '<div style="margin:6px 0">'+(i+1)+'. '+esc(w)+'</div>';}).join("")+'</div></div>'; }
  return '<div class="card"><div class="top"><div class="tabs" style="margin:0">'+m+'</div>'+(mode!=="conv"?'<input class="field" style="max-width:280px;margin:0" id="banq" placeholder="Buscar palabra o tema…" value="'+esc(STATE.sel.banq||"")+'">':'')+'</div>'+body+'</div>';
}

/* ---------- Progreso ---------- */
function proHTML(){
  var u=user();
  var learned=learnedIds();
  var pending=pendingCards();
  var attempts=(DB.attempts||[]);
  var lecDeck=lecDeckParas(), lecLearned=lecLearnedParas();
  return '<div class="grid"><div class="stat"><b>'+HIST.length+'</b><div class="small mut">Total banco</div></div>'+
    '<div class="stat"><b>'+learned.length+'</b><div class="small mut">Aprendidas</div></div>'+
    '<div class="stat"><b>'+lecLearned.length+'</b><div class="small mut">Párrafos de lectura aprendidos</div></div>'+
    '<div class="stat"><b>'+u.totalCorrect+'</b><div class="small mut">Correctas totales</div></div>'+
    '<div class="stat"><b>'+u.totalAnswered+'</b><div class="small mut">Respondidas</div></div></div>'+
    '<div class="card"><h2 style="margin-bottom:8px">Últimos intentos</h2>'+(attempts.length?'<table><tr><th>Tipo</th><th>Resultado</th><th>Fecha</th></tr>'+attempts.slice(0,10).map(function(a){return '<tr><td>'+(a.type==="simulador"?"Simulador":"Lectura")+'</td><td>'+a.score+'/'+a.total+' <span class="badge '+(a.passed?'ok':'no')+'">'+(a.passed?'Aprobado':'No aprobado')+'</span></td><td class="small mut">'+new Date(a.at).toLocaleString()+'</td></tr>';}).join("")+'</table>':'<p class="small mut">Aún no hay intentos registrados.</p>')+'</div>'+
    '<div class="card"><h2 style="margin-bottom:8px">Preguntas aprendidas <span class="pill green">'+learned.length+'</span></h2>'+(learned.length?learned.map(function(id){var q=byHistId(id);var card=getFlashcardInfo(id);return '<div class="small" style="margin:4px 0;display:flex;justify-content:space-between">'+
      '<span>• '+esc(q.pregunta)+'</span><span class="mut">✅ '+(card?card.correctCount:FLASHCARD_LEARN_COUNT)+'/'+FLASHCARD_LEARN_COUNT+'</span></div>';}).join(""):'<p class="small mut">Responde correctamente '+FLASHCARD_LEARN_COUNT+' veces en flashcards para aprender una pregunta.</p>')+'</div>'+
    '<div class="card"><h2 style="margin-bottom:8px">En repaso <span class="pill gold">'+pending.length+' pendientes</span></h2>'+(pending.length?pending.map(function(p){var q=byHistId(p.id);var card=getFlashcardInfo(p.id);var minDays=card&&card.wrong?1:FLASHCARD_MIN_DAYS;var canReview=!p.lastReviewedAt||daysSince(p.lastReviewedAt)>=minDays;return '<div class="small" style="margin:4px 0;display:flex;justify-content:space-between">'+
      '<span>• '+esc(q.pregunta)+' '+(canReview?'<span class="pill green" style="font-size:10px;padding:1px 6px">Disponible</span>':'<span class="pill rose" style="font-size:10px;padding:1px 6px">En espera</span>')+'</span><span class="mut">'+p.correctCount+'/'+FLASHCARD_LEARN_COUNT+'</span></div>';}).join(""):'<p class="small mut">Sin preguntas pendientes. Practica en el simulador o agrega preguntas desde el banco.</p>')+'</div>'+
    '<div class="card"><h2 style="margin-bottom:8px">Lectura en progreso <span class="pill green">'+lecLearned.length+' de '+lecDeck.length+' aprendidos</span></h2>'+
    (lecDeck.length?lecDeck.map(function(p){var pr=lecParaProgress(p);return '<div class="small" style="margin:4px 0;display:flex;justify-content:space-between"><span>• '+esc(p.title)+'</span>'+
      (lecParaLearned(p)?'<span class="pill green" style="font-size:10px;padding:1px 6px">✅ Aprendido</span>':'<span class="mut">'+pr.ok+'/'+pr.total+' correctas</span>')+'</div>';}).join(""):'<p class="small mut">Aún no hay párrafos en flashcards de lectura. Agrégalos desde la pestaña Lectura.</p>')+'</div>';
}

/* ---------- bind per view ---------- */
function bindView(){
  var tab=STATE.tab;
  if(tab==="sim"){
    var v=STATE.view;
    if(v.phase==="review"){ document.getElementById("again").onclick=function(){ STATE.view=null; render(); }; return; }
    document.querySelectorAll("#opts .opt").forEach(function(b){ b.onclick=function(){ v.ans[v.qs[v.idx].id]=+b.getAttribute("data-i"); render(); }; });
    var prev=document.getElementById("prev"); if(prev)prev.onclick=function(){v.idx--;render();};
    var next=document.getElementById("next"); if(next)next.onclick=function(){v.idx++;render();};
    var fin=document.getElementById("fin"); if(fin)fin.onclick=function(){submitSim(false);};
  }
  if(tab==="lec"){
    document.querySelectorAll("[data-addlec]").forEach(function(b){ b.onclick=function(){ addLecParagraph(+b.getAttribute("data-addlec")); }; });
    var lv=STATE.view;
    if(lv.phase==="review"){ document.getElementById("againlec").onclick=function(){ STATE.view=null; render(); }; return; }
    document.querySelectorAll(".opt[data-id]").forEach(function(b){ b.onclick=function(){ lv.ans[+b.getAttribute("data-id")]=+b.getAttribute("data-i"); render(); }; });
    document.getElementById("finlec").onclick=submitLec;
  }
  if(tab==="ent"){
    document.querySelectorAll(".opt[data-ent]").forEach(function(b){ b.onclick=function(){ STATE.sel.ent=+b.getAttribute("data-ent"); render(); }; });
    var pv=document.getElementById("prevwr"), nx=document.getElementById("nextwr");
    if(pv)pv.onclick=function(){ STATE.sel.wr=((STATE.sel.wr||0)-1+IW.writing.length)%IW.writing.length; render(); };
    if(nx)nx.onclick=function(){ STATE.sel.wr=((STATE.sel.wr||0)+1)%IW.writing.length; render(); };
  }
  if(tab==="fl"){
    var fv=STATE.flash;
    document.querySelectorAll("[data-flcat]").forEach(function(b){ b.onclick=function(){ STATE.sel.flcat=b.getAttribute("data-flcat"); STATE.flash=null; render(); }; });
    document.querySelectorAll("[data-fldeck]").forEach(function(b){ b.onclick=function(){ STATE.sel.fldeck=b.getAttribute("data-fldeck"); STATE.flash=null; render(); }; });
    var modeBtn=document.getElementById("flmode"); if(modeBtn)modeBtn.onclick=function(){ FL_MODE=FL_MODE==="reveal"?"choice":"reveal"; if(fv){fv.revealed=false;fv.answered=false;fv.selectedOption=null;} render(); };
    var sh=document.getElementById("flshow"); if(sh)sh.onclick=function(){fv.revealed=true;render();};
    var fc=document.getElementById("flcorrect"); if(fc)fc.onclick=function(){markFlashCorrect(true);};
    var fw=document.getElementById("flwrong"); if(fw)fw.onclick=function(){markFlashCorrect(false);};
    document.querySelectorAll("[data-fli]").forEach(function(b){ b.onclick=function(){
      if(fv.selectedOption!=null) return;
      var idx=+b.getAttribute("data-fli");
      fv.selectedOption=idx;
      markFlashCorrect(idx===fv.q.correct);
    }; });
  }
  if(tab==="ban"){
    document.querySelectorAll(".tab[data-banmode]").forEach(function(b){ b.onclick=function(){ STATE.sel.banmode=b.getAttribute("data-banmode"); render(); }; });
    document.querySelectorAll("[data-banfc]").forEach(function(b){ b.onclick=function(){ STATE.sel.banfc=b.getAttribute("data-banfc"); render(); }; });
    var bq=document.getElementById("banq"); if(bq){ bq.oninput=function(){ STATE.sel.banq=bq.value; }; }
    document.querySelectorAll("[data-addfl]").forEach(function(b){ b.onclick=function(){ addFromBank(+b.getAttribute("data-addfl")); }; });
    document.querySelectorAll("[data-addlec]").forEach(function(b){ b.onclick=function(){ addLecParagraph(+b.getAttribute("data-addlec")); }; });
  }
  if(tab==="pro"){ /* static */ }
}
function fmt(s){ s=Math.max(0,s|0); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
// Muestra la versión del build en el pie para verificar que el dispositivo
// (p. ej. un teléfono con caché) tenga la copia más reciente de la app.
var _av = document.getElementById("appver");
if (_av) _av.textContent = APP_VERSION;
render();
})();
</script>
