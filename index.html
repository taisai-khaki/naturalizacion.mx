:root{--bg:#022c22;--bg2:#064e3b;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--ink:#ecfdf5;--mut:#a7f3d0;--gold:#fcd34d;--rose:#fb7185;--green:#6ee7b7;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;font-weight:700;padding:10px 18px;border-radius:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.ghost[aria-pressed="true"]{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.55);color:#fde68a}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d1fae5;border:1px solid var(--line)}
.pill.gold{background:rgba(252,211,77,.15);color:#fde68a;border-color:rgba(252,211,77,.3)}
.pill.green{background:rgba(110,231,183,.15);color:#a7f3d0;border-color:rgba(110,231,183,.3)}
.pill.rose{background:rgba(251,113,133,.15);color:#fecdd3;border-color:rgba(251,113,133,.3)}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px}
.mut{color:var(--mut)}
.small{font-size:12px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;transition:background .15s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.sel{border-color:var(--gold);background:rgba(252,211,77,.18)}
.opt.ok{border-color:var(--green);background:rgba(110,231,183,.15)}
.opt.bad{border-color:var(--rose);background:rgba(251,113,133,.15)}
.opt.locked{opacity:.4}
.translation{color:#bfdbfe;font-style:italic;font-size:14px;margin-top:6px;padding:8px 10px;background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;border-radius:6px;white-space:pre-wrap}
.translation.fa{direction:rtl;text-align:right;font-style:normal;font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.8;border-left:0;border-right:3px solid #3b82f6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tab.on{background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:24px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#fcd34d,#fb7185);border-radius:999px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loginbox{max-width:420px;margin:8vh auto}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;margin:6px 0 12px}
textarea.field{min-height:120px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.passage{max-height:46vh;overflow:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.55}
#flashcard{margin:20px 0}
.qtext{font-size:19px;font-weight:700;line-height:1.4;margin:12px 0}
.footer{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}
.marker{color:#34d399;font-weight:700}
.badmark{color:#fda4af;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.badge.ok{background:rgba(110,231,183,.18);color:#6ee7b7}
.badge.no{background:rgba(251,113,133,.18);color:#fb7185}
</style>

rrect": 1, "explicacion": "México es una economía emergente relevante.", "categoria": "Historia", "subtema": "Economía", "dificultad": "media", "pregunta_en": "What place does Mexico hold in the world economy?", "opciones_en": ["Among the top 100", "16th place among the world's largest economies.", "Among the top 50", "Among the top 5"], "explicacion_en": "Mexico is a relevant emerging economy.", "pregunta_fa": null, "opciones_fa": null, "explicacion_fa": null}], "lectura": [{"id": 1, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 1, "title": "Párrafo 1 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Cuentan las historias de los primeros habitantes de Mesoamérica, que en el periodo anterior a la llegada del dios Quetzalcóatl, los aztecas sobrevivían alimentándose únicamente de las raíces y de los animales que cazaban.", "questions": [{"id": 50100, "question": "¿Qué comían los primeros habitantes de Mesoamérica antes de la llegada de Quetzalcóatl?", "options": ["Pescado que capturaban en el mar", "Raíces y animales que cazaban", "Cereales cultivados en grandes valles", "Solo frutas silvestres de los árboles"], "correct": 1}, {"id": 50101, "question": "¿Cuál era la situación de los aztecas antes de la llegada del dios Quetzalcóatl?", "options": ["Sobrevivían solo con raíces y animales cazados", "Comerciaban con pueblos de la costa", "Cultivaban maíz en abundancia", "Tenían grandes ciudades y templos"], "correct": 0}, {"id": 50102, "question": "¿En qué periodo se sitúa la falta de maíz según la leyenda?", "options": ["En los años posteriores a la muerte del dios", "En el periodo anterior a la llegada de Quetzalcóatl", "Durante la construcción de los grandes templos", "Después de la llegada de los conquistadores"], "correct": 1}, {"id": 50103, "question": "¿A qué pueblo se refiere el primer párrafo como el que vivía de raíces y de la cacería?", "options": ["A los aztecas", "A los olmecas de la costa", "A los incas del sur", "A los mayas de la península"], "correct": 0}, {"id": 50104, "question": "¿Qué tipo de vida llevaban los habitantes mencionados en el primer párrafo?", "options": ["Se alimentaban de pescado de río", "Se dedicaban al comercio marítimo", "Vivían de la agricultura intensiva de regadío", "Se alimentaban de raíces y de animales que cazaban"], "correct": 3}, {"id": 50105, "question": "¿Qué dios aparece en la leyenda como el que llegó a Mesoamérica?", "options": ["Quetzalcóatl", "Xipe Tótec", "Huitzilopochtli", "Tláloc"], "correct": 0}, {"id": 50106, "question": "¿Qué expresa la frase «periodo anterior a la llegada del dios Quetzalcóatl»?", "options": ["Un tiempo posterior a su muerte", "Un momento de celebración religiosa", "Un tiempo previo a su llegada", "Una época de paz total"], "correct": 2}, {"id": 50107, "question": "¿Qué significa la palabra «únicamente» en «se alimentaban únicamente de las raíces»?", "options": ["De forma ocasional", "Solo, exclusivamente", "Principalmente, aunque no solo", "Además de otros alimentos"], "correct": 1}, {"id": 50108, "question": "¿De qué modo obtenían los aztecas parte de su alimento según el primer párrafo?", "options": ["Comprándolos en mercados", "Cazando animales", "Pescándolos en el mar", "Criándolos en granjas"], "correct": 1}]}, {"id": 2, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 2, "title": "Párrafo 2 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Ellos no tenían el maíz, pues este cereal tan alimenticio, estaba escondido detrás de las montañas y ellos no tenían acceso a él. Los antiguos dioses trataron de obtenerlo e intentaron separar las montañas con su colosal fuerza, pero no lo lograron, así que los aztecas pidieron ayuda al dios Quezalcóatl.", "questions": [{"id": 50200, "question": "¿Por qué no tenían maíz los aztecas?", "options": ["Porque estaba escondido detrás de las montañas y no tenían acceso a él", "Porque se había acabado en las cosechas", "Porque lo habían quemado en una guerra", "Porque los dioses lo habían prohibido"], "correct": 0}, {"id": 50201, "question": "¿Dónde estaba escondido el maíz?", "options": ["En una isla lejana", "Detrás de las montañas", "Bajo tierra, en cuevas profundas", "En el fondo de un lago"], "correct": 1}, {"id": 50202, "question": "¿Cómo describe el texto al maíz?", "options": ["Como una fruta silvestre y amarga", "Como un cereal muy alimenticio", "Como un alimento de lujo sin valor", "Como una planta venenosa"], "correct": 1}, {"id": 50203, "question": "¿Qué intentaron hacer los antiguos dioses para obtener el maíz?", "options": ["Pedir el maíz a los dioses del mar", "Construir un puente hacia el cielo", "Robar el maíz de los pueblos vecinos", "Separar las montañas con su fuerza"], "correct": 3}, {"id": 50204, "question": "¿Lograron los antiguos dioses obtener el maíz por la fuerza?", "options": ["Sí, mediante un acuerdo con los aztecas", "No, no lograron separar las montañas", "Sí, con ayuda de los animales", "Sí, separaron las montañas en un solo día"], "correct": 1}, {"id": 50205, "question": "¿A quién pidieron ayuda los aztecas?", "options": ["A un cacique de la costa", "Al dios de la lluvia", "Al dios Quetzalcóatl", "A los antiguos dioses del fuego"], "correct": 2}, {"id": 50206, "question": "¿Qué pasó con el intento de los antiguos dioses de separar las montañas?", "options": ["Hizo que las montañas se elevaran aún más", "Abrió un paso hacia el maíz", "Creó un lago entre los montes", "No tuvo éxito; no lograron obtener el maíz"], "correct": 3}, {"id": 50207, "question": "¿Cómo se describe la fuerza de los antiguos dioses?", "options": ["Débil", "Colosal", "Moderada", "Insignificante"], "correct": 1}, {"id": 50208, "question": "¿Qué hicieron los aztecas al no poder obtener el maíz por sí mismos?", "options": ["Abandonaron la región para siempre", "Se rindieron sin intentar nada más", "Atacaron a los dioses antiguos", "Pidieron ayuda al dios Quetzalcóatl"], "correct": 3}, {"id": 50209, "question": "¿Qué significa la expresión «no tenían acceso a él»?", "options": ["Lo vendían en los mercados", "Lo rechazaban por costumbre", "No podían alcanzarlo ni obtenerlo", "Lo tenían guardado en sus casas"], "correct": 2}, {"id": 50210, "question": "¿Qué relación indica «así que» en «así que los aztecas pidieron ayuda»?", "options": ["Una condición que debe cumplirse", "Una comparación entre dos dioses", "Una consecuencia: como no lo lograron, pidieron ayuda", "Un contraste entre dos ideas"], "correct": 2}, {"id": 50211, "question": "¿Qué elemento de la naturaleza bloqueaba el acceso al maíz?", "options": ["Los ríos", "Los desiertos", "El mar", "Las montañas"], "correct": 3}, {"id": 50212, "question": "¿Quién intentó separar las montañas?", "options": ["Los pueblos de la costa", "Los aztecas", "Los antiguos dioses", "Quetzalcóatl"], "correct": 2}]}, {"id": 3, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 3, "title": "Párrafo 3 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Quezalcóatl no quiso emplear la fuerza, sino la inteligencia y la astucia, y se transformó en una hormiga negra. Decidió dirigirse a las montañas acompañado de una hormiga roja, dispuesto a conseguir el maíz para su pueblo.", "questions": [{"id": 50300, "question": "¿Qué tipo de recurso eligió Quetzalcóatl para conseguir el maíz?", "options": ["La inteligencia y la astucia", "El dinero y los regalos", "La fuerza física", "La magia de los sacerdotes"], "correct": 0}, {"id": 50301, "question": "¿En qué animal se transformó Quetzalcóatl?", "options": ["En un águila real", "En un venado", "En un jaguar", "En una hormiga negra"], "correct": 3}, {"id": 50302, "question": "¿Quién acompañó a Quetzalcóatl en su viaje?", "options": ["Un guerrero azteca", "Un perro fiel", "Un sacerdote del templo", "Una hormiga roja"], "correct": 3}, {"id": 50303, "question": "¿Hacia dónde se dirigió Quetzalcóatl?", "options": ["Hacia un cenote de la selva", "Hacia las montañas", "Hacia un lago sagrado", "Hacia el mar"], "correct": 1}, {"id": 50304, "question": "¿Para quién buscaba Quetzalcóatl el maíz?", "options": ["Para su pueblo", "Para venderlo en mercados lejanos", "Para sus enemigos", "Para los dioses antiguos"], "correct": 0}, {"id": 50305, "question": "¿Por qué no quiso usar la fuerza Quetzalcóatl?", "options": ["Prefería la inteligencia y la astucia", "Los dioses se lo habían prohibido", "Le faltaba fuerza física", "Las montañas eran demasiado bajas"], "correct": 0}, {"id": 50306, "question": "¿De qué color era la hormiga que acompañó a Quetzalcóatl?", "options": ["Roja", "Negra", "Verde", "Dorada"], "correct": 0}, {"id": 50307, "question": "¿Qué significa «astucia» en el texto?", "options": ["Costumbre de los antiguos dioses", "Habilidad para resolver problemas con ingenio", "Fuerza bruta para vencer obstáculos", "Miedo a los riesgos del viaje"], "correct": 1}, {"id": 50308, "question": "¿Qué decidió hacer Quetzalcóatl después de transformarse?", "options": ["Pedir perdón a los dioses antiguos", "Dirigirse a las montañas con la hormiga roja", "Quedarse en el templo a rezar", "Viajar al mar en una canoa"], "correct": 1}]}, {"id": 4, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 4, "title": "Párrafo 4 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Tras mucho esfuerzo y sin perder el ánimo, Quezalcóatl subió las montañas y cuando llegó a su destino, tomó entre sus mandíbulas un grano maduro de maíz e inició el duro regreso. Al llegar entregó el prometido grano de maíz a los hambrientos indígenas que plantaron la semilla, y desde entonces, tuvieron maíz para alimentarse.", "questions": [{"id": 50400, "question": "¿Qué hizo Quetzalcóatl al llegar a su destino?", "options": ["Construyó un templo en la montaña", "Tomó con sus mandíbulas un grano maduro de maíz", "Peleó contra las montañas", "Llamó a la lluvia para regar la tierra"], "correct": 1}, {"id": 50401, "question": "¿Qué parte de su cuerpo usó Quetzalcóatl para tomar el grano?", "options": ["La cola", "Las patas delanteras", "Las antenas", "Las mandíbulas"], "correct": 3}, {"id": 50402, "question": "¿Qué característica tenía el grano que tomó Quetzalcóatl?", "options": ["Estaba todavía verde", "Estaba seco y roto", "Estaba maduro", "Estaba mojado por la lluvia"], "correct": 2}, {"id": 50403, "question": "¿Cómo describe el texto el regreso de Quetzalcóatl?", "options": ["Como un viaje fácil y corto", "Como una huida sin esfuerzo", "Como un duro regreso", "Como una celebración alegre"], "correct": 2}, {"id": 50404, "question": "¿A quiénes entregó Quetzalcóatl el grano de maíz?", "options": ["A los guerreros de otros pueblos", "A los mercaderes de la costa", "A los dioses de las montañas", "A los hambrientos indígenas"], "correct": 3}, {"id": 50405, "question": "¿Qué hicieron los indígenas con el grano recibido?", "options": ["Lo vendieron a extranjeros", "Lo guardaron en un templo", "Lo plantaron como semilla", "Lo ofrecieron a los dioses sin plantarlo"], "correct": 2}, {"id": 50406, "question": "¿Qué les había prometido Quetzalcóatl a los indígenas?", "options": ["Riquezas de oro", "Una nueva ciudad", "La protección de los dioses", "Un grano de maíz"], "correct": 3}, {"id": 50407, "question": "¿Qué actitud mostró Quetzalcóatl durante la subida a las montañas?", "options": ["Miedo y desánimo constante", "Esfuerzo sin perder el ánimo", "Indiferencia ante el peligro", "Enojo contra los indígenas"], "correct": 1}, {"id": 50408, "question": "¿Desde cuándo tuvieron maíz los indígenas?", "options": ["Desde que construyeron sus ciudades", "Desde el año de la conquista", "Desde antes de la llegada de Quetzalcóatl", "Desde que plantaron la semilla que les dio Quetzalcóatl"], "correct": 3}, {"id": 50409, "question": "¿Qué significa «mandíbulas» en el texto?", "options": ["Partes de la boca que sujetan y muerden", "Patas delanteras del insecto", "Antenas que sirven para oler", "Alas con las que vuela"], "correct": 0}, {"id": 50410, "question": "¿Qué significa «maduro» referido al grano?", "options": ["Podrido por el tiempo", "Listo para consumirse o sembrarse", "Verde y todavía muy duro", "Pequeño y sin valor"], "correct": 1}, {"id": 50411, "question": "¿Qué hizo Quetzalcóatl después de tomar el grano?", "options": ["Subió a un templo para orar", "Inició el regreso", "Se quedó en la montaña a descansar", "Se escondió en una cueva"], "correct": 1}, {"id": 50412, "question": "¿Quién plantó la semilla del maíz?", "options": ["Los antiguos dioses", "Los guerreros aztecas", "Quetzalcóatl solo, sin ayuda", "Los hambrientos indígenas"], "correct": 3}, {"id": 50413, "question": "¿Qué beneficio obtuvieron los indígenas desde entonces?", "options": ["Tuvieron maíz para alimentarse", "Obtuvieron oro para comerciar", "Se trasladaron a otra región", "Ganaron guerras contra sus vecinos"], "correct": 0}]}, {"id": 5, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 5, "title": "Párrafo 5 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "El preciado grano, aumentó sus riquezas, y se volvieron más fuertes, construyeron ciudades, palacios, templos… Y desde entonces vivieron felices.", "questions": [{"id": 50500, "question": "¿Qué efecto tuvo el maíz en la riqueza de los pueblos?", "options": ["Aumentó sus riquezas", "Las trasladó a otros pueblos", "No cambió nada en su vida", "Las redujo de forma notable"], "correct": 0}, {"id": 50501, "question": "¿Qué construyeron los pueblos después de tener maíz?", "options": ["Ciudades, palacios y templos", "Fortalezas bajo el agua", "Carreteras y puentes de hierro", "Barcos de guerra para el mar"], "correct": 0}, {"id": 50502, "question": "¿Cómo quedaron los pueblos después de tener maíz?", "options": ["Igual que antes", "Dispersos y sin hogar", "Más débiles y enfermos", "Más fuertes"], "correct": 3}, {"id": 50503, "question": "¿Qué frase resume cómo terminó el párrafo?", "options": ["Vivieron felices", "Perdieron sus tierras", "Se dividieron en dos pueblos", "Se marcharon de la región"], "correct": 0}, {"id": 50504, "question": "¿Qué significa «preciado» en «el preciado grano»?", "options": ["Escaso y sin valor", "Valioso y muy apreciado", "Podrido e inservible", "Barato y fácil de conseguir"], "correct": 1}, {"id": 50505, "question": "¿Cuál de estos elementos NO aparece como resultado del maíz?", "options": ["Templos", "Palacios", "Guerras de conquista", "Ciudades"], "correct": 2}]}, {"id": 6, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 6, "title": "Párrafo 6 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Y a partir de ese momento, los aztecas veneraron al generoso Quetzalcóatl, el dios amigo de los hombres, el dios que les trajo el maíz.", "questions": [{"id": 50600, "question": "¿Qué hicieron los aztecas a partir de ese momento?", "options": ["Emigraron hacia el norte", "Veneraron a Quetzalcóatl", "Abandonaron el maíz por completo", "Destruyeron sus templos"], "correct": 1}, {"id": 50601, "question": "¿Cómo describe el texto a Quetzalcóatl en el último párrafo?", "options": ["Como un dios que los abandonó", "Como el dios amigo de los hombres", "Como un dios cruel y distante", "Como un dios guerrero y violento"], "correct": 1}, {"id": 50602, "question": "¿Qué les trajo Quetzalcóatl a los aztecas?", "options": ["El agua de los ríos", "Un nuevo idioma", "El caballo", "El maíz"], "correct": 3}, {"id": 50603, "question": "¿Qué sentimiento hacia Quetzalcóatl expresa el párrafo?", "options": ["Burla y desprecio", "Miedo y rechazo", "Veneración y gratitud", "Indiferencia total"], "correct": 2}, {"id": 50604, "question": "¿Por qué los aztecas veneraban a Quetzalcóatl?", "options": ["Porque les enseñó a cazar", "Porque construyó sus templos", "Porque los derrotó en batalla", "Porque les trajo el maíz"], "correct": 3}, {"id": 50605, "question": "¿Qué palabra describe el carácter de Quetzalcóatl en el último párrafo?", "options": ["Cruel", "Egoísta", "Temeroso", "Generoso"], "correct": 3}]}, {"id": 7, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 1, "title": "Párrafo 1 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "El majestuoso balcón natural del Sumidero tuvo como origen un largo proceso de fallas geológicas. Tiene un alto valor ecológico y cuenta con 21,789 hectáreas en cinco municipios del estado de Chiapas, a pocos kilómetros de su capital, Tuxtla Gutiérrez.", "questions": [{"id": 50700, "question": "¿Qué originó el majestuoso balcón natural del Sumidero?", "options": ["Un largo proceso de fallas geológicas", "La construcción de una presa hace siglos", "Un terremoto repentino en la costa", "La erosión de un volcán activo"], "correct": 0}, {"id": 50701, "question": "¿Qué valor tiene el Sumidero según el primer párrafo?", "options": ["Únicamente un valor histórico", "Solo un valor comercial", "Ninguno, es un área urbana", "Un alto valor ecológico"], "correct": 3}, {"id": 50702, "question": "¿Cuántas hectáreas abarca el área protegida?", "options": ["2,178 hectáreas", "12,000 hectáreas", "21,789 hectáreas", "217,890 hectáreas"], "correct": 2}, {"id": 50703, "question": "¿En cuántos municipios se extiende el parque?", "options": ["En uno solo", "En tres municipios", "En siete municipios", "En cinco municipios"], "correct": 3}, {"id": 50704, "question": "¿En qué estado de la República se encuentra el Sumidero?", "options": ["Yucatán", "Michoacán", "Oaxaca", "Chiapas"], "correct": 3}, {"id": 50705, "question": "¿Qué ciudad es la capital del estado donde se ubica el cañón?", "options": ["Villahermosa", "Campeche", "Tapachula", "Tuxtla Gutiérrez"], "correct": 3}, {"id": 50706, "question": "¿Qué significa que el cañón esté «a pocos kilómetros» de la capital?", "options": ["Que está cerca de Tuxtla Gutiérrez", "Que está a cientos de kilómetros de Tuxtla", "Que se encuentra dentro del mar", "Que ya no forma parte de Chiapas"], "correct": 0}, {"id": 50707, "question": "¿Qué significa «majestuoso» en el primer párrafo?", "options": ["Oscuro y peligroso", "Impresionante, grandioso", "Pequeño y sencillo", "Abandonado y descuidado"], "correct": 1}, {"id": 50708, "question": "¿Qué tipo de origen tiene el balcón natural según el texto?", "options": ["Geológico, por fallas", "Biológico, por la acción de animales", "Volcánico, por una erupción reciente", "Humano, por una obra de ingeniería"], "correct": 0}, {"id": 50709, "question": "¿Cuál de estos datos NO aparece en el primer párrafo?", "options": ["La altura de sus muros, de más de 1000 metros", "Los municipios que lo abarcan", "Su cercanía a Tuxtla Gutiérrez", "Su superficie en hectáreas"], "correct": 0}]}, {"id": 8, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 2, "title": "Párrafo 2 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "El cañón consiste en un imponente acantilado que se eleva sobre el cauce del río Grijalva. Sus muros, que alcanzan los más de 1000 metros de altura, se han convertido en uno de los paisajes más impresionantes de México, nominado desde hace tiempo para ser una de las Siete Nuevas Maravillas Naturales.", "questions": [{"id": 50800, "question": "¿Qué adjetivo se usa para describir el acantilado?", "options": ["Diminuto", "Llano", "Dudoso", "Imponente"], "correct": 3}, {"id": 50801, "question": "¿Qué significa «cauce» en el segundo párrafo?", "options": ["Un lago artificial", "El lecho por donde corre un río", "Un tipo de roca calcárea", "Una planta de la zona"], "correct": 1}, {"id": 50802, "question": "¿Sobre qué cauce se eleva el imponente acantilado?", "options": ["El río Usumacinta", "El río Grijalva", "El río Papaloapan", "El río Balsas"], "correct": 1}, {"id": 50803, "question": "¿Cuánto alcanzan de altura los muros del cañón?", "options": ["Unos 100 metros", "Unos 300 metros", "Menos de 50 metros", "Más de 1000 metros"], "correct": 3}, {"id": 50804, "question": "¿Cómo se describe el cañón en este párrafo?", "options": ["Como una llanura seca", "Como un bosque plano", "Como una playa de arena", "Como un imponente acantilado"], "correct": 3}, {"id": 50805, "question": "¿Para qué ha sido propuesto el Sumidero según el texto?", "options": ["Para convertirse en una ciudad industrial", "Para ser una reserva marina", "Para albergar un aeropuerto internacional", "Para ser una de las Siete Nuevas Maravillas Naturales"], "correct": 3}, {"id": 50806, "question": "¿Desde cuándo está nominado el Sumidero para esa distinción?", "options": ["Desde la construcción de la presa", "Desde hace tiempo", "Desde la fecha de su decreto como parque", "Desde el año 2004"], "correct": 1}, {"id": 50807, "question": "¿Qué paisaje se menciona como uno de los más impresionantes de México?", "options": ["Los desiertos del norte", "Los muros del cañón", "Las playas del Caribe", "Los volcanes nevados"], "correct": 1}, {"id": 50808, "question": "¿Qué significa «nominado» en el segundo párrafo?", "options": ["Ya premiado con un galardón", "Retirado de una lista oficial", "Propuesto o candidato para recibir un reconocimiento", "Nombrado por un decreto presidencial"], "correct": 2}, {"id": 50809, "question": "¿Qué relación hay entre la altura de los muros y el paisaje?", "options": ["Los muros bajos hacen el paisaje más atractivo", "Los muros impiden ver el río", "Los muros altos hacen del paisaje uno de los más impresionantes", "La altura no tiene relación con el paisaje"], "correct": 2}, {"id": 50810, "question": "¿Qué elemento hídrico recorre la base del cañón?", "options": ["Un arroyo de montaña temporal", "El río Grijalva", "Una laguna de agua salada", "Un canal artificial de riego"], "correct": 1}, {"id": 50811, "question": "¿Qué forma geológica describe el segundo párrafo?", "options": ["Un acantilado que se eleva sobre el cauce del río", "Una cueva que atraviesa una montaña", "Una planicie que se hunde en el mar", "Una meseta de piedra caliza sin relieve"], "correct": 0}]}, {"id": 9, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 3, "title": "Párrafo 3 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "La luz y el calor sobre las paredes del acantilado, así como sus abundantes escurrimientos han propiciado el surgimiento de varios microclimas en la vegetación y fauna en diferentes alturas del cañón. Algunas de sus especies endémicas (exclusivas de esta zona) son la salamandra Lengua Hongueada, la cuija Mexicana, el chupaflor Canelo, el sapo Jaspeado, la mojarra de Chiapa de Corzo y el encino Enano.", "questions": [{"id": 50900, "question": "¿Qué han propiciado la luz, el calor y los escurrimientos sobre el acantilado?", "options": ["Un clima uniforme en todo el cañón", "La desaparición de toda la vegetación", "Varios microclimas en la vegetación y la fauna", "La formación de un desierto"], "correct": 2}, {"id": 50901, "question": "¿Qué son las especies endémicas?", "options": ["Especies que llegaron de otro continente", "Especies comunes en todo el mundo", "Especies exclusivas de esta zona", "Especies introducidas por el hombre"], "correct": 2}, {"id": 50902, "question": "¿Cuál de estas especies se menciona como endémica?", "options": ["El oso pardo", "La salamandra Lengua Hongueada", "El águila calva", "El lobo gris"], "correct": 1}, {"id": 50903, "question": "¿Qué ave endémica aparece en el texto?", "options": ["El chupaflor Canelo", "El águila real", "El pelícano blanco", "El cóndor andino"], "correct": 0}, {"id": 50904, "question": "¿Qué tipo de encino aparece en la lista de especies?", "options": ["El encino Enano", "El encino Blanco", "El encino Rojo", "El encino Gigante"], "correct": 0}, {"id": 50905, "question": "¿Qué pez de la lista recibe su nombre de la ciudad de Chiapa de Corzo?", "options": ["El robalo de Chiapa de Corzo", "La trucha de Chiapa de Corzo", "El bagre de Chiapa de Corzo", "La mojarra de Chiapa de Corzo"], "correct": 3}, {"id": 50906, "question": "¿Qué ser vivo se llama «cuija Mexicana» en el texto?", "options": ["Un mamífero nocturno", "Un insecto acuático", "Un ave de gran tamaño", "Un reptil de la zona"], "correct": 3}, {"id": 50907, "question": "¿Qué especie de anfibio aparece en la lista?", "options": ["La rana de cristal", "El ajolote mexicano", "El sapo Jaspeado", "El sapo gigante"], "correct": 2}, {"id": 50908, "question": "¿Qué significa «microclimas»?", "options": ["Climas artificiales creados por el hombre", "Climas desaparecidos por la sequía", "Climas locales distintos dentro de una zona pequeña", "Climas de todo el país"], "correct": 2}, {"id": 50909, "question": "¿Qué factor no aparece como causante de los microclimas?", "options": ["Los abundantes escurrimientos", "El calor sobre las paredes", "La construcción de carreteras", "La luz sobre las paredes"], "correct": 2}, {"id": 50910, "question": "¿Qué se entiende por «diferentes alturas del cañón» en el texto?", "options": ["Cumbres que no tienen vegetación", "Distancias entre dos ciudades", "Medidas de la presa de Chicoasén", "Distintos niveles donde cambian el clima y la vida"], "correct": 3}, {"id": 50911, "question": "¿Cuántas especies endémicas se citan en el párrafo?", "options": ["Diez", "Doce", "Seis", "Tres"], "correct": 2}, {"id": 50912, "question": "¿Qué tipo de vegetación se menciona en el párrafo?", "options": ["Cactus del desierto", "Encino enano", "Mangle rojo", "Palmeras de coco"], "correct": 1}, {"id": 50913, "question": "¿Cuál de estas NO es una especie endémica citada en el párrafo?", "options": ["El sapo Jaspeado", "El encino Enano", "La salamandra Lengua Hongueada", "El jaguar"], "correct": 3}, {"id": 50914, "question": "¿Qué especie endémica citada es un reptil?", "options": ["El sapo Jaspeado", "La cuija Mexicana", "El chupaflor Canelo", "La mojarra de Chiapa de Corzo"], "correct": 1}, {"id": 50915, "question": "¿Qué significa «escurrimientos» en el texto?", "options": ["Pinturas rupestres", "Derrumbes de piedra", "Hongos que crecen en la roca", "Corrientes de agua que bajan por las paredes"], "correct": 3}, {"id": 50916, "question": "¿Qué palabra indica que los microclimas se distribuyen en distintos niveles?", "options": ["Longitudes", "Profundidades", "Latitudes", "Alturas"], "correct": 3}]}, {"id": 10, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 4, "title": "Párrafo 4 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "El parque es frecuentado por decenas de miles de visitantes que gustan de practicar la bicicleta de montaña, el nado, el kayak y el rapel.", "questions": [{"id": 51000, "question": "¿Quiénes frecuentan el parque?", "options": ["Decenas de miles de visitantes", "Solo científicos y biólogos", "Solo militares en entrenamiento", "Únicamente pescadores locales"], "correct": 0}, {"id": 51001, "question": "¿Cuál de estas actividades NO aparece en el párrafo?", "options": ["Esquí sobre nieve", "Kayak", "Bicicleta de montaña", "Nado"], "correct": 0}, {"id": 51002, "question": "¿Qué actividad de cuerda se menciona?", "options": ["El paracaidismo", "El puenting", "El rapel", "La escalada en hielo"], "correct": 2}, {"id": 51003, "question": "¿Qué significa «frecuentado» en este párrafo?", "options": ["Evitado por peligroso", "Olvidado por completo", "Visitado con frecuencia", "Cerrado al público"], "correct": 2}, {"id": 51004, "question": "¿Qué vehículo de dos ruedas usan los visitantes para recorrer el parque?", "options": ["El triciclo", "La motocicleta de carrera", "El patinete eléctrico", "La bicicleta de montaña"], "correct": 3}, {"id": 51005, "question": "¿Qué deporte acuático se practica según el párrafo?", "options": ["El buceo profundo", "El surf", "El esquí acuático", "El kayak"], "correct": 3}, {"id": 51006, "question": "¿Cuál es el propósito principal de la visita según el párrafo?", "options": ["Estudiar la historia colonial", "Comprar artesanías en mercados", "Practicar actividades al aire libre", "Participar en ceremonias religiosas"], "correct": 2}, {"id": 51007, "question": "¿Qué tipo de turismo describe este párrafo?", "options": ["Turismo de aventura y naturaleza", "Turismo de playa", "Turismo de compras y comercio", "Turismo de congresos"], "correct": 0}]}, {"id": 11, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 5, "title": "Párrafo 5 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "Dentro de la zona se encuentra la presa hidroeléctrica de Chicoasén, una de las mayores obras mexicanas de ingeniería hidráulica, con un embalse de 32 kilómetros de largo que abarca la totalidad del cañón.", "questions": [{"id": 51100, "question": "¿Qué obra hidroeléctrica se encuentra dentro de la zona?", "options": ["La presa de El Infiernillo", "La presa de Malpaso", "La presa de Chicoasén", "La presa de Angostura"], "correct": 2}, {"id": 51101, "question": "¿Cómo se describe la presa de Chicoasén?", "options": ["Como un proyecto que nunca se terminó", "Como una presa abandonada desde hace años", "Como una de las mayores obras mexicanas de ingeniería hidráulica", "Como una pequeña obra de riego local"], "correct": 2}, {"id": 51102, "question": "¿Qué longitud tiene el embalse?", "options": ["320 kilómetros", "3.2 kilómetros", "6 kilómetros", "32 kilómetros"], "correct": 3}, {"id": 51103, "question": "¿Qué parte del cañón abarca el embalse?", "options": ["Solo la parte alta del cañón", "La totalidad del cañón", "Solo la entrada del cañón", "Una pequeña laguna en el fondo"], "correct": 1}, {"id": 51104, "question": "¿Qué tipo de obra es la presa de Chicoasén?", "options": ["Minera", "Ferroviaria", "Petrolera", "Hidroeléctrica"], "correct": 3}, {"id": 51105, "question": "¿Qué significa «embalse» en el texto?", "options": ["Depósito artificial de agua contenida por una presa", "Canal de drenaje urbano", "Parte alta de una montaña", "Tipo de vegetación del cañón"], "correct": 0}, {"id": 51106, "question": "¿Qué relación tiene la presa con el cañón?", "options": ["Se encuentra dentro de la zona del parque", "Divide el parque en dos partes separadas", "Fue construida fuera del estado de Chiapas", "Está a cientos de kilómetros del parque"], "correct": 0}, {"id": 51107, "question": "¿Qué tipo de ingeniería destaca el texto?", "options": ["Ingeniería minera", "Ingeniería nuclear", "Ingeniería hidráulica", "Ingeniería aeronáutica"], "correct": 2}, {"id": 51108, "question": "¿Qué función cumple una presa hidroeléctrica?", "options": ["Proteger la costa de huracanes", "Regar cultivos de cacao", "Generar electricidad a partir del agua embalsada", "Extraer petróleo del subsuelo"], "correct": 2}]}, {"id": 12, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 6, "title": "Párrafo 6 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "Por su riqueza ecológica fue decretado Parque Nacional el 8 de diciembre de 1980. En 2004 fue clasificado como sitio Ramsar (humedal de importancia internacional).", "questions": [{"id": 51200, "question": "¿En qué fecha fue decretado Parque Nacional el Sumidero?", "options": ["El 2 de noviembre de 2004", "El 8 de diciembre de 1980", "El 15 de septiembre de 1810", "El 20 de noviembre de 1910"], "correct": 1}, {"id": 51201, "question": "¿En qué año fue clasificado como sitio Ramsar?", "options": ["En 2008", "En 2004", "En 1994", "En 1980"], "correct": 1}, {"id": 51202, "question": "¿Qué significa «sitio Ramsar» según el párrafo?", "options": ["Área urbana con servicios públicos", "Reserva de caza deportiva", "Humedal de importancia internacional", "Zona de uso exclusivo militar"], "correct": 2}, {"id": 51203, "question": "¿Por qué fue decretado el parque según el párrafo?", "options": ["Por ser una antigua fortaleza", "Por su potencial minero", "Por su riqueza ecológica", "Por su valor como zona industrial"], "correct": 2}, {"id": 51204, "question": "¿Qué tipo de reconocimiento recibió el Sumidero en 2004?", "options": ["Una distinción gastronómica", "Internacional, como humedal", "Un premio literario nacional", "Un galardón deportivo"], "correct": 1}, {"id": 51205, "question": "¿Qué orden cronológico es correcto en el párrafo?", "options": ["Ambos eventos ocurrieron el mismo año", "Decreto como parque en 1980 y clasificación Ramsar en 2004", "Clasificación Ramsar en 1980 y decreto en 2004", "Decreto en 2004 y clasificación en 1980"], "correct": 1}]}, {"id": 13, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 1, "title": "Párrafo 1 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "El Día de Muertos, que se realiza el 1 y 2 de noviembre, en la cual se agasaja a los difuntos con ofrendas que incluyen sus alimentos preferidos, agua, flores de cempasúchil, velas, papel picado, pan de muerto y calaveritas de azúcar y chocolate, para convidar a los seres queridos que ya no están.", "questions": [{"id": 51300, "question": "¿En qué fechas se realiza el Día de Muertos?", "options": ["El 12 de octubre", "El 25 de diciembre", "El 15 y 16 de septiembre", "El 1 y 2 de noviembre"], "correct": 3}, {"id": 51301, "question": "¿Para qué se preparan las ofrendas?", "options": ["Para pagar impuestos a los dioses", "Para festejar la llegada del verano", "Para celebrar una cosecha de maíz", "Para convidar a los seres queridos que ya no están"], "correct": 3}, {"id": 51302, "question": "¿Cuál de estos elementos NO aparece en la descripción de las ofrendas?", "options": ["Flores de cempasúchil", "Globos de helio", "Pan de muerto", "Velas"], "correct": 1}, {"id": 51303, "question": "¿Qué tipo de flor se menciona en las ofrendas?", "options": ["Rosa de Castilla", "Lirio blanco", "Orquídea silvestre", "Cempasúchil"], "correct": 3}, {"id": 51304, "question": "¿Qué alimentos se colocan en las ofrendas?", "options": ["Únicamente frutas tropicales", "Solo alimentos enlatados", "Los alimentos preferidos de los difuntos", "Solo carne asada"], "correct": 2}, {"id": 51305, "question": "¿Qué son las calaveritas mencionadas en el texto?", "options": ["Dulces de azúcar y chocolate", "Juguetes de madera", "Piezas de cerámica", "Cráneos de animales"], "correct": 0}, {"id": 51306, "question": "¿Qué significa «agasaja» en el primer párrafo?", "options": ["Castiga o reprende", "Vende o intercambia", "Honra o recibe con atenciones", "Olvida o desprecia"], "correct": 2}, {"id": 51307, "question": "¿Qué elemento de papel se usa en la decoración?", "options": ["Cartón corrugado", "Papel de china sin recortar", "Papel picado", "Papel tapiz"], "correct": 2}, {"id": 51308, "question": "¿Qué se incluye en la ofrenda además de la comida?", "options": ["Agua, flores y velas", "Monedas de oro", "Ropa nueva", "Armas y herramientas"], "correct": 0}, {"id": 51309, "question": "¿Qué expresa la frase «para convidar a los seres queridos que ya no están»?", "options": ["Que los vivos deben abandonar sus casas", "Que la ofrenda invita a recordar y acoger a los difuntos", "Que la fiesta solo es para niños", "Que los difuntos deben pagar una deuda"], "correct": 1}, {"id": 51310, "question": "¿Qué pan se coloca en la ofrenda?", "options": ["Pan dulce de canela", "Bolillo recién horneado", "Pan integral de centeno", "Pan de muerto"], "correct": 3}, {"id": 51311, "question": "¿Qué líquido se incluye en la ofrenda?", "options": ["Agua", "Jugo de naranja", "Atole de chocolate", "Pulque"], "correct": 0}, {"id": 51312, "question": "¿De quién son los alimentos preferidos que se colocan en la ofrenda?", "options": ["De los niños de la familia", "De los sacerdotes del templo", "De los difuntos", "De los visitantes extranjeros"], "correct": 2}]}, {"id": 14, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 2, "title": "Párrafo 2 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "El Día de Muertos es muestra de la gran riqueza cultural de México. La festividad indígena fue declarada en 2008 por la Organización de las Naciones Unidas para la Educación, la Ciencia y la Cultura (UNESCO) como Patrimonio Cultural Inmaterial de la Humanidad. De raíces prehispánicas, combinada con la celebración católica del Día de Todos los Santos, la celebración busca rendir culto a los antepasados, pues se cree que los días 1 y 2 de noviembre, las almas de los fallecidos regresan para convivir con los vivos.", "questions": [{"id": 51400, "question": "¿Por qué el Día de Muertos es muestra de la riqueza cultural de México?", "options": ["Porque se celebra únicamente en la capital", "Porque fue creada en el siglo XXI", "Porque es una festividad solo para turistas", "Porque expresa una gran diversidad de tradiciones"], "correct": 3}, {"id": 51401, "question": "¿En qué año fue declarada la festividad por la UNESCO?", "options": ["En 1810", "En 2004", "En 2008", "En 1980"], "correct": 2}, {"id": 51402, "question": "¿Qué organismo declaró la festividad Patrimonio Cultural Inmaterial de la Humanidad?", "options": ["La Organización de Estados Americanos", "La UNESCO", "El Fondo Monetario Internacional", "La Organización Mundial de la Salud"], "correct": 1}, {"id": 51403, "question": "¿Qué significa «Patrimonio Cultural Inmaterial»?", "options": ["Un edificio histórico de piedra", "Una obra de arte guardada en un museo", "Una expresión cultural viva que se transmite de generación en generación", "Un documento de archivo oficial"], "correct": 2}, {"id": 51404, "question": "¿Qué tradiciones se combinan en la celebración?", "options": ["Ritos africanos y celebraciones navideñas", "Tradiciones japonesas y europeas", "Costumbres del norte y del Caribe", "Raíces prehispánicas y la celebración católica de Todos los Santos"], "correct": 3}, {"id": 51405, "question": "¿Qué busca la celebración según el texto?", "options": ["Conmemorar una batalla militar", "Promover el turismo internacional", "Rendir culto a los antepasados", "Festejar el fin de la cosecha de café"], "correct": 2}, {"id": 51406, "question": "¿Qué creencia tiene la gente sobre el 1 y 2 de noviembre?", "options": ["Que los vivos deben viajar lejos de su hogar", "Que es un día de luto sin visitas", "Que las almas de los fallecidos regresan para convivir con los vivos", "Que los muertos deben quedarse en el panteón"], "correct": 2}, {"id": 51407, "question": "¿Qué significa «prehispánicas» en el texto?", "options": ["Propias del siglo XXI", "Traídas por los conquistadores", "Posteriores a la independencia de México", "Anteriores a la llegada de los españoles"], "correct": 3}, {"id": 51408, "question": "¿Qué relación tiene la celebración con el Día de Todos los Santos?", "options": ["Se combina con ella", "Es exactamente igual a ella", "No tiene ninguna relación", "Se opone totalmente a ella"], "correct": 0}, {"id": 51409, "question": "¿Qué se busca mantener con la celebración, según el segundo párrafo?", "options": ["La separación entre vivos y muertos", "Un calendario agrícola", "La convivencia con los antepasados", "El olvido de las tradiciones"], "correct": 2}, {"id": 51410, "question": "¿Qué indica el término «legado» si se aplica a esta festividad?", "options": ["Una deuda económica pendiente", "Un contrato de trabajo", "Una herencia cultural transmitida por generaciones", "Un tipo de comida típica"], "correct": 2}, {"id": 51411, "question": "¿Qué año se menciona en relación con la declaración de la UNESCO?", "options": ["2020", "1985", "2012", "2008"], "correct": 3}, {"id": 51412, "question": "¿Qué tipo de patrimonio es el Día de Muertos según el texto?", "options": ["Patrimonio natural de la humanidad", "Patrimonio arquitectónico de México", "Patrimonio Cultural Inmaterial de la Humanidad", "Patrimonio documental del Estado"], "correct": 2}, {"id": 51413, "question": "¿Qué cosa creen los mexicanos que regresa a casa en esas fechas?", "options": ["Las almas de los fallecidos", "Los migrantes que se fueron al norte", "Los turistas extranjeros", "Las golondrinas de la temporada"], "correct": 0}, {"id": 51414, "question": "¿Qué origen tienen las raíces de la festividad según el texto?", "options": ["Prehispánico", "Europeo medieval", "Asiático", "Africano"], "correct": 0}, {"id": 51415, "question": "¿Qué cualidad atribuye el texto a la festividad?", "options": ["Es una festividad aburrida y sin interés", "Solo interesa a las generaciones mayores", "Se celebra con el mismo ritual en todo el mundo", "Muestra la gran riqueza cultural del país"], "correct": 3}, {"id": 51416, "question": "¿Cuál es la sigla de la organización que declaró la festividad?", "options": ["UNESCO", "OEA", "OMS", "ONU"], "correct": 0}, {"id": 51417, "question": "¿Qué tipo de celebración es la festividad según su origen?", "options": ["Totalmente moderna y comercial", "Mestiza, combina raíces indígenas y católicas", "Solo española e importada", "Solo indígena, sin influencias externas"], "correct": 1}, {"id": 51418, "question": "¿Qué palabra del texto significa honrar a los antepasados con prácticas religiosas?", "options": ["Olvido", "Castigo", "Mercado", "Culto"], "correct": 3}]}, {"id": 15, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 3, "title": "Párrafo 3 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "Entre los lugares más emblemáticos en la celebración del Día de Muertos están Pátzcuaro, en Michoacán, y San Andrés Mixquic, en el Distrito Federal, así como la Huasteca Potosina, Huaquechula, Puebla y Ocotepec en Morelos, donde se ha logrado mantener esta tradición ancestral de convivencia entre vivos y muertos en casas, calles y cementerios.", "questions": [{"id": 51500, "question": "¿Cuál de estos lugares se menciona como emblemático de la celebración?", "options": ["Tulum, en Quintana Roo", "Pátzcuaro, en Michoacán", "Oaxaca, en Oaxaca", "Monterrey, en Nuevo León"], "correct": 1}, {"id": 51501, "question": "¿En qué estado se encuentra Huaquechula?", "options": ["Puebla", "Morelos", "Potosí", "Michoacán"], "correct": 0}, {"id": 51502, "question": "¿En qué estado está Ocotepec?", "options": ["Puebla", "Morelos", "Guerrero", "Hidalgo"], "correct": 1}, {"id": 51503, "question": "¿Qué región de San Luis Potosí se menciona en el párrafo?", "options": ["La Sierra Gorda", "La Sierra Madre Oriental", "La Huasteca Potosina", "El Altiplano"], "correct": 2}, {"id": 51504, "question": "¿Qué relación aparece entre vivos y muertos en estos lugares?", "options": ["Una separación total durante toda la festividad", "Ninguna relación, sólo recuerdos", "Un conflicto que se resuelve con la fiesta", "Una convivencia que se mantiene en casas, calles y cementerios"], "correct": 3}, {"id": 51505, "question": "¿En qué espacios se mantiene la tradición según el texto?", "options": ["Solo en mercados y plazas comerciales", "Solo en iglesias", "En casas, calles y cementerios", "Solo en escuelas y oficinas"], "correct": 2}, {"id": 51506, "question": "¿Qué palabra indica que la tradición se ha conservado en estos lugares?", "options": ["Mantener", "Abandonar", "Prohibir", "Ocultar"], "correct": 0}, {"id": 51507, "question": "¿Qué tipo de tradición se describe en este párrafo?", "options": ["Una fiesta deportiva", "Una moda reciente de internet", "Una celebración importada del extranjero", "Una tradición ancestral"], "correct": 3}, {"id": 51508, "question": "¿Qué significa «emblemáticos» en el texto?", "options": ["Sin importancia ni fama", "Desconocidos por la población", "Representativos o característicos", "Recientemente construidos"], "correct": 2}, {"id": 51509, "question": "¿Cuántos lugares emblemáticos se mencionan en el tercer párrafo?", "options": ["Tres", "Diez", "Siete", "Cinco"], "correct": 3}, {"id": 51510, "question": "¿A qué se refiere «Distrito Federal» en el texto?", "options": ["A una región de Michoacán", "Al actual territorio de la Ciudad de México", "A un estado del norte del país", "A una isla del Caribe"], "correct": 1}, {"id": 51511, "question": "¿Cuál es el nombre del lugar de Michoacán mencionado en el párrafo?", "options": ["Zamora", "Uruapan", "Pátzcuaro", "Morelia"], "correct": 2}, {"id": 51512, "question": "¿Qué lugar de Puebla aparece en la lista?", "options": ["Atlixco", "Cholula", "Tehuacán", "Huaquechula"], "correct": 3}, {"id": 51513, "question": "¿Qué tipo de convivencia se establece en la celebración?", "options": ["Entre vivos y muertos", "Entre artistas y público", "Entre niños y maestros", "Entre dos pueblos rivales"], "correct": 0}]}, {"id": 16, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 4, "title": "Párrafo 4 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "Ubicado al sur de la ciudad de México, Mixquic, en la Delegación Tláhuac, tiene una de las celebraciones más impactantes, pues todo el pueblo participa en la fiesta recibir a las almas de los difuntos. El 1 de noviembre llegan las ánimas de los niños y el día 2, las de los adultos, en medio de ofrendas, oraciones y el repique de las campanas.", "questions": [{"id": 51600, "question": "¿A qué parte de la Ciudad de México pertenece Mixquic?", "options": ["Al norte", "Al sur", "Al poniente", "Al oriente extremo"], "correct": 1}, {"id": 51601, "question": "¿En qué delegación se ubica Mixquic según el texto?", "options": ["Tláhuac", "Coyoacán", "Iztapalapa", "Xochimilco"], "correct": 0}, {"id": 51602, "question": "¿Qué sucede en Mixquic durante la celebración?", "options": ["Todo el pueblo participa en la fiesta", "La gente se queda encerrada en sus casas", "Se suspenden todas las ceremonias", "Solo asisten las autoridades municipales"], "correct": 0}, {"id": 51603, "question": "¿Qué llega el 1 de noviembre según el texto?", "options": ["Las ánimas de los niños", "Los comerciantes del mercado", "Las aves migratorias", "Los turistas extranjeros"], "correct": 0}, {"id": 51604, "question": "¿Qué día llegan las ánimas de los adultos?", "options": ["El 31 de octubre", "El 1 de noviembre", "El 2 de noviembre", "El 3 de noviembre"], "correct": 2}, {"id": 51605, "question": "¿Qué elementos acompañan la llegada de las ánimas?", "options": ["Desfiles de carros alegóricos", "Ofrendas, oraciones y el repique de las campanas", "Fuegos artificiales y música de banda", "Concursos de disfraces"], "correct": 1}, {"id": 51606, "question": "¿Qué significa «repique» en el texto?", "options": ["Sonido fuerte y repetido de campanas", "Un baile típico", "Un tipo de comida tradicional", "Una prenda de vestir"], "correct": 0}, {"id": 51607, "question": "¿Qué tipo de celebración es la de Mixquic según el párrafo?", "options": ["Una celebración apagada y discreta", "Una de las más impactantes del país", "Una festividad sin ofrendas", "Una fiesta que se celebra solo en privado"], "correct": 1}, {"id": 51608, "question": "¿Qué relación tiene la llegada de las ánimas con las ofrendas?", "options": ["Las ofrendas se queman para ahuyentarlas", "No tienen relación alguna", "Las ofrendas se preparan para recibirlas", "Las ofrendas se venden a los turistas"], "correct": 2}, {"id": 51609, "question": "¿Qué se entiende por «ánimas» en el texto?", "options": ["Los turistas que visitan el pueblo", "Los habitantes del pueblo", "Los músicos de la fiesta", "Las almas de los difuntos"], "correct": 3}, {"id": 51610, "question": "¿Qué grupo de personas llega primero según el texto?", "options": ["Los adultos", "Los sacerdotes", "Los niños", "Los ancianos"], "correct": 2}, {"id": 51611, "question": "¿Cuál es el sonido característico que se menciona?", "options": ["El de las trompetas", "El de las campanas", "El de los cohetes", "El de los tambores"], "correct": 1}]}, {"id": 17, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 5, "title": "Párrafo 5 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "La alumbrada o noche de las velas es el evento más significativo de la celebración, ya que el 2 de noviembre, a partir de las 18:00 horas, los habitantes de Mixquic se encaminan hacia el panteón con velas, incienso y flores. En el cementerio, todas las tumbas son iluminadas con velas y se hace arder el incienso, lo que crea un ambiente místico, de comunión entre vivos y muertos.", "questions": [{"id": 51700, "question": "¿Qué es la alumbrada según el texto?", "options": ["Un desfile de catrinas", "El evento más significativo de la celebración", "Un mercado nocturno de artesanías", "Un concurso de cocina tradicional"], "correct": 1}, {"id": 51701, "question": "¿Por qué se le llama también noche de las velas?", "options": ["Porque la fiesta se hace sin luz eléctrica", "Porque todos participan con linternas de colores", "Porque las tumbas se iluminan con velas", "Porque el evento dura toda la semana"], "correct": 2}, {"id": 51702, "question": "¿A qué hora empiezan a encaminarse los habitantes hacia el panteón?", "options": ["A las 6:00 de la mañana", "A las 21:00 horas", "A partir de las 18:00 horas", "A las 12:00 del mediodía"], "correct": 2}, {"id": 51703, "question": "¿Qué llevan los habitantes al panteón?", "options": ["Instrumentos musicales", "Comida enlatada", "Velas, incienso y flores", "Juguetes y globos"], "correct": 2}, {"id": 51704, "question": "¿Qué ocurre con las tumbas en el cementerio?", "options": ["Son iluminadas con velas", "Son retiradas para hacer obras", "Son pintadas de colores brillantes", "Son cerradas al público"], "correct": 0}, {"id": 51705, "question": "¿Qué se hace arder en el cementerio?", "options": ["Hojas secas", "Papel moneda", "Leña para calentarse", "Incienso"], "correct": 3}, {"id": 51706, "question": "¿Qué tipo de ambiente se crea según el párrafo?", "options": ["Un ambiente comercial y festivo", "Un ambiente místico, de comunión entre vivos y muertos", "Un ambiente de competencia deportiva", "Un ambiente de temor y silencio total"], "correct": 1}, {"id": 51707, "question": "¿Qué día se realiza la alumbrada en Mixquic?", "options": ["El 2 de noviembre", "El 15 de septiembre", "El 1 de noviembre", "El 25 de diciembre"], "correct": 0}, {"id": 51708, "question": "¿Qué significa «comunión» en el texto?", "options": ["Ceremonia religiosa de bautismo", "Separación de las familias", "Conflicto entre grupos", "Unión o vínculo espiritual"], "correct": 3}, {"id": 51709, "question": "¿Qué se realiza en el panteón durante la alumbrada?", "options": ["Se iluminan las tumbas y se quema incienso", "Se venden flores a los turistas", "Se realizan competencias deportivas", "Se construyen nuevas tumbas"], "correct": 0}, {"id": 51710, "question": "¿Qué se encamina hacia el panteón?", "options": ["Los músicos de la banda", "Los vendedores de comida", "Los habitantes de Mixquic", "Los visitantes extranjeros"], "correct": 2}, {"id": 51711, "question": "¿Qué ambiente lleva la alumbrada en su conjunto?", "options": ["Comercial y urbano", "Festivo y ruidoso", "Deportivo y competitivo", "Místico"], "correct": 3}, {"id": 51712, "question": "¿Cuál es el evento más significativo, según el texto?", "options": ["La quema de juguetes", "El concurso de catrinas", "La carrera de cruces", "La alumbrada o noche de las velas"], "correct": 3}, {"id": 51713, "question": "¿Qué elementos se llevan además de las velas?", "options": ["Herramientas de jardinería", "Incienso y flores", "Mapas y brújulas", "Almohadas y mantas"], "correct": 1}, {"id": 51714, "question": "¿Qué se entiende por «alumbrada» ligada a la luz de las velas?", "options": ["La iluminación de las tumbas con velas durante la noche", "Un espectáculo de fuegos artificiales", "Una carrera de antorchas por el pueblo", "La iluminación eléctrica de las calles"], "correct": 0}, {"id": 51715, "question": "¿Qué se hace arder en el cementerio junto con las velas?", "options": ["Hojas secas", "Papel moneda", "Leña para calentarse", "Incienso"], "correct": 3}, {"id": 51716, "question": "¿Por qué se describe como místico el ambiente de la alumbrada?", "options": ["Por la luz de las velas, el incienso y la comunión con los difuntos", "Por la oscuridad total del panteón", "Por los fuegos artificiales y los cohetes", "Por la música estridente de bandas"], "correct": 0}]}, {"id": 18, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 6, "title": "Párrafo 6 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "Durante esa noche, en medio de oraciones y cantos, los habitantes del pueblo de Mixquic permanecen al lado de las tumbas de sus deudos. Mientras transcurre la noche, la luz de las velas es la que alumbrará a las ánimas en su camino de regreso.", "questions": [{"id": 51800, "question": "¿Qué se realiza durante la noche de la alumbrada?", "options": ["Desfiles de carros", "Oraciones y cantos", "Carreras de bicicletas", "Concursos de canto nacional"], "correct": 1}, {"id": 51801, "question": "¿Quiénes permanecen al lado de las tumbas?", "options": ["Los habitantes del pueblo de Mixquic", "Solo los sacerdotes del templo", "Los funcionarios municipales", "Únicamente los turistas"], "correct": 0}, {"id": 51802, "question": "¿A quiénes pertenecen las tumbas junto a las que se permanece?", "options": ["A los animales del panteón", "A los conquistadores españoles", "A sus deudos, es decir, a sus familiares y seres queridos", "A personas desconocidas del pueblo"], "correct": 2}, {"id": 51803, "question": "¿Qué alumbra a las ánimas en su camino de regreso?", "options": ["La luz de las velas", "Las luces de la ciudad", "La luna llena", "Los faros de los autos"], "correct": 0}, {"id": 51804, "question": "¿Cuál es el propósito de las velas según el último párrafo?", "options": ["Calentar a los visitantes", "Guiar a las ánimas en su regreso", "Espantar a los animales del cementerio", "Decorar los caminos del pueblo"], "correct": 1}, {"id": 51805, "question": "¿Qué se entiende por «deudos» en el texto?", "options": ["Sacerdotes encargados del panteón", "Familiares y seres queridos del difunto", "Vecinos de la misma calle", "Acreedores de dinero del pueblo"], "correct": 1}, {"id": 51806, "question": "¿Cuándo permanecen los habitantes junto a las tumbas?", "options": ["Solo al mediodía", "Únicamente en Navidad", "Durante esa noche", "Durante la semana completa"], "correct": 2}, {"id": 51807, "question": "¿Qué transcurre durante la noche según el texto?", "options": ["Carreras de caballos", "Oraciones y cantos en medio de la luz de las velas", "Un mercado de flores", "Una competencia de cocina"], "correct": 1}, {"id": 51808, "question": "¿Qué hacen los habitantes mientras transcurre la noche?", "options": ["Acompañan a sus difuntos junto a las tumbas", "Se van a dormir a sus casas", "Viajan a otra ciudad", "Organizan partidos de fútbol"], "correct": 0}, {"id": 51809, "question": "¿Qué ocurre con las ánimas al final de la noche según el párrafo?", "options": ["Se transforman en aves", "Regresan a su mundo siguiendo la luz de las velas", "Desaparecen sin rastro", "Se quedan para siempre en el pueblo"], "correct": 1}, {"id": 51810, "question": "¿Qué sentimiento transmite la escena de los habitantes junto a las tumbas?", "options": ["Acompañamiento y cercanía con los difuntos", "Temor a los fantasmas", "Indiferencia total hacia los muertos", "Alegría desbordada y competencia"], "correct": 0}, {"id": 51811, "question": "¿Qué significa «camino de regreso» en el último párrafo?", "options": ["Un atajo entre dos barrios del pueblo", "El recorrido del panteón a la iglesia", "El viaje de las ánimas de vuelta a su mundo", "Una ruta de peregrinación turística"], "correct": 2}]}, {"id": 19, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 1, "title": "Párrafo 1 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Hace mucho, pero mucho tiempo, Itzamná decidió crear una tierra que fuera tan hermosa que todo aquél que la conociera quisiera vivir allí, enamorado de su belleza. Entonces creó El Mayab, la tierra de los elegidos, y sembró en ella las más bellas flores que adornaran los caminos, creó enormes cenotes cuyas aguas cristalinas reflejaran la luz del sol y también profundas cavernas llenas de misterio.", "questions": [{"id": 51900, "question": "¿Quién decidió crear una tierra muy hermosa?", "options": ["Hunab Ku", "Itzamná", "Tláloc", "Quetzalcóatl"], "correct": 1}, {"id": 51901, "question": "¿Por qué querría la gente vivir en esa tierra?", "options": ["Porque quedaría enamorada de su belleza", "Porque allí había mucho oro", "Porque el clima era frío", "Porque los invasores la protegían"], "correct": 0}, {"id": 51902, "question": "¿Cómo se llamó la tierra creada por Itzamná?", "options": ["El Mayab", "Tierra de los elegidos del norte", "Tierra de las ceibas", "El Yucatán colonial"], "correct": 0}, {"id": 51903, "question": "¿Cómo se describe El Mayab?", "options": ["Como una montaña de hielo", "Como la tierra de los elegidos", "Como un desierto árido y sin agua", "Como una isla sin habitantes"], "correct": 1}, {"id": 51904, "question": "¿Qué sembró Itzamná en la tierra?", "options": ["Las más bellas flores que adornaran los caminos", "Cañaverales de azúcar", "Campos de trigo y cebada", "Enormes bosques de pinos"], "correct": 0}, {"id": 51905, "question": "¿Qué tipo de agua tenían los cenotes creados por Itzamná?", "options": ["Aguas turbias y sucias", "Aguas heladas de montaña", "Aguas saladas del mar", "Aguas cristalinas"], "correct": 3}, {"id": 51906, "question": "¿Qué efecto producían los cenotes sobre la luz?", "options": ["La convertían en fuego", "Reflejaban la luz del sol", "La oscurecían por completo", "Absorbían toda la luz"], "correct": 1}, {"id": 51907, "question": "¿Qué otra creación de Itzamná se menciona además de los cenotes?", "options": ["Profundas cavernas llenas de misterio", "Pirámides de cristal", "Murallas de hierro", "Puentes colgantes"], "correct": 0}, {"id": 51908, "question": "¿Qué significa «cenote» según el contexto?", "options": ["Un pozo natural de agua", "Un tipo de flor silvestre", "Un ave de la selva", "Una piedra preciosa"], "correct": 0}, {"id": 51909, "question": "¿Qué sentimiento provocaba la creación de Itzamná?", "options": ["Miedo a la oscuridad", "Enojo entre los habitantes", "Indiferencia total", "Admiración por su belleza"], "correct": 3}, {"id": 51910, "question": "¿Qué adjetivo describe las cavernas?", "options": ["Luminosas", "Misteriosas", "Diminutas", "Calurosas"], "correct": 1}, {"id": 51911, "question": "¿Qué relación hay entre los cenotes y la luz del sol?", "options": ["El sol los iluminaba desde abajo", "Se secaban con el sol", "Sus aguas reflejaban la luz del sol", "No tenían relación alguna con el sol"], "correct": 2}, {"id": 51912, "question": "¿Qué quería Itzamná que sintiera quien conociera la tierra?", "options": ["El deseo de abandonarla", "El deseo de conquistarla", "El deseo de olvidarla", "El deseo de vivir allí"], "correct": 3}, {"id": 51913, "question": "¿Cuál de estas creaciones NO aparece en la leyenda de Itzamná?", "options": ["Templos de piedra con escalinatas", "Flores en los caminos", "Profundas cavernas", "Enormes cenotes"], "correct": 0}, {"id": 51914, "question": "¿Qué creó Itzamná que reflejaba la luz del sol?", "options": ["Los templos de piedra", "Los cenotes de aguas cristalinas", "Los palacios dorados", "Las montañas de cristal"], "correct": 1}, {"id": 51915, "question": "¿Cuál era el propósito de sembrar flores en los caminos?", "options": ["Marcar los límites de la tierra", "Ocultar las cavernas", "Alimentar a los animales", "Adornarlos"], "correct": 3}]}, {"id": 20, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 2, "title": "Párrafo 2 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Después, Itzamná le entregó la nueva tierra a los mayas y escogió tres animales para que vivieran por siempre en El Mayab y quien pensara en ellos lo recordara de inmediato. Los elegidos por Itzamná fueron el faisán, el venado y la serpiente de cascabel. Los mayas vivieron felices y se encargaron de construir palacios y ciudades de piedra.", "questions": [{"id": 52000, "question": "¿A quién le entregó Itzamná la nueva tierra?", "options": ["A los olmecas", "A los mayas", "A los incas", "A los aztecas"], "correct": 1}, {"id": 52001, "question": "¿Cuántos animales escogió Itzamná?", "options": ["Cinco", "Cuatro", "Tres", "Dos"], "correct": 2}, {"id": 52002, "question": "¿Qué animales fueron elegidos por Itzamná?", "options": ["El tucán, el jabalí y el puma", "El jaguar, el águila y el colibrí", "El lobo, el coyote y la tortuga", "El faisán, el venado y la serpiente de cascabel"], "correct": 3}, {"id": 52003, "question": "¿Para qué escogió Itzamná a los animales?", "options": ["Para que vendieran la tierra", "Para que trabajaran en los campos", "Para que vivieran por siempre en El Mayab", "Para que cazaran a los invasores"], "correct": 2}, {"id": 52004, "question": "¿Qué debía ocurrir cuando alguien pensaba en los animales?", "options": ["Lo recordaba de inmediato", "Lo olvidaba por completo", "Los cazaba en el bosque", "Se alejaba de la tierra"], "correct": 0}, {"id": 52005, "question": "¿Cómo vivieron los mayas según el texto?", "options": ["En guerra constante", "Atemorizados", "Felices", "En la pobreza"], "correct": 2}, {"id": 52006, "question": "¿Qué construyeron los mayas?", "options": ["Barcos de madera para el mar", "Palacios y ciudades de piedra", "Presas de tierra en los ríos", "Casas de paja en la selva"], "correct": 1}, {"id": 52007, "question": "¿De qué material eran las ciudades construidas por los mayas?", "options": ["De vidrio", "De hierro", "De adobe y paja", "De piedra"], "correct": 3}, {"id": 52008, "question": "¿Qué tipo de construcciones se mencionan en el segundo párrafo?", "options": ["Puertos marítimos", "Estaciones de tren", "Palacios", "Presas hidroeléctricas"], "correct": 2}, {"id": 52009, "question": "¿Qué significa «entregó» en la frase «Itzamná le entregó la nueva tierra»?", "options": ["Dio o concedió", "Vendió a crédito", "Quitó o arrebató", "Perdió de vista"], "correct": 0}, {"id": 52010, "question": "¿Qué sentimiento tenían los mayas según el segundo párrafo?", "options": ["Vivieron felices", "Vivieron con miedo", "Vivieron con rabia", "Vivieron con tristeza"], "correct": 0}, {"id": 52011, "question": "¿Qué se dice sobre la permanencia de los animales?", "options": ["Solo vivirían un año en la tierra", "Vivirían por siempre en El Mayab", "Se irían cuando llegaran los extranjeros", "Serían llevados a otro continente"], "correct": 1}, {"id": 52012, "question": "¿Qué relación tienen los animales con el pueblo maya según el párrafo?", "options": ["No tienen relación alguna con los mayas", "Son animales domésticos que sirven de alimento", "Son símbolos elegidos por el dios para recordar la tierra", "Son enemigos que deben ser cazados"], "correct": 2}, {"id": 52013, "question": "¿Qué expresión indica que los animales vivirían para siempre en El Mayab?", "options": ["«Hasta mañana»", "«De vez en cuando»", "«Por un año»", "«Por siempre»"], "correct": 3}, {"id": 52014, "question": "¿Qué hicieron los mayas con la tierra que recibieron?", "options": ["La abandonaron para siempre", "La vendieron a extranjeros", "Construyeron palacios y ciudades de piedra", "La cubrieron de agua"], "correct": 2}]}, {"id": 21, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 3, "title": "Párrafo 3 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Mientras, los animales que escogió Itzamná no se cansaban de recorrer El Mayab. El faisán volaba hasta los árboles más altos y su grito era tan poderoso que podían escucharle todos los habitantes de esa tierra. El venado corría ligero como el viento y la serpiente movía sus cascabeles para producir música a su paso.", "questions": [{"id": 52100, "question": "¿Qué hacían los animales escogidos por Itzamná?", "options": ["Dormir en cuevas durante todo el día", "Recorrer El Mayab sin cansarse", "Construir ciudades de piedra", "Emigrar hacia el mar"], "correct": 1}, {"id": 52101, "question": "¿Hasta dónde volaba el faisán?", "options": ["Hasta la costa del mar", "Hasta el fondo de los cenotes", "Hasta las montañas nevadas", "Hasta los árboles más altos"], "correct": 3}, {"id": 52102, "question": "¿Por qué podían escucharlo todos los habitantes?", "options": ["Porque cantaba en coro con los mayas", "Porque hablaba en voz baja", "Porque su grito era muy poderoso", "Porque lo transmitía por radio"], "correct": 2}, {"id": 52103, "question": "¿Cómo corría el venado?", "options": ["Lento como una tortuga", "Solo a saltos cortos", "Torpe y pesado", "Ligero como el viento"], "correct": 3}, {"id": 52104, "question": "¿Qué producía la serpiente a su paso?", "options": ["Pequeñas piedras", "Humo y fuego", "Música con sus cascabeles", "Un olor fuerte"], "correct": 2}, {"id": 52105, "question": "¿Qué significa «ligero» en el texto?", "options": ["Ligero de peso, sin fuerza", "Claro de color", "Veloz y ágil", "Pesado y lento"], "correct": 2}, {"id": 52106, "question": "¿Qué animal emite un grito que se oye en toda la tierra?", "options": ["La serpiente", "El faisán", "El venado", "El jaguar"], "correct": 1}, {"id": 52107, "question": "¿Qué animal produce música?", "options": ["El colibrí", "La serpiente de cascabel", "El faisán", "El venado"], "correct": 1}, {"id": 52108, "question": "¿Qué animal recorre la tierra con gran rapidez?", "options": ["El venado", "El faisán", "El tapir", "La serpiente de cascabel"], "correct": 0}, {"id": 52109, "question": "¿Qué características se atribuyen al faisán?", "options": ["Nada en los cenotes y canta bajo el agua", "Vuela sobre los árboles más altos y tiene un grito poderoso", "Camina sobre el agua de los lagos", "Cava túneles en la tierra"], "correct": 1}, {"id": 52110, "question": "¿Para qué movía sus cascabeles la serpiente?", "options": ["Para asustar a los visitantes", "Para atraer presas a su cueva", "Para producir música a su paso", "Para avisar de un peligro inminente"], "correct": 2}, {"id": 52111, "question": "¿Qué idea se expresa con la frase «no se cansaban de recorrer»?", "options": ["Se aburrían en la selva", "Estaban agotados y dormían mucho", "Recorrían la tierra con constancia y entusiasmo", "Eran animales perezosos"], "correct": 2}, {"id": 52112, "question": "¿Qué tipo de sonido produce el faisán?", "options": ["Un silbido suave", "Un zumbido grave", "Un canto melodioso", "Un grito potente"], "correct": 3}, {"id": 52113, "question": "¿Qué efecto tenía la música de la serpiente en su paso?", "options": ["Espantaba a todas las aves", "No se oía a distancia", "Apagaba el sonido de los ríos", "Se oía por donde pasaba"], "correct": 3}]}, {"id": 22, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 4, "title": "Párrafo 4 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Así era la vida en El Mayab, hasta que un día, los chilam, o sea los adivinos mayas, vieron en el futuro algo que les causó gran tristeza. Entonces, llamaron a todos los habitantes, para anunciar lo siguiente: —Tenemos que dar noticias que les causarán mucha pena. Pronto nos invadirán hombres venidos de muy lejos; traerán armas y pelearán contra nosotros para quitarnos nuestra tierra. Tal vez no podamos defender El Mayab y lo perderemos.", "questions": [{"id": 52200, "question": "¿Quiénes vieron en el futuro algo que causó tristeza?", "options": ["Los animales elegidos", "Los chilam, o adivinos mayas", "Los sacerdotes de Itzamná", "Los invasores extranjeros"], "correct": 1}, {"id": 52201, "question": "¿Qué significa «chilam» en el texto?", "options": ["Guerreros de la selva", "Constructores de palacios", "Jefes de los cenotes", "Adivinos mayas"], "correct": 3}, {"id": 52202, "question": "¿Qué hicieron los chilam después de su visión?", "options": ["Llamaron a todos los habitantes para anunciar lo que vieron", "Atacaron a los extranjeros", "Huyeron de la tierra en secreto", "Ocultaron la visión a todos"], "correct": 0}, {"id": 52203, "question": "¿Quiénes llegarían a El Mayab según el anuncio?", "options": ["Los animales de la selva", "Hombres venidos de muy lejos", "Los dioses de la lluvia", "Los pobladores del norte"], "correct": 1}, {"id": 52204, "question": "¿Qué traerían los invasores?", "options": ["Telas y colores", "Libros y papeles", "Semillas y herramientas", "Armas"], "correct": 3}, {"id": 52205, "question": "¿Qué querían los invasores según el anuncio?", "options": ["Quitarles su tierra", "Visitar los cenotes", "Enseñarles una nueva religión", "Crear una alianza comercial"], "correct": 0}, {"id": 52206, "question": "¿Qué advirtieron los chilam sobre la defensa de El Mayab?", "options": ["Que nadie intentaría defenderla", "Que los dioses la defenderían solos", "Que la defensa sería muy sencilla", "Tal vez no podrían defenderla y la perderían"], "correct": 3}, {"id": 52207, "question": "¿Cómo describe el texto el anuncio de los chilam?", "options": ["Como una fiesta de bienvenida", "Como noticias que causarían mucha pena", "Como un mensaje sin importancia", "Como una canción alegre"], "correct": 1}, {"id": 52208, "question": "¿Qué sentimiento causó el anuncio entre los habitantes?", "options": ["Entusiasmo guerrero", "Alegría y celebración", "Indiferencia total", "Tristeza y preocupación"], "correct": 3}, {"id": 52209, "question": "¿Qué significa «invadirán» en el anuncio?", "options": ["Entrarán por la fuerza en un territorio ajeno", "Visitarán amablemente la región", "Comprarán tierras pacíficamente", "Abandonarán la tierra"], "correct": 0}, {"id": 52210, "question": "¿Cuál era la visión de los chilam?", "options": ["Una lluvia que destruiría las ciudades", "Un terremoto bajo las montañas", "Una invasión extranjera que conquistaría El Mayab", "Una gran fiesta en los cenotes"], "correct": 2}, {"id": 52211, "question": "¿Qué tipo de noticia dieron los chilam?", "options": ["Una noticia sobre un nuevo rey", "Una noticia sobre una cosecha abundante", "Una noticia dolorosa sobre el futuro", "Una noticia de paz y prosperidad"], "correct": 2}, {"id": 52212, "question": "¿Qué expresión indica que la invasión aún no había ocurrido?", "options": ["Ya nos conquistaron", "Nos invadieron en el pasado", "Pronto nos invadirán", "Nunca nos invadirán"], "correct": 2}, {"id": 52213, "question": "¿Qué palabra indica que el peligro era incierto?", "options": ["Nunca", "Siempre", "Tal vez", "Seguramente"], "correct": 2}, {"id": 52214, "question": "¿Qué relación hay entre los chilam y los habitantes?", "options": ["No se conocen entre sí", "Los chilam trabajan para los invasores", "Los habitantes dirigen a los chilam", "Los chilam informan a los habitantes sobre lo que vieron en el futuro"], "correct": 3}, {"id": 52215, "question": "¿Cuál es la consecuencia de la visión para los mayas?", "options": ["Pierden la memoria de los animales", "Destruyen los cenotes", "Se preparan para defender su tierra", "Abandonan la tierra de inmediato"], "correct": 2}, {"id": 52216, "question": "¿Qué se busca transmitir al decir «tenemos que dar noticias»?", "options": ["Una invitación a un banquete", "Un anuncio festivo", "Una petición de ayuda comercial", "Una advertencia seria y urgente"], "correct": 3}, {"id": 52217, "question": "¿Qué tipo de texto es este párrafo?", "options": ["Una carta de amor entre dos personas", "Un informe de un viaje comercial", "Una receta de cocina tradicional", "Un anuncio de los adivinos sobre una invasión"], "correct": 3}]}, {"id": 23, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 5, "title": "Párrafo 5 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Al oír las palabras de los chilam, el faisán huyó de inmediato a la selva y se escondió entre las yerbas, pues prefirió dejar de volar para que los invasores no lo encontraran.", "questions": [{"id": 52300, "question": "¿Qué hizo el faisán al oír las palabras de los chilam?", "options": ["Voló hasta el sol para pedir ayuda", "Se unió al ejército de los invasores", "Corrió a la costa para esperarlos", "Huyó a la selva y se escondió entre las yerbas"], "correct": 3}, {"id": 52301, "question": "¿Por qué dejó de volar el faisán?", "options": ["Para que los invasores no lo encontraran", "Porque los chilam se lo ordenaron", "Porque estaba cansado y enfermo", "Porque no le gustaba la altura"], "correct": 0}, {"id": 52302, "question": "¿Dónde se escondió el faisán?", "options": ["En una cueva de piedra", "En el fondo de un cenote", "En lo alto de una montaña", "Entre las yerbas de la selva"], "correct": 3}, {"id": 52303, "question": "¿Qué significa «de inmediato» en el texto?", "options": ["Nunca", "Solo en la noche", "Después de mucho tiempo", "Sin tardar, al momento"], "correct": 3}, {"id": 52304, "question": "¿Qué prefirió el faisán en lugar de seguir volando?", "options": ["Dejar de volar para no ser visto", "Volar más alto que los árboles", "Cantar para atraer a los invasores", "Pelear contra los extranjeros"], "correct": 0}, {"id": 52305, "question": "¿Qué quería evitar el faisán?", "options": ["Que llegara la noche", "Que los invasores lo encontraran", "Que sus plumas se mojaran", "Que lo viera el venado"], "correct": 1}]}, {"id": 24, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 6, "title": "Párrafo 6 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Cuando el venado supo que perdería su tierra, sintió una gran tristeza; entonces lloró tanto, que sus lágrimas formaron muchas aguadas. A partir de ese momento, al venado le quedaron los ojos muy húmedos, como si estuviera triste siempre. Sin duda, quien más se enojó al saber de la conquista fue la serpiente de cascabel; ella decidi
