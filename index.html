 la fundación de Tenochtitlan. Junto con el Himno Nacional y el Escudo, la Bandera es uno de los tres símbolos patrios de México, y su uso está regulado por la ley. En las escuelas, los lunes se realizan honores a la bandera, una ceremonia en la que estudiantes y maestros la saludan y entonan el Himno Nacional. Respetar la bandera es una forma de expresar identidad, memoria y pertenencia a la nación.", "text_en": "In Mexico, February 24 is Flag Day, a date dedicated to one of the most beloved national symbols. The current flag is made up of three vertical stripes — green, white, and red — with the National Coat of Arms in the center of the white stripe. Green symbolizes hope, white unity, and red the blood of the national heroes. The coat of arms shows a golden eagle perched on a cactus devouring a snake, an image that represents the founding of Tenochtitlan. Along with the National Anthem and the Coat of Arms, the Flag is one of Mexico's three national symbols, and its use is regulated by law. In schools, flag ceremonies are held on Mondays, where students and teachers salute the flag and sing the National Anthem. Respecting the flag is a way to express identity, memory, and belonging to the nation.", "text_fa": null, "questions": [{"id": 11600, "question": "¿En qué fecha se celebra el Día de la Bandera?", "options": ["5 de mayo", "20 de noviembre", "16 de septiembre", "24 de febrero"], "correct": 3, "question_en": "On what date is Flag Day celebrated?", "options_en": ["May 5", "November 20", "September 16", "February 24"], "question_fa": null, "options_fa": null}, {"id": 11601, "question": "¿Qué colores tiene la bandera de México?", "options": ["Verde, blanco y rojo", "Azul, blanco y rojo", "Verde, amarillo y rojo", "Rojo y blanco"], "correct": 0, "question_en": "What colors does the Mexican flag have?", "options_en": ["Green, white and red", "Blue, white and red", "Green, yellow and red", "Red and white"], "question_fa": null, "options_fa": null}, {"id": 11602, "question": "¿Qué representa el águila del escudo nacional?", "options": ["La Independencia", "La riqueza minera", "La fundación de Tenochtitlan", "La Revolución"], "correct": 2, "question_en": "What does the eagle in the coat of arms represent?", "options_en": ["Independence", "Mining wealth", "The founding of Tenochtitlan", "The Revolution"], "question_fa": null, "options_fa": null}, {"id": 11603, "question": "¿Qué simboliza el color verde de la bandera?", "options": ["La unidad", "La esperanza", "La sangre de los héroes", "La paz eterna"], "correct": 1, "question_en": "What does the green color of the flag symbolize?", "options_en": ["Unity", "Hope", "The blood of the heroes", "Eternal peace"], "question_fa": null, "options_fa": null}, {"id": 11604, "question": "¿Cuántos son los símbolos patrios de México?", "options": ["Cuatro", "Cinco", "Tres", "Dos"], "correct": 2, "question_en": "How many national symbols does Mexico have?", "options_en": ["Four", "Five", "Three", "Two"], "question_fa": null, "options_fa": null}, {"id": 11605, "question": "¿Qué se realiza en las escuelas los lunes?", "options": ["Una feria", "Un desfile deportivo", "Un examen", "Honores a la bandera"], "correct": 3, "question_en": "What is done in schools on Mondays?", "options_en": ["A fair", "A sports parade", "An exam", "Flag honors ceremony"], "question_fa": null, "options_fa": null}]}], "iw": {"interview": [{"question": "¿Por qué desea obtener la nacionalidad mexicana?", "tip": "Explica motivo personal, integración social y compromiso cívico."}, {"question": "¿Cuánto tiempo lleva viviendo en México?", "tip": "Menciona fecha aproximada de llegada, ciudad y estabilidad de residencia."}, {"question": "¿A qué se dedica actualmente?", "tip": "Describe tu ocupación, funciones principales y aporte concreto."}, {"question": "¿Qué le gusta de vivir en México?", "tip": "Incluye ejemplos reales sobre comunidad, cultura o calidad de vida."}, {"question": "¿Por qué decidió establecerse en este país?", var FC_REMAP = {"74": 73, "99": 719, "104": 17, "122": 630, "129": 632, "135": 628, "139": 638, "164": 607, "185": 622, "223": 1, "259": 5, "347": 562, "510": 20, "584": 621, "599": 53, "635": 134, "639": 141, "640": 142, "643": 146, "646": 155, "649": 158, "650": 159, "655": 149, "657": 227, "658": 567, "659": 594, "666": 244, "668": 252, "670": 263, "671": 268, "672": 270, "677": 303, "679": 329, "683": 334, "686": 344, "690": 588, "694": 364, "695": 427, "699": 445, "702": 499, "708": 53, "709": 61, "717": 92, "718": 94, "724": 115};
migrateDataVersion();

function key(){ return "nmx_db_" + (phone||"").trim(); }

    var db = JSON.parse(localStorage.getItem(key()) || "{}") || {};

}

function user(){ return DB.user || {id:1,name:"",practiceSession:0,totalCorrect:0,totalAnswered:0,masteredCount:0,simuladorApproved:false,lecturaApproved:false}; }

function cardAllowed(qid){

// Al eliminar preguntas duplicadas del banco (mismo concepto en dos ids), el
// progreso guardado bajo el id viejo se reasigna al id que se conservó; los ids
// que ya no existen en el banco se descartan. Es importante NO purgar por rango

// de las preguntas del lote 605+ y hacía que siempre se repitieran las mismas

function migrateDataVersion(){
  var changed = false;
  ["flashcards","simSeen","bankAdded","correctDays"].forEach(function(mapName){
    var map = DB[mapName];
    if(!map || typeof map !== "object") return;
    for(var k in map){
      var old = +k;
      var target = (FC_REMAP || {})[old];
      if(target){
        if(mapName === "correctDays"){
          var src = Array.isArray(map[k]) ? map[k] : [];
          var dst = Array.isArray(map[target]) ? map[target] : [];
          var seen = {};
          dst.forEach(function(d){ seen[d] = true; });
          src.forEach(function(d){ if(!seen[d]){ dst.push(d); seen[d] = true; } });
          dst.sort(function(a,b){ return a-b; });
          map[target] = dst;
        } else if(mapName === "flashcards" && map[k] && typeof map[k] === "object" && map[target] && typeof map[target] === "object"){
          var a = map[k], b = map[target];
          var last = [b.lastReviewedAt, a.lastReviewedAt].filter(Boolean).sort().pop() || null;
          map[target] = {
            correctCount: Math.max(b.correctCount||0, a.correctCount||0),
            learned: !!(b.learned || a.learned),
            lastReviewedAt: last,
            wrong: false,
          };
        } else {
          map[target] = map[k]; // booleans de simSeen / bankAdded
        }
        delete map[k];
        changed = true;
      } else if(!isHistoryId(old)){
        delete map[k];
        changed = true;
      }
    }
  });
  DB.dataVersion = APP_VERSION;
  saveDB();
  if(changed) saveDB();
}
function migrateFlashcards(){
  var fc=DB.flashcards||{};
  var seen=DB.simSeen||{};
  var added=DB.bankAdded||{};
  var changed=false;
  for(var qid in fc){
    var val=fc[qid];
    if(Array.isArray(val)){
      // Migrate from old format (array of marks) to new format (object)
      var correctCount=val.filter(function(x){return x==="facil";}).length;
      fc[qid]={correctCount:correctCount,learned:correctCount>=5,lastReviewedAt:null};
      changed=true;
      val=fc[qid];
    }
    // Solo preguntas de Historia/Cultura (del simulador o agregadas desde el
    // banco) pertenecen a flashcards. Se elimina lo de otras secciones (lectura).
    if(!isHistoryId(qid)){
      delete fc[qid];
      changed=true;
      continue;
    }
    // ...y solo si viene del simulador o se añadió desde el banco.
    if(wasAnswered(qid) && !seen[qid]){ seen[qid]=true; changed=true; }
    if(!cardAllowed(qid)){
      delete fc[qid];
      delete seen[qid];
      changed=true;
      continue;
    }
    // Si una tarjeta nueva (o proveniente del simulador con <=1 aciertos y no aprendida)
    // quedó bloqueada con fecha por versiones anteriores, desbloquearla para que
    // esté disponible de inmediato para repasar.
    if(val && !val.learned && (val.correctCount||0) <= 1 && val.wrong === undefined && val.lastReviewedAt){
      val.lastReviewedAt = null;
      changed = true;
    }
  }
  for(var sid in seen){
    if(!isHistoryId(sid)){ delete seen[sid]; changed=true; }
  }
  for(var aid in added){
    if(!isHistoryId(aid)){ delete added[aid]; changed=true; continue; }
    // Una pregunta añadida desde el banco siempre tiene su tarjeta (disponible para repasar).
    if(!fc[aid]){ fc[aid]={correctCount:0,learned:false,lastReviewedAt:null}; changed=true; }
  }
  DB.simSeen=seen;
  DB.bankAdded=added;
  DB.flashcards=fc;
  // Keep the displayed mastered count in sync after the cleanup.
  var u=user();
  var newCount=learnedIds().length;
  if(u.masteredCount!==newCount){ u.masteredCount=newCount; DB.user=u; changed=true; }
  if(changed){ saveDB(); }
}

function currentFarsiWork(){
  var out=[],signature=STATE.tab;
  if(STATE.tab==="sim"&&STATE.view){
    var sv=STATE.view;
    var simqs=sv.phase==="review"?sv.qs:[sv.qs[sv.idx]];
    simqs.forEach(function(q){addHistoryFarsiSources(out,q);});
    signature+="-"+sv.phase+"-"+(sv.phase==="review"?"all":sv.qs[sv.idx].id);
  } else if(STATE.tab==="lec"&&STATE.view){
    var lv=STATE.view;
    addFarsiSource(out,lv.p.text_en,lv.p.text_fa);
    lv.qs.forEach(function(q){addReadingFarsiSources(out,q);});
    signature+="-"+lv.p.id;
  } else if(STATE.tab==="fl"&&STATE.flash){
    addHistoryFarsiSources(out,STATE.flash.q);
    signature+="-"+STATE.flash.q.id+"-"+STATE.flash.revealed;
  } else if(STATE.tab==="ban"){
    var mode=STATE.sel.banmode||"hist";
    var query=(STATE.sel.banq||"").toLowerCase();
    if(mode==="hist"){
      HIST.filter(function(x){if(!query)return true;return (x.pregunta+" "+(x.pregunta_en||"")+" "+(x.subtema||"")).toLowerCase().indexOf(query)>=0;}).slice(0,10).forEach(function(q){addHistoryFarsiSources(out,q);});
    } else if(mode==="lec"){
      PASSAGES.filter(function(p){if(!query)return true;return (p.title+" "+p.text+" "+(p.text_en||"")).toLowerCase().indexOf(query)>=0;}).slice(0,2).forEach(function(p){addFarsiSource(out,p.text_en,p.text_fa);p.questions.forEach(function(q){addReadingFarsiSources(out,q);});});
    }
    signature+="-"+mode+"-"+query;
  }
  return {sources:out,signature:signature};
}
function splitTranslationText(text){
  if(encodeURIComponent(text).length<=430) return [text];
  var words=text.split(/\s+/),chunks=[],current="";
  words.forEach(function(word){
    var next=current?current+" "+word:word;
    if(current&&encodeURIComponent(next).length>430){chunks.push(current);current=word;}
    else current=next;
  });
  if(current)chunks.push(current);
  return chunks;
}
function decodeTranslationEntities(text){
  var area=document.createElement("textarea"); area.innerHTML=text; return area.value;
}
function requestFarsi(text){
  var url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=en%7Cfa&mt=1";
  return fetch(url,{method:"GET",mode:"cors"}).then(function(response){
    if(!response.ok)throw new Error("Translation HTTP "+response.status);
    return response.json();
  }).then(function(data){
    if(!data.responseData||Number(data.responseStatus)!==200||data.quotaFinished)throw new Error(data.responseDetails||"Translation quota unavailable");
    var text=decodeTranslationEntities(data.responseData.translatedText||"").trim();
    if(!text)throw new Error("Empty translation");
    return text;
  });
}
function translateFarsiSource(source){
  var chunks=splitTranslationText(source);
  return Promise.all(chunks.map(requestFarsi)).then(function(parts){return parts.join(" ");});
}
function ensureFarsiForView(){
  if(TRANSLATION!=="fa"||FA_LOADING||FA_ERROR)return;
  var work=currentFarsiWork();
  if(work.signature===FA_LAST_VIEW)return;
  FA_LAST_VIEW=work.signature;
  if(!work.sources.length)return;
  FA_LOADING=true;
  var button=document.getElementById("fa"); if(button)button.textContent="FA …";
  var cursor=0;
  function worker(){
    var index=cursor++; if(index>=work.sources.length)return Promise.resolve();
    var source=work.sources[index];
    return translateFarsiSource(source).then(function(result){FA_CACHE[source]=result;}).then(worker);
  }
  var workers=[];
  for(var i=0;i<Math.min(4,work.sources.length);i++)workers.push(worker());
  Promise.all(workers).then(function(){
    saveFarsiCache(); FA_LOADING=false; render();
  }).catch(function(error){
    console.error("Farsi translation failed",error); saveFarsiCache(); FA_LOADING=false; FA_ERROR=String(error&&error.message||error); render();
  });
}

function startTimer(){
  clearInterval(STATE.timer);
  STATE.timer=setInterval(function(){
    var v=STATE.view; if(!v) return;
    if(v.phase==="active"&&v.left>0){ v.left--; var el=document.querySelector(".timer"); if(el)el.textContent=fmt(v.left); if(v.left<=0){ clearInterval(STATE.timer); submitSim(true); } }
  },1000);

function submitSim(force){
  var v=STATE.view; if(!v||v.phase!=="active") return;
  clearInterval(STATE.timer);
  var list=v.qs.map(function(q){return {id:q.id, ans:v.ans[q.id], correct:q.correct};});
  var correct=list.filter(function(x){return x.ans===x.correct;}).length;
  var total=v.qs.length;
  var passed=correct>=8;
  recordAnswers(list,"simulador");
  recordAttempt("simulador",correct,total,passed);
  if(passed) setUser({simuladorApproved:true});
  v.phase="review"; v.correct=correct; v.total=total; v.passed=passed; v.list=list;
  render();
}
function recordAnswers(list,type){
  var day=sessionDay();
  var cd=DB.correctDays||{};
  list.forEach(function(x){ if(x.ans===x.correct){ var arr=cd[x.id]||[]; if(arr.indexOf(day)<0){arr.push(day); arr.sort(function(a,b){return a-b;});} cd[x.id]=arr; } });
  DB.correctDays=cd;
  var u=user(); u.totalAnswered+=(list.filter(function(x){return x.ans!=null;}).length); u.totalCorrect+=(list.filter(function(x){return x.ans===x.correct;}).length); u.practiceSession=day;
  // El simulador agrega a flashcards de forma automática SOLO las preguntas
  // que aún no están en la lista; el banco lo hace de forma manual con
  // addFromBank(). Lectura y otras secciones nunca aparecen.
  if(type==="simulador"){
    var seen=DB.simSeen=DB.simSeen||{};
    var fc=DB.flashcards=DB.flashcards||{};
    list.forEach(function(x){
      if(!isHistoryId(x.id)) return;
      if(x.ans==null) return; // only questions actually answered in the simulator
      seen[x.id]=true;
      if(fc[x.id]) return; // ya está en flashcards: su progreso solo se toca desde Flashcards
      // Nueva tarjeta: disponible de inmediato para repasar (lastReviewedAt null)
      // a diferencia de antes, donde se registraba la fecha y la tarjeta no
      // podía repasarse en 5 días.
      var card={correctCount:0,learned:false,lastReviewedAt:null};
      if(x.ans===x.correct){
        card.correctCount=1;
        card.wrong=false;
      } else {
        card.wrong=true; // fallada en el simulador: repasar al día siguiente
      }
      fc[x.id]=card;
    });
  }
  u.masteredCount=learnedIds().length;
  setUser(u);
  var d=DB.daily[today()]||{flashcards:0,simulador:false,lectura:false};
  d.simulador=type==="simulador";
  d.lectura=type==="lectura";
  DB.daily[today()]=d; saveDB();
}

/* ---------- Flashcards ---------- */
var FLASHCARD_LEARN_COUNT=5;
var FLASHCARD_MIN_DAYS=5;
var FL_MODE="reveal"; // "reveal" or "choice"
// Las flashcards provienen del simulador (automático) o del banco (manual).
function learnedIds(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push(+qid); }
  return out;
}
function pendingCards(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&!card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push({id:+qid,correctCount:card.correctCount||0,lastReviewedAt:card.lastReviewedAt||null}); }
  return out;
}
function daysSince(dateStr){
  if(!dateStr) return 9999;
  var d1=new Date(String(dateStr).slice(0,10)+"T00:00:00Z");
  var d2=new Date(today()+"T00:00:00Z");
  return Math.round((d2.getTime()-d1.getTime())/86400000);
}
// Filtros por categoría para la sección Flashcards: separar por tema
// (Historia / Cultura / Cívica / Geografía) igual que en el Banco.
var FL_CATS=[["all","Todas"],["Historia","Historia"],["Cultura","Cultura"],["Cívica","Cívica"],["Geografía","Geografía"]];
function availablePool(cat){
  cat=cat||STATE.sel.flcat||"all";
  var fc=DB.flashcards||{};
  var pool=HIST.filter(function(q){
    var card=fc[q.id];
    if(!card) return false;              // must have been added (simulator or bank)
    if(!cardAllowed(q.id)) return false; // only simulator-answered or bank-added
    if(card.learned) return false;
    if(cat!=="all" && q.categoria!==cat) return false;
    if(!card.lastReviewedAt) return true; // not reviewed yet
    // Si fallaste, la tarjeta vuelve al día siguiente; si acertaste, espera el
    // intervalo completo de repetición espaciada.
    var minDays = card.wrong ? 1 : FLASHCARD_MIN_DAYS;
    return daysSince(card.lastReviewedAt) >= minDays;
  });
  return pool;
}
function flHTML(){
  var learned=learnedIds();
  var pending=pendingCards();
  var cat=STATE.sel.flcat||"all";
  var studied=(DB.daily[today()]||{}).flashcards||0;
  if(!STATE.flash){
    var pool=availablePool(cat);
    var poolAll=availablePool("all");
    if(!pool.length){
      return '<div class="card" style="padding:40px;text-align:center">'+
        '<div class="row" style="margin-bottom:12px;justify-content:center"><span class="pill gold">Pendientes: '+pending.length+'</span><span class="pill green">Aprendidas: '+learned.length+'</span></div>'+
        '<div class="row" style="margin-bottom:12px;justify-content:center">'+FL_CATS.map(function(c){return '<button class="tab'+(cat===c[0]?' on':'')+'" data-flcat="'+c[0]+'" style="font-size:12px;padding:6px 12px">'+c[1]+'</button>';}).join("")+'</div>'+
        '<h2>'+(poolAll.length?'¡Ninguna disponible hoy'+(cat!=="all"?' en esta categoría':'')+'! ⏳':'¡Sin pendientes! 🎉')+'</h2>'+
        '<p class="small mut" style="margin-top:8px">'+(poolAll.length?('Hay '+poolAll.length+' tarjeta(s) disponible(s) hoy en otras categorías. Cambia el filtro para repasarlas. '):'No hay tarjetas para repasar. ')+'Las tarjetas ya repasadas vuelven con un intervalo de '+FLASHCARD_MIN_DAYS+' días (o al día siguiente si fallaste). Vuelve a practicar en el simulador o agrega preguntas desde el banco.</p></div>';
    }
    STATE.flash={q:shuffle(pool)[0],revealed:false,answered:false,selectedOption:null};
  }
  var v=STATE.flash,q=v.q;
  var modeBtn='<button class="btn ghost" id="flmode" style="margin-left:auto;font-size:12px">'+
    (FL_MODE==="reveal"?"Cambiar a opciones":"Cambiar a autoevaluación")+'</button>';
  var header='<div class="row" style="margin-bottom:8px;flex-wrap:wrap"><span class="pill gold">Pendientes: '+pending.length+'</span><span class="pill green">Aprendidas: '+learned.length+'</span>'+modeBtn+'</div>'+
    '<div class="row" style="margin-bottom:10px"><span class="small mut" style="font-size:11px;font-weight:700;letter-spacing:.06em">CATEGORÍA:</span>'+FL_CATS.map(function(c){return '<button class="tab'+(cat===c[0]?' on':'')+'" data-flcat="'+c[0]+'" style="font-size:12px;padding:6px 12px">'+c[1]+'</button>';}).join("")+'</div>';
  var cardInfo=getFlashcardInfo(q.id);
  var progressText=cardInfo?(' <span class="small mut">('+cardInfo.correctCount+'/'+FLASHCARD_LEARN_COUNT+' correctas)</span>'):'';
  var body='';
  if(FL_MODE==="reveal"){
    body=qpills(q)+'<div class="qtext">'+esc(q.pregunta)+progressText+'</div>'+tr(q.pregunta_en,q.pregunta_fa)+
      '<div id="flashcard">'+(v.revealed?('<div class="card" style="background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.3)"><b>Respuesta:</b> '+esc(q.opciones[q.correct])+trOption(q.opciones_en,q.opciones_fa,q.correct)+(q.explicacion?'<p class="small mut">'+esc(q.explicacion)+'</p>':'')+tr(q.explicacion_en,q.explicacion_fa)+'</div>'):'')+'</div>'+
      '<div class="row">'+(v.answered?'<p class="small mut">¡Respuesta registrada! Cargando siguiente...</p>':(v.revealed?
        '<button class="btn" id="flcorrect">✅ Correcta</button><button class="btn ghost" id="flwrong">❌ Incorrecta</button>'
        :'<button class="btn ghost" id="flshow">Mostrar respuesta</button>'))+
      '</div>';
  } else {
    body=qpills(q)+'<div class="qtext">'+esc(q.pregunta)+progressText+'</div>'+tr(q.pregunta_en,q.pregunta_fa)+
      (v.answered?'<div style="text-align:center;margin-bottom:8px;font-weight:700" class="'+(v.selectedOption===q.correct?'marker':'badmark')+'">'+(v.selectedOption===q.correct?'¡Correcta! ✅':'Incorrecta ❌')+'</div>':'')+
      '<div id="flashcard">'+q.opciones.map(function(o,i){
        var cls="opt";
        if(v.selectedOption!=null){
          if(i===q.correct) cls="opt ok";
          else if(i===v.selectedOption) cls="opt bad";
          else cls="opt locked";
        }
        return '<button class="'+cls+'" data-fli="'+i+'"'+(v.selectedOption!=null?' disabled':'')+'>'+
          '<b style="color:#fcd34d">'+String.fromCharCode(65+i)+'.</b> '+esc(o)+
          (v.selectedOption!=null&&i===q.correct?' <span class="marker">✓</span>':'')+
          (v.selectedOption!=null&&i===v.selectedOption&&i!==q.correct?' <span class="badmark">✗</span>':'')+
          trOption(q.opciones_en,q.opciones_fa,i)+'</button>';
      }).join("")+'</div>'+
      (v.selectedOption==null?'<p class="small mut">Selecciona la opción correcta</p>':'');
  }
  return '<div class="card">'+header+body+
    '<p class="small mut" style="margin-top:8px">Modo '+(FL_MODE==="reveal"?"autoevaluación":"opciones múltiples")+' · Repetición espaciada: una tarjeta acertada vuelve en <b>'+FLASHCARD_MIN_DAYS+' días</b> y una fallada, <b>al día siguiente</b>. Responde correctamente '+FLASHCARD_LEARN_COUNT+' veces seguidas para aprenderla; si fallas, el contador vuelve a 0.</p></div>';
}
function getFlashcardInfo(qid){
  var fc=DB.flashcards||{};
  return fc[qid]||null;
}
function markFlashCorrect(isCorrect){
  var v=STATE.flash,q=v.q;
  var fc=DB.flashcards=DB.flashcards||{};
  var card=fc[q.id]||{correctCount:0,learned:false,lastReviewedAt:null};
  if(isCorrect){ card.correctCount=(card.correctCount||0)+1; card.wrong=false; }
  else { card.correctCount=0; card.wrong=true; } // fallada: contador a 0, se reprograma para el día siguiente
  card.lastReviewedAt=new Date().toISOString();
  if(card.correctCount>=FLASHCARD_LEARN_COUNT) card.learned=true;
  fc[q.id]=card;
  // Update daily stats
  var d=DB.daily[today()]||{flashcards:0,simulador:false,lectura:false};
  d.flashcards=(d.flashcards||0)+1; DB.daily[today()]=d;
  // Update masteredCount
  var u=user(); u.masteredCount=learnedIds().length; setUser(u);
  saveDB();
  v.answered=true; render();
  setTimeout(function(){ STATE.flash=null; render(); },1500);
}
// Agregar manualmente una pregunta del banco a las flashcards del usuario.
function addFromBank(qid){
  qid=+qid;
  if(!isHistoryId(qid)) return;
  var fc=DB.flashcards=DB.flashcards||{};
  var added=DB.bankAdded=DB.bankAdded||{};
  added[qid]=true; // elegida a mano desde el banco: siempre puede repasarla
  if(!fc[qid]) fc[qid]={correctCount:0,learned:false,lastReviewedAt:null};
  var u=user(); u.masteredCount=learnedIds().length; setUser(u);
  saveDB();
  render();
}

/* ---------- bind per view ---------- */
function bindView(){
  var tab=STATE.tab;
  if(tab==="sim"){
    var v=STATE.view;
    if(v.phase==="review"){ document.getElementById("again").onclick=function(){ STATE.view=null; render(); }; return; }
    document.querySelectorAll("#opts .opt").forEach(function(b){ b.onclick=function(){ v.ans[v.qs[v.idx].id]=+b.getAttribute("data-i"); render(); }; });
    var prev=document.getElementById("prev"); if(prev)prev.onclick=function(){v.idx--;render();};
    var next=document.getElementById("next"); if(next)next.onclick=function(){v.idx++;render();};
    var fin=document.getElementById("fin"); if(fin)fin.onclick=function(){submitSim(false);};
  }
  if(tab==="lec"){
    var lv=STATE.view;
    if(lv.phase==="review"){ document.getElementById("againlec").onclick=function(){ STATE.view=null; render(); }; return; }
    document.querySelectorAll(".opt[data-id]").forEach(function(b){ b.onclick=function(){ lv.ans[+b.getAttribute("data-id")]=+b.getAttribute("data-i"); render(); }; });
    document.getElementById("finlec").onclick=submitLec;
  }
  if(tab==="ent"){
    document.querySelectorAll(".opt[data-ent]").forEach(function(b){ b.onclick=function(){ STATE.sel.ent=+b.getAttribute("data-ent"); render(); }; });
    var pv=document.getElementById("prevwr"), nx=document.getElementById("nextwr");
    if(pv)pv.onclick=function(){ STATE.sel.wr=((STATE.sel.wr||0)-1+IW.writing.length)%IW.writing.length; render(); };
    if(nx)nx.onclick=function(){ STATE.sel.wr=((STATE.sel.wr||0)+1)%IW.writing.length; render(); };
  }
  if(tab==="fl"){
    var fv=STATE.flash;
    document.querySelectorAll("[data-flcat]").forEach(function(b){ b.onclick=function(){ STATE.sel.flcat=b.getAttribute("data-flcat"); STATE.flash=null; render(); }; });
    var modeBtn=document.getElementById("flmode"); if(modeBtn)modeBtn.onclick=function(){ FL_MODE=FL_MODE==="reveal"?"choice":"reveal"; if(fv){fv.revealed=false;fv.answered=false;fv.selectedOption=null;} render(); };
    var sh=document.getElementById("flshow"); if(sh)sh.onclick=function(){fv.revealed=true;render();};
    var fc=document.getElementById("flcorrect"); if(fc)fc.onclick=function(){markFlashCorrect(true);};
    var fw=document.getElementById("flwrong"); if(fw)fw.onclick=function(){markFlashCorrect(false);};
    document.querySelectorAll("[data-fli]").forEach(function(b){ b.onclick=function(){
      if(fv.selectedOption!=null) return;
      var idx=+b.getAttribute("data-fli");
      fv.selectedOption=idx;
      markFlashCorrect(idx===fv.q.correct);
    }; });
  }
  if(tab==="ban"){
    document.querySelectorAll(".tab[data-banmode]").forEach(function(b){ b.onclick=function(){ STATE.sel.banmode=b.getAttribute("data-banmode"); render(); }; });
    document.querySelectorAll("[data-banfc]").forEach(function(b){ b.onclick=function(){ STATE.sel.banfc=b.getAttribute("data-banfc"); render(); }; });
    var bq=document.getElementById("banq"); if(bq){ bq.oninput=function(){ STATE.sel.banq=bq.value; }; }
    document.querySelectorAll("[data-addfl]").forEach(function(b){ b.onclick=function(){ addFromBank(+b.getAttribute("data-addfl")); }; });
  }

}
