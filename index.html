:root{--bg:#022c22;--bg2:#064e3b;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--ink:#ecfdf5;--mut:#a7f3d0;--gold:#fcd34d;--rose:#fb7185;--green:#6ee7b7;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;font-weight:700;padding:10px 18px;border-radius:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.ghost[aria-pressed="true"]{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.55);color:#fde68a}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d1fae5;border:1px solid var(--line)}
.pill.gold{background:rgba(252,211,77,.15);color:#fde68a;border-color:rgba(252,211,77,.3)}
.pill.green{background:rgba(110,231,183,.15);color:#a7f3d0;border-color:rgba(110,231,183,.3)}
.pill.rose{background:rgba(251,113,133,.15);color:#fecdd3;border-color:rgba(251,113,133,.3)}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px}
.mut{color:var(--mut)}
.small{font-size:12px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;transition:background .15s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.sel{border-color:var(--gold);background:rgba(252,211,77,.18)}
.opt.ok{border-color:var(--green);background:rgba(110,231,183,.15)}
.opt.bad{border-color:var(--rose);background:rgba(251,113,133,.15)}
.opt.locked{opacity:.4}
.translation{color:#bfdbfe;font-style:italic;font-size:14px;margin-top:6px;padding:8px 10px;background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;border-radius:6px;white-space:pre-wrap}
.translation.fa{direction:rtl;text-align:right;font-style:normal;font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.8;border-left:0;border-right:3px solid #3b82f6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tab.on{background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:24px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#fcd34d,#fb7185);border-radius:999px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loginbox{max-width:420px;margin:8vh auto}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;margin:6px 0 12px}
textarea.field{min-height:120px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.passage{max-height:46vh;overflow:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.55}
#flashcard{margin:20px 0}
.qtext{font-size:19px;font-weight:700;line-height:1.4;margin:12px 0}
.footer{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}
.marker{color:#34d399;font-weight:700}
.badmark{color:#fda4af;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.badge.ok{background:rgba(110,231,183,.18);color:#6ee7b7}
.badge.no{background:rgba(251,113,133,.18);color:#fb7185}
</style>

rrect": 3, "explicacion": "México es una economía emergente relevante.", "categoria": "Historia", "subtema": "Economía", "dificultad": "media", "pregunta_en": "What place does Mexico hold in the world economy?", "opciones_en": ["Among the top 100", "Among the top 50", "Among the top 5", "16th place among the world's largest economies."], "explicacion_en": "Mexico is a relevant emerging economy.", "pregunta_fa": null, "opciones_fa": null, "explicacion_fa": null}], "passages": [{"id": 1, "title": "El Grito de Dolores y el mes patrio", "topic": "Historia y cultura civica", "text": "En México, la noche del 15 de septiembre tiene un significado especial. En plazas de todo el país, miles de personas se reúnen para escuchar la ceremonia conocida como el Grito. Esta conmemoración recuerda el llamado a levantarse contra el dominio español realizado en 1810 por Miguel Hidalgo y Costilla, en Dolores. Aunque no existe un registro textual único de las palabras exactas de ese primer llamado, históricamente se reconoce como el inicio de la lucha de Independencia. Con el paso del tiempo, la ceremonia evolucionó y se convirtió en un acto cívico nacional. Hoy, autoridades de distintos niveles repiten la ceremonia en sus localidades, mientras la gente porta banderas, escucha música regional y participa en festejos comunitarios. En ese contexto, el simbolismo patrio tiene un papel central: los colores verde, blanco y rojo aparecen en edificios, ropa y decoraciones. Comprender esta celebración ayuda a entender por qué septiembre es considerado mes patrio y por qué el Grito no es solo una fiesta, sino también una memoria compartida de identidad histórica.", "text_en": "In Mexico, the night of September 15 has special meaning. In plazas across the country, thousands of people gather to hear the ceremony known as the Grito. This commemoration recalls the call to rise up against Spanish rule made in 1810 by Miguel Hidalgo y Costilla in Dolores. Although there is no single written record of the exact words of that first call, it is historically recognized as the start of the struggle for Independence. Over time the ceremony evolved and became a national civic act. Today, authorities at different levels repeat the ceremony in their localities while people carry flags, listen to regional music, and take part in community festivities. In this context, patriotic symbolism plays a central role: the green, white, and red colors appear on buildings, clothing, and decorations. Understanding this celebration helps explain why September is considered the patriotic month and why the Grito is not only a party, but also a shared memory of historical identity.", "text_fa": null, "questions": [{"id": 10100, "question": "¿Qué se conmemora en la ceremonia del Grito?", "options": ["El inicio de la lucha de Independencia", "La consumación de la Independencia", "La promulgación de la Constitución de 1917", "La Revolución Mexicana"], "correct": 0, "question_en": "What is commemorated in the Grito ceremony?", "options_en": ["The start of the Independence struggle", "The consummation of Independence", "The enactment of the 1917 Constitution", "The Mexican Revolution"], "question_fa": null, "options_fa": null}, {"id": 10101, "question": "¿En qué año se ubica históricamente el llamado de Hidalgo?", "options": ["1810", "1910", "1857", "1821"], "correct": 0, "question_en": "In what year is Hidalgo's call historically placed?", "options_en": ["1810", "1910", "1857", "1821"], "question_fa": null, "options_fa": null}, {"id": 10102, "question": "¿Qué elemento se menciona como parte del simbolismo patrio?", "options": ["Los colores verde, blanco y rojo", "Únicamente música clásica", "Solo fuegos artificiales", "Escudos regionales extranjeros"], "correct": 0, "question_en": "Which element is mentioned as part of the patriotic symbolism?", "options_en": ["The green, white and red colors", "Only classical music", "Only fireworks", "Foreign regional coats of arms"], "question_fa": null, "options_fa": null}, {"id": 10103, "question": "Según el texto, el Grito actual se entiende principalmente como:", "options": ["Una celebración privada", "Un evento deportivo", "Una ceremonia cívica con memoria histórica", "Un acto comercial"], "correct": 2, "question_en": "According to the text, today's Grito is mainly understood as:", "options_en": ["A private celebration", "A sporting event", "A civic ceremony with historical memory", "A commercial event"], "question_fa": null, "options_fa": null}, {"id": 10104, "question": "¿Qué afirma el texto sobre las palabras exactas del primer Grito?", "options": ["No existe un registro textual único", "Fueron dictadas por el Congreso", "Se conservan en audio original", "Se escribieron un siglo después por decreto"], "correct": 0, "question_en": "What does the text state about the exact words of the first Grito?", "options_en": ["There is no single written record", "They were dictated by Congress", "They survive in original audio", "They were written a century later by decree"], "question_fa": null, "options_fa": null}, {"id": 10105, "question": "¿Por qué septiembre se considera mes patrio en el texto?", "options": ["Por la conmemoración del inicio de la Independencia", "Por ser fin de cosecha", "Por el inicio de clases", "Por una tradición exclusivamente religiosa"], "correct": 0, "question_en": "Why is September considered the patriotic month in the text?", "options_en": ["Because it commemorates the start of Independence", "Because it marks the end of harvest", "Because school starts", "Because of an exclusively religious tradition"], "question_fa": null, "options_fa": null}]}, {"id": 2, "title": "Refranes mexicanos y lenguaje cotidiano", "topic": "Lengua y cultura popular", "text": "Los refranes forman parte de la vida cotidiana en México. Son frases breves que transmiten experiencia, consejo o una forma de ver la realidad. Muchas veces se usan para orientar una decisión sin dar una explicación larga. Por ejemplo, cuando alguien dice «Más vale tarde que nunca», sugiere que es preferible completar una acción, aunque sea después del momento ideal. Otro refrán muy conocido es «Al mal tiempo, buena cara», que invita a mantener una actitud positiva frente a las dificultades. También se escucha «A darle que es mole de olla», expresión que anima a comenzar una tarea con energía. El valor de estos dichos no está solo en su significado literal, sino en su función social: permiten resumir ideas complejas en pocas palabras y facilitan la comunicación entre generaciones. En muchos hogares, abuelos y padres comparten refranes con niñas, niños y jóvenes como parte de una educación informal. Así, el lenguaje popular se convierte en una vía para conservar memoria cultural y fortalecer la identidad comunitaria.", "text_en": "Proverbs (refranes) are part of everyday life in Mexico. They are short phrases that convey experience, advice, or a way of seeing reality. They are often used to guide a decision without a long explanation. For example, when someone says \"Better late than never\" (Más vale tarde que nunca), they suggest it is preferable to complete an action even after the ideal moment. Another well-known saying is \"Al mal tiempo, buena cara\" (put on a good face in bad weather), which invites keeping a positive attitude toward difficulties. People also hear \"A darle que es mole de olla\" (let's get to it — it's mole de olla), an expression that encourages starting a task with energy. The value of these sayings lies not only in their literal meaning but in their social function: they summarize complex ideas in few words and ease communication between generations. In many homes, grandparents and parents share proverbs with children and young people as informal education. In this way, popular language becomes a way to preserve cultural memory and strengthen community identity.", "text_fa": null, "questions": [{"id": 10200, "question": "¿Para qué se usan principalmente los refranes en el texto?", "options": ["Para traducir idiomas extranjeros", "Para resumir consejos y experiencias", "Para reemplazar leyes", "Para escribir documentos técnicos"], "correct": 1, "question_en": "According to the text, what are proverbs mainly used for?", "options_en": ["To translate foreign languages", "To summarize advice and experience", "To replace laws", "To write technical documents"], "question_fa": null, "options_fa": null}, {"id": 10201, "question": "¿Qué idea transmite «Más vale tarde que nunca»?", "options": ["Es preferible hacer algo tarde que no hacerlo", "Es mejor no actuar", "Nunca hay que intentar", "Solo importa la rapidez"], "correct": 0, "question_en": "What idea does \"Más vale tarde que nunca\" convey?", "options_en": ["It is better to do something late than not at all", "It is better not to act", "Never try", "Only speed matters"], "question_fa": null, "options_fa": null}, {"id": 10202, "question": "¿Qué sugiere «Al mal tiempo, buena cara»?", "options": ["Ignorar los problemas", "Evitar conversar", "Mantener actitud positiva ante dificultades", "Cambiar de ciudad"], "correct": 2, "question_en": "What does \"Al mal tiempo, buena cara\" suggest?", "options_en": ["Ignore problems", "Avoid conversation", "Keep a positive attitude toward difficulties", "Move to another city"], "question_fa": null, "options_fa": null}, {"id": 10203, "question": "¿Cómo interpreta el texto «A darle que es mole de olla»?", "options": ["Evitar el trabajo en equipo", "Detener una actividad", "Preparar comida diariamente", "Comenzar una tarea con energía"], "correct": 3, "question_en": "How does the text interpret \"A darle que es mole de olla\"?", "options_en": ["Avoid teamwork", "Stop an activity", "Prepare food daily", "Start a task with energy"], "question_fa": null, "options_fa": null}, {"id": 10204, "question": "¿Qué papel tienen las familias en la transmisión de refranes?", "options": ["Solo los escriben en libros", "Los comparten como educación informal", "Los sustituyen por lenguaje técnico", "No participan"], "correct": 1, "question_en": "What role do families play in passing on proverbs?", "options_en": ["They only write them in books", "They share them as informal education", "They replace them with technical language", "They do not participate"], "question_fa": null, "options_fa": null}, {"id": 10205, "question": "Según el texto, los refranes ayudan a:", "options": ["Eliminar diferencias regionales", "Debilitar la identidad comunitaria", "Reducir vocabulario", "Conservar memoria cultural"], "correct": 3, "question_en": "According to the text, proverbs help to:", "options_en": ["Erase regional differences", "Weaken community identity", "Reduce vocabulary", "Preserve cultural memory"], "question_fa": null, "options_fa": null}]}, {"id": 3, "title": "Parque Nacional Cañón del Sumidero", "topic": "Geografía y patrimonio natural", "text": "El Cañón del Sumidero es uno de los paisajes naturales más impresionantes de México. Su origen se debe a un largo proceso de fallas geológicas. Tiene un alto valor ecológico y cuenta con 21,789 hectáreas distribuidas en cinco municipios del estado de Chiapas, a pocos kilómetros de su capital, Tuxtla Gutiérrez.\n\nEl cañón consiste en un imponente acantilado que se eleva sobre el cauce del río Grijalva. Sus muros alcanzan más de mil metros de altura y, por su belleza, el lugar ha sido nominado para formar parte de las Siete Nuevas Maravillas Naturales del mundo.\n\nLa luz y el calor sobre las paredes del acantilado, junto con sus abundantes escurrimientos de agua, han permitido que surjan varios microclimas con vegetación y fauna propias en las distintas alturas del cañón. Entre las especies endémicas, es decir, exclusivas de esta zona, se encuentran la salamandra Lengua Hongueada, la cuija mexicana, el chupaflor canelo, el sapo jaspeado, la mojarra de Chiapa de Corzo y el encino enano.\n\nDentro del parque se ubica la presa hidroeléctrica de Chicoasén, una de las mayores obras de ingeniería hidráulica de México, cuyo embalse de 32 kilómetros abarca la totalidad del cañón. Por su riqueza ecológica, el lugar fue decretado Parque Nacional el 8 de diciembre de 1980 y, en 2004, fue clasificado como sitio Ramsar, es decir, un humedal de importancia internacional.", "text_en": "The Sumidero Canyon is one of Mexico's most impressive natural landscapes. Its origin is due to a long process of geological faults. It has high ecological value and covers 21,789 hectares across five municipalities in the state of Chiapas, a few kilometers from its capital, Tuxtla Gutiérrez. The canyon consists of an imposing cliff that rises over the course of the Grijalva River. Its walls reach more than one thousand meters high and, for its beauty, the place has been nominated to be part of the Seven New Natural Wonders of the world. Light and heat on the cliff walls, together with abundant water runoff, have allowed several microclimates with their own vegetation and fauna to emerge at the different heights of the canyon. Among the endemic species — that is, exclusive to this area — are the Lengua Hongueada salamander, the Mexican cuija, the canelo hummingbird, the speckled toad, the Chiapa de Corzo mojarra, and the dwarf oak. Inside the park is the Chicoasén hydroelectric dam, one of Mexico's greatest hydraulic engineering works, whose 32-kilometer reservoir covers the entire canyon. For its ecological richness, the place was declared a National Park on December 8, 1980, and in 2004 it was classified as a Ramsar site, a wetland of international importance.", "text_fa": null, "questions": [{"id": 10300, "question": "¿En qué estado de México se ubica el Cañón del Sumidero?", "options": ["Oaxaca", "Chiapas", "Veracruz", "Tabasco"], "correct": 1, "question_en": "In which Mexican state is the Sumidero Canyon located?", "options_en": ["Oaxaca", "Chiapas", "Veracruz", "Tabasco"], "question_fa": null, "options_fa": null}, {"id": 10301, "question": "¿Cuántas hectáreas abarca el Parque Nacional Cañón del Sumidero?", "options": ["10,000", "21,789", "45,000", "32,000"], "correct": 1, "question_en": "How many hectares does the Sumidero Canyon National Park cover?", "options_en": ["10,000", "21,789", "45,000", "32,000"], "question_fa": null, "options_fa": null}, {"id": 10302, "question": "¿Sobre qué río se eleva el acantilado del cañón?", "options": ["Río Lerma", "Río Balsas", "Río Grijalva", "Río Usumacinta"], "correct": 2, "question_en": "Over which river does the canyon cliff rise?", "options_en": ["Lerma River", "Balsas River", "Grijalva River", "Usumacinta River"], "question_fa": null, "options_fa": null}, {"id": 10303, "question": "¿Qué es la presa de Chicoasén?", "options": ["Una reserva de peces", "Una presa hidroeléctrica", "Un parque de diversiones", "Un embalse de agua potable"], "correct": 1, "question_en": "What is the Chicoasén dam?", "options_en": ["A fish reserve", "A hydroelectric dam", "An amusement park", "A drinking water reservoir"], "question_fa": null, "options_fa": null}, {"id": 10304, "question": "¿En qué fecha fue decretado Parque Nacional el Cañón del Sumidero?", "options": ["5 de mayo de 1980", "20 de noviembre de 2004", "8 de diciembre de 1980", "16 de septiembre de 1980"], "correct": 2, "question_en": "On what date was the Sumidero Canyon declared a National Park?", "options_en": ["May 5, 1980", "November 20, 2004", "December 8, 1980", "September 16, 1980"], "question_fa": null, "options_fa": null}, {"id": 10305, "question": "En 2004, ¿cómo fue clasificado el lugar?", "options": ["Área urbana protegida", "Patrimonio Cultural de la Humanidad", "Sitio Ramsar (humedal de importancia internacional)", "Maravilla natural del mundo"], "correct": 2, "question_en": "In 2004, how was the place classified?", "options_en": ["Protected urban area", "World Cultural Heritage", "Ramsar site (wetland of international importance)", "Natural wonder of the world"], "question_fa": null, "options_fa": null}]}, {"id": 4, "title": "La celebración del Día de Muertos", "topic": "Tradición cultural", "text": "El Día de Muertos se celebra el 1 y 2 de noviembre. En esta festividad se agasaja a los difuntos con ofrendas que incluyen sus alimentos preferidos, agua, flores de cempasúchil, velas, papel picado, pan de muerto y calaveritas de azúcar y chocolate. El objetivo es convidar a los seres queridos que ya no están.\n\nEl Día de Muertos es una muestra de la gran riqueza cultural de México. Esta festividad de origen indígena fue declarada en 2008 por la UNESCO como Patrimonio Cultural Inmaterial de la Humanidad. De raíces prehispánicas, combinadas con la celebración católica del Día de Todos los Santos, busca rendir culto a los antepasados, pues se cree que el 1 y 2 de noviembre las almas de los fallecidos regresan para convivir con los vivos.\n\nEntre los lugares más emblemáticos de esta celebración están Pátzcuaro, en Michoacán, y San Andrés Mixquic, en la Ciudad de México, así como la Huasteca Potosina, Huaquechula, en Puebla, y Ocotepec, en Morelos. En estos sitios se ha mantenido la tradición ancestral de convivencia entre vivos y muertos en casas, calles y cementerios.\n\nMixquic, al sur de la Ciudad de México, en la Delegación Tláhuac, tiene una de las celebraciones más impactantes: todo el pueblo participa en la fiesta para recibir a las almas de los difuntos. El 1 de noviembre llegan las ánimas de los niños y el día 2 las de los adultos, en medio de ofrendas, oraciones y el repique de las campanas. La alumbrada, o noche de las velas, es el evento más significativo: el 2 de noviembre, a partir de las seis de la tarde, los habitantes de Mixquic van al panteón con velas, incienso y flores, iluminan todas las tumbas y permanecen junto a ellas para que la luz de las velas guíe a las ánimas en su camino de regreso.", "text_en": "The Day of the Dead is celebrated on November 1 and 2. During this festivity, the deceased are honored with offerings that include their favorite foods, water, marigold flowers, candles, papel picado, pan de muerto, and sugar or chocolate skulls. The goal is to share with the loved ones who are no longer here. The Day of the Dead is a sign of Mexico's great cultural richness. This festivity of indigenous origin was declared in 2008 by UNESCO as Intangible Cultural Heritage of Humanity. Of pre-Hispanic roots, combined with the Catholic celebration of All Saints' Day, it seeks to honor ancestors, since it is believed that on November 1 and 2 the souls of the deceased return to live with the living. Among the most emblematic places for this celebration are Pátzcuaro in Michoacán and San Andrés Mixquic in Mexico City, as well as the Huasteca Potosina, Huaquechula in Puebla, and Ocotepec in Morelos. In these places the ancestral tradition of coexistence between the living and the dead has been kept in houses, streets, and cemeteries. Mixquic, south of Mexico City in the Tláhuac borough, has one of the most striking celebrations: the whole town takes part in the party to receive the souls of the dead. On November 1 the souls of the children arrive, and on day 2 those of the adults, amid offerings, prayers, and the ringing of bells. The alumbrada, or night of candles, is the most significant event: on November 2, starting at six in the evening, the people of Mixquic go to the cemetery with candles, incense, and flowers, light all the graves, and stay beside them so the candlelight guides the souls on their way back.", "text_fa": null, "questions": [{"id": 10400, "question": "¿En qué fechas se celebra el Día de Muertos?", "options": ["15 y 16 de septiembre", "24 y 25 de diciembre", "1 y 2 de noviembre", "1 y 2 de enero"], "correct": 2, "question_en": "On which dates is the Day of the Dead celebrated?", "options_en": ["September 15 and 16", "December 24 and 25", "November 1 and 2", "January 1 and 2"], "question_fa": null, "options_fa": null}, {"id": 10401, "question": "¿Qué elementos se incluyen en las ofrendas según el texto?", "options": ["Ropa y zapatos nuevos", "Alimentos preferidos, flores, velas y pan de muerto", "Únicamente fotografías", "Solo juguetes y dulces"], "correct": 1, "question_en": "Which elements are included in the offerings according to the text?", "options_en": ["New clothes and shoes", "Favorite foods, flowers, candles and pan de muerto", "Only photographs", "Only toys and candy"], "question_fa": null, "options_fa": null}, {"id": 10402, "question": "¿En qué año fue declarada Patrimonio Cultural Inmaterial de la Humanidad por la UNESCO?", "options": ["2008", "2004", "2012", "1998"], "correct": 0, "question_en": "In what year was it declared Intangible Cultural Heritage of Humanity by UNESCO?", "options_en": ["2008", "2004", "2012", "1998"], "question_fa": null, "options_fa": null}, {"id": 10403, "question": "Según la creencia descrita, ¿qué ocurre el 1 y 2 de noviembre?", "options": ["Se cierran los mercados", "Termina la temporada de lluvias", "Se siembran los campos", "Las almas de los fallecidos regresan a convivir con los vivos"], "correct": 3, "question_en": "According to the belief described, what happens on November 1 and 2?", "options_en": ["The markets close", "The rainy season ends", "The fields are sown", "The souls of the deceased return to live with the living"], "question_fa": null, "options_fa": null}, {"id": 10404, "question": "¿Qué ánimas llegan el 1 de noviembre en Mixquic?", "options": ["Las de los adultos", "Las de los animales", "Las de los ancianos", "Las de los niños"], "correct": 3, "question_en": "Whose souls arrive on November 1 in Mixquic?", "options_en": ["The adults", "The animals", "The elderly", "The children"], "question_fa": null, "options_fa": null}, {"id": 10405, "question": "¿Qué es la alumbrada según el texto?", "options": ["La noche en que se iluminan las tumbas con velas", "Una carrera con antorchas", "Un desfile de carros alegóricos", "Una feria gastronómica"], "correct": 0, "question_en": "What is the alumbrada according to the text?", "options_en": ["The night when the graves are lit with candles", "A torch race", "A parade of floats", "A food fair"], "question_fa": null, "options_fa": null}]}, {"id": 5, "title": "La leyenda del Cenote Zací", "topic": "Leyendas y memoria regional", "text": "Un cenote es un pozo de agua dulce que se forma por la erosión de las rocas calizas. En el interior de la ciudad de Valladolid, Yucatán, se encuentra el cenote Zací: una impresionante caverna parcialmente colapsada, de unos 45 metros de diámetro.\n\nDurante el imperio de los Cupules y los Cocomes se fundó, en 1543, la ciudad maya de Zací, cuyo nombre significa «gavilán blanco». Dentro de la ciudad estaba este cenote, y sobre su bóveda vivía la curandera y hechicera del pueblo, una anciana poderosa, patrona de la familia Cocom. En Zací existían dos familias que se disputaban el poder. El cacique Halach-Huinic, «el hombre verdadero», gobernaba en ese tiempo y tenía un hijo llamado Hul-Kin, «rayo de sol», de la familia de los Cupules.\n\nLa nieta de la hechicera se había quedado huérfana al nacer. La abuela la quería doblemente: era la hermosa Sac-Nicte, «flor blanca». Al principio Hul-Kin y Sac-Nicte parecían odiarse y peleaban constantemente; sin embargo, al llegar a la juventud surgió entre ellos un apasionado amor. Se veían a escondidas, pero el cacique se enteró y, enfurecido, envió a su hijo a un pueblo del sur para casarlo con una princesa, como parte de una alianza.\n\nSac-Nicte perdió la alegría y, entre llantos, le contó a su abuela su secreto: estaba embarazada y no quería vivir más. La abuela le prometió traer de vuelta a Hul-Kin. Un día, Sac-Nicte se enteró de que Hul-Kin se casaba; entonces amarró una piedra a su larga cabellera y se arrojó a las aguas del cenote. En ese momento, Hul-Kin sintió un fuerte dolor en el pecho y regresó esa misma noche. Al enterarse de lo ocurrido, se arrojó al cenote para morir con su verdadero amor. La hechicera, en un arranque de ira, maldijo el cenote: cada año, cuando el manto verde del agua se tornara oscuro, el cenote cobraría una vida en sacrificio por aquel amor prohibido.", "text_en": "A cenote is a freshwater pool formed by the erosion of limestone rock. Inside the city of Valladolid, Yucatán, lies the Zací cenote: an impressive, partially collapsed cavern about 45 meters in diameter. During the rule of the Cupules and the Cocomes, the Maya city of Zací — whose name means \"white hawk\" — was founded in 1543. This cenote was inside the city, and over its vault lived the town's healer and sorceress, a powerful old woman, matron of the Cocom family. In Zací there were two families that permanently disputed power. The chief Halach-Huinic, \"the true man,\" governed at that time and had a son named Hul-Kin, \"sunbeam,\" of the Cupul family. The sorceress's granddaughter had been orphaned at birth. The grandmother loved her doubly: she was the beautiful Sac-Nicte, \"white flower.\" At first Hul-Kin and Sac-Nicte seemed to hate each other and fought constantly; however, in their youth a passionate love grew between them. They met in secret, but the chief found out and, enraged, sent his son to a southern town to marry a princess as part of an alliance. Sac-Nicte lost her joy and, in tears, told her grandmother her secret: she was pregnant and did not want to live anymore. The grandmother promised to bring Hul-Kin back. One day Sac-Nicte learned that Hul-Kin was getting married; she tied a stone to her long hair and threw herself into the cenote's waters. At that moment Hul-Kin felt a strong pain in his chest and returned that same night. Upon learning what had happened, he threw himself into the cenote to die with his true love. The sorceress, in a fit of rage, cursed the cenote: every year, when the green veil of the water turned dark, the cenote would take a life as a sacrifice for that forbidden love.", "text_fa": null, "questions": [{"id": 10500, "question": "¿Qué es un cenote según el texto?", "options": ["Una laguna artificial", "Un río subterráneo salado", "Un pozo de agua dulce formado por la erosión de rocas calizas", "Un volcán apagado"], "correct": 2, "question_en": "What is a cenote according to the text?", "options_en": ["An artificial lagoon", "An underground saltwater river", "A freshwater pool formed by the erosion of limestone rock", "An extinct volcano"], "question_fa": null, "options_fa": null}, {"id": 10501, "question": "¿En qué ciudad se ubica el cenote Zací?", "options": ["Valladolid", "Campeche", "Cancún", "Mérida"], "correct": 0, "question_en": "In which city is the Zací cenote located?", "options_en": ["Valladolid", "Campeche", "Cancún", "Mérida"], "question_fa": null, "options_fa": null}, {"id": 10502, "question": "¿Qué significa Sac-Nicte?", "options": ["Gavilán blanco", "Rayo de sol", "Flor blanca", "Agua oscura"], "correct": 2, "question_en": "What does Sac-Nicte mean?", "options_en": ["White hawk", "Sunbeam", "White flower", "Dark water"], "question_fa": null, "options_fa": null}, {"id": 10503, "question": "¿Qué hizo el cacique al enterarse del amor de Hul-Kin y Sac-Nicte?", "options": ["Bendijo la unión", "Envió a su hijo a un pueblo del sur para casarlo con una princesa", "Desterró a la hechicera", "Cerró el cenote"], "correct": 1, "question_en": "What did the chief do upon learning of the love between Hul-Kin and Sac-Nicte?", "options_en": ["Blessed the union", "Sent his son to a southern town to marry a princess", "Banished the sorceress", "Closed the cenote"], "question_fa": null, "options_fa": null}, {"id": 10504, "question": "¿Qué se ató Sac-Nicte a la cabellera antes de arrojarse al cenote?", "options": ["Una cuerda", "Un collar de oro", "Una flor blanca", "Una piedra"], "correct": 3, "question_en": "What did Sac-Nicte tie to her hair before throwing herself into the cenote?", "options_en": ["A rope", "A gold necklace", "A white flower", "A stone"], "question_fa": null, "options_fa": null}, {"id": 10505, "question": "¿Qué maldición lanzó la hechicera sobre el cenote?", "options": ["Que la ciudad desaparecería", "Que nadie volvería a enamorarse en Zací", "Que cada año, al oscurecerse el agua, cobraría una vida", "Que sus aguas se secarían para siempre"], "correct": 2, "question_en": "What curse did the sorceress place on the cenote?", "options_en": ["That the city would disappear", "That no one would fall in love in Zací again", "That every year, when the water darkened, it would take a life", "That its waters would dry up forever"], "question_fa": null, "options_fa": null}]}, {"id": 6, "title": "Los volcanes: Popocatépetl e Iztaccíhuatl", "topic": "Leyenda prehispánica y paisaje", "text": "Hace miles de lunas vivió un joven destacado en las artes de la guerra, famoso por sus hazañas. Un día, en su camino, se encontró con una hermosa joven y quedó inmediatamente enamorado. Decidió pedir su mano, pero el padre de ella, un hombre poco destacado en la guerra, puso una condición: entregaría a su hija a cambio de que el guerrero luchara en favor de su pueblo. El joven aceptó, pues lo prometido era regresar victorioso y obtener el amor de aquella joven.\n\nLa guerra se prolongó y la joven comenzó a angustiarse y a sufrir por amor. Llegó a sus oídos la versión de que el guerrero había muerto en batalla; enfermó de dolor del alma y, una mañana, su padre la encontró sumida en el sueño eterno. Al día siguiente, el sol iluminaba el valle y se escucharon sonidos de victoria: el ejército regresaba y, al frente, avanzaba el joven con la alegría de reunirse con su amada.\n\nSu corazón se rompió al conocer la noticia. Gritó al cielo pidiendo explicaciones a los dioses, tomó el cuerpo de su amada, subió al valle, la recostó en la cima y decidió velar su sueño eterno con una antorcha encendida. Los dioses, al ver aquel acto de amor, eternizaron a la pareja: cubrieron sus cuerpos con nieve y los petrificaron para siempre. Con el paso de los siglos aún podemos ver a los dos enamorados en dos grandes montañas: el Popocatépetl y el Iztaccíhuatl.\n\nEl nombre Popocatépetl viene del náhuatl y significa «montaña que humea», porque desde tiempos prehispánicos permanece activo. Iztaccíhuatl significa «mujer blanca», pues se asemeja a una mujer dormida cubierta por un manto blanco. Ambos volcanes se ubican en los límites de la Ciudad de México y Puebla, y están unidos por el norte mediante el Paso de Cortés.", "text_en": "Thousands of moons ago there lived a young man outstanding in the arts of war, famous for his deeds. One day, on his path, he met a beautiful young woman and fell in love at once. He decided to ask for her hand, but her father, a man of little renown in war, set a condition: he would give his daughter in exchange for the warrior fighting on behalf of his people. The young man accepted, for what was promised was to return victorious and win that young woman's love. The war dragged on and the young woman began to grow anxious and to suffer for love. Word reached her that the warrior had died in battle; she fell ill with sorrow and, one morning, her father found her lost in eternal sleep. The next day the sun shone over the valley and sounds of victory were heard: the army was returning and, at the front, the young man advanced with the joy of reuniting with his beloved. His heart broke when he learned the news. He cried out to the sky asking the gods for answers, took his beloved's body, climbed to the valley, laid her on the summit, and decided to watch over her eternal sleep with a lit torch. The gods, seeing that act of love, made the couple eternal: they covered their bodies with snow and turned them to stone forever. Over the centuries we can still see the two lovers in two great mountains: Popocatépetl and Iztaccíhuatl. The name Popocatépetl comes from Nahuatl and means \"smoking mountain,\" because it has remained active since pre-Hispanic times. Iztaccíhuatl means \"white woman,\" since it resembles a sleeping woman covered by a white mantle. Both volcanoes stand on the border of Mexico City and Puebla, and are joined on the north by the Paso de Cortés.", "text_fa": null, "questions": [{"id": 10600, "question": "¿Qué condición puso el padre de la joven para entregar a su hija?", "options": ["Que le pagara con oro", "Que construyera un templo", "Que el guerrero luchara en favor de su pueblo", "Que abandonara la guerra"], "correct": 2, "question_en": "What condition did the young woman's father set to give away his daughter?", "options_en": ["That he pay in gold", "That he build a temple", "That the warrior fight on behalf of his people", "That he abandon the war"], "question_fa": null, "options_fa": null}, {"id": 10601, "question": "¿Qué noticia enfermó de tristeza a la joven?", "options": ["Que debía abandonar su hogar", "Que el guerrero había muerto en batalla", "Que su padre la casaría con otro", "Que la guerra nunca terminaría"], "correct": 1, "question_en": "What news made the young woman sick with sadness?", "options_en": ["That she had to leave her home", "That the warrior had died in battle", "That her father would marry her to another", "That the war would never end"], "question_fa": null, "options_fa": null}, {"id": 10602, "question": "¿Qué hizo el guerrero al encontrar muerta a su amada?", "options": ["Declaró la guerra a los dioses", "Se marchó a otra tierra", "La enterró junto al río", "La llevó a la cima y veló su sueño con una antorcha encendida"], "correct": 3, "question_en": "What did the warrior do upon finding his beloved dead?", "options_en": ["Declared war on the gods", "Left for another land", "Buried her beside the river", "Took her to the summit and watched over her sleep with a lit torch"], "question_fa": null, "options_fa": null}, {"id": 10603, "question": "¿Qué hicieron los dioses al ver el acto de amor?", "options": ["Les devolvieron la vida", "Los convirtieron en estrellas", "Los castigaron con el olvido", "Cubrieron sus cuerpos con nieve y los petrificaron"], "correct": 3, "question_en": "What did the gods do when they saw the act of love?", "options_en": ["Brought them back to life", "Turned them into stars", "Punished them with oblivion", "Covered their bodies with snow and turned them to stone"], "question_fa": null, "options_fa": null}, {"id": 10604, "question": "¿Qué significa Popocatépetl en náhuatl?", "options": ["Mujer blanca", "Montaña que humea", "Cerro dormido", "Valle de fuego"], "correct": 1, "question_en": "What does Popocatépetl mean in Nahuatl?", "options_en": ["White woman", "Smoking mountain", "Sleeping hill", "Valley of fire"], "question_fa": null, "options_fa": null}, {"id": 10605, "question": "¿Qué significa Iztaccíhuatl según el texto?", "options": ["Rayo de sol", "Montaña que humea", "Mujer blanca", "Flor blanca"], "correct": 2, "question_en": "What does Iztaccíhuatl mean according to the text?", "options_en": ["Sunbeam", "Smoking mountain", "White woman", "White flower"], "question_fa": null, "options_fa": null}]}, {"id": 7, "title": "El Mayab, la tierra del faisán y del venado", "topic": "Tradición maya", "text": "Hace mucho tiempo, el dios Itzamná decidió crear una tierra tan hermosa que todo aquel que la conociera quisiera vivir allí. Entonces creó El Mayab, la tierra de los elegidos: sembró las más bellas flores para adornar los caminos, creó enormes cenotes de aguas cristalinas y profundas cavernas llenas de misterio.\n\nDespués, Itzamná entregó la nueva tierra a los mayas y escogió tres animales para que vivieran por siempre en El Mayab: el faisán, el venado y la serpiente de cascabel. Los mayas vivieron felices y construyeron palacios y ciudades de piedra. El faisán volaba hasta los árboles más altos y su grito era tan poderoso que todos los habitantes podían escucharlo; el venado corría ligero como el viento, y la serpiente movía sus cascabeles para producir música a su paso.\n\nUn día, los chilam, los adivinos mayas, vieron en el futuro algo que les causó gran tristeza y anunciaron: «Pronto nos invadirán hombres venidos de muy lejos; traerán armas y pelearán contra nosotros para quitarnos nuestra tierra». Al oírlo, el faisán huyó a la selva y se escondió entre las hierbas para que los invasores no lo encontraran. El venado lloró tanto que sus lágrimas formaron muchas aguadas y desde entonces le quedaron los ojos húmedos, como si estuviera siempre triste. La serpiente de cascabel, en cambio, decidió olvidar su música y luchar: creó un nuevo sonido al mover la cola, que ahora usa antes de atacar.\n\nComo anunciaron los chilam, los extranjeros conquistaron El Mayab. Sin embargo, un famoso adivino maya dijo que los tres animales cumplirían una misión importante y que llegaría el día en que los mayas recuperarían su tierra. Las señales serían tres: el faisán volaría sobre los árboles más altos y su sombra se vería en todo El Mayab; el venado atravesaría la tierra de un solo salto, y la serpiente produciría música de nuevo. Mientras ese día llega, el faisán alisa sus alas, el venado afila sus pezuñas y la serpiente frota sus cascabeles.", "text_en": "Long ago, the god Itzamná decided to create a land so beautiful that anyone who knew it would want to live there. So he created El Mayab, the land of the chosen: he planted the most beautiful flowers to adorn the paths, created enormous cenotes of crystalline waters, and deep caverns full of mystery. Then Itzamná gave the new land to the Maya and chose three animals to live forever in El Mayab: the pheasant, the deer, and the rattlesnake. The Maya lived happily and built palaces and stone cities. The pheasant flew to the highest trees and its cry was so powerful that all the inhabitants could hear it; the deer ran light as the wind, and the snake shook its rattles to make music as it passed. One day the chilam, the Maya seers, saw in the future something that filled them with sadness and announced: \"Soon men from far away will invade us; they will bring weapons and fight us to take our land.\" Upon hearing this, the pheasant fled into the jungle and hid among the grasses so the invaders would not find it. The deer wept so much that its tears formed many waterholes, and since then its eyes have stayed moist, as if always sad. The rattlesnake, in contrast, decided to forget its music and fight: it created a new sound by shaking its tail, which it now uses before attacking. As the chilam had announced, the foreigners conquered El Mayab. However, a famous Maya seer said the three animals would fulfill an important mission and that the day would come when the Maya recover their land. The signs would be three: the pheasant would fly over the highest trees and its shadow would be seen across all El Mayab; the deer would cross the land in a single leap, and the snake would make music again. Until that day comes, the pheasant preens its wings, the deer sharpens its hooves, and the snake rubs its rattles.", "text_fa": null, "questions": [{"id": 10700, "question": "¿Quién creó El Mayab según la leyenda?", "options": ["Hul-Kin", "Quetzalcóatl", "Itzamná", "Halach-Huinic"], "correct": 2, "question_en": "Who created El Mayab according to the legend?", "options_en": ["Hul-Kin", "Quetzalcóatl", "Itzamná", "Halach-Huinic"], "question_fa": null, "options_fa": null}, {"id": 10701, "question": "¿Qué tres animales escogió Itzamná para vivir en El Mayab?", "options": ["El quetzal, el mono y el tucán", "El colibrí, el coyote y el armadillo", "El faisán, el venado y la serpiente de cascabel", "El águila, el jaguar y la serpiente"], "correct": 2, "question_en": "Which three animals did Itzamná choose to live in El Mayab?", "options_en": ["The quetzal, the monkey and the toucan", "The hummingbird, the coyote and the armadillo", "The pheasant, the deer and the rattlesnake", "The eagle, the jaguar and the snake"], "question_fa": null, "options_fa": null}, {"id": 10702, "question": "¿Quiénes anunciaron la llegada de los invasores?", "options": ["Los sacerdotes católicos", "Los guerreros aztecas", "Los chilam (adivinos mayas)", "Los mercaderes"], "correct": 2, "question_en": "Who announced the arrival of the invaders?", "options_en": ["The Catholic priests", "The Aztec warriors", "The chilam (Maya seers)", "The merchants"], "question_fa": null, "options_fa": null}, {"id": 10703, "question": "¿Qué formaron las lágrimas del venado?", "options": ["Ríos de agua salada", "Cascadas", "Cenotes secos", "Muchas aguadas"], "correct": 3, "question_en": "What did the deer's tears form?", "options_en": ["Saltwater rivers", "Waterfalls", "Dry cenotes", "Many waterholes"], "question_fa": null, "options_fa": null}, {"id": 10704, "question": "¿Qué hizo la serpiente de cascabel al saber de la conquista?", "options": ["Huyó a la selva", "Lloró hasta quedarse dormida", "Creó un nuevo sonido para luchar", "Se escondió en una caverna"], "correct": 2, "question_en": "What did the rattlesnake do upon learning of the conquest?", "options_en": ["Fled to the jungle", "Wept until it fell asleep", "Created a new sound to fight", "Hid in a cavern"], "question_fa": null, "options_fa": null}, {"id": 10705, "question": "¿Cuáles serán las tres señales para recuperar la tierra?", "options": ["El canto del gallo, el ladrido y el maullido", "El trueno, el rayo y la lluvia", "La salida del sol, la luna llena y la estrella", "La sombra del faisán, el salto del venado y la música de la serpiente"], "correct": 3, "question_en": "What will be the three signs to recover the land?", "options_en": ["The rooster's crow, the bark and the meow", "Thunder, lightning and rain", "Sunrise, full moon and star", "The pheasant's shadow, the deer's leap and the snake's music"], "question_fa": null, "options_fa": null}]}, {"id": 8, "title": "La leyenda del maíz", "topic": "Mundo mesoamericano", "text": "Cuentan las historias de los primeros habitantes de Mesoamérica que, antes de la llegada del dios Quetzalcóatl, los aztecas sobrevivían alimentándose únicamente de raíces y de los animales que cazaban. Ellos no tenían el maíz, pues este cereal tan alimenticio estaba escondido detrás de las montañas y no tenían acceso a él.\n\nLos antiguos dioses intentaron obtenerlo y trataron de separar las montañas con su colosal fuerza, pero no lo lograron. Entonces los aztecas pidieron ayuda al dios Quetzalcóatl. Él no quiso emplear la fuerza, sino la inteligencia y la astucia, y se transformó en una hormiga negra. Decidió dirigirse a las montañas acompañado de una hormiga roja, dispuesto a conseguir el maíz para su pueblo.\n\nTras mucho esfuerzo y sin perder el ánimo, Quetzalcóatl subió las montañas. Al llegar a su destino, tomó entre sus mandíbulas un grano maduro de maíz e inició el duro camino de regreso. Entregó el grano prometido a los hambrientos indígenas, quienes plantaron la semilla, y desde entonces tuvieron maíz para alimentarse.\n\nEl preciado grano aumentó sus riquezas: se volvieron más fuertes y construyeron ciudades, palacios y templos. Desde entonces vivieron felices, y los aztecas veneraron al generoso Quetzalcóatl, el dios amigo de los hombres, el dios que les trajo el maíz.", "text_en": "The stories of the first inhabitants of Mesoamerica tell that, before the arrival of the god Quetzalcóatl, the Aztecs survived eating only roots and the animals they hunted. They did not have maize, because this nutritious grain was hidden behind the mountains and they had no access to it. The ancient gods tried to obtain it and attempted to separate the mountains with their colossal strength, but they failed. So the Aztecs asked the god Quetzalcóatl for help. He did not wish to use force, but rather intelligence and cunning, and he transformed himself into a black ant. He decided to head to the mountains accompanied by a red ant, determined to get the maize for his people. After much effort and without losing heart, Quetzalcóatl climbed the mountains. Upon reaching his destination, he took a ripe grain of maize between his jaws and began the hard journey back. He gave the promised grain to the hungry people, who planted the seed, and from then on they had maize to feed themselves. The precious grain increased their wealth: they became stronger and built cities, palaces, and temples. From then on they lived happily, and the Aztecs revered the generous Quetzalcóatl, the god who was a friend to men, the god who brought them maize.", "text_fa": null, "questions": [{"id": 10800, "question": "Antes de tener maíz, ¿de qué se alimentaban los aztecas?", "options": ["De pescado y mariscos", "De frutas y verduras", "De tortillas y frijoles", "De raíces y de los animales que cazaban"], "correct": 3, "question_en": "Before having maize, what did the Aztecs eat?", "options_en": ["Fish and seafood", "Fruits and vegetables", "Tortillas and beans", "Roots and the animals they hunted"], "question_fa": null, "options_fa": null}, {"id": 10801, "question": "¿Por qué los aztecas no podían obtener el maíz?", "options": ["Porque los dioses lo habían prohibido", "Porque no sabían sembrar", "Porque era muy caro", "Porque estaba escondido detrás de las montañas"], "correct": 3, "question_en": "Why couldn't the Aztecs obtain the maize?", "options_en": ["Because the gods had forbidden it", "Because they didn't know how to sow", "Because it was very expensive", "Because it was hidden behind the mountains"], "question_fa": null, "options_fa": null}, {"id": 10802, "question": "¿Qué hicieron primero los antiguos dioses para obtener el maíz?", "options": ["Pidieron ayuda a Quetzalcóatl", "Intentaron separar las montañas con su fuerza", "Plantaron semillas", "Negociaron con otros pueblos"], "correct": 1, "question_en": "What did the ancient gods do first to obtain the maize?", "options_en": ["They asked Quetzalcóatl for help", "They tried to separate the mountains with their strength", "They planted seeds", "They negotiated with other peoples"], "question_fa": null, "options_fa": null}, {"id": 10803, "question": "¿En qué animal se transformó Quetzalcóatl para conseguir el maíz?", "options": ["En un venado", "En una hormiga negra", "En una serpiente", "En un águila"], "correct": 1, "question_en": "Into what animal did Quetzalcóatl transform to get the maize?", "options_en": ["A deer", "A black ant", "A snake", "An eagle"], "question_fa": null, "options_fa": null}, {"id": 10804, "question": "¿Quién acompañó a Quetzalcóatl a las montañas?", "options": ["Un guerrero azteca", "Un venado", "Un faisán", "Una hormiga roja"], "correct": 3, "question_en": "Who accompanied Quetzalcóatl to the mountains?", "options_en": ["An Aztec warrior", "A deer", "A pheasant", "A red ant"], "question_fa": null, "options_fa": null}, {"id": 10805, "question": "¿Qué hicieron los aztecas con el grano que les entregó Quetzalcóatl?", "options": ["Lo plantaron y desde entonces tuvieron maíz", "Lo guardaron como ofrenda", "Lo regalaron a otros pueblos", "Lo vendieron"], "correct": 0, "question_en": "What did the Aztecs do with the grain Quetzalcóatl gave them?", "options_en": ["They planted it and from then on had maize", "They kept it as an offering", "They gave it to other peoples", "They sold it"], "question_fa": null, "options_fa": null}]}, {"id": 9, "title": "Chinampas de Xochimilco", "topic": "Tecnicas agricolas tradicionales", "text": "Las chinampas son un sistema agrícola tradicional desarrollado en zonas lacustres del Valle de México. Consisten en parcelas construidas de forma artificial sobre aguas someras, con técnicas que permiten alta productividad y manejo cuidadoso del entorno. En Xochimilco, este método ha sostenido por siglos la producción de hortalizas, flores y plantas de consumo local. Su valor no es solo económico: también representa conocimiento histórico sobre suelos, agua y biodiversidad. Por esa razón, se considera un patrimonio cultural y ambiental de gran relevancia. Aunque hoy enfrenta presiones urbanas y ambientales, diversas comunidades y proyectos trabajan para conservarlo mediante restauración ecológica, reforestación y fortalecimiento productivo. En una lectura de examen, este tipo de texto puede incluir preguntas sobre la función de las chinampas, su origen histórico y los riesgos actuales que enfrentan. Comprenderlo exige relacionar técnica tradicional con sostenibilidad y vida comunitaria en la ciudad.", "text_en": "Chinampas are a traditional agricultural system developed in the lake areas of the Valley of Mexico. They consist of plots built artificially over shallow waters, with techniques that allow high productivity and careful management of the environment. In Xochimilco, this method has sustained for centuries the production of vegetables, flowers, and plants for local consumption. Its value is not only economic: it also represents historical knowledge about soil, water, and biodiversity. For this reason, it is considered a cultural and environmental heritage of great relevance. Although today it faces urban and environmental pressures, various communities and projects work to conserve it through ecological restoration, reforestation, and productive strengthening. In an exam reading, this type of text may include questions about the function of the chinampas, their historical origin, and the current risks they face. Understanding it requires relating traditional technique with sustainability and community life in the city.", "text_fa": null, "questions": [{"id": 10900, "question": "¿Qué son las chinampas según el texto?", "options": ["Canales de riego para ganado", "Mercados flotantes", "Fortalezas de piedra", "Parcelas agrícolas tradicionales construidas sobre aguas someras"], "correct": 3, "question_en": "According to the text, what are chinampas?", "options_en": ["Irrigation canals for cattle", "Floating markets", "Stone fortresses", "Traditional agricultural plots built over shallow waters"], "question_fa": null, "options_fa": null}, {"id": 10901, "question": "¿Qué ha sostenido por siglos el método de Xochimilco?", "options": ["Pesca marítima", "Fabricación textil", "Extracción minera", "Producción de hortalizas, flores y plantas"], "correct": 3, "question_en": "What has Xochimilco's method sustained for centuries?", "options_en": ["Maritime fishing", "Textile manufacturing", "Mining extraction", "Production of vegetables and flowers"], "question_fa": null, "options_fa": null}, {"id": 10902, "question": "Además del valor económico, ¿qué representan las chinampas?", "options": ["Tecnología militar", "Rutas de comercio internacional", "Conocimiento histórico sobre suelos, agua y biodiversidad", "Ceremonias religiosas"], "correct": 2, "question_en": "Besides economic value, what do chinampas represent?", "options_en": ["Military technology", "International trade routes", "Historical knowledge about soil, water and biodiversity", "Religious ceremonies"], "question_fa": null, "options_fa": null}, {"id": 10903, "question": "¿Qué presiones enfrenta hoy este sistema?", "options": ["Solo cambios de clima", "Presiones urbanas y ambientales", "Falta de turistas", "Exceso de tierras"], "correct": 1, "question_en": "What pressures does this system face today?", "options_en": ["Only weather changes", "Urban and environmental pressures", "Lack of tourists", "Too much farmland"], "question_fa": null, "options_fa": null}, {"id": 10904, "question": "¿Cómo intentan conservar las chinampas las comunidades?", "options": ["Restauración ecológica y reforestación", "Construyendo viviendas", "Cerrando los canales", "Eliminando vegetación"], "correct": 0, "question_en": "How do communities try to conserve the chinampas?", "options_en": ["Ecological restoration and reforestation", "Building housing", "Closing the canals", "Removing vegetation"], "question_fa": null, "options_fa": null}, {"id": 10905, "question": "¿Qué relación exige comprender las chinampas?", "options": ["Técnica tradicional, sostenibilidad y vida comunitaria", "Minería y puertos", "Industria y banca", "Moda y espectáculo"], "correct": 0, "question_en": "What relationship does understanding the chinampas require?", "options_en": ["Traditional technique, sustainability and community life", "Mining and ports", "Industry and banking", "Fashion and entertainment"], "question_fa": null, "options_fa": null}]}, {"id": 10, "title": "Reserva de la Biosfera Mariposa Monarca", "topic": "Patrimonio natural y cultural", "text": "Cada año, millones de mariposas monarca viajan miles de kilómetros desde Norteamérica hasta los bosques templados de México, principalmente en Michoacán y el Estado de México. Este fenómeno migratorio destaca por su precisión y continuidad, pues las colonias regresan de manera recurrente a zonas de hibernación. La región ha sido reconocida por su relevancia ecológica y por el valor cultural que las comunidades locales le atribuyen. En algunos contextos, la llegada de la monarca coincide con temporadas de memoria y celebración comunitaria, lo que fortalece su simbolismo. La conservación de estos bosques requiere acciones coordinadas: manejo forestal, vigilancia, restauración y participación social. Por eso, estudiar la monarca no significa solo conocer una especie; implica entender la relación entre biodiversidad, territorio y cultura. En ejercicios de comprensión, suelen preguntarse datos de ubicación, finalidad de protección y mensaje central del texto.", "text_en": "Every year, millions of monarch butterflies travel thousands of kilometers from North America to the temperate forests of Mexico, mainly in Michoacán and the State of Mexico. This migratory phenomenon stands out for its precision and continuity, since the colonies return repeatedly to hibernation areas. The region has been recognized for its ecological relevance and for the cultural value that local communities give it. In some contexts, the monarch's arrival coincides with seasons of remembrance and community celebration, which strengthens its symbolism. Conserving these forests requires coordinated actions: forest management, monitoring, restoration, and social participation. That is why studying the monarch does not mean only knowing a species; it implies understanding the relationship between biodiversity, territory, and culture. In comprehension exercises, questions are usually asked about location data, the purpose of protection, and the central message of the text.", "text_fa": null, "questions": [{"id": 11000, "question": "¿A dónde llegan las mariposas monarca según el texto?", "options": ["Valles de Sonora", "Selvas de Chiapas y Tabasco", "Playas de Baja California", "Bosques de Michoacán y Estado de México"], "correct": 3, "question_en": "According to the text, where do monarch butterflies arrive?", "options_en": ["Valleys of Sonora", "Jungles of Chiapas and Tabasco", "Beaches of Baja California", "Forests of Michoacán and the State of Mexico"], "question_fa": null, "options_fa": null}, {"id": 11001, "question": "¿Qué destaca del fenómeno migratorio?", "options": ["Ausencia de ciclos", "Precisión y continuidad anual", "Cambio diario de ruta local", "Migración exclusivamente nocturna urbana"], "correct": 1, "question_en": "What stands out about the migratory phenomenon?", "options_en": ["Absence of cycles", "Precision and annual continuity", "Daily change of local route", "Exclusively urban night migration"], "question_fa": null, "options_fa": null}, {"id": 11002, "question": "¿Qué tipo de valor tiene la región además del ecológico?", "options": ["Uso industrial pesado", "Únicamente valor inmobiliario", "Solo valor deportivo", "Valor cultural comunitario"], "correct": 3, "question_en": "Besides ecological value, what kind of value does the region have?", "options_en": ["Heavy industrial use", "Only real estate value", "Only sporting value", "Community cultural value"], "question_fa": null, "options_fa": null}, {"id": 11003, "question": "¿Qué requiere su conservación?", "options": ["Eliminar vegetación local", "Cierre total de comunidades", "Acciones coordinadas de manejo y participación social", "Solo publicidad"], "correct": 2, "question_en": "What does its conservation require?", "options_en": ["Removing local vegetation", "Total closure of communities", "Coordinated management actions and social participation", "Only advertising"], "question_fa": null, "options_fa": null}, {"id": 11004, "question": "¿Qué relación central propone el texto?", "options": ["Moda y espectáculo", "Biodiversidad, territorio y cultura", "Moneda y comercio internacional", "Minería y puertos"], "correct": 1, "question_en": "What central relationship does the text propose?", "options_en": ["Fashion and spectacle", "Biodiversity, territory and culture", "Currency and international trade", "Mining and ports"], "question_fa": null, "options_fa": null}, {"id": 11005, "question": "¿Qué tipo de preguntas menciona el texto para comprensión?", "options": ["Solo ortografía técnica", "Historia de inventos europeos", "Ubicación, protección y mensaje central", "Cálculo de impuestos"], "correct": 2, "question_en": "What kind of questions does the text mention for comprehension?", "options_en": ["Only technical spelling", "History of European inventions", "Location, protection and central message", "Tax calculation"], "question_fa": null, "options_fa": null}]}, {"id": 11, "title": "Mariachi: musica de cuerdas, canto y trompeta", "topic": "Musica tradicional mexicana", "text": "El mariachi es una expresión musical ampliamente reconocida como símbolo de México. Su evolución incluye una vertiente tradicional de cuerdas y otra moderna que incorpora trompetas, vihuela, guitarrón y violines en formaciones más amplias. A lo largo del tiempo, su repertorio ha integrado sones, jarabes, corridos, valses y canciones rancheras, entre otros géneros. Más que un estilo sonoro, el mariachi funciona como práctica social: se interpreta en fiestas familiares, celebraciones comunitarias y actos cívicos. También ha sido una vía de transmisión intergeneracional de memoria local, lenguaje y afecto por la región de origen. En diversos espacios culturales se reconoce su papel como patrimonio inmaterial por su capacidad de articular identidad y pertenencia. En lectura de comprensión, este tema suele evaluar si la persona distingue entre características del mariachi tradicional y del moderno, y si identifica su importancia cultural más allá de la música.", "text_en": "The mariachi is a musical expression widely recognized as a symbol of Mexico. Its evolution includes a traditional string style and a modern one that adds trumpets, vihuela, guitarrón, and violins in larger ensembles. Over time, its repertoire has included sones, jarabes, corridos, waltzes, and rancheras, among other genres. More than a sound style, the mariachi works as a social practice: it is performed at family parties, community celebrations, and civic events. It has also been a way of passing local memory, language, and affection for one's region from generation to generation. In various cultural spaces its role as intangible heritage is recognized for its capacity to articulate identity and belonging. In reading comprehension, this topic usually evaluates whether the person distinguishes the characteristics of traditional and modern mariachi, and whether they identify its cultural importance beyond music.", "text_fa": null, "questions": [{"id": 11100, "question": "¿Qué instrumentos se mencionan en la variante moderna?", "options": ["Piano y flauta transversal", "Solo batería eléctrica", "Saxofón y acordeón exclusivamente", "Trompetas, violines, vihuela y guitarrón"], "correct": 3, "question_en": "Which instruments are mentioned in the modern style?", "options_en": ["Piano and transverse flute", "Only electric drums", "Saxophone and accordion exclusively", "Trumpets, violins, vihuela and guitarrón"], "question_fa": null, "options_fa": null}, {"id": 11101, "question": "¿Qué géneros se citan dentro del repertorio?", "options": ["Jazz contemporáneo únicamente", "Música electrónica de club", "Sones, jarabes y corridos", "Ópera italiana exclusivamente"], "correct": 2, "question_en": "Which genres are cited within the repertoire?", "options_en": ["Only contemporary jazz", "Electronic club music", "Sones, jarabes and corridos", "Only Italian opera"], "question_fa": null, "options_fa": null}, {"id": 11102, "question": "¿Cómo define el texto al mariachi además de estilo musical?", "options": ["Método de construcción", "Sistema de transporte", "Práctica social y cultural", "Disciplina militar"], "correct": 2, "question_en": "How does the text define mariachi besides a musical style?", "options_en": ["A construction method", "A transportation system", "A social and cultural practice", "A military discipline"], "question_fa": null, "options_fa": null}, {"id": 11103, "question": "¿En qué espacios suele interpretarse?", "options": ["Solo auditorios cerrados", "Solo ceremonias deportivas", "Solo universidades extranjeras", "Fiestas familiares, comunidad y actos cívicos"], "correct": 3, "question_en": "In which spaces is it usually performed?", "options_en": ["Only closed auditoriums", "Only sports ceremonies", "Only foreign universities", "Family parties, community and civic events"], "question_fa": null, "options_fa": null}, {"id": 11104, "question": "¿Qué reconoce su declaratoria cultural?", "options": ["Su utilidad industrial", "Su papel en identidad y pertenencia", "Su uso médico", "Su función bancaria"], "correct": 1, "question_en": "What does its cultural declaration recognize?", "options_en": ["Its industrial utility", "Its role in identity and belonging", "Its medical use", "Its banking function"], "question_fa": null, "options_fa": null}, {"id": 11105, "question": "¿Qué puede evaluar una pregunta de comprensión sobre este tema?", "options": ["Diferencias entre mariachi tradicional y moderno", "Caligrafía artística", "Solo velocidad de lectura", "Memoria de fechas sin contexto"], "correct": 0, "question_en": "What can a comprehension question on this topic evaluate?", "options_en": ["Differences between traditional and modern mariachi", "Artistic calligraphy", "Only reading speed", "Memorizing dates without context"], "question_fa": null, "options_fa": null}]}, {"id": 12, "title": "Cocina tradicional mexicana", "topic": "Patrimonio alimentario", "text": "La cocina tradicional mexicana se entiende como un patrimonio vivo que une ingredientes, técnicas, saberes comunitarios y celebraciones. Su valor cultural no depende de un solo platillo, sino de una red de prácticas que inicia en el campo y continúa en mercados, cocinas familiares y fiestas locales. El maíz ocupa un lugar central en ese sistema, junto con procesos como la nixtamalización, el uso de comales y las preparaciones regionales que cambian según territorio y temporada. En 2010, esta cocina fue inscrita en la Lista Representativa del Patrimonio Cultural Inmaterial de la Humanidad, reconocimiento que subraya su relevancia social y su capacidad de transmitir conocimiento entre generaciones. El texto también destaca la dimensión de sostenibilidad: proteger semillas, valorar a los productores locales y mantener las técnicas tradicionales fortalece comunidades y ecosistemas. En comprensión lectora, suelen aparecer preguntas sobre la idea principal, la fecha de reconocimiento y la relación entre alimentación e identidad.", "text_en": "Traditional Mexican cuisine is understood as a living heritage that unites ingredients, techniques, community knowledge, and celebrations. Its cultural value does not depend on a single dish, but on a network of practices that begins in the countryside and continues in markets, family kitchens, and local festivals. Maize holds a central place in that system, together with processes such as nixtamalization, the use of comales, and regional preparations that change according to territory and season. In 2010, this cuisine was inscribed on the Representative List of the Intangible Cultural Heritage of Humanity, a recognition that highlights its social relevance and its capacity to pass knowledge between generations. The text also highlights the sustainability dimension: protecting seeds, valuing local producers, and maintaining traditional techniques strengthens communities and ecosystems. In reading comprehension, questions often appear about the main idea, the date of recognition, and the relationship between food and identity.", "text_fa": null, "questions": [{"id": 11200, "question": "¿Cómo define el texto la cocina tradicional mexicana?", "options": ["Conjunto de recetas importadas", "Patrimonio vivo de prácticas comunitarias", "Industria exclusivamente urbana", "Lista fija de un solo estado"], "correct": 1, "question_en": "How does the text define traditional Mexican cuisine?", "options_en": ["A set of imported recipes", "Living heritage of community practices", "An exclusively urban industry", "A fixed list from a single state"], "question_fa": null, "options_fa": null}, {"id": 11201, "question": "¿Qué ingrediente se menciona como central?", "options": ["Avena", "Trigo", "Centeno", "Maíz"], "correct": 3, "question_en": "Which ingredient is mentioned as central?", "options_en": ["Oats", "Wheat", "Rye", "Maize"], "question_fa": null, "options_fa": null}, {"id": 11202, "question": "¿En qué año se reconoce en la Lista Representativa?", "options": ["2015", "2020", "2008", "2010"], "correct": 3, "question_en": "In what year was it recognized on the Representative List?", "options_en": ["2015", "2020", "2008", "2010"], "question_fa": null, "options_fa": null}, {"id": 11203, "question": "¿Qué aspecto resalta el reconocimiento internacional?", "options": ["Uso exclusivo de maquinaria", "Homogeneidad nacional obligatoria", "Sustitución total de técnicas tradicionales", "Transmisión social y cultural del conocimiento"], "correct": 3, "question_en": "What aspect does the international recognition highlight?", "options_en": ["Exclusive use of machinery", "Obligatory national homogeneity", "Total replacement of traditional techniques", "Social and cultural transmission of knowledge"], "question_fa": null, "options_fa": null}, {"id": 11204, "question": "¿Qué s are fantastic figures of Mexican folk art, traditionally made of cartonería (papier-mâché) and polychrome wood, depending on the region. In the most widespread account, their modern origin is associated with the artisan Pedro Linares, who imagined creatures of unexpected shapes and great color. Over time, this expression grew in family workshops, fairs, parades, and cultural spaces. Beyond the visual, alebrijes represent collective creativity and the passing of a craft between generations. Many pieces combine features of several animals to build a unique symbolic being, which allows experimenting with identity, imagination, and local memory. In some cities, their making has been recognized as intangible cultural heritage for its artistic and community importance. In a reading comprehension, this topic allows evaluating whether one identifies the origin, materials, and cultural function of the craft without reducing it to a decorative object.", "text_fa": null, "questions": [{"id": 11300, "question": "¿Qué son los alebrijes según el texto?", "options": ["Instrumentos musicales", "Edificios históricos", "Trajes ceremoniales", "Figuras fantásticas del arte popular"], "correct": 3, "question_en": "What are alebrijes according to the text?", "options_en": ["Musical instruments", "Historic buildings", "Ceremonial costumes", "Fantastic figures of folk art"], "question_fa": null, "options_fa": null}, {"id": 11301, "question": "¿Con qué artesano se asocia su origen moderno?", "options": ["José María Velasco", "Enrique Carbajal", "Pedro Linares", "Diego Rivera"], "correct": 2, "question_en": "With which artisan is their modern origin associated?", "options_en": ["José María Velasco", "Enrique Carbajal", "Pedro Linares", "Diego Rivera"], "question_fa": null, "options_fa": null}, {"id": 11302, "question": "¿Qué materiales se mencionan?", "options": ["Solo acero", "Solo vidrio", "Cartonería y madera policromada", "Concreto y mármol"], "correct": 2, "question_en": "Which materi arolas del volcán se han asociado con fuerza, respeto y significado ritual. Su presencia domina el paisaje de regiones cercanas a Puebla, Estado de México y Morelos, donde ha influido en rutas, asentamientos y relatos locales. El texto subraya que un volcán puede leerse desde dos planos: el científico, que estudia procesos geológicos, y el cultural, que conserva memorias, leyendas y prácticas comunitarias. En comprensión lectora, esta combinación de perspectivas obliga a distinguir dato lingüístico, descripción natural e interpretación simbólica. Al hacerlo, la persona lectora demuestra que no solo identifica información puntual, sino también la estructura de sentido que une territorio e historia.", "text_en": "The name Popocatépetl comes from Nahuatl and is interpreted as \"smoking mountain.\" This name reflects the historical observation of its volcanic activity and the relationship that highland peoples have kept with their surroundings. Since pre-Hispanic times, the volcano's fumaroles have been associated with strength, respect, and ritual meaning. Its presence dominates the landscape of regions near Puebla, the State of Mexico, and Morelos, where it has influenced routes, settlements, and local stories. The text stresses that a volcano can be read on two levels: the scientific one, which studies geological processes, and the cultural one, which keeps memories, legends, and community practices. In reading comprehension, this combination of perspectives requires distinguishing linguistic data, natural description, and symbolic interpretation. In doing so, the reader shows not only that they identify specific information, but also the structure of meaning that unites territory and history.", "text_fa": null, "questions": [{"id": 11400, "question": "¿Qué significa Popocatépetl en náhuatl según el texto?", "options": ["Mujer blanca", "Tierra del faisán", "Montaña que humea", "Agua profunda"], "correct": 2, "question_en": "What does Popocatépetl mean in Nahuatl according to the text?", "options_en": ["White woman", "Land of the pheasant", "Smoking mountain", "Deep water"], "question_fa": null, "options_fa": null}, {"id": 11401, "question": "¿Qué elemento histórico refleja ese nombre?", "options": ["Observación de su actividad volcánica", "Diseño colonial de rutas", "Uso de calendarios europeos", "Traducción francesa moderna"], "correct": 0, "question_en": "What historical element does that name reflect?", "options_en": ["Observation of its volcanic activity", "Colonial route design", "Use of European calendars", "Modern French translation"], "question_fa": null, "options_fa": null}, {"id": 11402, "question": "¿Qué regiones se mencionan alrededor del volcán?", "options": ["Sonora, Sinaloa y Nayarit", "Chihuahua, Durango y Coahuila", "Campeche, Yucatán y Quintana Roo", "Puebla, Estado de México y Morelos"], "correct": 3, "question_en": "Which regions are mentioned around the volcano?", "options_en": ["Sonora, Sinaloa and Nayarit", "Chihuahua, Durango and Coahuila", "Campeche, Yucatán and Quintana Roo", "Puebla, the State of Mexico and Morelos"], "question_fa": null, "options_fa": null}, {"id": 11403, "question": "¿Qué dos planos de lectura propone el texto?", "options": ["Eléctrico y digital", "Jurídico y financiero", "Militar y comercial", "Científico y cultural"], "correct": 3, "question_en": "What two levels of reading does the text propose?", "options_en": ["Electric and digital", "Legal and financial", "Military and commercial", "Scientific and cultural"], "question_fa": null, "options_fa": null}, {"id": 11404, "question": "¿Qué debe distinguir la persona lectora en comprensión?", "options": ["Solo fechas históricas", "Solo números de altitud", "Solo nombres propios", "Dato lingüístico, descripción natural e interpretación simbólica"], "correct": 3, "question_en": "What must the reader distinguish in comprehension?", "options_en": ["Only historical dates", "Only altitude figures", "Only proper names", "Linguistic data, natu oped in its surroundings and domesticated crops fundamental to the local diet, such as maize, beans, and squash. This double natural and cultural character explains why its conservation requires long-term strategies and social participation. It is not only about protecting landscapes: it is about sustaining living conditions for human and non-human populations. In reading comprehension, a text like this can ask about the purpose of protection, examples of biodiversity, or the relationship between natural heritage and community knowledge.", "text_fa": null, "questions": [{"id": 11500, "question": "¿Qué tipo de espacio es Izta-Popo según el texto?", "options": ["Zona industrial", "Puerto comercial", "Área natural protegida", "Corredor ferroviario"], "correct": 2, "question_en": "What type of space is Izta-Popo according to the text?", "options_en": ["Industrial zone", "Commercial port", "Protected natural area", "Railway corridor"], "question_fa": null, "options_fa": null}, {"id": 11501, "question": "¿Qué razón principal se menciona para su importancia?", "options": ["Explotación minera", "Turismo de playa", "Biodiversidad y servicios ambientales", "Comercio marítimo"], "correct": 2, "question_en": "What main reason is mentioned for its importance?", "options_en": ["Mining exploitation", "Beach tourism", "Biodiversity and environmental services", "Maritime trade"], "question_fa": null, "options_fa": null}, {"id": 11502, "question": "¿Qué cultivos se nombran como parte de su valor histórico?", "options": ["Café y cacao", "Maíz, frijol y calabaza", "Trigo y centeno", "Cebada y avena"], "correct": 1, "question_en": "Which crops are named as part of its historical value?", "options_en": ["Coffee and cacao", "Maize, beans and squash", "Wheat and rye", "Barley and oats"], "question_fa": null, "options_fa": null}, {"id": 11503, "question": "¿Qué exige su conservación según el texto?", "options": ["Privatización completa", "Cierre total de acceso", "Estrategias de largo plazo
