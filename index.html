:root{--bg:#022c22;--bg2:#064e3b;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--ink:#ecfdf5;--mut:#a7f3d0;--gold:#fcd34d;--rose:#fb7185;--green:#6ee7b7;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;font-weight:700;padding:10px 18px;border-radius:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.ghost[aria-pressed="true"]{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.55);color:#fde68a}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d1fae5;border:1px solid var(--line)}
.pill.gold{background:rgba(252,211,77,.15);color:#fde68a;border-color:rgba(252,211,77,.3)}
.pill.green{background:rgba(110,231,183,.15);color:#a7f3d0;border-color:rgba(110,231,183,.3)}
.pill.rose{background:rgba(251,113,133,.15);color:#fecdd3;border-color:rgba(251,113,133,.3)}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px}
.mut{color:var(--mut)}
.small{font-size:12px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;transition:background .15s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.sel{border-color:var(--gold);background:rgba(252,211,77,.18)}
.opt.ok{border-color:var(--green);background:rgba(110,231,183,.15)}
.opt.bad{border-color:var(--rose);background:rgba(251,113,133,.15)}
.opt.locked{opacity:.4}
.translation{color:#bfdbfe;font-style:italic;font-size:14px;margin-top:6px;padding:8px 10px;background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;border-radius:6px;white-space:pre-wrap}
.translation.fa{direction:rtl;text-align:right;font-style:normal;font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.8;border-left:0;border-right:3px solid #3b82f6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tab.on{background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:24px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#fcd34d,#fb7185);border-radius:999px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loginbox{max-width:420px;margin:8vh auto}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;margin:6px 0 12px}
textarea.field{min-height:120px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.passage{max-height:46vh;overflow:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.55}
#flashcard{margin:20px 0}
.qtext{font-size:19px;font-weight:700;line-height:1.4;margin:12px 0}
.footer{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}
.marker{color:#34d399;font-weight:700}
.badmark{color:#fda4af;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.badge.ok{background:rgba(110,231,183,.18);color:#6ee7b7}
.badge.no{background:rgba(251,113,133,.18);color:#fb7185}
</style>

 زندگی کند و شیفتهٔ زیبایی‌اش شود. آنگاه المایاب، سرزمین برگزیدگان، را آفرید و زیباترین گل‌ها را در آن کاشت تا آرایهٔ راه‌ها باشند، سنوته‌های بزرگی آفرید که آب‌های زلالشان نور خورشید را بازتاب دهند و همچنین غارهای ژرفی سرشار از راز.", "questions": [{"id": 51900, "question": "¿Cuándo decidió Itzamná crear una tierra tan hermosa?", "options": ["Durante el imperio maya", "Al llegar los españoles", "Hace mucho, pero mucho tiempo", "Hace pocos años"], "correct": 2, "question_en": "When did Itzamna decide to create a land so beautiful?", "question_fa": "ایتزمنه چه زمانی تصمیم گرفت سرزمینی آن‌قدر زیبا بیافریند؟", "options_en": ["During the mayan empire", "Upon the arrival of the spaniards", "A long, long time ago", "A few years ago"], "options_fa": ["در زمان امپراتوری مایا", "با آمدن اسپانیایی‌ها", "زمانی بسیار بسیار دور", "چند سال پیش"]}, {"id": 51901, "question": "¿Quién decidió crear una tierra tan hermosa?", "options": ["Quetzalcóatl", "Itzamná", "Kukulkán", "Chaac"], "correct": 1, "question_en": "Who decided to create a land so beautiful?", "question_fa": "چه کسی تصمیم گرفت سرزمینی آن‌قدر زیبا بیافریند؟", "options_en": ["Quetzalcoatl", "Itzamna", "Kukulkan", "Chaac"], "options_fa": ["کرتزالکواتل", "ایتزمنه", "کوکولکان", "چاک"]}, {"id": 51902, "question": "¿Qué decidió crear Itzamná?", "options": ["una tierra", "un reino de guerreros", "un mar de aguas tibias", "una ciudad de piedra"], "correct": 0, "question_en": "What did Itzamna decide to create?", "question_fa": "ایتزمنه تصمیم گرفت چه چیزی بیافریند؟", "options_en": ["a land", "a kingdom of warriors", "a sea of warm waters", "a city of stone"], "options_fa": ["سرزمینی", "پادشاهی جنگجویان", "دریایی با آب‌های گرم", "شهری سنگی"]}, {"id": 51903, "question": "¿Cómo debía ser la tierra que quiso crear Itzamná?", "options": ["tan alta que tocara las nubes", "tan grande que abarcara todo el sur", "tan rica que tuviera oro y jade", "tan hermosa que todo aquél que la conociera quisiera vivir allí"], "correct": 3, "question_en en": ["small", "warm", "enormous", "hidden"], "options_fa": ["کوچک", "گرم", "بزرگ", "پنهان"]}]}, {"id": 20, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 2, "title": "Párrafo 2 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Después, Itzamná le entregó la nueva tierra a los mayas y escogió tres animales para que vivieran por siempre en El Mayab y quien pensara en ellos lo recordara de inmediato. Los elegidos por Itzamná fueron el faisán, el venado y la serpiente de cascabel. Los mayas vivieron felices y se encargaron de construir palacios y ciudades de piedra.", "text_en": "Then Itzamna handed the new land over to the mayas and chose three animals so that they would live forever in El Mayab and whoever thought of them would remember it at once. The ones chosen by Itzamna were the pheasant, the deer and the rattlesnake. The mayas lived happily and took charge of building palaces and cities of stone.", "text_fa": "سپس ایتزمنه سرزمین تازه را به مایاها سپرد و سه جانور را برگزید تا برای همیشه در المایاب زندگی کنند و هر کس به آنان بیندیشد بی‌درنگ آن سرزمین را به یاد آورد. برگزیدگان ایتزمنه فازان، گوزن و مار زنگی بودند. مایاها شاد زیستند و به ساختن کاخ‌ها و شهرهای سنگی پرداختند.", "questions": [{"id": 52000, "question": "¿A quiénes les entregó Itzamná la nueva tierra?", "options": ["a los aztecas", "a los mayas", "a los olmecas", "a los toltecas"], "correct": 1, "question_en": "To whom did Itzamna hand over the new land?", "question_fa": "ایتزمنه آن سرزمین تازه را به چه کسانی سپرد؟", "options_en": ["to the aztecas", "the mayas", "to the olmecans", "to the toltecs"], "options_fa": ["آزتک‌ها", "مایاها", "اولمک‌ها", "تولتک‌ها"]}, {"id": 52001, "question": "¿Qué les entregó Itzamná a los mayas?", "options": ["el maíz escondido", "las aguas cristalinas", "la nueva tierra", "el fuego sagrado"], "correct": 2, "question_en": "What did Itzamna hand over to the mayas?", "question_fa": "ایتزمنه چه چیزی را به مایاها سپرد؟", "options_en": ["the hidden corn", "the crystal-clear waters", "the new land", "the sacred fire"], "options_fa": ["ذرت پنهان", "آب‌های زلال", "سرزمین تازه", "آتش مقدس"]}, {"id": 52002, "question": "¿Cuántos animales escogió Itzamná?", "options": ["cuatro animales", "tres animales", "dos animales", "cinco animales"], "correct": 1, "question_en": "How many animals did Itzamna choose?", "question_fa": "ایتزمنه چند جانور را برگزید؟", "options_en": ["four animals", "three animals", "two animals", "five animals"], "options_fa": ["چهار جانور", "سه جانور", "دو جانور", "پنج جانور"]}, {"id": 52003, "question": "¿Para qué escogió Itzamná tres animales?", "options": ["para que protegieran las cavernas", "para que vivieran por siempre en El Mayab", "para que guiaran a los viajeros", "para que cuidaran los cenotes"], "correct": 1, "question_en": "What did Itzamna choose three animals for?", "question_fa": "ایتزمنه سه جانور را برای چه چیزی برگزید؟", "options_en": ["so that they would guard the caverns", "so that they would live forever in El Mayab", "so that they would guide the travelers", "so that they would guard the cenotes"], "options_fa": ["تا از غارها نگهبانی کنند", "تا برای همیشه در المایاب زندگی کنند", "تا مسافران را راهنمایی کنند", "تا از سنوته‌ها نگهبانی کنند"]}, {"id": 52004, "question": "¿Por cuánto tiempo vivirían los animales escogidos en El Mayab?", "options": ["por una luna", "por muchos años", "hasta la conquista", "por siempre"], "correct": 3, "question_en": "For how long would the chosen animals live in El Mayab?", "question_fa": "آن جانوران برگزیده چه مدتی در المایاب زندگی می‌کردند؟", "options_en": ["for one moon", "for many years", "until the conquest", "forever"], "options_fa": ["به اندازهٔ یک ماه", "برای سال‌های بسیار", "تا زمان فتح", "برای همیشه"]}, {"id": 52005, "question": "Según el texto, quien pensara en los animales elegidos, ¿qué haría?", "options": ["viviría para siempre", "lo recordara de inmediato", "se perdería en la selva", "tendría buena suerte"], "correct": 1, "question_en": "According to the text, what would whoever thought of the chosen animals do?", "question_fa": "بر اساس متن، هر کس به آن جانوران برگزیده بیندیشد چه می‌کرد؟", "options_en": ["he would live forever", "remember it at once", "he would get lost in the jungle", "he would have good luck"], "options_fa": ["برای همیشه زنده می‌ماند", "بی‌درنگ آن سرزمین را به یاد آورد", "در جنگل گم می‌شد", "خوش‌اقبال می‌شد"]}, {"id": 52006, "question": "¿Quiénes fueron los elegidos por Itzamná?", "options": ["el colibrí, el mono y la iguana", "el águila, el jaguar y la tortuga", "el quetzal, el tapir y el cocodrilo", "el faisán, el venado y la serpiente de cascabel"], "correct": 3, "question_en": "Who were the ones chosen by Itzamna?", "question_fa": "برگزیدگان ایتزمنه چه کسانی بودند؟", "options_en": ["the hummingbird, the monkey and the iguana", "the eagle, the jaguar and the turtle", "the quetzal, the tapir and the crocodile", "the pheasant, the deer and the rattlesnake"], "options_fa": ["مگس‌خوار، میمون و ایگوانا", "عقاب، جگوار و لاک‌پشت", "کتزال، تاپیر و تمساح", "فازان، گوزن و مار زنگی"]}, {"id": 52007, "question": "Además del venado y la serpiente de cascabel, ¿qué otro animal fue elegido por Itzamná?", "options": ["el águila", "el quetzal", "el faisán", "el colibrí"], "correct": 2, "question_en": "Besides the deer and the rattlesnake, which other animal was chosen by Itzamna?", "question_fa": "جز گوزن و مار زنگی، کدام جانور دیگر را ایتزمنه برگزید؟", "options_en": ["the eagle", "the quetzal", "the pheasant", "the hummingbird"], "options_fa": ["عقاب", "کتزال", "فازان", "مگس‌خوار"]}, {"id": 52008, "question": "Además del faisán y la serpiente de cascabel, ¿qué otro animal fue elegido por Itzamná?", "options": ["el tapir", "el jaguar", "el mono", "el venado"], "correct": 3, "question_en": "Besides the pheasant and the rattlesnake, which other animal was chosen by Itzamna?", "question_fa": "جز فازان و مار زنگی، کدام جانور دیگر piente"], "correct": 0, "question_en": "Which animal ran light as the wind?", "question_fa": "کدام جانور چون باد سبک می‌دوید؟", "options_en": ["The deer", "The jaguar", "The pheasant", "The snake"], "options_fa": ["گوزن", "جگوار", "فازان", "مار"]}, {"id": 52109, "question": "¿Qué movía la serpiente?", "options": ["su piel", "sus cascabeles", "su cola", "su cabeza"], "correct": 1, "question_en": "What did the snake move?", "question_fa": "مار چه چیزی را تکان می‌داد؟", "options_en": ["its skin", "its rattles", "its tail", "its head"], "options_fa": ["پوستش", "زنگولک‌هایش", "دمش", "سرش"]}, {"id": 52110, "question": "¿Para qué movía sus cascabeles la serpiente?", "options": ["para atraer a otros animales", "para producir música a su paso", "para marcar su territorio", "para avisar del peligro"], "correct": 1, "question_en": "Why did the snake move its rattles?", "question_fa": "مار چرا زنگولک‌هایش را تکان می‌داد؟", "options_en": ["to attract other animals", "to produce music as it passed", "to mark its territory", "to warn of danger"], "options_fa": ["تا جانوران دیگر را جلب کند", "تا بر سر راهش موسیقی بسازد", "تا قلمرو خود را مشخص کند", "تا خطر را هشدار دهد"]}, {"id": 52111, "question": "¿Qué animal producía música a su paso?", "options": ["el pájaro", "el faisán", "el venado", "la serpiente"], "correct": 3, "question_en": "Which animal produced music as it passed?", "question_fa": "کدام جانور بر سر راهش موسیقی می‌ساخت؟", "options_en": ["the bird", "the pheasant", "the deer", "the snake"], "options_fa": ["پرنده", "فازان", "گوزن", "مار"]}, {"id": 52112, "question": "¿Qué producía la serpiente al mover sus cascabeles?", "options": ["ecos", "música", "cantos", "miedo"], "correct": 1, "question_en": "What did the snake produce by moving its rattles?", "question_fa": "مار با تکان دادن زنگولک‌هایش چه چیزی می‌ساخت؟", "options_en": ["echoes", "music", "songs", "fear"], "options_fa": ["پژواک‌ها", "موسیقی", "سرودها", "هراس"]}, {"id": 52113, "question": "¿Qué hacía el venado según el texto?", "options": ["nadaba", "corría", "saltaba", "volaba"], "correct": 1, "question_en": "What did the deer do according to the text?", "question_fa": "بر اساس متن، گوزن چه می‌کرد؟", "options_en": ["swam", "ran", "jumped", "flew"], "options_fa": ["شنا می‌کرد", "می‌دوید", "می‌پرید", "پرواز می‌کرد"]}]}, {"id": 22, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 4, "title": "Párrafo 4 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Así era la vida en El Mayab, hasta que un día, los chilam, o sea los adivinos mayas, vieron en el futuro algo que les causó gran tristeza. Entonces, llamaron a todos los habitantes, para anunciar lo siguiente: —Tenemos que dar noticias que les causarán mucha pena. Pronto nos invadirán hombres venidos de muy lejos; traerán armas y pelearán contra nosotros para quitarnos nuestra tierra. Tal vez no podamos defender El Mayab y lo perderemos.", "text_en": "That was life in El Mayab, until one day the chilam, that is, the mayan diviners, saw in the future something that caused them great sadness. Then they called all the inhabitants to announce the following: We have to give news that will cause you much sorrow. Soon men from very far away will invade us; they will bring weapons and fight against us to take our land from us. Perhaps we will not be able to defend El Mayab and we will lose it.", "text_fa": "چنین بود زندگی در المایاب، تا آنکه روزی، چیلام، یعنی پیشگویان مایا، در آینده چیزی دیدند که اندوه بزرگی برایشان آورد. آنگاه همهٔ اهالی را خواندند تا چنین اعلام کنند: باید خبرهایی بدهیم که اندوهی بسیار بر شما خواهد آورد. به‌زودی مردمانی از جای بسیار دور به ما حمله خواهند کرد؛ سلاح خواهند آورد و با ما خواهند جنگید تا سرزمینمان را از ما بگیرند. شاید نتوانیم از المایاب دفاع کنیم و آن را از دست بدهیم.", "questions": [{"id": 52200, "question": "¿Quiénes eran los chilam?", "options": ["los guerreros mayas", "los curanderos del pueblo", "los adivinos mayas", "los sacerdotes aztecas"], "correct": 2, "question_en": "Who were the chilam?", "question_fa": "چیلام چه کسانی بودند؟", "options_en": ["the mayan warriors", "the healers of the town", "the mayan diviners", "the aztec priests"], "options_fa": ["جنگجویان مایا", "طبیبان روستا", "پیشگویان مایا", "کاهنان آزتک"]}, {"id": 52201, "question": "¿Qué vieron los chilam en el futuro?", "options": ["algo que les causó gran alegría", "algo que les causó gran tristeza", "la llegada de los dioses", "una época de paz y riqueza"], "correct": 1, "question_en": "What did the chilam see in the future?", "question_fa": "چیلام در آینده چه چیزی دیدند؟", "options_en": ["something that caused them great joy", "something that caused them great sadness", "the arrival of the gods", "an era of peace and wealth"], "options_fa": ["چیزی دیدند که شادی بزرگی برایشان آورد", "چیزی دیدند که اندوه بزرگی برایشان آورد", "آمدن خدایان", "دوره‌ای از صلح و رفاه"]}, {"id": 52202, "question": "¿Dónde vieron los chilam lo que les causó gran tristeza?", "options": ["en las cavernas", "en el futuro", "en los cenotes", "en las estrellas"], "correct": 1, "question_en": "Where did the chilam see what caused them great sadness?", "question_fa": "چیلام آن چیزی که اندوه بزرگی برایشان آورد کجا دیدند؟", "options_en": ["in the caverns", "in the future", "in the cenotes", "in the stars"], "options_fa": ["در غارها", "در آینده", "در سنوته‌ها", "در ستاره‌ها"]}, {"id": 52203, "question": "¿Qué les causó a los chilam lo que vieron?", "options": ["gran alegría", "gran enojo", "gran tristeza", "gran miedo"], "correct": 2, "question_en": "What did what they see cause the chilam?", "question_fa": "آنچه دیدند چه چیزی در چیلام پدید آورد؟", "options_en": ["great joy", "great anger", "great sadness", "great fear"], "options_fa": ["شادی بزرگی", "خشم بزرگی", "اندوه بزرگی", "هراس بزرگی"]}, {"id": 52204, "question": "¿A quiénes llamaron los chilam?", "options": ["a todos los habitantes", "a los animales elegidos", "a los sacerdotes de los  "the words of the gods", "the words of the mayas", "the words of Itzamna"], "options_fa": ["سخنان چیلام", "سخنان خدایان", "سخنان مایاها", "سخنان ایتزمنه"]}, {"id": 52301, "question": "¿Quién huyó a la selva al oír las palabras de los chilam?", "options": ["el jaguar", "el faisán", "el venado", "la serpiente"], "correct": 1, "question_en": "Who fled to the jungle when he heard the words of the chilam?", "question_fa": "چه کسی هنگام شنیدن سخنان چیلام به جنگل گریخت؟", "options_en": ["the jaguar", "the pheasant", "the deer", "the snake"], "options_fa": ["جگوار", "فازان", "گوزن", "مار"]}, {"id": 52302, "question": "¿A dónde huyó el faisán?", "options": ["a la selva", "a las cavernas", "a los cenotes", "a las montañas"], "correct": 0, "question_en": "Where did the pheasant flee to?", "question_fa": "فازان به کجا گریخت؟", "options_en": ["to the jungle", "to the caverns", "to the cenotes", "to the mountains"], "options_fa": ["به جنگل", "به غارها", "به سنوته‌ها", "به سوی کوه‌ها"]}, {"id": 52303, "question": "¿Dónde se escondió el faisán?", "options": ["entre las rocas", "entre los árboles", "entre las flores", "entre las yerbas"], "correct": 3, "question_en": "Where did the pheasant hide?", "question_fa": "فازان کجا پنهان شد؟", "options_en": ["among the rocks", "among the trees", "among the flowers", "among the grasses"], "options_fa": ["میان سنگ‌ها", "میان درختان", "میان گل‌ها", "میان علف‌ها"]}, {"id": 52304, "question": "¿Cuándo huyó el faisán a la selva?", "options": ["con mucha calma", "al caer la noche", "después de unos días", "de inmediato"], "correct": 3, "question_en": "When did the pheasant flee to the jungle?", "question_fa": "فازان چه زمانی به جنگل گریخت؟", "options_en": ["with much calm", "at nightfall", "after a few days", "at once"], "options_fa": ["با آرامش بسیار", "هنگام فرود شب", "پس از چند روز", "بی‌درنگ"]}, {"id": 52305, "question": "¿Para qué prefirió dejar de volar el faisán?", "options": ["para vivir tranquilo en la selva", "para cuidar a los demás an رفت موسیقی‌اش را فراموش کند و با دشمنان بجنگد؛ پس صدایی تازه آفرید که با تکان دادن دمش پدید می‌آید و اکنون پیش از حمله از آن بهره می‌گیرد.", "questions": [{"id": 52400, "question": "¿Qué supo el venado que le causó gran tristeza?", "options": ["que llegarían los dioses", "que perdería su tierra", "que morirían los animales", "que se secarían los ríos"], "correct": 1, "question_en": "What did the deer learn that caused it great sadness?", "question_fa": "گوزن چه چیزی فهمید که اندوه بزرگی بر آن آورد؟", "options_en": ["that the gods would arrive", "that it would lose its land", "that the animals would die", "that the rivers would dry up"], "options_fa": ["که خدایان خواهند رسید", "سرزمینش را از دست خواهد داد", "که جانوران خواهند مرد", "که رودها خشک خواهند شد"]}, {"id": 52401, "question": "¿Quién supo que perdería su tierra?", "options": ["el venado", "el faisán", "el jaguar", "la serpiente"], "correct": 0, "question_en": "Who learned that it would lose its land?", "question_fa": "چه کسی فهمید که سرزمینش را از دست خواهد داد؟", "options_en": ["the deer", "the pheasant", "the jaguar", "the snake"], "options_fa": ["گوزن", "فازان", "جگوار", "مار"]}, {"id": 52402, "question": "¿Qué sintió el venado al saber que perdería su tierra?", "options": ["una gran sorpresa", "un gran enojo", "un gran miedo", "una gran tristeza"], "correct": 3, "question_en": "What did the deer feel when it learned that it would lose its land?", "question_fa": "گوزن هنگام فهمیدن اینکه سرزمینش را از دست می‌دهد چه احساسی کرد؟", "options_en": ["great surprise", "great anger", "great fear", "great sadness"], "options_fa": ["تعجب بزرگ", "خشم بزرگ", "هراس بزرگ", "اندوه بزرگی"]}, {"id": 52403, "question": "¿Qué hizo el venado con tanta fuerza por su tristeza?", "options": ["gritó", "lloró", "cantó", "huyó"], "correct": 1, "question_en": "What did the deer do with all its strength because of its sadness?", "question_fa": "گوزن به‌خاطر اندوهش با تمام قوا چه کرد؟", "options_en": ["shouted", "cried", "sang", "fled errero de las ciudades", "un antiguo cacique maya", "un famoso adivino maya"], "correct": 3, "question_en": "Who announced the important mission of the three animals?", "question_fa": "چه کسی رسالت مهم آن سه جانور را اعلام کرد؟", "options_en": ["a priest of the temples", "a warrior of the cities", "an ancient mayan chief", "a famous mayan diviner"], "options_fa": ["کاهن معبد‌ها", "جنگجوی شهرها", "رئیس کهن مایا", "پیشگوی نامی مایا"]}, {"id": 52505, "question": "¿Qué anunció el famoso adivino maya?", "options": ["que los animales desaparecerían para siempre", "que los dioses volverían a crear la tierra", "que los extranjeros se irían pronto", "que los tres animales elegidos por Itzamná cumplirán una importante misión en su tierra"], "correct": 3, "question_en": "What did the famous mayan diviner announce?", "question_fa": "آن پیشگوی نامی مایا چه اعلام کرد؟", "options_en": ["that the animals would disappear forever", "that the gods would create the land again", "that the foreigners would leave soon", "that the three animals chosen by Itzamna will fulfill an important mission in their land"], "options_fa": ["که جانوران برای همیشه ناپدید خواهند شد", "که خدایان دوباره سرزمین را می‌آفرینند", "که بیگانگان به‌زودی خواهند رفت", "که آن سه جانورِ برگزیدۀ ایتزمنه رسالتی مهم در سرزمینشان انجام خواهند داد"]}, {"id": 52506, "question": "¿Quiénes cumplirán una importante misión según el adivino maya?", "options": ["los dioses de las cavernas", "los chilam de El Mayab", "los tres animales elegidos por Itzamná", "los mayas de las ciudades"], "correct": 2, "question_en": "Who will fulfill an important mission, according to the mayan diviner?", "question_fa": "بر اساس گفتۀ پیشگوی مایا، چه کسانی رسالتی مهم انجام خواهند داد؟", "options_en": ["the gods of the caverns", "the chilam of El Mayab", "the three animals chosen by Itzamna", "the mayas of the cities"], "options_fa": ["خدایان غارها", "چیلام‌های المایاب", "آن سه جانورِ برگزیدۀ ایتزمنه", "مایاهای شهرها"]}, {"id": 52507, "question": "¿ id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 8, "title": "Párrafo 8 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "—Mientras las ceibas estén en pie y las cavernas de El Mayab sigan abiertas, habrá esperanza. Llegará el día en que recobraremos nuestra tierra, entonces los mayas deberán reunirse y combatir. Sabrán que la fecha ha llegado cuando reciban tres señales. La primera será del faisán, quien volará sobre los árboles más altos y su sombra podrá verse en todo El Mayab. La segunda señal la traerá el venado, pues atravesará esta tierra de un solo salto. La tercera mensajera será la serpiente de cascabel, que producirá música de nuevo y ésta se oirá por todas partes. Con estas tres señales, los animales avisarán a los mayas que es tiempo de recuperar la tierra que les quitaron.", "text_en": "As long as the ceibas stand and the caverns of El Mayab remain open, there will be hope. The day will come when we recover our land, and then the mayas must gather and fight. They will know that the date has arrived when they receive three signs. The first will be of the pheasant, which will fly over the highest trees and its shadow will be seen in all of El Mayab. The second sign will be brought by the deer, for it will cross this land in a single jump. The third messenger will be the rattlesnake, which will produce music again and it will be heard everywhere. With these three signs, the animals will warn the mayas that it is time to recover the land that was taken from them.", "text_fa": "تا زمانی که درختان سبا استوار بایستند و غارهای المایاب باز بمانند، امید خواهد بود. آن روز خواهد رسید که سرزمین خود را پس خواهیم گرفت، آنگاه مایاها باید گرد هم آیند و بجنگند. آنان خواهند دانست که روزگار رسیده است، هنگامی که سه نشانه دریافت کنند. نشانهٔ نخست از فازان خواهد بود که بر بلندترین درختان پرواز می‌کند و سایه‌اش در سراسر المایاب دیده خواهد شد. نشانهٔ دوم را گوزن می‌آورد، زیرا این سرزمین را با یک پرش از آن سو می‌گذراند. سومین پیام‌آور مار زنگی خواهد بود که دوباره موسیقی خواهد ساخت و آن از هر سو شنیده خواهد شد. با این سه نشانه، جانوران به مایاها خبر خواهند داد که وقت آن رسیده است سرزمینی را که از آنان گرفتند پس بگیرند.", "questions": [{"id": 52600, "question": "¿Qué árboles deben seguir en pie para que haya esperanza?", "options": ["los encinos", "las ceibas", "las palmas", "los cedros"], "correct": 1, "question_en": "Which trees must remain standing so that there is hope?", "question_fa": "کدام درختان باید استوار بایستند تا امید باشد؟", "options_en": ["the oaks", "the ceibas", "the palms", "the cedars"], "options_fa": ["بلوط‌ها", "درختان سبا", "نخل‌ها", "درختان سدر"]}, {"id": 52601, "question": "¿Qué debe pasar con las ceibas para que haya esperanza?", "options": ["estén en pie", "den buenos frutos", "crezcan muy altas", "florezcan cada año"], "correct": 0, "question_en": "What must happen with the ceibas so that there is hope?", "question_fa": "با درختان سبا چه باید بشود تا امید باشد؟", "options_en": ["stand", "give good fruit", "grow very tall", "bloom every year"], "options_fa": ["استوار بایستند", "میوهٔ نیکو دهند", "بسیار بلند شوند", "هر سال شکوفا شوند"]}, {"id": 52602, "question": "Además de las ceibas, ¿qué debe seguir abierto en El Mayab?", "options": ["los cenotes", "las cavernas", "los templos", "los caminos"], "correct": 1, "question_en": "Besides the ceibas, what must remain open in El Mayab?", "question_fa": "جز درختان سبا، چه چیزی باید در المایاب باز بماند؟", "options_en": ["the cenotes", "the caverns", "the temples", "the paths"], "options_fa": ["سنوته‌ها", "غارها", "معبد‌ها", "راه‌ها"]}, {"id": 52603, "question": "¿Qué deberá seguir abierto según las palabras del anuncio?", "options": ["los templos de los mayas", "los caminos de la selva", "las cavernas de El Mayab", "los cenotes del Mayab"], "correct": 2, "question_en": "What must remain open, according to the words of the announcement?", "question_fa": "بر اساس سخنان آن اعلام، چه چیزی باید ب e year", "forever"], "options_fa": ["تا جنگ", "برای چند ماه", "برای یک سال", "برای همیشه"]}]}, {"id": 28, "passage_id": 5, "passage": "Los volcanes", "paragraph": 2, "title": "Párrafo 2 · Los volcanes", "topic": "Leyendas y geografía", "text": "Daría la mano de su hija a aquel joven guerrero a cambio de que luchara en favor de su guerra; él decidió aceptar, pues lo prometido era regresar victoriosos y obtener el amor de aquella joven. Fue una guerra prolongada y no se veía la llegada del guerrero, la joven comenzó a angustiarse y a sufrir por amor.", "text_en": "He would give the hand of his daughter to that young warrior in exchange for fighting in favor of his war; he decided to accept, for what was promised was to return victorious and to win the love of that young woman. It was a prolonged war and the arrival of the warrior was not seen, and the young woman began to be anxious and to suffer for love.", "text_fa": "پدر گفت دستِ دخترش را به آن جوان جنگجو خواهم داد، در ازای آنکه در راه جنگ او بجنگد؛ او تصمیم کرد بپذیرد، زیرا آنچه وعده شده بود پیروز بازگشتن و به دست آوردن عشق آن دختر بود. جنگی دراز بود و آمدن جنگجو دیده نمی‌شد، و دختر شروع کرد به دلواپسی و به رنج بردن از عشق.", "questions": [{"id": 52800, "question": "¿Qué daría el padre a aquel joven guerrero?", "options": ["la mano de su hija", "una casa en el valle", "la mitad de sus tierras", "sus mejores armas"], "correct": 0, "question_en": "What would the father give to that young warrior?", "question_fa": "پدر به آن جوان جنگجو چه می‌داد؟", "options_en": ["the hand of his daughter", "a house in the valley", "half of his lands", "his best weapons"], "options_fa": ["دستِ دخترش", "خانه‌ای در دره", "نیمی از زمین‌هایش", "بهترین سلاح‌هایش"]}, {"id": 52801, "question": "¿A cambio de qué daría el padre la mano de su hija?", "options": ["a cambio de oro y plata", "a cambio de tierras fértiles", "a cambio de que luchara en favor de su guerra", "a cambio de un tributo anual"], "correct": 2, "question_en": "In exchange f iving; it was the army of her people drawing near to their homes; in front of the warriors, the young man advanced forcefully with enormous joy that now at last he could be happy beside his beloved.", "text_fa": "خبر به گوش او رسید که جوان جنگجو در نبرد مرده است، و دختر از دردِ جان بیمار شد؛ شب‌های پُرالتهاب را گذراند تا آنکه یک صبح، پدرش غمگین او را یافت فرو رفته در خواب جاودان. صبح روز بعد آفتاب دره را می‌درخشاند و صداهای پیروسی رسید؛ سپاه مردم او به خانه‌هایشان نزدیک می‌شد؛ پیشاپیش جنگجویان، جوان با شادیی بزرگ پیش می‌آمد که اکنون می‌تواند در کنار معشوقش خوشبخت باشد.", "questions": [{"id": 52900, "question": "¿Qué llegó a oídos de la joven?", "options": ["la versión de que el padre había enfermado", "la versión de que la guerra había terminado", "la versión de que el joven guerrero había muerto en batalla", "la versión de que el joven guerrero había sido capturado"], "correct": 2, "question_en": "What reached the ears of the young woman?", "question_fa": "چه چیزی به گوش دختر رسید؟", "options_en": ["that the father had fallen ill", "that the war had ended", "that the young warrior had died in battle", "that the young warrior had been captured"], "options_fa": ["که پدرش بیمار شده است", "که جنگ به پایان رسیده است", "که جوان جنگجو در نبرد مرده است", "که جوان جنگجو اسیر شده است"]}, {"id": 52901, "question": "¿De qué se enfermó la joven?", "options": ["de mal de ojo", "de fiebre alta", "de una herida profunda", "de dolor del alma"], "correct": 3, "question_en": "What did the young woman fall ill with?", "question_fa": "دختر به چه چیزی مبتلا شد؟", "options_en": ["of the evil eye", "of high fever", "of a deep wound", "of pain of the soul"], "options_fa": ["چشم‌زخم", "تب بالا", "زخمی ژرف", "دردِ جان"]}, {"id": 52902, "question": "¿Quién encontró a la joven una mañana?", "options": ["un vecino del pueblo", "su abuela", "un sacerdote del templo", "su padre entristecido"], "correct": 3, "question_en": "Who found the young woman one morning?", "question_fa": "چه کسی یک صبح دخت question": "¿A quién le pidió explicaciones el enamorado?", "options": ["a los sacerdotes", "a los dioses", "a su padre", "al cacique del pueblo"], "correct": 1, "question_en": "To whom did the lover ask for explanations?", "question_fa": "عاشق از چه کسی توضیح خواست؟", "options_en": ["the priests", "the gods", "his father", "the chief of the town"], "options_fa": ["کاهنان", "خدایان", "پدرش", "رئیس روستا"]}, {"id": 53002, "question": "¿Qué gritó el enamorado al cielo?", "options": ["pidiendo explicaciones a los dioses", "pidiendo ayuda a sus soldados", "pidiendo perdón por sus pecados", "pidiendo la lluvia para el valle"], "correct": 0, "question_en": "What did the lover cry out to the sky doing?", "question_fa": "عاشق چه چیزی را به آسمان فریاد زد؟", "options_en": ["asking the gods for explanations", "asking his soldiers for help", "asking forgiveness for his sins", "asking for rain for the valley"], "options_fa": ["از خدایان خواست توضیحی بدهند", "از سربازانش یاری خواستن", "طلب بخشش برای گناهانش", "خواستن باران برای دره"]}, {"id": 53003, "question": "¿Qué tomó el enamorado?", "options": ["la antorcha de su padre", "el cuerpo de su amada", "el escudo del guerrero", "las armas de sus soldados"], "correct": 1, "question_en": "What did the lover take?", "question_fa": "عاشق چه چیزی را برداشت؟", "options_en": ["the torch of his father", "the body of his beloved", "the shield of the warrior", "the weapons of his soldiers"], "options_fa": ["مشعل پدرش", "پیکر معشوقش", "سپر جنگجو", "سلاح سربازانش"]}, {"id": 53004, "question": "¿A dónde subió el enamorado?", "options": ["subió al valle", "subió a la montaña del norte", "subió al templo del pueblo", "subió a la playa"], "correct": 0, "question_en": "Where did the lover climb to?", "question_fa": "عاشق به کجا بالا رفت؟", "options_en": ["climbed the valley", "climbed the northern mountain", "climbed the temple of the town", "climbed to the beach"], "options_fa": ["به سوی دره بالا رفت", "به کوه شمالی بالا رفت", "به معبد روستا بالا رفت", "به ساحل بالا رفت"]}, {"id": 53005, "question": "¿Dónde recostó el enamorado a su amada?", "options": ["en el templo", "en la playa", "en la cima", "en la plaza del pueblo"], "correct": 2, "question_en": "Where did the lover lay his beloved down?", "question_fa": "عاشق معشوقش را کجا خواباند؟", "options_en": ["in the temple", "on the beach", "on the summit", "in the plaza of the town"], "options_fa": ["در معبد", "در ساحل", "بر قله", "در میدان روستا"]}, {"id": 53006, "question": "¿Qué decidió velar el enamorado?", "options": ["su sueño eterno", "su nombre", "su herida", "su tristeza"], "correct": 0, "question_en": "What did the lover decide to keep watch over?", "question_fa": "عاشق تصمیم کرد چه چیزی را بپاید؟", "options_en": ["her eternal sleep", "her name", "her wound", "her sadness"], "options_fa": ["خواب جاودانش", "نامش", "زخمش", "اندوهش"]}, {"id": 53007, "question": "¿Con qué velaba el enamorado el sueño de su amada?", "options": ["con una antorcha encendida", "con una vela blanca", "con un fuego de leña", "con flores de cempasúchil"], "correct": 0, "question_en": "With what did the lover keep watch over the sleep of his beloved?", "question_fa": "عاشق با چه چیزی خواب معشوقش را می‌پایید؟", "options_en": ["with a lit torch", "with a white candle", "with a wood fire", "with cempasuchil flowers"], "options_fa": ["با مشعلی روشن", "با شمعی سفید", "با آتشی از هیزم", "با گل‌های سمپاسوچیل"]}]}, {"id": 31, "passage_id": 5, "passage": "Los volcanes", "paragraph": 5, "title": "Párrafo 5 · Los volcanes", "topic": "Leyendas y geografía", "text": "Los dioses al ver aquel acto de amor, decidieron eternizar a la pareja cubriendo de nieve sus cuerpos y petrificándolos por la eternidad. Y ahí sigue la mujer dormida y a un lado su guerrero enamorado con su antorcha de fuego. Con el paso de los siglos aún podemos observar a esos dos enamorados, en dos grandes montañas conocidas como Iztaccíhuatl y Popocatépetl.", "text_en": "The gods, on seeing that act of love, decided to make the couple eternal by covering their bodies with snow and petrifying them for eternity. And there the sleeping woman remains, and beside her the warrior in love, with his torch of fire. With the passing of the centuries we can still observe those two lovers, in two great mountains known as Iztaccíhuatl and Popocatépetl.", "text_fa": "خدایان هنگام دیدن آن کردارِ عشق، تصمیم کردند زوج را جاودانه سازند؛ پیکرشان را با برف بپوشانند و تا ابد سنگشان کنند. و آنجا زن خوابیده باقی است و در کنارش آن جنگجوی عاشق، با مشعل آتش خود. با گذشت سده‌ها هنوز می‌توانیم آن دو عاشق را در دو کوه بزرگ ببینیم که اینتساکیواتل و پوکاتپتل نامیده می‌شوند.", "questions": [{"id": 53100, "question": "¿Qué decidieron hacer los dioses al ver aquel acto de amor?", "options": ["revivir a la joven", "separar a la pareja", "eternizar a la pareja", "castigar al enamorado"], "correct": 2, "question_en": "What did the gods decide to do when they saw that act of love?", "question_fa": "خدایان هنگام دیدن آن کردارِ عشق چه کردند؟", "options_en": ["bring the young woman back to life", "separate the couple", "make the couple eternal", "punish the lover"], "options_fa": ["دختر را به زندگی بازگردانند", "زوج را از هم جدا کنند", "زوج را جاودانه سازند", "عاشق را کیفر دهند"]}, {"id": 53101, "question": "¿Qué cubrieron de nieve los dioses?", "options": ["sus cuerpos", "el valle entero", "las montañas del norte", "el templo del pueblo"], "correct": 0, "question_en": "What did the gods cover with snow?", "question_fa": "خدایان چه چیزی را با برف پوشاندند؟", "options_en": ["their bodies", "the whole valley", "the mountains of the north", "the temple of the town"], "options_fa": ["پیکرشان", "تمام دره", "کوه‌های شمال", "معبد روستا"]}, {"id": 53102, "question": "¿Cómo quedaron los cuerpos de la pareja?", "options": ["llevados al cielo entre nubes", "enterrados bajo el templo", "convertidos en árboles", "petrificándolos por la eternidad"], "correct": 3, "question_en": "What did the bodies of the couple end up like?", "question پتل «کوه یا تپه»، زیرا از دوران پیش از اسپانیا فعال مانده است. اما شاهزاده‌خانمی که اینتساکیواتل نام دارد، از ناهواتل ایستاک «سفید» و سیواتل «زن»، زیرا به پیکر زن خوابیده‌ای می‌ماند که ردایی سفید بر تن دارد. این دو در مرز شهر مکزیک و پوئبلا جای گرفته‌اند. جفت آتشفشان‌ها از سوای شمال، از راه گردنهٔ کوهستانی که گردنهٔ کورتس نامیده می‌شود به هم پیوسته‌اند.", "questions": [{"id": 53200, "question": "¿Por qué son icónicos el Popocatépetl e Iztaccíhuatl?", "options": ["por los templos que tienen en sus laderas", "por las nieves que los cubren todo el año", "por su altura sobre el nivel del mar", "por su forma que asemeja una pareja de enamorados"], "correct": 3, "question_en": "Why are the Popocatépetl and Iztaccíhuatl iconic?", "question_fa": "چرا پوکاتپتل و اینتساکیواتل نمادین‌اند؟", "options_en": ["for the temples they have on their slopes", "for the snows that cover them all year", "for their height above sea level", "for their shape that resembles a couple of lovers"], "options_fa": ["به سبب معبد‌هایی که بر دامنه‌هایشان دارند", "به سبب برفی که تمام سال می‌پوشانشان", "به سبب ارتفاعشان از سطح دریا", "به سبب شکل خود که به دو عاشق شبیه است"]}, {"id": 53201, "question": "¿Qué asemeja la forma de los volcanes?", "options": ["un grupo de guerreros", "una pareja de enamorados", "una familia de cazadores", "un par de templos"], "correct": 1, "question_en": "What does the shape of the volcanoes resemble?", "question_fa": "شکل آتشفشان‌ها شبیه چه چیزی است؟", "options_en": ["a group of warriors", "a couple of lovers", "a family of hunters", "a pair of temples"], "options_fa": ["گروهی جنگجو", "دو عاشق", "خانواده‌ای شکارچی", "دو معبد"]}, {"id": 53202, "question": "¿Qué significa popo-ca según la nota?", "options": ["‘que cae’", "‘que duerme’", "‘que humea’", "‘que brilla’"], "correct": 2, "question_en": "What does popo-ca mean according to the note?", "question_fa": "بر اساس آن یادداشت پوپو-کا چه معنایی دارد؟", "options_en": ["'that falls'", "'that sleeps'", "'that smokes'", "'that teneciente a la familia de los cupules.", "text_en": "During the empire of the Cupules and the Cocomes, in 1543, the mayan city of Zaci (white hawk) was founded in what is today the city of Valladolid, Yucatán. Inside the city was this cenote, and on its vault was the home of the healer and sorceress of the town. She was the patron of the Cocom family; an old woman powerful and influential. Since always, there had existed in Zaci two families that permanently disputed power. The chief Halach-Huinic (the true man) was the one who governed at that time, and he had a son called Hul-Kin (ray of sun), belonging to the family of the cupules.", "text_fa": "در زمان امپراتوری کوپول‌ها و کوکوم‌ها، در سال 1543، شهر ماییِ زاسی (بازِ سفید) در جایی ساخته شد که امروز شهر وایادولید در یوکاتان است. درون این شهر همین سنوته بود و بر گنبد آن، خانهٔ طبیب و جادوگر روستا قرار داشت. او حامی خاندان کوکوم بود؛ پیرزنی نیرومند و بانفوذ. از همیشه، در زاسی دو خاندان بودند که پیوسته بر سر قدرت با یکدیگر در ستیز بودند. رئیس هالاچ-وینیک (مرد راستین) در آن زمان حکومت می‌کرد و پسری داشت به نام هول-کین (پرتو خورشید) که از خاندان کوپول‌ها بود.", "questions": [{"id": 53500, "question": "¿Durante qué imperio se fundó la ciudad maya de Zací?", "options": ["el imperio de los Itzá", "el imperio de los Tutul Xiú", "el imperio de los Cupules y los Cocomes", "el imperio de los Mexicas"], "correct": 2, "question_en": "During which empire was the mayan city of Zaci founded?", "question_fa": "شهر ماییِ زاسی در زمان کدام امپراتوری بنیاد نهاده شد؟", "options_en": ["the empire of the Itzá", "the empire of the Tutul Xiú", "the empire of the Cupules and the Cocomes", "the empire of the Mexicas"], "options_fa": ["امپراتوری ایتزا", "امپراتوری تولول شیو", "امپراتوری کوپول‌ها و کوکوم‌ها", "امپراتوری مسیکاها"]}, {"id": 53501, "question": "¿En qué año se fundó la ciudad maya de Zací?", "options": ["en 1521", "en 1543", "en 1600", "en 1492"], "correct": 1, "question_en": "In what year was the mayan city of Zaci founded?", "q  that later turned into a passionate love, the feeling of her toward the prince being greater and overwhelming, since Sac-Nicte was innocent and pure. Without the sorceress or the chief knowing, they met in secret, and after a few months she gave her virginity and purity. Even though they kept their love in secret, the chief found out and, enraged, sent his son to a town in the south of the peninsula, whose chief he had already arranged an alliance with: to marry Hul-Kin to the princess of that place.", "text_fa": "در آغاز، هول-کین و ساک-نیکته چنان می‌نمود که از هم متنفرند و پیوسته با هم می‌جنگیدند. با این همه، هنگامی که به جوانی رسیدند، دوستی میان آنان پدید آمد که بعد از آن به عشقی آتشین بدل شد و احساس او نسبت به شاهزاده بزرگ‌تر و مهارگریز بود، زیرا ساک-نیکته پاک و معصوم بود. نه جادوگر می‌دانست و نه رئیس؛ آنان پنهانی یکدیگر را می‌دیدند و پس از چند ماه او باکرگی و پاکی خود را به او بخشید. با وجود آنکه عشقشان را پنهان می‌داشتند، رئیس آگاه شد و، خشمگین، پسرش را به روستایی در جنوب شبه‌جزیره فرستاد که پیش‌تر با رئیس آن پیمان بسته بود: هول-کین را با شاهزادهٔ آن جا همسر کند.", "questions": [{"id": 53700, "question": "¿Cómo parecían al principio Hul-Kin y Sac-Nicte?", "options": ["parecían indiferentes", "parecían amigos desde niños", "parecían enamorados", "parecían odiarse"], "correct": 3, "question_en": "How did Hul-Kin and Sac-Nicte seem at first?", "question_fa": "هول-کین و ساک-نیکته در آغاز چگونه به نظر می‌رسیدند؟", "options_en": ["they seemed indifferent", "they seemed friends since children", "they seemed in love", "seemed to hate each other"], "options_fa": ["چنان می‌نمود که بی‌تفاوت‌اند", "چنان می‌نمود که از کودکی دوست‌اند", "چنان می‌نمود که عاشق‌اند", "چنان می‌نمود که از هم متنفرند"]}, {"id": 53701, "question": "¿Qué surgió entre ellos al llegar a su juventud?", "options": ["una alianza familiar", "una enemistad profunda", "una rivalidad comercial", "una amistad"], "correct": 3, "question_en": "What arose between them when they reached their youth?", "question_fa": "هنگام رسیدن به جوانی چه چیزی میان آنان پدید آمد؟", "options_en": ["a family alliance", "a deep enmity", "a commercial rivalry", "a friendship"], "options_fa": ["پیمان خانوادگی", "دشمنی ژرف", "رقابت بازرگانی", "دوستی"]}, {"id": 53702, "question": "¿En qué se convirtió la amistad entre ellos?", "options": ["un odio eterno", "una alianza política", "una simple costumbre", "un apasionado amor"], "correct": 3, "question_en": "What did the friendship between them turn into?", "question_fa": "آن دوستی میان آنان به چه بدل شد؟", "options_en": ["an eternal hatred", "a political alliance", "a simple custom", "a passionate love"], "options_fa": ["کینتی جاودان", "پیمانی سیاسی", "عادتی ساده", "عشقی آتشین"]}, {"id": 53703, "question": "¿Cuál era el sentimiento más grande y avasallador?", "options": ["el sentimiento de los pueblos hacia el cenote", "el sentimiento del cacique hacia su hijo", "el sentimiento de él hacia la hechicera", "el sentimiento de ella hacia al príncipe"], "correct": 3, "question_en": "Which was the greater and overwhelming feeling?", "question_fa": "کدام احساس بزرگ‌تر و مهارگریز بود؟", "options_en": ["the feeling of the towns toward the cenote", "the feeling of the chief toward his son", "the feeling of him toward the sorceress", "the feeling of her toward the prince"], "options_fa": ["احساس روستاها نسبت به سنوته", "احساس رئیس نسبت به پسرش", "احساس او نسبت به جادوگر", "احساس او نسبت به شاهزاده"]}, {"id": 53704, "question": "¿Cómo era Sac-Nicte?", "options": ["fría y calculadora", "inocente y pura", "orgullosa y altiva", "cruel y ambiciosa"], "correct": 1, "question_en": "What was Sac-Nicte like?", "question_fa": "ساک-نیکته چگونه بود؟", "options_en": ["cold and calculating", "innocent and pure", "proud and haughty", "cruel and ambitious"], "options_fa": ["سرد و محاسبه‌گر", "پاک و معصوم", "سربلند و متکبر", "ستمگر و طمع‌کار"]}, {"id": 53705, "question": "¿Quiénes no sabían que se veían?", "options": ["los vecinos del pueblo", "los sacerdotes del templo", "l d the chief react when he found out?", "question_fa": "رئیس هنگام آگاه شدن چگونه واکنش نشان داد؟", "options_en": ["enraged", "content", "indifferent", "moved"], "options_fa": ["خشمگین", "خشنود", "بی‌تفاوت", "عاطفی"]}, {"id": 53710, "question": "¿A dónde envió el cacique a su hijo?", "options": ["a la ciudad de Mérida", "a una isla cercana", "al centro de la selva", "a un pueblo del sur de la península"], "correct": 3, "question_en": "Where did the chief send his son?", "question_fa": "رئیس پسرش را به کجا فرستاد؟", "options_en": ["to the city of Mérida", "to a nearby island", "to the center of the jungle", "to a town in the south of the peninsula"], "options_fa": ["به شهر مریدا", "به جزیره‌ای نزدیک", "به میان جنگل", "به روستایی در جنوب شبه‌جزیره"]}, {"id": 53711, "question": "¿Con quién quería casar el cacique a Hul-Kin?", "options": ["la princesa de aquel lugar", "una joven de la familia Cocom", "la nieta de la hechicera", "la hija del sacerdote mayor"], "correct": 0, "question_en": "Whom did the chief want to marry Hul-Kin to?", "question_fa": "رئیس می‌خواست هول-کین را با چه کسی همسر کند؟", "options_en": ["the princess of that place", "a young woman of the Cocom family", "the granddaughter of the sorceress", "the daughter of the high priest"], "options_fa": ["شاهزادهٔ آن جا", "دختری از خاندان کوکوم", "نوهٔ جادوگر", "دختر کاهن بزرگ"]}, {"id": 53712, "question": "¿Qué había tratado el cacique con el cacique del sur?", "options": ["una guerra", "una alianza", "un tributo anual", "un intercambio de tierras"], "correct": 1, "question_en": "What had the chief arranged with the chief of the south?", "question_fa": "رئیس با رئیس جنوب چه چیزی بسته بود؟", "options_en": ["a war", "an alliance", "an annual tribute", "an exchange of lands"], "options_fa": ["جنگ", "پیمان", "باجی سالانه", "دادوستد زمین"]}, {"id": 53713, "question": "¿Cuánto tiempo después se veían a escondidas?", "options": ["al cabo de algunos años", "al cabo de unos meses", "en la misma semana", "al cabo de unos días"], "correct": 1, "question_en": "How long later did they start meeting in secret?", "question_fa": "چه مدتی بعد آنان پنهانی یکدیگر را دیدند؟", "options_en": ["after some years", "after a few months", "in the same week", "after a few days"], "options_fa": ["پس از چند سال", "پس از چند ماه", "همان هفته", "پس از چند روز"]}]}, {"id": 38, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 6, "title": "Párrafo 6 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Desde su separación, la alegría escapó del alma de Sac-Nicte. Sus ojos perdieron el brillo de la ilusión y entre llantos le contó a su amada abuela el secreto. Estaba embarazada y no quería vivir más. La abuela, afligida y preocupada, le prometió que con la ayuda de los dioses y sus hechizos le traería de vuelta a Hul-Kin.", "text_en": "Since their separation, joy escaped from the soul of Sac-Nicte. Her eyes lost the shine of hope and, amid weeping, she told her beloved grandmother the secret. She was pregnant and did not want to live any longer. The grandmother, afflicted and worried, promised her that with the help of the gods and her spells she would bring Hul-Kin back.", "text_fa": "از جدایی‌شان، شادی از جان ساک-نیکته گریخت. چشمانش درخشش آرزو را از دست داد و در میان گریه‌ها راز را به مادربزرگ مهربانش گفت. او باردار بود و دیگر نمی‌خواست زنده بماند. مادربزرگ، اندوهگین و نگران، به او وعده داد که با یاری خدایان و جادوهایش هول-کین را بازمی‌گرداند.", "questions": [{"id": 53800, "question": "¿Qué escapó del alma de Sac-Nicte desde su separación?", "options": ["el miedo", "la esperanza", "la fe", "la alegría"], "correct": 3, "question_en": "What escaped from the soul of Sac-Nicte since their separation?", "question_fa": "از جدایی‌شان چه چیزی از جان ساک-نیکته گریخت؟", "options_en": ["fear", "hope", "faith", "joy"], "options_fa": ["ترس", "امید", "ایمان", "شادی"]}, {"id": 53801, "question": "¿Qué perdieron los ojos de Sac-Nicte?", "options": ["la vista", "las lágrimas", "el brillo de la ilusión", "el color de la vida"], "correct": 2, "question_en": "What did the eyes of Sac-Nicte lose?", "question_fa": "چشمان ساک-نیکته چه چیزی را از دست داد؟", "options_en": ["sight", "tears", "the shine of hope", "the color of life"], "options_fa": ["بینایی", "اشک‌ها", "درخشش آرزو", "رنگ زندگی"]}, {"id": 53802, "question": "¿A quién le contó Sac-Nicte el secreto?", "options": ["a su amada abuela", "a la familia Cocom", "al cacique", "a su madre"], "correct": 0, "question_en": "To whom did Sac-Nicte tell the secret?", "question_fa": "ساک-نیکته راز را به چه کسی گفت؟", "options_en": ["her beloved grandmother", "the Cocom family", "the chief", "her mother"], "options_fa": ["مادربزرگ مهربانش", "خاندان کوکوم", "رئیس", "مادرش"]}, {"id": 53803, "question": "¿Cómo le contó Sac-Nicte el secreto a su abuela?", "options": ["en silencio", "con alegría", "entre llantos", "con enojo"], "correct": 2, "question_en": "How did Sac-Nicte tell her grandmother the secret?", "question_fa": "ساک-نیکته راز را چگونه به مادربزرگش گفت؟", "options_en": ["in silence", "with joy", "amid weeping", "with anger"], "options_fa": ["در خاموشی", "با شادی", "در میان گریه‌ها", "با خشم"]}, {"id": 53804, "question": "¿Qué estaba Sac-Nicte?", "options": ["dormida", "embarazada", "herida", "enferma"], "correct": 1, "question_en": "What was Sac-Nicte?", "question_fa": "ساک-نیکته چه بود؟", "options_en": ["asleep", "pregnant", "wounded", "sick"], "options_fa": ["خواب", "باردار", "زخمی", "بیمار"]}, {"id": 53805, "question": "¿Qué no quería Sac-Nicte?", "options": ["salir del pueblo", "vivir más", "ver a su abuela", "casarse con otro"], "correct": 1, "question_en": "What did Sac-Nicte not want?", "question_fa": "ساک-نیکته چه چیزی را نمی‌خواست؟", "options_en": ["to leave the town", "to live any longer", "to see her grandmother", "to marry another"], "options_fa": ["روستا را ترک کند", "زنده بماند", "مادربزرگش را ببیند", "با دیگری ازدواج کند"]}, {"id": 53806, "question": "¿Cómo estaba la abuela al escuchar el secreto?", "options": ["furiosa y violenta", "alegre y tranquila", "indiferente", "afligida y preocupada"], "correct": 3, "question_en": "How was the grandmother when she heard the secret?", "question_fa": "مادربزرگ هنگام شنیدن راز چگونه بود؟", "options_en": ["furious and violent", "joyful and calm", "indifferent", "afflicted and worried"], "options_fa": ["خشمگین و پرخاشگر", "شاد و آرام", "بی‌تفاوت", "اندوهگین و نگران"]}, {"id": 53807, "question": "¿Qué le prometió la abuela a Sac-Nicte?", "options": ["le devolvería su alegría", "le traería de vuelta a Hul-Kin", "la llevaría lejos del pueblo", "le daría una casa nueva"], "correct": 1, "question_en": "What did the grandmother promise Sac-Nicte?", "question_fa": "مادربزرگ به ساک-نیکته چه وعده داد؟", "options_en": ["she would give back her joy", "she would bring Hul-Kin back", "she would take her far from the town", "she would give her a new house"], "options_fa": ["شادی‌اش را بازمی‌گرداند", "هول-کین را بازمی‌گرداند", "او را از روستا دور می‌کرد", "خانه‌ای تازه به او می‌داد"]}, {"id": 53808, "question": "¿Con la ayuda de quiénes traería la abuela a Hul-Kin?", "options": ["la ayuda de los sacerdotes", "la ayuda de los dioses y sus hechizos", "la ayuda de los guerreros", "la ayuda del cacique"], "correct": 1, "question_en": "With the help of whom would the grandmother bring Hul-Kin back?", "question_fa": "مادربزرگ با یاری چه کسی هول-کین را بازمی‌گرداند؟", "options_en": ["the help of the priests", "the help of the gods and her spells", "the help of the warriors", "the help of the chief"], "options_fa": ["با یاری کاهنان", "با یاری خدایان و جادوهایش", "با یاری جنگجویان", "با یاری رئیس"]}, {"id": 53809, "question": "¿Desde cuándo escapó la alegría del alma de Sac-Nicte?", "options": ["Desde el nacimiento de su hijo", "Desde su separación", "Desde la muerte de su madre", "Desde la boda de su amado"], "correct": 1, "question_en": "Since when did joy escape from the soul of Sac-Nicte?", "question_fa": "از چه زمانی شادی از جان ساک-نیکته گریخت؟", "options_en": ["Since the birth of her son", "Since their separation", "Since the death of her mother", "Since the wedding of her beloved"], "options_fa": ["از زادن پسرش", "از جدایی‌شان", "از مرگ مادرش", "از عروسی معشوقش"]}]}, {"id": 39, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 7, "title": "Párrafo 7 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Un día, Sac-Nicte se enteró de que Hul-Kin se casaba. Tomó entonces una terrible decisión y la noche antes de la boda amarró una piedra a su larga cabellera y se arrojó a las aguas del cenote. En ese preciso momento, Hul-Kin sufrió un fuerte dolor en el pecho y tuvo un atroz presentimiento que lo obligó a regresar a Zací esa misma noche para averiguar qué había ocurrido. Al llegar, encontró a la hechicera llorando y maldiciendo enloquecida. Al enterarse de todo, Hul-Kin se arrojó al cenote para morir con su verdadero amor: Sac-Nicte. La hechicera se acercó al borde de la bóveda y, tirando una flor blanca, gritó sollozando: “Sac-Nicte, ¡te he cumplido! Te he traído a Hul-Kin, y ¡estará contigo para siempre!”. Finalmente, en un arranque de ira, la hechicera puso una maldición en el cenote: cada año, cuando el manto verde del agua se tornara oscuro, el cenote cobraría una vida en sacrificio por ese gran amor prohibido.", "text_en": "One day, Sac-Nicte learned that Hul-Kin was getting married. Then she took a terrible decision and, the night before the wedding, she tied a stone to her long hair and threw herself into the waters of the cenote. At that precise moment, Hul-Kin suffered a strong pain in the chest and had a dreadful presentiment that forced him to return to Zaci that same night to find out what had happened. On arriving, he found the sorceress weeping and cursing in a frenzy. On learning everything, Hul-Kin threw himself into the cenote to die with his true love: Sac-Nicte. The sorceress came close to the edge of the vault and, throwing a white flower, she cried out sobbing: Sac-Nicte, I have kept my word to you! I have brought you Hul-Kin, and he will be with you forever! Finally, in a fit of rage, the sorceress put a curse on the cenote: every year, when the green mantle of the water turns dark, the cenote would take a life as sacrifice for that great forbidden love.", "text_fa": "روزی، ساک-نیکته فهمید که هول-کین عروسی می‌کند. آنگاه او تصمیمی وحشتناک گرفت و شب پیش از عروسی، سنگی به موهای بلندش بست و خود را به آب‌های سنوته افکند. در همان لحظهٔ دقیق، هول-کین درد شدیدی در سینه احساس کرد و پیش‌گویی هولناکی او را واداشت همان شب به زاسی بازگردد تا بفهمد چه رخ داده است. هنگام رسیدن، جادوگر را یافت که می‌گریست و از سر دیوانگی نفرین می‌فرستاد. هنگامی که از همه‌چیز آگاه شد، هول-کین خود را به سنوته افکند تا با عشق راستینش بمیرد: ساک-نیکته. جادوگر به لبهٔ گنبد نزدیک شد و، با انداختن گلی سفید، با هق‌هق فریاد زد: «ساک-نیکته، من به عهدم عمل کردم! هول-کین را برایت آوردم و او برای همیشه با تو خواهد بود!». در پایان، جادوگر در شعلهٔ خشم، نفرینی بر سنوته نهاد: هر سال، هنگامی که ردای سبز آب تیره شود، سنوته جانی را در قربان آن عشق بزرگ ممنوع خواهد ستاند.", "questions": [{"id": 53900, "question": "¿Qué se enteró Sac-Nicte un día?", "options": ["de que Hul-Kin había muerto", "de que Hul-Kin se casaba", "de que el cacique había muerto", "de que su abuela estaba enferma"], "correct": 1, "question_en": "What did Sac-Nicte learn one day?", "question_fa": "ساک-نیکته روزی چه چیزی فهمید؟", "options_en": ["that Hul-Kin had died", "that Hul-Kin was getting married", "that the chief had died", "that her grandmother was sick"], "options_fa": ["که هول-کین مرده است", "که هول-کین عروسی می‌کند", "که رئیس مرده است", "که مادربزرگش بیمار است"]}, {"id": 53901, "question": "¿Qué decisión tomó Sac-Nicte?", "options": ["una decisión sensata", "una decisión de casarse", "una decisión de huir", "una terrible decisión"], "correct": 3, "question_en": "What decision did Sac-Nicte take?", "question_fa": "ساک-نیکته چه تصمیمی گرفت؟", "options var DATA_VERSION_CHANGED = DB.dataVersion !== APP_VERSION;

function key(){ return "nmx_db_" + (phone||"").trim(); }
function loadDB(){
  try {
    var db = JSON.parse(localStorage.getItem(key()) || "{}") || {};
    if(!db.flashcards || typeof db.flashcards !== "object") db.flashcards={};
    if(!db.simSeen || typeof db.simSeen !== "object") db.simSeen={};
    if(!db.bankAdded || typeof db.bankAdded !== "object") db.bankAdded={};
    if(!db.correctDays || typeof db.correctDays !== "object") db.correctDays={};
    if(!Array.isArray(db.attempts)) db.attempts=[];
    if(!db.daily || typeof db.daily !== "object") db.daily={};
    if(!db.lecParas || typeof db.lecParas !== "object") db.lecParas={};
    if(!db.lecQ || typeof db.lecQ !== "object") db.lecQ={};
    return db;
  }
  catch(e){ return {flashcards:{},simSeen:{},bankAdded:{},correctDays:{},attempts:[],daily:{},lecParas:{},lecQ:{}}; }

// Error del último guardado ("" si todo salió bien). Se muestra en Flashcards:

// contador sin cambios.
function saveDB(){
  try {
    localStorage.setItem(key(), JSON.stringify(DB));
    DB_SAVE_ERROR = "";

    DB_SAVE_ERROR = String(e && e.message || e);
    if(typeof console !== "undefined") console.error("No se pudo guardar el progreso", e);

}

function user(){ return DB.user || {id:1,name:"",practiceSession:0,totalCorrect:0,totalAnswered:0,masteredCount:0,simuladorApproved:false,lecturaApproved:false}; }
function isHistoryId(qid){ qid=+qid; for(var i=0;i<HIST.length;i++){ if(HIST[i].id===qid) return true; } return false; }
// Una tarjeta es válida si la pregunta fue respondida en el simulador
// (DB.simSeen o DB.correctDays) o se añadió a mano desde el banco (DB.bankAdded).
function cardAllowed(qid){
  qid=+qid;
  var seen=DB.simSeen||{}, added=DB.bankAdded||{};
  return !!seen[qid] || !!added[qid] || wasAnswered(qid);
}
// Historial antiguo: antes de DB.simSeen solo quedaba registro de las preguntas
// contestadas correctamente (DB.correctDays). Eso también prueba que la pregunta
// se respondió en el simulador, así que cuenta como "respondida".
function wasAnswered(qid){
  var arr=(DB.correctDays||{})[qid];
  return Array.isArray(arr) && arr.length>0;
}
// Al eliminar preguntas duplicadas del banco (mismo concepto en dos ids), el
// progreso guardado bajo el id viejo se reasigna al id que se conservó; los ids
// que ya no existen en el banco se descartan. Es importante NO purgar por rango
// de id en cada build: purgar a diario reiniciaba el progreso (contador en 0)
// de las preguntas del lote 605+ y hacía que siempre se repitieran las mismas
// 8-10 preguntas sin que el contador avanzara.
function migrateDataVersion(){
  var changed = false;
  ["flashcards","simSeen","bankAdded","correctDays"].forEach(function(mapName){
    var map = DB[mapName];
    if(!map || typeof map !== "object") return;
    for(var k in map){
      var old = +k;
      var target = (FC_REMAP || {})[old];
      if(target){
        if(mapName === "correctDays"){
          var src = Array.isArray(map[k]) ? map[k] : [];
          var dst = Array.isArray(map[target]) ? map[target] : [];
          var seen = {};
          dst.forEach(function(d){ seen[d] = true; });
          src.forEach(function(d){ if(!seen[d]){ dst.push(d); seen[d] = true; } });
          dst.sort(function(a,b){ return a-b; });
          map[target] = dst;
        } else if(mapName === "flashcards" && map[k] && typeof map[k] === "object" && map[target] && typeof map[target] === "object"){
          var a = map[k], b = map[target];
          var last = [b.lastReviewedAt, a.lastReviewedAt].filter(Boolean).sort().pop() || null;
          map[target] = {
            correctCount: Math.max(b.correctCount||0, a.correctCount||0),
            learned: !!(b.learned || a.learned),
            lastReviewedAt: last,
            wrong: false,
          };
        } else {
          map[target] = map[k]; // booleans de simSeen / bankAdded
        }
        delete map[k];
        changed = true;
      } else if(!isHistoryId(old)){
        delete map[k];
        changed = true;
      }
    }
  });
  DB.dataVersion = APP_VERSION;
  saveDB();
  if(changed) saveDB();
}
function migrateFlashcards(){
  var fc=DB.flashcards||{};
  var seen=DB.simSeen||{};
  var added=DB.bankAdded||{};
  var changed=false;
  for(var qid in fc){
    var val=fc[qid];
    if(Array.isArray(val)){
      // Migrate from old format (array of marks) to new format (object)
      var correctCount=val.filter(function(x){return x==="facil";}).length;
      fc[qid]={correctCount:correctCount,learned:correctCount>=5,lastReviewedAt:null};
      changed=true;
      val=fc[qid];
    }
    // Solo preguntas de Historia/Cultura (del simulador o agregadas desde el
    // banco) pertenecen a flashcards. Se elimina lo de otras secciones (lectura).
    if(!isHistoryId(qid)){
      delete fc[qid];
      changed=true;
      continue;
    }
    // ...y solo si viene del simulador o se añadió desde el banco.
    if(wasAnswered(qid) && !seen[qid]){ seen[qid]=true; changed=true; }
    if(!cardAllowed(qid)){
      delete fc[qid];
      delete seen[qid];
      changed=true;
      continue;
    }
    // Una sola vez por versión de datos: si una tarjeta nueva o pendiente quedó
    // bloqueada con fecha por versiones anteriores, desbloquearla para que esté
    // disponible de inmediato. NO debe correr en cada carga: borraba el
    // lastReviewedAt de toda tarjeta con <=1 acierto, así que su historial nunca
    // cambiaba y volvía a salir todos los días aunque se respondiera bien.
    if(DATA_VERSION_CHANGED && val && !val.learned && (val.correctCount||0) <= 1 && val.lastReviewedAt){
      val.lastReviewedAt = null;
      changed = true;
    }
  }
  for(var sid in seen){
    if(!isHistoryId(sid)){ delete seen[sid]; changed=true; }
  }
  for(var aid in added){
    if(!isHistoryId(aid)){ delete added[aid]; changed=true; continue; }
    // Una pregunta añadida desde el banco siempre tiene su tarjeta (disponible para repasar).
    if(!fc[aid]){ fc[aid]={correctCount:0,learned:false,lastReviewedAt:null}; changed=true; }
  }
  DB.simSeen=seen;
  DB.bankAdded=added;
  DB.flashcards=fc;
  // Keep the displayed mastered count in sync after the cleanup.
  var u=user();
  var newCount=learnedIds().length;
  if(u.masteredCount!==newCount){ u.masteredCount=newCount; DB.user=u; changed=true; }
  if(changed){ saveDB(); }
}

function addHistoryFarsiSources(out,q){

  (q.opciones_en||[]).forEach(function(txt,i){addFarsiSource(out,txt,q.opciones_fa&&q.opciones_fa[i]);});
  addFarsiSource(out,q.explicacion_en,q.explicacion_fa);
}
function addReadingFarsiSources(out,q){
  addFarsiSource(out,q.question_en,q.question_fa);
  (q.options_en||[]).forEach(function(txt,i){addFarsiSource(out,txt,q.options_fa&&q.options_fa[i]);});

function currentFarsiWork(){
  var out=[],signature=STATE.tab;
  if(STATE.tab==="sim"&&STATE.view){
    var sv=STATE.view;
    var simqs=sv.phase==="review"?sv.qs:[sv.qs[sv.idx]];
    simqs.forEach(function(q){addHistoryFarsiSources(out,q);});
    signature+="-"+sv.phase+"-"+(sv.phase==="review"?"all":sv.qs[sv.idx].id);
  } else if(STATE.tab==="lec"&&STATE.view){
    var lv=STATE.view;
    addFarsiSource(out,lv.p.text_en,lv.p.text_fa);
    lv.qs.forEach(function(q){addReadingFarsiSources(out,q);});
    signature+="-"+lv.p.id;
  } else if(STATE.tab==="fl"&&STATE.flash){
    addHistoryFarsiSources(out,STATE.flash.q);
    signature+="-"+STATE.flash.q.id+"-"+STATE.flash.revealed;
  } else if(STATE.tab==="ban"){
    var mode=STATE.sel.banmode||"hist";
    var query=(STATE.sel.banq||"").toLowerCase();
    if(mode==="hist"){
      HIST.filter(function(x){if(!query)return true;return (x.pregunta+" "+(x.pregunta_en||"")+" "+(x.subtema||"")).toLowerCase().indexOf(query)>=0;}).slice(0,10).forEach(function(q){addHistoryFarsiSources(out,q);});
    } else if(mode==="lec"){
      // El banco muestra los párrafos con su texto y todas sus preguntas. La
      // traducción al farsi ya viene en los datos (data/reading/traducciones.tsv),
      // así que aquí solo se encolan las frases que falten, y solo entre los
      // párrafos visibles: si no, una traducción pendiente dispararía cientos de
      // peticiones al servicio en línea.
      LEC.filter(function(p){
        if(!query) return true;
        return (p.title+" "+(p.topic||"")+" "+p.text).toLowerCase().indexOf(query)>=0;
      }).slice(0,3).forEach(function(p){
        addFarsiSource(out,p.text_en,p.text_fa);
        p.questions.forEach(function(q){addReadingFarsiSources(out,q);});
      });
    }
    signature+="-"+mode+"-"+query;
  }
  return {sources:out,signature:signature};
}
function splitTranslationText(text){
  if(encodeURIComponent(text).length<=430) return [text];
  var words=text.split(/\s+/),chunks=[],current="";
  words.forEach(function(word){
    var next=current?current+" "+word:word;
    if(current&&encodeURIComponent(next).length>430){chunks.push(current);current=word;}
    else current=next;
  });
  if(current)chunks.push(current);
  return chunks;
}
function decodeTranslationEntities(text){
  var area=document.createElement("textarea"); area.innerHTML=text; return area.value;
}
function requestFarsi(text){
  var url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=en%7Cfa&mt=1";
  return fetch(url,{method:"GET",mode:"cors"}).then(function(response){
    if(!response.ok)throw new Error("Translation HTTP "+response.status);
    return response.json();
  }).then(function(data){
    if(!data.responseData||Number(data.responseStatus)!==200||data.quotaFinished)throw new Error(data.responseDetails||"Translation quota unavailable");
    var text=decodeTranslationEntities(data.responseData.translatedText||"").trim();
    if(!text)throw new Error("Empty translation");
    return text;
  });
}
function translateFarsiSource(source){
  var chunks=splitTranslationText(source);
  return Promise.all(chunks.map(requestFarsi)).then(function(parts){return parts.join(" ");});
}
function ensureFarsiForView(){
  if(TRANSLATION!=="fa"||FA_LOADING||FA_ERROR)return;
  var work=currentFarsiWork();
  if(work.signature===FA_LAST_VIEW)return;
  FA_LAST_VIEW=work.signature;
  if(!work.sources.length)return;
  FA_LOADING=true;
  var button=document.getElementById("fa"); if(button)button.textContent="FA …";
  var cursor=0;
  function worker(){
    var index=cursor++; if(index>=work.sources.length)return Promise.resolve();
    var source=work.sources[index];
    return translateFarsiSource(source).then(function(result){FA_CACHE[source]=result;}).then(worker);
  }
  var workers=[];
  for(var i=0;i<Math.min(4,work.sources.length);i++)workers.push(worker());
  Promise.all(workers).then(function(){
    saveFarsiCache(); FA_LOADING=false; render();
  }).catch(function(error){
    console.error("Farsi translation failed",error); saveFarsiCache(); FA_LOADING=false; FA_ERROR=String(error&&error.message||error); render();
  });
}

function submitSim(force){
  var v=STATE.view; if(!v||v.phase!=="active") return;
  clearInterval(STATE.timer);
  var list=v.qs.map(function(q){return {id:q.id, ans:v.ans[q.id], correct:q.correct};});
  var correct=list.filter(function(x){return x.ans===x.correct;}).length;
  var total=v.qs.length;
  var passed=correct>=8;
  recordAnswers(list,"simulador");
  recordAttempt("simulador",correct,total,passed);

function recordAnswers(list,type){
  var day=sessionDay();
  var cd=DB.correctDays||{};
  // Lectura usa su propio progreso (DB.lecQ): no toca correctDays ni el mazo de Historia.
  if(type==="lectura") list.forEach(function(x){ if(x.ans!=null) lecMark(x.id,x.ans===x.correct); });
  list.forEach(function(x){ if(type!=="lectura" && x.ans===x.correct){ var arr=cd[x.id]||[]; if(arr.indexOf(day)<0){arr.push(day); arr.sort(function(a,b){return a-b;});} cd[x.id]=arr; } });
  DB.correctDays=cd;
  var u=user(); u.totalAnswered+=(list.filter(function(x){return x.ans!=null;}).length); u.totalCorrect+=(list.filter(function(x){return x.ans===x.correct;}).length); u.practiceSession=day;
  // El simulador agrega a flashcards de forma automática SOLO las preguntas
  // que aún no están en la lista; el banco lo hace de forma manual con
  // addFromBank(). Lectura y otras secciones nunca aparecen.
  if(type==="simulador"){
    var seen=DB.simSeen=DB.simSeen||{};
    var fc=DB.flashcards=DB.flashcards||{};
    list.forEach(function(x){
      if(!isHistoryId(x.id)) return;
      if(x.ans==null) return; // only questions actually answered in the simulator
      seen[x.id]=true;
      if(fc[x.id]) return; // ya está en flashcards: su progreso solo se toca desde Flashcards
      // Nueva tarjeta: disponible de inmediato para repasar (lastReviewedAt null)
      // a diferencia de antes, donde se registraba la fecha y la tarjeta no
      // podía repasarse hasta pasado el intervalo.
      var card={correctCount:0,learned:false,lastReviewedAt:null};
      if(x.ans===x.correct){
        card.correctCount=1;
        card.wrong=false;
      } else {
        card.wrong=true; // fallada en el simulador: repasar al día siguiente
      }
      fc[x.id]=card;
    });
  }
  u.masteredCount=learnedIds().length;
  setUser(u);
  var d=DB.daily[today()]||{flashcards:0,simulador:false,lectura:false};
  d.simulador=type==="simulador";
  d.lectura=type==="lectura";
  DB.daily[today()]=d; saveDB();
}

// Progreso de lectura. DB.lecParas = {id_párrafo: true} (párrafos en flashcards de
// lectura) y DB.lecQ = {id_pregunta: {ok, last, wrong}}. Una pregunta se aprende con
// UNA respuesta correcta (en flashcards o en el examen); un párrafo se aprende cuando
// todas sus preguntas están ok. Una respuesta fallada vuelve al día siguiente.
function lecMark(qid,isCorrect){
  var lq=DB.lecQ=DB.lecQ||{};
  var c=lq[qid]||{ok:false,last:null,wrong:false};
  if(isCorrect){ c.ok=true; c.wrong=false; } else { c.wrong=true; }
  c.last=new Date().toISOString();
  lq[qid]=c;
}
function lecInDeck(pid){ return !!(DB.lecParas||{})[pid]; }
function lecCard(qid){ return (DB.lecQ||{})[qid]||null; }
function lecOk(qid){ var c=lecCard(qid); return !!(c&&c.ok); }
function lecDue(qid){
  var c=lecCard(qid);
  if(!c) return true;
  if(c.ok) return false;
  if(!c.last) return true;
  return daysSince(c.last) >= (c.wrong?1:FLASHCARD_MIN_DAYS);
}
function lecDeckParas(){ return LEC.filter(function(p){ return lecInDeck(p.id); }); }
function lecDeckQuestions(){
  var out=[];
  lecDeckParas().forEach(function(p){ p.questions.forEach(function(q){ out.push(q); }); });
  return out;
}
function lecPending(){ return lecDeckQuestions().filter(function(q){ return !lecOk(q.id); }); }
function lecAvailable(){ return lecPending().filter(function(q){ return lecDue(q.id); }); }
function lecParaLearned(p){ return p.questions.length>0 && p.questions.every(function(q){ return lecOk(q.id); }); }
function lecParaProgress(p){ return {ok:p.questions.filter(function(q){return lecOk(q.id);}).length, total:p.questions.length}; }
function lecLearnedParas(){ return lecDeckParas().filter(lecParaLearned); }
// Selecciona un párrafo: todas sus preguntas pasan a flashcards de lectura.
function addLecParagraph(pid){
  var p=null; for(var i=0;i<LEC.length;i++){ if(LEC[i].id===pid){ p=LEC[i]; break; } }
  if(!p) return;
  var dp=DB.lecParas=DB.lecParas||{}; dp[pid]=true;
  var lq=DB.lecQ=DB.lecQ||{};
  p.questions.forEach(function(q){ if(!lq[q.id]) lq[q.id]={ok:false,last:null,wrong:false}; });
  saveDB(); render();
}
function lecProgressHTML(){
  var rows=LEC.map(function(p){
    var right;
    if(lecInDeck(p.id)){
      var pr=lecParaProgress(p);
      right='<span class="row" style="gap:8px">'+(lecParaLearned(p)?'<span class="pill green">✅ Aprendido</span>':'')+
        '<span class="small mut">'+pr.ok+'/'+pr.total+' correctas</span><span class="pill gold">En flashcards</span></span>';
    } else {
      right='<button class="btn ghost" data-addlec="'+p.id+'" style="font-size:12px;padding:6px 12px">+ Agregar a flashcards</button>';

  return '<div class="card" style="margin-top:16px"><div class="top"><h2>Lectura en progreso</h2><div class="row">'+

    '<p class="small mut" style="margin-bottom:8px">Elige párrafos para pasarlos a tu mazo de Lectura (Flashcards → Lectura). Al agregar un párrafo, todas sus preguntas entran a flashcards. Un párrafo se aprende cuando respondes bien cada una de sus preguntas al menos una vez.</p>'+rows+'</div>';
}

// Flashcards de lectura: misma mecánica que Historia (revelar / opciones),
// pero con su propio mazo y su propio criterio de aprendizaje.
function lecCardOf(q){
  var p=LEC_PARA[q.id]||null;
  // Mismas claves que una tarjeta de Historia (pregunta/opciones/…) para que los
  // botones EN y FA y la cola de farsi funcionen igual en los dos mazos.
  return {id:q.id,pregunta:q.question,opciones:q.options,correct:q.correct,explicacion:null,categoria:"Lectura",subtema:p?p.title:"",dificultad:null,para:p,
    pregunta_en:q.question_en,pregunta_fa:q.question_fa,opciones_en:q.options_en,opciones_fa:q.options_fa};
}

/* ---------- Flashcards ---------- */
var FLASHCARD_LEARN_COUNT=5;
// Días mínimos entre repasos: con 1, una tarjeta respondida hoy vuelve a estar
// disponible al día siguiente (antes eran 5 días).
var FLASHCARD_MIN_DAYS=1;
// Texto para la UI, para que no se lea "cada 1 días" (y siga siendo correcto si
// el intervalo vuelve a subir).
var FLASHCARD_INTERVAL_LABEL=FLASHCARD_MIN_DAYS===1?"al día siguiente":("cada "+FLASHCARD_MIN_DAYS+" días");
var FL_MODE="reveal"; // "reveal" or "choice"
// Las flashcards provienen del simulador (automático) o del banco (manual).
function learnedIds(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push(+qid); }
  return out;
}
function pendingCards(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&!card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push({id:+qid,correctCount:card.correctCount||0,lastReviewedAt:card.lastReviewedAt||null}); }
  return out;
}
// Día (local) en que se repasó una tarjeta. Las marcas ISO llevan hora y zona,
// así que se convierten al día local; las fechas sueltas legacy ("YYYY-MM-DD")
// ya son un día local.
function reviewDay(dateStr){
  var s = String(dateStr);
  return s.indexOf("T") >= 0 ? localDay(new Date(s)) : s.slice(0,10);
}
function daysSince(dateStr){
  if(!dateStr) return 9999;
  var d1=new Date(reviewDay(dateStr)+"T00:00:00");
  var d2=new Date(today()+"T00:00:00");
  return Math.round((d2.getTime()-d1.getTime())/86400000);
}
// Filtros por categoría para la sección Flashcards: separar por tema
// (Historia / Cultura / Cívica / Geografía) igual que en el Banco.
var FL_CATS=[["all","Todas"],["Historia","Historia"],["Cultura","Cultura"],["Cívica","Cívica"],["Geografía","Geografía"]];
function availablePool(cat){
  cat=cat||STATE.sel.flcat||"all";
  var fc=DB.flashcards||{};
  var pool=HIST.filter(function(q){
    var card=fc[q.id];
    if(!card) return false;              // must have been added (simulator or bank)
    if(!cardAllowed(q.id)) return false; // only simulator-answered or bank-added
    if(card.learned) return false;
    if(cat!=="all" && q.categoria!==cat) return false;
    if(!card.lastReviewedAt) return true; // not reviewed yet
    // Si fallaste, la tarjeta vuelve al día siguiente; si acertaste, espera el
    // intervalo completo de repetición espaciada.
    var minDays = card.wrong ? 1 : FLASHCARD_MIN_DAYS;
    return daysSince(card.lastReviewedAt) >= minDays;
  });
  return pool;
}
function flHTML(){
  return flDeckBar()+(STATE.sel.fldeck==="lec"?flLecHTML():flHistHTML());
}

    (FL_MODE==="reveal"?"Cambiar a opciones":"Cambiar a autoevaluación")+'</button>';

    '<div class="row" style="margin-bottom:10px"><span class="small mut" style="font-size:11px;font-weight:700;letter-spacing:.06em">CATEGORÍA:</span>'+FL_CATS.map(function(c){return '<button class="tab'+(cat===c[0]?' on':'')+'" data-flcat="'+c[0]+'" style="font-size:12px;padding:6px 12px">'+c[1]+'</button>';}).join("")+'</div>';
  var cardInfo=getFlashcardInfo(q.id);
