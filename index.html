ó olvidar su música y luchar con los enemigos; así que creó un nuevo sonido que produce al mover la cola y que ahora usa antes de atacar.", "questions": [{"id": 52400, "question": "¿Qué ocurrió cuando el venado supo que perdería su tierra?", "options": ["Huyó hacia el mar", "Se alegró y celebró la noticia", "Se unió a los invasores", "Sintió una gran tristeza y lloró"], "correct": 3}, {"id": 52401, "question": "¿Qué formaron las lágrimas del venado?", "options": ["Una montaña de piedra", "Un lago de fuego", "Muchas aguadas", "Un río de agua salada"], "correct": 2}, {"id": 52402, "question": "¿Qué le quedó al venado a partir de ese momento?", "options": ["Un cuerno dorado", "Las alas para volar", "Los ojos muy húmedos", "Las patas rotas"], "correct": 2}, {"id": 52403, "question": "¿Por qué parece el venado siempre triste?", "options": ["Porque no tiene amigos", "Porque ya no puede correr", "Porque lo tratan mal en el bosque", "Porque tiene los ojos húmedos desde que lloró"], "correct": 3}, {"id": 52404, "question": "¿Quién se enojó más al saber de la conquista?", "options": ["Los mayas", "El venado", "La serpiente de cascabel", "El faisán"], "correct": 2}, {"id": 52405, "question": "¿Qué decidió hacer la serpiente?", "options": ["Irse a vivir al mar", "Esconderse en una cueva", "Olvidar su música y luchar contra los enemigos", "Pedir perdón a los invasores"], "correct": 2}, {"id": 52406, "question": "¿Qué nuevo sonido creó la serpiente?", "options": ["Uno que produce al mover la cola", "Un silbido al amanecer", "Un zumbido con las alas", "Un canto con la boca"], "correct": 0}, {"id": 52407, "question": "¿Cuándo usa la serpiente su nuevo sonido?", "options": ["Cuando llueve en la selva", "Al despertar cada mañana", "Solo para dormir", "Antes de atacar"], "correct": 3}, {"id": 52408, "question": "¿Qué significa «aguadas» en el texto?", "options": ["Montañas de arena", "Charcos o lagunas formados por agua", "Árboles de la selva", "Tipos de flores"], "correct": 1}, {"id": 52409, "question": "¿Qué sentimiento provocó la conquista en la serpiente?", "options": ["Un gran enojo", "Un miedo paralizante", "Una enorme indiferencia", "Una profunda alegría"], "correct": 0}, {"id": 52410, "question": "¿Por qué lloró tanto el venado?", "options": ["Porque tuvo un accidente en el bosque", "Porque perdió su cuerno", "Porque se había perdido en la selva", "Porque supo que perdería su tierra"], "correct": 3}, {"id": 52411, "question": "¿Qué hizo la serpiente con su música?", "options": ["La grabó en piedra", "La enseñó a los mayas", "La olvidó para luchar", "La compartió con los invasores"], "correct": 2}, {"id": 52412, "question": "¿Qué relación hay entre la tristeza del venado y sus ojos?", "options": ["Sus ojos perdieron la vista", "Su tristeza dejó sus ojos húmedos para siempre", "Sus ojos se volvieron de color rojo", "No hubo cambios en sus ojos"], "correct": 1}, {"id": 52413, "question": "¿Qué sentimiento compartió el venado con la serpiente?", "options": ["La alegría por la llegada de extranjeros", "La tristeza y el enojo por la conquista", "La indiferencia ante la pérdida", "El amor por los invasores"], "correct": 1}, {"id": 52414, "question": "¿Cuál es el efecto de la conquista en la serpiente?", "options": ["No tuvo ningún efecto", "La convirtió en una piedra", "La hizo desaparecer del bosque", "Cambió su canto y se preparó para luchar"], "correct": 3}, {"id": 52415, "question": "¿Qué características tiene la serpiente tras la conquista?", "options": ["Es ciega y no oye nada", "Es una serpiente de agua que vive en los lagos", "Es pacífica y canta todo el día", "Es combativa y su sonido ahora sirve para atacar"], "correct": 3}, {"id": 52416, "question": "¿Qué tipo de relato es este párrafo?", "options": ["Un informe científico sobre serpientes", "Una noticia de un periódico", "Un manual de caza", "Una explicación de por qué los animales tienen esas características"], "correct": 3}, {"id": 52417, "question": "¿Qué significa «a partir de ese momento» en el texto?", "options": ["Durante la noche", "Desde entonces", "Antes de ese suceso", "Hasta el fin del año"], "correct": 1}, {"id": 52418, "question": "¿Qué expresa la frase «sin duda»?", "options": ["Una negación rotunda", "Duda constante", "Una pregunta abierta", "Certeza de que algo es verdadero"], "correct": 3}]}, {"id": 25, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 7, "title": "Párrafo 7 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Como dijeron los chilam, los extranjeros conquistaron El Mayab. Pero aún así, un famoso adivino maya anunció que los tres animales elegidos por Itzamná cumplirán una importante misión en su tierra. Los mayas aún recuerdan las palabras que una vez dijo:", "questions": [{"id": 52500, "question": "¿Quiénes conquistaron El Mayab?", "options": ["Los extranjeros", "Los mayas del sur", "Los chilam", "Los animales de la selva"], "correct": 0}, {"id": 52501, "question": "¿Qué anunció un famoso adivino maya?", "options": ["Que los extranjeros se marcharían", "Que el mundo llegaría a su fin", "Que los tres animales elegidos cumplirían una importante misión", "Que los mayas abandonarían El Mayab"], "correct": 2}, {"id": 52502, "question": "¿Qué misión tendrían los animales?", "options": ["Vigilar las fronteras del mar", "Construir un nuevo templo", "Una importante misión en la tierra", "Llevar el maíz a otros pueblos"], "correct": 2}, {"id": 52503, "question": "¿Quién recuerda las palabras del adivino?", "options": ["Nadie las recuerda", "Los mayas", "Los extranjeros", "Solo los animales"], "correct": 1}, {"id": 52504, "question": "¿Qué expresión indica que el adivino habló después de la conquista?", "options": ["Como dijeron los chilam, los extranjeros conquistaron El Mayab", "Tras la muerte de Itzamná", "Antes de que comenzaran las lluvias", "Mientras los animales dormían"], "correct": 0}, {"id": 52505, "question": "¿Qué palabra indica contraste en la frase «Pero aún así»?", "options": ["Que la conquista fue inútil", "Que los animales se fueron", "Que, a pesar de la conquista, hubo esperanza", "Que los mayas se rindieron"], "correct": 2}, {"id": 52506, "question": "¿Qué significa «conquistaron» en el texto?", "options": ["Se apoderaron de un territorio por la fuerza", "Visitaron un territorio con curiosidad", "Se fueron de un territorio en paz", "Compraron un territorio al gobierno"], "correct": 0}, {"id": 52507, "question": "¿Qué relación tiene el anuncio del adivino con los chilam?", "options": ["Se confirma la predicción de los chilam sobre la conquista", "No tiene relación con ellos", "Los chilam fueron acusados de mentir", "Se contradice la predicción de los chilam"], "correct": 0}, {"id": 52508, "question": "¿Cuál es el tono del anuncio del adivino?", "options": ["Indiferente al destino de los mayas", "Enojado con los animales", "Burlón y desesperanzado", "Esperanzador, pues anuncia una recuperación futura"], "correct": 3}, {"id": 52509, "question": "¿Qué cumplirán los tres animales según el adivino?", "options": ["Un castigo para los invasores", "Un ritual de purificación", "Un viaje al mar", "Una misión importante en su tierra"], "correct": 3}, {"id": 52510, "question": "¿Qué hecho ocurrió antes del anuncio del adivino?", "options": ["Los animales recuperaron la tierra", "Los extranjeros conquistaron El Mayab", "Los mayas construyeron un nuevo imperio", "Los cenotes se secaron"], "correct": 1}]}, {"id": 26, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 8, "title": "Párrafo 8 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "—Mientras las ceibas estén en pie y las cavernas de El Mayab sigan abiertas, habrá esperanza. Llegará el día en que recobraremos nuestra tierra, entonces los mayas deberán reunirse y combatir. Sabrán que la fecha ha llegado cuando reciban tres señales. La primera será del faisán, quien volará sobre los árboles más altos y su sombra podrá verse en todo El Mayab. La segunda señal la traerá el venado, pues atravesará esta tierra de un solo salto. La tercera mensajera será la serpiente de cascabel, que producirá música de nuevo y ésta se oirá por todas partes. Con estas tres señales, los animales avisarán a los mayas que es tiempo de recuperar la tierra que les quitaron.", "questions": [{"id": 52600, "question": "¿Qué condición da esperanza según el adivino?", "options": ["Que los extranjeros se marchen de la tierra", "Que las ceibas estén en pie y las cavernas sigan abiertas", "Que los mayas construyan más palacios", "Que los animales vuelvan a volar en el cielo"], "correct": 1}, {"id": 52601, "question": "¿Qué cosas deben seguir en pie para que haya esperanza?", "options": ["Las presas de agua", "Las ceibas", "Los palacios de piedra", "Los puentes de madera"], "correct": 1}, {"id": 52602, "question": "¿Qué cavidades deben seguir abiertas para que haya esperanza?", "options": ["Los pozos de las minas", "Las ventanas de los palacios", "Las cavernas de El Mayab", "Las puertas de los templos"], "correct": 2}, {"id": 52603, "question": "¿Qué llegará en el futuro según el adivino?", "options": ["Una gran sequía", "El final de los animales", "El día en que recobrarán su tierra", "La llegada de nuevos invasores"], "correct": 2}, {"id": 52604, "question": "¿Qué deberán hacer los mayas cuando llegue ese día?", "options": ["Huir al bosque", "Abandonar la tierra", "Rendirse a los extranjeros", "Reunirse y combatir"], "correct": 3}, {"id": 52605, "question": "¿Cómo sabrán los mayas que la fecha ha llegado?", "options": ["Cuando los extranjeros se marchen", "Cuando aparezca un cometa", "Cuando reciban tres señales", "Cuando llueva durante siete días"], "correct": 2}, {"id": 52606, "question": "¿Qué traerá la primera señal?", "options": ["El venado", "El jaguar", "La serpiente de cascabel", "El faisán"], "correct": 3}, {"id": 52607, "question": "¿Qué traerá la segunda señal?", "options": ["El tucán", "El faisán", "El venado", "La serpiente"], "correct": 2}, {"id": 52608, "question": "¿Qué traerá la tercera señal?", "options": ["La lluvia", "La serpiente de cascabel", "El faisán", "El venado"], "correct": 1}, {"id": 52609, "question": "¿Qué hará el faisán en la primera señal?", "options": ["Cantará en la ceiba sagrada", "Se esconderá en las yerbas", "Volará sobre los árboles más altos", "Nadará en un cenote"], "correct": 2}, {"id": 52610, "question": "¿Dónde podrá verse la sombra del faisán?", "options": ["En el fondo de los cenotes", "En una sola ciudad", "Solo en la costa", "En todo El Mayab"], "correct": 3}, {"id": 52611, "question": "¿Qué hará el venado en la segunda señal?", "options": ["Huirá hacia el mar", "Atravesará la tierra de un solo salto", "Se quedará quieto en el bosque", "Bajará a una caverna"], "correct": 1}, {"id": 52612, "question": "¿Qué hará la serpiente en la tercera señal?", "options": ["Se esconderá en las cavernas", "Atacará a los extranjeros con veneno", "Producirá música de nuevo", "Volará sobre los árboles"], "correct": 2}, {"id": 52613, "question": "¿Qué sentirán al oír la música de la serpiente?", "options": ["Que no la oirán nadie", "Que se oirá por todas partes", "Que se oirá solo de noche", "Que solo la escucharán los animales"], "correct": 1}, {"id": 52614, "question": "¿Qué avisarán los animales a los mayas?", "options": ["Que los extranjeros llegarán mañana", "Que deben abandonar El Mayab", "Que es tiempo de recuperar la tierra que les quitaron", "Que la lluvia destruirá las ceibas"], "correct": 2}, {"id": 52615, "question": "¿Cuál es la idea central del último párrafo?", "options": ["La destrucción total de El Mayab", "La llegada de nuevos dioses", "La huida de los mayas a otras tierras", "La esperanza de recuperar la tierra con las señales de los animales"], "correct": 3}, {"id": 52616, "question": "¿Qué significa «recobraremos» en el texto?", "options": ["Recuperaremos lo que se había perdido", "Venderemos la tierra", "Olvidaremos lo que nos pertenece", "Destruiremos lo que nos queda"], "correct": 0}, {"id": 52617, "question": "¿Qué palabra expresa que la esperanza depende de algo que debe mantenerse?", "options": ["Aunque", "Mientras", "Jamás", "Nunca"], "correct": 1}, {"id": 52618, "question": "¿Qué tono tiene el mensaje final del adivino?", "options": ["Amenazante hacia los extranjeros", "Burlón hacia los animales", "Desesperanzado y resignado", "Esperanzado y de llamado a la unión"], "correct": 3}, {"id": 52619, "question": "¿Qué significa «atravesará» en la segunda señal?", "options": ["Se quedará parado en un lugar", "Lo olvidará por completo", "Cruzará de un lado a otro", "Lo mirará desde lejos"], "correct": 2}, {"id": 52620, "question": "¿Qué significa «mensajera» aplicado a la serpiente?", "options": ["Quien vende productos en el mercado", "Quien construye palacios", "Quien lleva un aviso o señal", "Quien guarda los secretos del templo"], "correct": 2}, {"id": 52621, "question": "¿Qué sentirán los mayas al reconocer las señales?", "options": ["Que ha llegado el tiempo de recuperar su tierra", "Que deben huir de la selva", "Que han perdido toda esperanza", "Que los animales los abandonan"], "correct": 0}, {"id": 52622, "question": "¿Qué significa «combatir» en el texto?", "options": ["Luchar para defender algo", "Celebrar una fiesta", "Construir una muralla", "Huir de un peligro"], "correct": 0}, {"id": 52623, "question": "¿A quién se dirige el mensaje del adivino?", "options": ["A los dioses", "A los mayas", "A los animales", "A los extranjeros"], "correct": 1}, {"id": 52624, "question": "¿Qué significa «sombra» en la primera señal?", "options": ["La presencia visible del vuelo del faisán sobre la tierra", "Un refugio contra el calor", "Un tipo de árbol de la selva", "Una mancha en el agua de los cenotes"], "correct": 0}]}, {"id": 27, "passage_id": 5, "passage": "Los volcanes", "paragraph": 1, "title": "Párrafo 1 · Los volcanes", "topic": "Leyendas y geografía", "text": "Hace ya miles de lunas, existió en nuestro mundo un joven destacado en las artes de la guerra, famoso por sus hazañas, quien un día en su caminar se encontró con una hermosa joven de la que quedó inmediatamente enamorado. Decidió ir para con el padre de ella y poder unir sus vidas para siempre, sin embargo, el padre de ella era un hombre poco destacado en la guerra y toma una decisión a su favor.", "questions": [{"id": 52700, "question": "¿En qué destacaba el joven de la historia?", "options": ["En el comercio de telas", "En la agricultura de maíz", "En la pintura y la poesía", "En las artes de la guerra"], "correct": 3}, {"id": 52701, "question": "¿Por qué era famoso el joven?", "options": ["Por haber fundado una ciudad", "Por su riqueza heredada", "Por su gran sabiduría religiosa", "Por sus hazañas"], "correct": 3}, {"id": 52702, "question": "¿Con quién se encontró el joven en su caminar?", "options": ["Con un comerciante extranjero", "Con una hermosa joven", "Con un anciano sabio", "Con un sacerdote del templo"], "correct": 1}, {"id": 52703, "question": "¿Qué sintió el joven al conocer a la joven?", "options": ["Quedó enojado con ella", "Quedó inmediatamente enamorado", "Sintió miedo y huyó", "Se sintió indiferente"], "correct": 1}, {"id": 52704, "question": "¿Qué decidió hacer el joven?", "options": ["Partir a una guerra lejana sin despedirse", "Ir con el padre de la joven para unir sus vidas", "Regresar a su aldea natal", "Construir una casa en la montaña"], "correct": 1}, {"id": 52705, "question": "¿Cómo era el padre de la joven en la guerra?", "options": ["Invencible en combate", "Un guerrero legendario", "Muy famoso y temido", "Poco destacado"], "correct": 3}, {"id": 52706, "question": "¿Qué decisión tomó el padre de la joven?", "options": ["Una decisión a su favor", "Casar a su hija con otro guerrero", "Enviar a su hija lejos del valle", "Expulsar al joven del pueblo"], "correct": 0}, {"id": 52707, "question": "¿Qué significa «miles de lunas» en el texto?", "options": ["Miles de noches de luna llena", "Miles de años de lluvia", "Miles de estrellas en el cielo", "Miles de meses, un tiempo muy antiguo"], "correct": 3}, {"id": 52708, "question": "¿Qué quería el joven para siempre con la joven?", "options": ["Mudarse a otra región", "Unir sus vidas para siempre", "Olvidar el amor de su juventud", "Separarse cuanto antes"], "correct": 1}, {"id": 52709, "question": "¿Quién tomaba la decisión final sobre la boda?", "options": ["El padre de la joven", "La joven misma", "Los dioses", "El joven guerrero"], "correct": 0}, {"id": 52710, "question": "¿Qué expresión indica que la historia ocurrió hace mucho tiempo?", "options": ["«Esta misma semana»", "«Hace ya miles de lunas»", "«Ayer por la tarde»", "«El año pasado»"], "correct": 1}, {"id": 52711, "question": "¿Qué hizo el joven antes de decidir ir con el padre?", "options": ["Se fue a estudiar a la ciudad", "Partió a la guerra", "Vendió su casa", "Se enamoró de la joven"], "correct": 3}, {"id": 52712, "question": "¿Qué relación había entre el joven y la guerra?", "options": ["Era un comerciante que vendía armas", "Era un guerrero destacado", "Era un pacifista que rechazaba la guerra", "Era un sacerdote que bendecía a los soldados"], "correct": 1}, {"id": 52713, "question": "¿Qué papel jugó la decisión del padre en la historia?", "options": ["Ayudó a la pareja a huir", "Puso condiciones para aceptar la unión", "Impidió que la joven se casara jamás", "Ofreció dinero para la boda"], "correct": 1}, {"id": 52714, "question": "¿Qué significa «a su favor» en la frase «toma una decisión a su favor»?", "options": ["Que la decisión es neutral", "Que la decisión favorece a los enemigos", "Que la decisión beneficia al padre", "Que la decisión beneficia al joven"], "correct": 2}, {"id": 52715, "question": "¿Qué relación tenía el padre con el joven?", "options": ["Era un enemigo del pueblo", "Era su hermano mayor", "Era su maestro de guerra", "Era el futuro suegro del joven"], "correct": 3}, {"id": 52716, "question": "¿Qué tipo de vínculo se busca al decidir la unión de la pareja?", "options": ["Un acuerdo comercial", "Un vínculo matrimonial", "Una alianza política entre pueblos", "Un pacto de sangre"], "correct": 1}, {"id": 52717, "question": "¿Cuál es la cualidad destacada del joven en el primer párrafo?", "options": ["Su gran riqueza", "Su talento para la música", "Su habilidad como comerciante", "Su valentía y destreza en la guerra"], "correct": 3}, {"id": 52718, "question": "¿Qué tipo de relato narra el primer párrafo de los volcanes?", "options": ["Un manual de guerra", "Una leyenda de amor", "Una receta tradicional", "Un informe histórico"], "correct": 1}, {"id": 52719, "question": "¿Qué idea expresa «sin embargo» en el primer párrafo?", "options": ["Una comparación entre dos pueblos", "Una consecuencia del amor del joven", "Un resumen del relato", "Contraste entre el valor del joven y la falta de gloria del padre"], "correct": 3}]}, {"id": 28, "passage_id": 5, "passage": "Los volcanes", "paragraph": 2, "title": "Párrafo 2 · Los volcanes", "topic": "Leyendas y geografía", "text": "Daría la mano de su hija a aquel joven guerrero a cambio de que luchara en favor de su guerra; él decidió aceptar, pues lo prometido era regresar victoriosos y obtener el amor de aquella joven. Fue una guerra prolongada y no se veía la llegada del guerrero, la joven comenzó a angustiarse y a sufrir por amor.", "questions": [{"id": 52800, "question": "¿Qué propuso el padre al joven guerrero?", "options": ["Darle la mano de su hija a cambio de que luchara en su guerra", "Pagarle un salario de oro", "Enviarlo a estudiar a otra ciudad", "Darle un pedazo de tierra fértil"], "correct": 0}, {"id": 52801, "question": "¿Qué decidió el joven?", "options": ["Aceptar la propuesta", "Pedir ayuda a los dioses del cielo", "Huir del valle para siempre", "Rechazarla de inmediato"], "correct": 0}, {"id": 52802, "question": "¿Qué esperaba a guerra", "Alegría por su independencia", "Angustia y dolor de amor"], "correct": 3}, {"id": 52811, "question": "¿Qué se dice del amor de la joven en este párrafo?", "options": ["No existió nunca", "Se convirtió en odio hacia el joven", "Sufrió por amor a causa de la espera", "Se apagó por completo con el tiempo"], "correct": 2}, {"id": 52812, "question": "¿Qué se quería lograr con la guerra?", "options": ["Obtener el control de las minas", "Ganar y cumplir la promesa de matrimonio", "Expandir el comercio hacia el mar", "Conquistar las montañas del norte"], "correct": 1}, {"id": 52813, "question": "¿Qué idea central transmite el segundo párrafo?", "options": ["La espera y el sufrimiento de una joven enamorada", "La llegada de los conquistadores", "La caída de un imperio", "La fundación de una ciudad"], "correct": 0}, {"id": 52814, "question": "¿Qué tipo de vínculo une al joven con la joven en este párrafo?", "options": ["Una amistad de la infancia", "Un amor esperando el regreso del guerrero", "Un parentesco de sangre", "Una relación de maestro y alumna"], "correct": 1}, {"id": 52815, "question": "¿Qué significa «angustiarse» en el texto?", "options": ["Hacer ejercicio al aire libre", "Quedarse dormida", "Sentir una gran alegría", "Sentir una pena intensa y ansiedad"], "correct": 3}]}, {"id": 29, "passage_id": 5, "passage": "Los volcanes", "paragraph": 3, "title": "Párrafo 3 · Los volcanes", "topic": "Leyendas y geografía", "text": "Llegó a sus oídos la versión de que el joven guerrero había muerto en batalla y la joven se enferma de dolor del alma, angustiadas noches pasó hasta que una mañana su padre entristecido la encontró sumida en el sueño eterno. La mañana siguiente el sol relumbraba el valle y se escucharon llegar sonidos de victoria, era el ejército de su pueblo acercándose a sus hogares; frente a los guerreros, avanzaba fuertemente el joven con una enorme alegría de que ahora sí podría ser feliz a lado de su amada.", "questions": [{"id": 52900, "question": "¿Qué noticia llegó a oídos de la joven?", "options": ["Que el joven había huido del pueblo", "Que el joven se había casado con otra mujer", "Que el joven había ganado la guerra", "Que el joven guerrero había muerto en batalla"], "correct": 3}, {"id": 52901, "question": "¿Cómo reaccionó la joven ante esa noticia?", "options": ["Celebró la memoria del guerrero", "Se volvió más fuerte y valiente", "Escapó del valle con sus amigas", "Se enfermó de dolor del alma"], "correct": 3}, {"id": 52902, "question": "¿Qué pasó con las noches de la joven?", "options": ["Fueron cortas y alegres", "Fueron tranquilas y dulces", "Fueron angustiadas", "Fueron llenas de fiestas"], "correct": 2}, {"id": 52903, "question": "¿Quién encontró a la joven sumida en el sueño eterno?", "options": ["Un amigo del guerrero", "Un cazador del bosque", "Su padre, entristecido", "Un sacerdote del templo"], "correct": 2}, {"id": 52904, "question": "¿Qué significa «sueño eterno» en el texto?", "options": ["La muerte", "Una enfermedad pasajera", "Un sueño muy largo y profundo", "Un descanso antes de la boda"], "correct": 0}, {"id": 52905, "question": "¿Qué se escuchó a la mañana siguiente?", "options": ["Lamentos del pueblo", "Campanas de una boda", "Gritos de los enemigos", "Sonidos de victoria"], "correct": 3}, {"id": 52906, "question": "¿Qué se acercaba al valle a la mañana siguiente?", "options": ["El ejército del pueblo", "Un grupo de comerciantes", "Una tormenta de nieve", "Un ejército enemigo"], "correct": 0}, {"id": 52907, "question": "¿Quién avanzaba al frente de los guerreros?", "options": ["El sacerdote del pueblo", "Un capitán enemigo", "El joven guerrero", "El padre de la joven"], "correct": 2}, {"id": 52908, "question": "¿Qué sentimiento llevaba el joven al volver?", "options": ["Una profunda tristeza", "Un miedo paralizante", "Una gran confusión", "Una enorme alegría"], "correct": 3}, {"id": 52909, "question": "¿Qué esperaba el joven al regresar?", "options": ["Olvidar su pasado de guerra", "Recibir una condecoración del rey", "Vivir en otro pueblo lejano", "Ser feliz junto a su amada"], "correct": 3}, {"id": 52910, "question": "¿Qué significa «ahora sí» en la frase «ahora sí podría ser feliz»?", "options": ["Que ya no quería casarse", "Que ya era demasiado tarde", "Que estaba arrepentido", "Que por fin se cumpliría su deseo"], "correct": 3}, {"id": 52911, "question": "¿Qué tipo de cambio provoca el regreso del ejército?", "options": ["Pasa de la tristeza a la celebración", "Pasa de la riqueza a la pobreza", "Pasa de la paz a la guerra", "Pasa del día a la noche"], "correct": 0}, {"id": 52912, "question": "¿Qué significa «relumbraba» en la frase «el sol relumbraba el valle»?", "options": ["Se ocultaba tras las montañas", "Llovía sobre el valle", "Brillaba con intensidad", "Estaba nublado"], "correct": 2}, {"id": 52913, "question": "¿Qué ocurrió primero según el párrafo?", "options": ["La joven se recuperó del dolor", "El ejército regresó al pueblo", "Llegó la noticia de la muerte del guerrero", "El padre firmó un tratado de paz"], "correct": 2}, {"id": 52914, "question": "¿Qué significa «lamentable» en la frase «tan lamentable noticia»?", "options": ["Alegre y festiva", "Triste y dolorosa", "Esperada por todos", "Sin importancia"], "correct": 1}, {"id": 52915, "question": "¿Qué relación tiene la mañana siguiente con la noche anterior?", "options": ["El mismo día cambia la tristeza por el regreso del guerrero", "Son dos historias sin relación", "La mañana es un recuerdo de la noche", "La noche fue más alegre que la mañana"], "correct": 0}, {"id": 52916, "question": "¿Qué provocó que la joven se enfermara?", "options": ["El frío de las montañas", "El dolor del alma por la noticia de la muerte del guerrero", "Una caída en el río", "Una epidemia en el valle"], "correct": 1}, {"id": 52917, "question": "¿Cómo se refiere el texto al estado de la joven al morir?", "options": ["Sentada frente al espejo", "Perdida en el bosque", "Cantando en el templo", "Sumi "question": "¿Qué estado de ánimo se describe en el guerrero?", "options": ["Felicidad completa por el regreso", "Indiferencia ante la muerte", "Dolor profundo por la pérdida", "Miedo al castigo de los dioses"], "correct": 2}, {"id": 53011, "question": "¿A quién pidió explicaciones el enamorado?", "options": ["A su padre", "Al ejército enemigo", "A los dioses", "Al cacique del pueblo"], "correct": 2}, {"id": 53012, "question": "¿Qué tiempo del día sugiere la antorcha encendida con la que vela a la joven?", "options": ["El mediodía", "El amanecer", "La noche", "La tarde soleada"], "correct": 2}, {"id": 53013, "question": "¿Qué motivó al guerrero a velar a su amada?", "options": ["El deseo de venganza", "El amor y la devoción", "El miedo al castigo", "El odio hacia los dioses"], "correct": 1}, {"id": 53014, "question": "¿Qué efecto tuvo la pérdida en el corazón del guerrero?", "options": ["Un dolor tan grande que lo llevó a gritar al cielo", "Una alegría repentina", "Un sueño profundo y tranquilo", "Un olvido inmediato de su amada"], "correct": 0}]}, {"id": 31, "passage_id": 5, "passage": "Los volcanes", "paragraph": 5, "title": "Párrafo 5 · Los volcanes", "topic": "Leyendas y geografía", "text": "Los dioses al ver aquel acto de amor, decidieron eternizar a la pareja cubriendo de nieve sus cuerpos y petrificándolos por la eternidad. Y ahí sigue la mujer dormida y a un lado su guerrero enamorado con su antorcha de fuego. Con el paso de los siglos aún podemos observar a esos dos enamorados, en dos grandes montañas conocidas como Iztaccíhuatl y Popocatépetl.", "questions": [{"id": 53100, "question": "¿Qué decidieron los dioses al ver el acto de amor?", "options": ["Separar a la pareja para siempre", "Castigar a los dos enamorados", "Enviar a la pareja al mar", "Eternizar a la pareja"], "correct": 3}, {"id": 53101, "question": "¿Cómo eternizaron los dioses a la pareja?", "options": ["Con un rayo de fuego sobre el valle", "Cubriendo sus cuerpos de nieve y petrificándolos", "Con una gran inundación", "Convirtiéndolos en aves del cielo"], "correct": 1}, {"id": 53102, "question": "¿Qué significa «petrificar» en el texto?", "options": ["Iluminar con luz", "Dormir en silencio", "Convertir en piedra", "Cubrir con tierra"], "correct": 2}, {"id": 53103, "question": "¿En qué posición permanece la mujer?", "options": ["Despierta y sonriente", "De pie frente al valle", "Sentada junto al río", "Dormida"], "correct": 3}, {"id": 53104, "question": "¿Qué sostiene a su lado el guerrero?", "options": ["Su antorcha de fuego", "Una lanza de madera", "Un ramo de flores", "Un escudo de guerra"], "correct": 0}, {"id": 53105, "question": "¿Qué nombres reciben las montañas donde se encuentran los enamorados?", "options": ["Nevado de Toluca y Tláloc", "Pico de Orizaba y Cofre de Perote", "Cerro del Chiquihuite y Cerro de la Estrella", "Iztaccíhuatl y Popocatépetl"], "correct": 3}, {"id": 53106, "question": "¿Cuánto tiempo han observado las montañas a los enamorados?", "options": ["Solo durante un año", "Desde la semana pasada", "Con el paso de los siglos", "Desde la última erupción de una década"], "correct": 2}, {"id": 53107, "question": "¿Qué forma tienen las montañas según la leyenda?", "options": ["La de dos enamorados", "La de dos torres de piedra", "La de una pirámide escalonada", "La de un volcán aislado"], "correct": 0}, {"id": 53108, "question": "¿Cuántas montañas forman la pareja?", "options": ["Una", "Cuatro", "Tres", "Dos"], "correct": 3}, {"id": 53109, "question": "¿Qué significa «eternizar» en el texto?", "options": ["Hacer que algo termine pronto", "Hacer que algo dure para siempre", "Cambiar de lugar", "Olvidar algo por completo"], "correct": 1}, {"id": 53110, "question": "¿Qué relación hay entre la nieve y los cuerpos de los enamorados?", "options": ["La nieve los cubre y los transforma en montañas", "La nieve no tiene relación con ellos", "La nieve los protege del frío", "La nieve los derrite y los borra"], "correct": 0}, {"id": 53111, "question": "¿Qué sucede con el guerrero y su antorcha en la montaña?", "options": ["Se apagan con la nieve", "Se pierden en el valle", "Vuelan hacia el cielo", "Permanecen a un lado de la mujer"], "correct": 3}, {"id": 53112, "question": "¿Qué expresa la frase «aún podemos observar»?", "options": ["Que la leyenda se olvidó", "Que la leyenda sigue presente en el paisaje actual", "Que nadie puede ver los volcanes", "Que las montañas ya no existen"], "correct": 1}, {"id": 53113, "question": "¿Qué tipo de castigo recibieron los enamorados?", "options": ["Ninguno: fueron eternizados por su acto de amor", "Fueron condenados a la guerra", "Fueron separados para siempre", "Fueron desterrados del valle"], "correct": 0}, {"id": 53114, "question": "¿Qué fenómeno explica la leyenda de los volcanes?", "options": ["Una gran inundación en el valle", "La formación de dos montañas con forma de pareja", "La llegada de los españoles", "Un terremoto que partió el suelo"], "correct": 1}, {"id": 53115, "question": "¿Qué cubrió los cuerpos de la pareja?", "options": ["Arena", "Hojas secas", "Nieve", "Ceniza"], "correct": 2}, {"id": 53116, "question": "¿En qué se convirtieron los cuerpos de los enamorados?", "options": ["En flores", "En humo", "En agua", "En piedra"], "correct": 3}, {"id": 53117, "question": "¿Qué significa «siglos» en el texto?", "options": ["Estaciones del año", "Periodos de cien años", "Días de lluvia", "Noches de luna"], "correct": 1}]}, {"id": 32, "passage_id": 5, "passage": "Los volcanes", "paragraph": 6, "title": "Párrafo 6 · Los volcanes", "topic": "Leyendas y geografía", "text": "Nota: El Popocatépetl e Iztaccíhuatl son icónicos por su forma que asemeja una pareja de enamorados. El guerrero lleva por nombre Popocatépetl del náhuatl popo-ca ‘que humea’ y te-petl ‘montaña o monte’, debido a que desde tiempos prehispánicos permanece activo. Mientras que la princesa llamada Iztaccíhuatl, del náhuatl Iztac, ‘blanco’ y ‘cihuatl ‘mujer’, porque asemeja a la figura de una mujer dormida cubierta de un manto blanco. Ubicados en los límites de la Ciudad de México y Puebla. La pareja de volcanes están unidos por la parte norte, mediante un paso montañoso conocido como Paso de Cortés.", "questions": [{"id": 53200, "question": "¿Por qué los volcanes son icónicos?", "options": ["Por ser los más altos del mundo", "Por tener lagos en la cima", "Por su gran riqueza mineral", "Por su forma, que asemeja una pareja de enamorados"], "correct": 3}, {"id": 53201, "question": "¿Qué significa «Popocatépetl» en náhuatl?", "options": ["«Montaña nevada» y «agua»", "«Mujer dormida» y «blanco»", "«Guerrero valiente» y «fuego»", "«Que humea» y «montaña»"], "correct": 3}, {"id": 53202, "question": "¿Qué significa «Iztaccíhuatl» en náhuatl?", "options": ["«Blanco» y «mujer»", "«Princesa» y «nieve»", "«Que humea» y «montaña»", "«Guerrera» y «sol»"], "correct": 0}, {"id": 53203, "question": "¿Por qué se llama Popocatépetl al volcán del guerrero?", "options": ["Porque es el más antiguo de México", "Porque tiene forma de pirámide", "Porque hay un templo en su cima", "Porque desde tiempos prehispánicos permanece activo"], "correct": 3}, {"id": 53204, "question": "¿Qué significa «popo-ca» en el nombre del volcán?", "options": ["«Que humea»", "«Que brilla»", "«Que crece»", "«Que duerme»"], "correct": 0}, {"id": 53205, "question": "¿Qué significa «te-petl»?", "options": ["«Montaña o monte»", "«Fuego o luz»", "«Lago o agua»", "«Valle o río»"], "correct": 0}, {"id": 53206, "question": "¿Por qué se llama Iztaccíhuatl a la princesa?", "options": ["Porque es la diosa de la nieve", "Porque asemeja una mujer dormida cubierta de un manto blanco", "Porque nació en un valle blanco", "Porque su padre se llamaba así"], "correct": 1}, {"id": 53207, "question": "¿Qué relación tienen los volcanes con los límites de la Ciudad de México y Puebla?", "options": ["Están ubicados en esos límites", "Están en el centro de la capital", "Están dentro del estado de Morelos", "Están fuera de México"], "correct": 0}, {"id": 53208, "question": "¿Cómo están unidos los volcanes por la parte norte?", "options": ["Mediante un túnel subterráneo", "Mediante un puente de piedra", "Mediante el Paso de Cortés", "Mediante una carretera de montaña"], "correct": 2}, {"id": 53209, "question": "¿Qué es el Paso de Cortés según la nota?", "options": ["Una calle histórica de Puebla", "Un paso montañoso que une los dos volcanes", "Un canal de riego del valle", "Un puerto marítimo de la costa"], "correct": 1}, {"id": 53210, "question": "¿Qué ciudad se menciona en la nota junto con Puebla?", "options": ["Querétaro", "Ciudad de México", "Guadalajara", "Monterrey"], "correct": 1}, {"id": 53211, "question": "¿Qué se dice de la forma del Iztaccíhuatl?", "options": ["Que parece un guerrero con escudo", "Que parece un río de lava", "Que parece una torre de vigilancia", "Que parece una mujer dormida cubierta con un manto blanco"], "correct": 3}, {"id": 53212, "question": "¿Qué palabra del texto indica que la pareja de volcanes está relacionada?", "options": ["Olvidados", "Aislados", "Separados", "Unidos"], "correct": 3}, {"id": 53213, "question": "¿De qué idioma provienen los nombres de los volcanes?", "options": ["Del maya", "Del otomí", "Del español antiguo", "Del náhuatl"], "correct": 3}, {"id": 53214, "question": "¿Qué significa «icónicos» en la nota?", "options": ["Que son volcanes extintos", "Que son desconocidos por la población", "Que están bajo el mar", "Que son símbolos reconocibles y representativos"], "correct": 3}, {"id": 53215, "question": "¿Qué significa «manto» en «cubierta de un manto blanco»?", "options": ["Canal de agua de lluvia", "Montaña de piedra caliza", "Cobertura o capa de tela o de nieve", "Tipo de árbol de la región"], "correct": 2}, {"id": 53216, "question": "¿Qué significa «activo» en la nota?", "options": ["Que nunca se mueve", "Que puede tener actividad volcánica", "Que está apagado por completo", "Que está en reposo eterno"], "correct": 1}, {"id": 53217, "question": "¿Qué se explica en la nota sobre el nombre Popocatépetl?", "options": ["La cantidad de habitantes de la zona", "La ubicación exacta del volcán en el mapa", "La procedencia y el significado de sus raíces náhuatl", "La historia del guerrero en la batalla"], "correct": 2}, {"id": 53218, "question": "¿Qué volcán se asocia con la princesa dormida?", "options": ["Iztaccíhuatl", "Pico de Orizaba", "Popocatépetl", "Nevado de Toluca"], "correct": 0}, {"id": 53219, "question": "¿Qué volcán se asocia con el guerrero que humea?", "options": ["Nevado de Colima", "Iztaccíhuatl", "Popocatépetl", "Cofre de Perote"], "correct": 2}, {"id": 53220, "question": "¿Qué significa «cihuatl» en el nombre Iztaccíhuatl?", "options": ["«Mujer»", "«Montaña»", "«Blanco»", "«Fuego»"], "correct": 0}, {"id": 53221, "question": "¿Qué significa «paso montañoso» en la nota?", "options": ["Una presa de agua", "Un túnel de tren", "Un camino que atraviesa entre montañas", "Un puerto marítimo"], "correct": 2}, {"id": 53222, "question": "¿Por qué parte se unen los dos volcanes?", "options": ["Por el oeste", "Por el sur", "Por el norte", "Por el este"], "correct": 2}, {"id": 53223, "question": "¿Con qué ciudad y estado limitan los volcanes según la nota?", "options": ["Morelos y Guerrero", "Ciudad de México y Puebla", "Querétaro e Hidalgo", "Toluca y Michoacán"], "correct": 1}, {"id": 53224, "question": "¿Qué significa «iztac» en el nombre de la princesa?", "options": ["«Blanco»", "«Dormida»", "«Nieve eterna»", "«Mujer»"], "correct": 0}, {"id": 53225, "question": "¿Qué tipo de texto es la nota del pasaje?", "options": ["Una receta de cocina tradicional", "Un poema de amor", "Un manual de escalada", "Una explicación sobre el origen y significado de los nombres de los volcanes"], "correct": 3}]}, {"id": 33, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 1, "title": "Párrafo 1 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "¿Qué es un cenote? Es un pozo de agua dulce que se forma por el desgaste o erosión de las rocas calizas.", "questions": [{"id": 53300, "question": "¿Qué es un cenote según el texto?", "options": ["Un río subterráneo de agua salada", "Una laguna de agua de mar", "Un pozo de agua dulce", "Una montaña de roca volcánica"], "correct": 2}, {"id": 53301, "question": "¿Cómo se forma un cenote?", "options": ["Por la acción de la lava sobre la arena", "Por el desgaste o erosión de las rocas calizas", "Por el choque de dos placas de hielo", "Por la erupción de un volcán"], "correct": 1}, {"id": 53302, "question": "¿Qué tipo de roca forma los cenotes según el texto?", "options": ["Rocas calizas", "Mármol blanco", "Granito puro", "Rocas volcánicas"], "correct": 0}, {"id": 53303, "question": "¿Qué clase de agua contiene un cenote?", "options": ["Agua salada", "Agua de lluvia acidulada", "Agua hirviendo", "Agua dulce"], "correct": 3}, {"id": 53304, "question": "¿Qué significa «desgastamiento» o «erosión» en el primer párrafo?", "options": ["Pérdida progresiva de material por el paso del agua y del tiempo", "Solidificación de la lava", "Formación rápida de una montaña", "Construcción artificial de un pozo"], "correct": 0}, {"id": 53305, "question": "¿Qué significa «pozo» en el texto?", "options": ["Una cavidad profunda que contiene agua", "Un tipo de planta acuática", "Un camino de tierra", "Una torre de vigilancia"], "correct": 0}, {"id": 53306, "question": "¿Qué relación hay entre el agua y la roca caliza en la formación del cenote?", "options": ["La roca se disuelve en aceite", "La roca caliza absorbe toda el agua", "El agua desgasta la roca y forma el pozo", "El agua y la roca no tienen relación"], "correct": 2}, {"id": 53307, "question": "¿Qué se pregunta el primer párrafo del texto?", "options": ["Qué es un cenote", "Dónde se encuentra la ciudad de Mérida", "Quién construyó el primer cenote", "Cuándo se secó el cenote de Zací"], "correct": 0}]}, {"id": 34, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 2, "title": "Párrafo 2 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Ubicado en el interior de la ciudad de Valladolid, Yucatán el cenote Zací es una impresionante caverna, parcialmente colapsada, de unos 45 metros de diámetro.", "questions": [{"id": 53400, "question": "¿En qué ciudad se encuentra el cenote Zací?", "options": ["En Mérida, Yucatán", "En Chichén Itzá, Yucatán", "En Campeche, Campeche", "En Valladolid, Yucatán"], "correct": 3}, {"id": 53401, "question": "¿Cómo se describe el cenote Zací?", "options": ["Como un lago tranquilo en medio de un bosque", "Como un manantial de agua caliente", "Como una pirámide escalonada de piedra", "Como una impresionante caverna parcialmente colapsada"], "correct": 3}, {"id": 53402, "question": "¿Cuál es el diámetro aproximado del cenote Zací?", "options": ["Unos 45 metros", "Unos 4.5 metros", "Unos 15 metros", "Unos 450 metros"], "correct": 0}, {"id": 53403, "question": "¿Qué significa que la caverna esté «parcialmente colapsada»?", "options": ["Que está completamente cubierta de agua", "Que nunca ha sufrido daños", "Que una parte de su techo se ha derrumbado", "Que está pintada con colores brillantes"], "correct": 2}, {"id": 53404, "question": "¿Qué significa «impresionante» en el texto?", "options": ["Que es fácil de recorrer", "Que está seco y vacío", "Que causa admiración por su tamaño o belleza", "Que es pequeño y poco visible"], "correct": 2}, {"id": 53405, "question": "¿Qué tipo de formación es el cenote Zací?", "options": ["Una caverna", "Una playa de arena", "Una selva tropical", "Una montaña"], "correct": 0}, {"id": 53406, "question": "¿En qué estado mexicano se encuentra la ciudad de Valladolid?", "options": ["Quintana Roo", "Campeche", "Tabasco", "Yucatán"], "correct": 3}, {"id": 53407, "question": "¿Qué medida se da para el diámetro del cenote?", "options": ["4.5 kilómetros", "45 metros", "150 metros", "15 kilómetros"], "correct": 1}]}, {"id": 35, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 3, "title": "Párrafo 3 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Durante el imperio de los Cupules y los Cocomes se fundó, en 1543, la ciudad maya de Zací (gavilán blanco) en lo que en la actualidad es la ciudad de Valladolid, Yucatán. Dentro de la ciudad se encontraba este cenote, y sobre su bóveda se encontraba la vivienda de la curandera y hechicera del pueblo. Era la patrona de la familia Cocom; una anciana poderosa e influyente. Desde siempre, habían existido en Zací dos familias que se disputaban permanentemente el poder. El cacique Halach-Huinic (el hombre verdadero) era el que gobernaba en ese tiempo, y tenía un hijo llamado Hul-Kin (rayo de sol), perteneciente a la familia de los cupules.", "questions": [{"id": 53500, "question": "¿Quiénes dominaban durante el imperio en el que se fundó Zací?", "options": ["Los olmecas y los toltecas", "Los Cupules y los Cocomes", "Los mexicas y los tlaxcaltecas", "Los zapotecas y los mixtecos"], "correct": 1}, {"id": 53501, "question": "¿En qué año se fundó la ciudad maya de Zací?", "options": ["En 1543", "En 1325", "En 1521", "En 1810"], "correct": 0}, {"id": 53502, "question": "¿Qué significa «Zací» según el texto?", "options": ["Gavilán blanco", "Jaguar negro", "Serpiente de agua", "Flor de la selva"], "correct": 0}, {"id": 53503, "question": "¿En qué ciudad actual se encontraba la ciudad de Zací?", "options": ["En Mérida", "En Cancún", "En Campeche", "En Valladolid, Yucatán"], "correct": 3}, {"id": 53504, "question": "¿Dónde estaba la vivienda de la curandera y hechicera?", "options": ["Dentro de un templo de piedra", "En la costa del mar Caribe", "Al pie de la montaña más alta", "Sobre la bóveda del cenote"], "correct": 3}, {"id": 53505, "question": "¿Qué papel tenía la anciana del pueblo?", "options": ["Era comerciante de sal", "Era guerrera del ejército", "Era curandera y hechicera", "Era gobernante de la ciudad"], "correct": 2}, {"id": 53506, "question": "¿De qué familia era patrona la anciana?", "options": ["La familia Halach-Huinic", "La familia Sac-Nicte", "La familia Cupul", "La familia Cocom"], "correct": 3}, {"id": 53507, "question": "¿Cómo se describe a la anciana en el texto?", "options": ["Como una joven aprendiz de la hechicería", "Como una mujer pobre y olvidada", "Como una anciana poderosa e influyente", "Como una sacerdotisa que vivía en el mar"], "correct": 2}, {"id": 53508, "question": "¿Qué existía desde siempre en Zací?", "options": ["Dos familias que se disputaban el poder", "Un solo gobierno sin conflictos", "Un mercado de esclavos", "Un templo abandonado"], "correct": 0}, {"id": 53509, "question": "¿Quién gobernaba en esa época?", "options": ["La hechicera", "El cacique Hul-Kin", "El rey de los Cocomes", "El cacique Halach-Huinic"], "correct": 3}, {"id": 53510, "question": "¿Qué significa «Halach-Huinic» según el texto?", "options": ["El rayo de sol", "El hombre verdadero", "El gavilán blanco", "La flor blanca"], "correct": 1}, {"id": 53511, "question": "¿Qué significa «Hul-Kin» según el texto?", "options": ["Flor blanca", "Rayo de sol", "Hombre verdadero", "Mujer noble"], "correct": 1}, {"id": 53512, "question": "¿A qué familia pertenecía Hul-Kin?", "options": ["A la familia de los cocomes", "A la familia del cacique Halach-Huinic", "A la familia de la hechicera", "A la familia de los cupules"], "correct": 3}, {"id": 53513, "question": "¿Quién era el hijo del cacique?", "options": ["El gavilán blanco", "Halach-Huinic", "Hul-Kin", "Sac-Nicte"], "correct": 2}, {"id": 53514, "question": "¿Qué se disputaban las dos familias de Zací?", "options": ["El comercio de cacao", "El poder", "Las tierras del norte", "La ciudad de Mérida"], "correct": 1}, {"id": 53515, "question": "¿Cuál de estos datos NO aparece en el tercer párrafo?", "options": ["La fecha de fundación de Zací", "La fundación de Mérida en 1542", "El nombre del cacique Halach-Huinic", "La familia a la que pertenecía Hul-Kin"], "correct": 1}, {"id": 53516, "question": "¿Qué significa «curandera» en el texto?", "options": ["Persona que construye casas", "Persona que dirige la guerra", "Persona que vende telas", "Persona que cura enfermedades con remedios y ritos"], "correct": 3}, {"id": 53517, "question": "¿Qué significa «bóveda» en el texto?", "options": ["El techo curvo de una cavidad", "El fondo de un pozo", "La puerta principal del templo", "Un tipo de árbol de la selva"], "correct": 0}, {"id": 53518, "question": "¿Qué representaba la anciana para la familia Cocom?", "options": ["Su guerrera principal", "Su enemiga política", "Su mayor comerciante", "Su patrona, es decir, su protectora espiritual"], "correct": 3}, {"id": 53519, "question": "¿Qué relación tenían los Cupules y los Cocomes en Zací?", "options": ["Se habían unido por matrimonio", "Vivían en ciudades distintas sin contacto", "Eran aliados en todas las guerras", "Se disputaban el poder en la ciudad"], "correct": 3}, {"id": 53520, "question": "¿Qué tipo de gobierno mantenía el cacique Halach-Huinic?", "options": ["Gobernaba la ciudad en su tiempo", "Gobernaba desde el mar", "Gobernaba desde una selva lejana", "No gobernaba en la ciudad"], "correct": 0}, {"id": 53521, "question": "¿En qué lugar se fundó la ciudad maya de Zací según el texto?", "options": ["En la costa del golfo de México", "En lo que hoy es la ciudad de Valladolid", "En el centro de la ciudad de México", "En lo que hoy es la ciudad de Campeche"], "correct": 1}, {"id": 53522, "question": "¿Qué relación tenía la vivienda de la hechicera con el cenote?", "options": ["No tenía ninguna relación con el cenote", "Estaba situada justo sobre la bóveda del cenote", "Estaba dentro del agua del cenote", "Estaba a cientos de kilómetros del cenote"], "correct": 1}, {"id": 53523, "question": "¿Qué significa «imperio» en el texto?", "options": ["Una casa de piedra con jardines", "Una familia de comerciantes", "Un conjunto de pueblos gobernados por un poder central", "Un pequeño pueblo de agricultores"], "correct": 2}, {"id": 53524, "question": "¿Qué tipo de ciudad era Zací?", "options": ["Una colonia española", "Un puerto comercial", "Una ciudad maya", "Un campamento militar"], "correct": 2}, {"id": 53525, "question": "¿Qué hechos ocurrían durante el imperio de los Cupules y los Cocomes?", "options": ["Comenzó la independencia de México", "Se fundó la ciudad de Zací en 1543", "Se construyó el Canal de Panamá", "Se fundó la ciudad de México"], "correct": 1}, {"id": 53526, "question": "¿Qué significa «gavilán» en el nombre Zací?", "options": ["Un jaguar de la selva", "Una serpiente de agua", "Una flor blanca", "Un ave rapaz"], "correct": 3}, {"id": 53527, "question": "¿Qué relación tenía el cacique Halach-Huinic con su hijo Hul-Kin?", "options": ["Era su padre", "Era su tío", "Era su hermano", "Era su maestro"], "correct": 0}, {"id": 53528, "question": "¿A qué familia rival pertenecía la familia de Hul-Kin?", "options": ["A los mexicas", "A los cupules", "A los tlaxcaltecas", "A los cocomes"], "correct": 1}, {"id": 53529, "question": "¿Qué significa «cacique» en el texto?", "options": ["Sacerdote del templo", "Comerciante de sal", "Jefe o líder de un pueblo", "Guerrero de élite"], "correct": 2}, {"id": 53530, "question": "¿Qué se entiende por «hechicera» en el texto?", "options": ["Mujer que practica magia y hechizos", "Reina del pueblo", "Maestra de escuela", "Comerciante de telas"], "correct": 0}]}, {"id": 36, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 4, "title": "Párrafo 4 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "La nieta de la hechicera se había quedado huérfana al nacer, y por ello la abuela la quería doblemente, ya que en ella cifraba el amor a su hija y a su propia nieta, la hermosa “Sac-Nicte” (flor blanca), quien le habría de alegrar la vida en su ancianidad.", "questions": [{"id": 53600, "question": "¿Por qué se quedó huérfana la nieta de la hechicera?", "options": ["Su madre la abandonó en el bosque", "Murió en una guerra de su pueblo", "Quedó huérfana al nacer", "Falleció por una enfermedad en la juventud"], "correct": 2}, {"id": 53601, "question": "¿Cómo quería la abuela a su nieta?", "options": ["Con indiferencia", "Con temor", "Doblemente", "De manera distante"], "correct": 2}, {"id": 53602, "question": "¿En qué cifraba la abuela su amor?", "options": ["En los dioses del cenote", "En su hija y en su nieta", "En las riquezas de la familia", "En su propio pasado de guerrera"], "correct": 1}, {"id": 53603, "question": "¿Cómo se llamaba la nieta de la hechicera?", "options": ["Zací", "Halach-Huinic", "Sac-Nicte", "Hul-Kin"], "correct": 2}, {"id": 53604, "question": "¿Qué significa «Sac-Nicte» en el texto?", "options": ["Hombre verdadero", "Gavilán blanco", "Rayo de sol", "Flor blanca"], "correct": 3}, {"id": 53605, "question": "¿Qué papel tendría Sac-Nicte en la vejez de su abuela?", "options": ["Dejarla sola en la casa", "Alegrarle la vida en su ancianidad", "Vender sus remedios en el mercado", "Hacerla trabajar en la cocina"], "correct": 1}, {"id": 53606, "question": "¿Qué significa «ancianidad» en el texto?", "options": ["La niñez", "La edad adulta", "La juventud", "La vejez"], "correct": 3}, {"id": 53607, "question": "¿Qué sentimiento tenía la abuela hacia la nieta?", "options": ["Una indiferencia total", "Un amor doble, hacia su hija y hacia su nieta", "Un odio profundo", "Un temor a los dioses"], "correct": 1}, {"id": 53608, "question": "¿Qué significa «cifraba» en la frase «en ella cifraba el amor»?", "options": ["Escondía o perdía", "Vendía o cambiaba", "Depositaba o concentraba", "Dividía o repartía"], "correct": 2}, {"id": 53609, "question": "¿Qué calificativo recibe Sac-Nicte en el texto?", "options": ["Fea y olvidada", "Hermosa", "Cruel y violenta", "Anciana y enferma"], "correct": 1}, {"id": 53610, "question": "¿Qué significa «huérfana» en el texto?", "options": ["Persona que ha perdido a sus padres", "Persona que trabaja en el templo", "Persona que tiene muchos hermanos", "Persona que vive sola en el bosque"], "correct": 0}, {"id": 53611, "question": "¿Qué le pasó a la madre de Sac-Nicte?", "options": ["Murió al nacer su hija", "Se convirtió en hechicera", "Se fue a vivir al mar", "Se casó con el cacique"], "correct": 0}, {"id": 53612, "question": "¿Cuál es la relación de la abuela con la madre de Sac-Nicte?", "options": ["Era su hermana menor", "No tenía parentesco alguno", "Era la madre de la madre de Sac-Nicte", "Era su tía lejana"], "correct": 2}, {"id": 53613, "question": "¿Qué expresa el cuarto párrafo sobre la vida de la abuela?", "options": ["Que la abuela estaba enferma y triste", "Que Sac-Nicte iba a alegrar sus últimos años", "Que la abuela se fue de la aldea", "Que la abuela dejó de amar a su familia"], "correct": 1}, {"id": 53614, "question": "¿Qué expresa que Sac-Nicte fuera «la hermosa»?", "options": ["Que era una joven de gran belleza", "Que era una anciana enferma", "Que vivía dentro del templo", "Que era una extranjera"], "correct": 0}, {"id": 53615, "question": "¿Qué significa «alegrar» en la frase «le habría de alegrar la vida»?", "options": ["Entristecer", "Cansar", "Apagar", "Hacer feliz"], "correct": 3}]}, {"id": 37, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 5, "title": "Párrafo 5 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Al principio, Hul-Kin y Sac-Nicte parecían odiarse y peleaban constantemente. Sin embargo, al llegar a su juventud, surgió entre ellos una amistad que más tarde se convirtió en un apasionado amor, siendo más grande y avasallador el sentimiento de ella hacia al príncipe, pues Sac-Nicte era inocente y pura. Sin saberlo ni la hechicera ni el cacique, ellos se veían a escondidas, y al cabo de unos meses ella entrego su virginidad y pureza. A pesar de que guardaban en secreto su amor, el cacique se enteró y, enfurecido, envió a su hijo a un pueblo del sur de la península, con cuyo cacique ya había tratado una alianza: casar a Hul-Kin con la princesa de aquel lugar.", "questions": [{"id": 53700, "question": "¿Cómo se trataban Hul-Kin y Sac-Nicte al principio?", "options": ["Se ignoraban por completo", "Eran hermanos de sangre", "Parecían odiarse y peleaban constantemente", "Eran grandes amigos desde la niñez"], "correct": 2}, {"id": 53701, "question": "¿Qué surgió entre ellos al llegar a su juventud?", "options": ["Un pacto comercial entre familias", "Una enemistad que se volvió odio mortal", "Una amistad que se convirtió en amor", "Un interés por la política del pueblo"], "correct": 2}, {"id": 53702, "question": "¿Quién tenía el sentimiento más grande y avasallador?", "options": ["Sac-Nicte", "La hechicera", "El cacique Halach-Huinic", "Hul-Kin"], "correct": 0}, {"id": 53703, "question": "¿Por qué se decía que Sac-Nicte era inocente y pura?", "options": ["Porque era hija de un sacerdote", "Porque vivía en un templo sagrado", "Porque su amor era sincero y sin malicia", "Porque era rica y poderosa"], "correct": 2}, {"id": 53704, "question": "¿Dónde se veían los jóvenes?", "options": ["En el mercado público", "En la casa del cacique", "A escondidas", "En la plaza del pueblo"], "correct": 2}, {"id": 53705, "question": "¿Qué entregó Sac-Nicte a Hul-Kin?", "options": ["Su virginidad y su pureza", "Una joya de oro", "Un mapa del cenote", "Un mensaje secreto"], "correct": 0}, {"id": 53706, "question": "¿Quién se enteró de la relación entre los jóvenes?", "options": ["Los sacerdotes del templo", "Solo la hechicera", "El cacique", "Todo el pueblo de Zací"], "correct": 2}, {"id": 53707, "question": "¿Cómo reaccionó el cacique al enterarse?", "options": ["Desterró a la hechicera de la ciudad", "Los dejó en paz sin decir nada", "Los bendijo y organizó una boda inmediata", "Se enfureció y envió a su hijo al sur de la península"], "correct": 3}, {"id": 53708, "question": "¿A dónde envió el cacique a su hijo?", "options": ["A un pueblo del sur de la península", "A las montañas del norte", "A la ciudad de Mérida", "A la costa del golfo de México"], "correct": 0}, {"id": 53709, "question": "¿Con qué propósito envió el cacique a Hul-Kin al sur?", "options": ["Para casarlo con la princesa de aquel lugar", "Para construir un cenote nuevo", "Para pedir ayuda militar al rey", "Para aprender el arte de la guerra"], "correct": 0}, {"id": 53710, "question": "¿Con qué cacique del sur ya había tratado una alianza el padre?", "options": ["Con los sacerdotes del templo", "Con el cacique de aquel pueblo del sur", "Con el cacique de Zací", "Con la hechicera de la familia Cocom"], "correct": 1}, {"id": 53711, "question": "¿Qué significa «avasallador» en el texto?", "options": ["Silencioso y tímido", "Abrumador, que domina por completo", "Pequeño y frágil", "Ligero y pasajero"], "correct": 1}, {"id": 53712, "question": "¿Qué significa «enfurecido» en el texto?", "options": ["Muy contento y tranquilo", "Triste y resignado", "Cansado y sin fuerzas", "Lleno de ira y furia"], "correct": 3}, {"id": 53713, "question": "¿Qué quiere decir «a pesar de que guardaban en secreto su amor»?", "options": ["Que el amor fue público desde el principio", "Que el amor se mantenía oculto, aunque el cacique lo descubrió", "Que la pareja nunca se amó de verdad", "Que el amor terminó antes de empezar"], "correct": 1}, {"id": 53714, "question": "¿Cuál era la alianza que motivó la separación?", "options": ["Entregar Zací a los enemigos", "Unir los cenotes de dos ciudades", "Intercambiar tierras de cultivo", "Casar a Hul-Kin con la princesa del sur"], "correct": 3}, {"id": 53715, "question": "¿Qué tipo de relación se describe al inicio entre Hul-Kin y Sac-Nicte?", "options": ["Una relación de maestro y alumna", "Una relación de comercio", "Una relación de familia", "Una relación hostil que luego cambió"], "correct": 3}, {"id": 53716, "question": "¿Qué provocó el cambio de sentimientos entre los jóvenes?", "options": ["Un viaje a otra ciudad", "La llegada de un ejército extranjero", "La muerte de la hechicera", "El trato y la convivencia que los hizo amarse"], "correct": 3}, {"id": 53717, "question": "¿Por qué ella entregó su virginidad a Hul-Kin?", "options": ["Porque lo amaba, según el texto", "Por obligación de la hechicera", "Porque se lo ordenaron los dioses", "Por dinero que le ofreció el cacique"], "correct": 0}, {"id": 53718, "question": "¿Qué sucedió con los encuentros de los jóvenes al final del párrafo?", "options": ["Terminaron por voluntad de Sac-Nicte", "Se volvieron públicos y celebrados", "Continuaron sin ser descubiertos", "El cacique los descubrió y los separó"], "correct": 3}, {"id": 53719, "question": "¿Qué se refiere la expresión «al cabo de unos meses»?", "options": ["Al día siguiente", "En el mismo instante", "Después de algunos meses", "Después de muchos años"], "correct": 2}, {"id": 53720, "question": "¿Qué idea central transmite el quinto párrafo?", "options": ["La llegada de nuevos gobernantes", "La historia de la fundación de una ciudad", "Un amor prohibido que terminó en separación por decisión del cacique", "Una alianza exitosa entre dos pueblos"], "correct": 2}, {"id": 53721, "question": "¿Qué sentimiento se volvió apasionado entre los jóvenes?", "options": ["La envidia", "El amor", "La ira", "La indiferencia"], "correct": 1}, {"id": 53722, "question": "¿Qué motivo tenía el cacique para enviar a su hijo al sur?", "options": ["Organizar una guerra contra los cocomes", "Protegerlo de los peligros del cenote", "Llevarlo a estudiar a otra ciudad", "Cumplir una alianza ya acordada con el cacique del sur"], "correct": 3}, {"id": 53723, "question": "¿Qué significa «enterarse» en el texto?", "options": ["Llegar a saber algo", "Enseñar algo", "Ocultar algo", "Olvidar algo"], "correct": 0}, {"id": 53724, "question": "¿Qué idea expresa «sin saberlo ni la hechicera ni el cacique»?", "options": ["Que ambos ignoraban la relación secreta", "Que ambos estaban de acuerdo con la boda", "Que ambos amaban a Sac-Nicte", "Que ambos aprobaban la relación"], "correct": 0}, {"id": 53725, "question": "¿Qué relación tenía el cacique con el cacique del sur?", "options": ["Eran hermanos", "Tenían una alianza ya acordada", "Eran enemigos mortales", "No se conocían"], "correct": 1}, {"id": 53726, "question": "¿A qué se refiere «aquel lugar» en la frase «la princesa de aquel lugar»?", "options": ["Al templo del norte", "A la ciudad de Zací", "Al pueblo del sur de la península", "Al cenote sagrado"], "correct": 2}, {"id": 53727, "question": "¿Qué significa «apasionado» en el texto?", "options": ["Frío y distante", "Intenso y lleno de pasión", "Pequeño y frágil", "Efímero y breve"], "correct": 1}, {"id": 53728, "question": "¿Cuánto tiempo pasó entre el inicio de los encuentros y la entrega de la joven?", "options": ["Varios años", "Unos meses", "Un solo día", "Una semana"], "correct": 1}, {"id": 53729, "question": "¿Cuál era el estado de ánimo del cacique al enterarse?", "options": ["Feliz", "Indiferente", "Preocupado por el clima", "Enfurecido"], "correct": 3}, {"id": 53730, "question": "¿Qué quiere decir «a escondidas»?", "options": ["En público y con permiso", "En secreto, sin que nadie lo viera", "En la iglesia del pueblo", "Con la presencia del padre"], "correct": 1}]}, {"id": 38, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 6, "title": "Párrafo 6 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Desde su separación, la alegría escapó del alma de Sac-Nicte. Sus ojos perdieron el brillo de la ilusión y entre llantos le contó a su amada abuela el secreto. Estaba embarazada y no quería vivir más. La abuela, afligida y preocupada, le prometió que con la ayuda de los dioses y sus hechizos le traería de vuelta a Hul-Kin.", "questions": [{"id": 53800, "question": "¿Qué le pasó a la alegría de Sac-Nicte tras la separación?", "options": ["Se multiplicó con los años", "Se trasladó a su abuela", "Se mantuvo igual de intensa", "Escapó de su alma"], "correct": 3}, {"id": 53801, "question": "¿Qué perdieron los ojos de Sac-Nicte?", "options": ["La luz del día", "El brillo de la ilusión", "La capacidad de ver", "El color original"], "correct": 1}, {"id": 53802, "question": "¿A quién le contó Sac-Nicte el secreto?", "options": ["A su madre", "A Hul-Kin", "A su abuela", "Al cacique"], "correct": 2}, {"id": 53803, "question": "¿Qué secreto reveló Sac-Nicte a su abuela?", "options": ["Que estaba embarazada", "Que se iba a casar con otro hombre", "Que había perdido su piedra preciosa", "Que quería huir del pueblo"], "correct": 0}, {"id": 53804, "question": "¿Qué sentimiento provocó en Sac-Nicte la noticia de su embarazo?", "options": ["Una alegría enorme que la hizo celebrar", "Una gran tristeza que la llevó a no querer vivir", "Indiferencia ante su situación", "Una valentía para enfrentar al cacique"], "correct": 1}, {"id": 53805, "question": "¿Cómo reaccionó la abuela al oír el secreto?", "options": ["Con indiferencia total", "Con enojo contra los dioses", "Afligida y preocupada", "Con alegría y celebración"], "correct": 2}, {"id": 53806, "question": "¿Qué prometió la abuela a Sac-Nicte?", "options": ["Enviarla a vivir a otro pueblo", "Traerle de vuelta a Hul-Kin con la ayuda de los dioses y sus hechizos", "Ocultarle el embarazo a todos", "Casarla con un comerciante rico"], "correct": 1}, {"id": 53807, "question": "¿Qué significa «afligida» en el texto?", "options": ["Triste y preocupada", "Cansada y dormida", "Contenta y animada", "Enojada y violenta"], "correct": 0}, {"id": 53808, "question": "¿Qué medios usaría la abuela para traer de vuelta a Hul-Kin?", "options": ["Un viaje al sur de la península", "El dinero del cacique", "Los dioses y sus hechizos", "Las armas de los guerreros"], "correct": 2}, {"id": 53809, "question": "¿Qué significa «desde su separación» al inicio del párrafo?", "options": ["Antes de conocerse", "A partir del momento en que se separaron", "Después de la maldición del cenote", "Durante la boda de Hul-Kin"], "correct": 1}, {"id": 53810, "question": "¿Qué significaba para Sac-Nicte haber perdido su alegría?", "options": ["Que dejó de sentir ilusión por la vida", "Que dejó de hablar con su abuela", "Que se mudó a otra ciudad", "Que empezó a trabajar en el templo"], "correct": 0}, {"id": 53811, "question": "¿Qué significa «entre llantos» en el texto?", "options": ["Mientras lloraba", "Mientras cantaba", "Mientras reía a carcajadas", "Mientras dormía"], "correct": 0}, {"id": 53812, "question": "¿Qué ocurrió con la alegría y la ilusión de Sac-Nicte después de la separación?", "options": ["Desaparecieron de su vida", "Siguieron igual que antes", "Se trasladaron a Hul-Kin", "Aumentaron con la noticia del embarazo"], "correct": 0}, {"id": 53813, "question": "¿Qué significa «ilusión» en la frase «el brillo de la ilusión»?", "options": ["Sueño nocturno", "Esperanza y deseo", "Mentira", "Engaño visual"], "correct": 1}, {"id": 53814, "question": "¿Cómo describe el texto a Sac-Nicte al contar su secreto?", "options": ["Con calma", "Con alegría", "Entre llantos", "Con enojo"], "correct": 2}]}, {"id": 39, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 7, "title": "Párrafo 7 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Un día, Sac-Nicte se enteró de que Hul-Kin se casaba. Tomó entonces una terrible decisión y la noche antes de la boda amarró una piedra a su larga cabellera y se arrojó a las aguas del cenote. En ese preciso momento, Hul-Kin sufrió un fuerte dolor en el pecho y tuvo un atroz presentimiento que lo obligó a regresar a Zací esa misma noche para averiguar qué había ocurrido. Al llegar, encontró a la hechicera llorando y maldiciendo enloquecida. Al enterarse de todo, Hul-Kin se arrojó al cenote para morir con su verdadero amor: Sac-Nicte. La hechicera se acercó al borde de la bóveda y, tirando una flor blanca, gritó sollozando: “Sac-Nicte, ¡te he cumplido! Te he traído a Hul-Kin, y ¡estará contigo para siempre!”. Finalmente, en un arranque de ira, la hechicera puso una maldición en el cenote: cada año, cuando el manto verde del agua se tornara oscuro, el cenote cobraría una vida en sacrificio por ese gran amor prohibido.", "questions": [{"id": 53900, "question": "¿Qué se enteró Sac-Nicte un día?", "options": ["Que Hul-Kin se casaba", "Que el cacique la había desterrado", "Que su abuela había muerto", "Que el cenote se estaba secando"], "correct": 0}, {"id": 53901, "question": "¿Qué decisión tomó Sac-Nicte?", "options": ["Pedir perdón al cacique", "Casarse con otro joven de Zací", "Huir del pueblo con un mensajero", "Una terrible decisión: quitarse la vida"], "correct": 3}, {"id": 53902, "question": "¿Cuándo se arrojó Sac-Nicte al cenote?", "options": ["Durante la primera luna llena del otoño", "El día después de la boda", "La noche antes de la boda", "En la mañana del primer día del año"], "correct": 2}, {"id": 53903, "question": "¿Qué amarró Sac-Nicte a su cabellera antes de arrojarse?", "options": ["Una piedra", "Una flor blanca", "Una cuerda de henequén", "Un collar de jade"], "correct": 0}, {"id": 53904, "question": "¿Dónde se arrojó Sac-Nicte?", "options": ["Al río del pueblo", "Al mar Caribe", "A las aguas del cenote", "A un pozo abandonado"], "correct": 2}, {"id": 53905, "question": "¿Qué sintió Hul-Kin en el momento en que ella se arrojó?", "options": ["Ningún cambio en su cuerpo", "Un sueño tranquilo", "Una gran alegría", "Un fuerte dolor en el pecho"], "correct": 3}, {"id": 53906, "question": "¿Qué tuvo Hul-Kin en ese momento?", "options": ["Un sueño profundo", "Un atroz presentimiento", "Una gran fiebre", "Una invitación de la hechicera"], "correct": 1}, {"id": 53907, "question": "¿Qué hizo Hul-Kin después del presentimiento?", "options": ["Huyó a las montañas", "Regresó a Zací esa misma noche", "Se fue a dormir a la casa del cacique", "Se quedó en el sur con la princesa"], "correct": 1}, {"id": 53908, "question": "¿Qué encontró Hul-Kin al llegar a Zací?", "options": ["Un pueblo vacío y silencioso", "A Sac-Nicte cantando en el templo", "A la hechicera llorando y maldiciendo enloquecida", "A su padre celebrando la boda"], "correct": 2}, {"id": 53909, "question": "¿Qué hizo Hul-Kin al enterarse de todo?", "options": ["Acusó a la hechicera ante el cacique", "Se arrojó al cenote para morir con su verdadero amor", "Pidió perdón a su padre", "Se fue a vivir al sur con la princesa"], "correct": 1}, {"id": 53910, "question": "¿Qué quería Hul-Kin al arrojarse al cenote?", "options": ["Escapar de la maldición de la hechicera", "Huir del pueblo para siempre", "Morir con Sac-Nicte, su verdadero amor", "Encontrar un tesoro en el fondo del cenote"], "correct": 2}, {"id": 53911, "question": "¿Qué hizo la hechicera al acercarse al borde de la bóveda?", "options": ["Tiró su bastón al agua", "Tiró una antorcha encendida", "Tiró una piedra al cenote", "Tiró una flor blanca"], "correct": 3}, {"id": 53912, "question": "¿Qué gritó la hechicera al tirar la flor?", "options": ["¡El cenote no se llevará a nadie más!", "¡Que la princesa venga al pueblo!", "¡Sac-Nicte, te he cumplido! Te he traído a Hul-Kin", "¡Hul-Kin, vuelve a casa ahora!"], "correct": 2}, {"id": 53913, "question": "¿Qué significa «sollozando» en el texto?", "options": ["Cantando en voz baja", "Riendo a carcajadas", "Gritando con enojo", "Llorando con sollozos"], "correct": 3}, {"id": 53914, "question": "¿Qué maldición puso la hechicera en el cenote?", "options": ["Que el cenote se secara para siempre", "Que cada año cobrara una vida en sacrificio", "Que Hul-Kin nunca encontrara la paz", "Que nadie volviera a bañarse en él"], "correct": 1}, {"id": 53915, "question": "¿Qué señal anunciaría que el cenote cobraría una vida?", "options": ["Cuando sonara la campana del templo", "Cuando el manto verde del agua se tornara oscuro", "Cuando el sol cubriera la bóveda", "Cuando la flor blanca flotara en la superficie"], "correct": 1}, {"id": 5391 (function(){

// {id_antiguo: id_conservado, ...} — inyectado por build_standalone.py a partir
// de data/dedupe_remap.json. Se define ANTES de migrateDataVersion() porque

var FC_REMAP = {"74": 73, "99": 719, "104": 17, "122": 630, "129": 632, "135": 628, "139": 638, "164": 607, "185": 622, "223": 1, "259": 5, "347": 562, "510": 20, "584": 621, "599": 53, "635": 134, "639": 141, "640": 142, "643": 146, "646": 155, "649": 158, "650": 159, "655": 149, "657": 227, "658": 567, "659": 594, "666": 244, "668": 252, "670": 263, "671": 268, "672": 270, "677": 303, "679": 329, "683": 334, "686": 344, "690": 588, "694": 364, "695": 427, "699": 445, "702": 499, "708": 53, "709": 61, "717": 92, "718": 94, "724": 115};
// ¿Cambió la versión de datos desde la última visita? Las migraciones que se

// anteriores) deben correr únicamente cuando esto es verdadero: si se repiten en
// cada carga borran el historial recién guardado y la misma tarjeta vuelve a
// salir todos los días aunque se responda bien.
var DATA_VERSION_CHANGED = DB.dataVersion !== APP_VERSION;
// Se declara aquí (antes de las migraciones, que ya guardan) para no perder el
// error de un guardado fallido; saveDB() vive más abajo.
var DB_SAVE_ERROR = "";
migrateDataVersion();
migrateFlashcards();

function key(){ return "nmx_db_" + (phone||"").trim(); }
function loadDB(){
  try {
    var db = JSON.parse(localStorage.getItem(key()) || "{}") || {};
    if(!db.flashcards || typeof db.flashcards !== "object") db.flashcards={};
    if(!db.simSeen || typeof db.simSeen !== "object") db.simSeen={};
    if(!db.bankAdded || typeof db.bankAdded !== "object") db.bankAdded={};
    if(!db.correctDays || typeof db.correctDays !== "object") db.correctDays={};
    if(!Array.isArray(db.attempts)) db.attempts=[];
    if(!db.daily || typeof db.daily !== "object") db.daily={};
    if(!db.lecParas || typeof db.lecParas !== "object") db.lecParas={};
    if(!db.lecQ || typeof db.lecQ !== "object") db.lecQ={};
    return db;
  }
  catch(e){ return {flashcards:{},simSeen:{},bankAdded:{},correctDays:{},attempts:[],daily:{},lecParas:{},lecQ:{}}; }
}
// Error del último guardado ("" si todo salió bien). Se muestra en Flashcards:
// si localStorage está lleno o el navegador está en modo privado, el progreso se
// perdía en silencio y las tarjetas respondidas volvían al día siguiente con el
// contador sin cambios.
function saveDB(){
  try {
    localStorage.setItem(key(), JSON.stringify(DB));
    DB_SAVE_ERROR = "";
  } catch(e){
    DB_SAVE_ERROR = String(e && e.message || e);
    if(typeof console !== "undefined") console.error("No se pudo guardar el progreso", e);
  }
}
function loadFarsiCache(){
  try { return JSON.parse(localStorage.getItem("nmx_farsi_translations") || "{}") || {}; }
  catch(e){ return {}; }
}

  try { localStorage.setItem("nmx_farsi_translations",JSON.stringify(FA_CACHE)); }
  catch(e){ /* Translation still works for this session if storage is full. */ }
}
function user(){ return DB.user || {id:1,name:"",practiceSession:0,totalCorrect:0,totalAnswered:0,masteredCount:0,simuladorApproved:false,lecturaApproved:false}; }
function isHistoryId(qid){ qid=+qid; for(var i=0;i<HIST.length;i++){ if(HIST[i].id===qid) return true; } return false; }
// Una tarjeta es válida si la pregunta fue respondida en el simulador
// (DB.simSeen o DB.correctDays) o se añadió a mano desde el banco (DB.bankAdded).
function cardAllowed(qid){
  qid=+qid;
  var seen=DB.simSeen||{}, added=DB.bankAdded||{};
  return !!seen[qid] || !!added[qid] || wasAnswered(qid);
}
// Historial antiguo: antes de DB.simSeen solo quedaba registro de las preguntas
// contestadas correctamente (DB.correctDays). Eso también prueba que la pregunta
// se respondió en el simulador, así que cuenta como "respondida".
function wasAnswered(qid){
  var arr=(DB.correctDays||{})[qid];
  return Array.isArray(arr) && arr.length>0;
}
// Al eliminar preguntas duplicadas del banco (mismo concepto en dos ids), el
// progreso guardado bajo el id viejo se reasigna al id que se conservó; los ids
// que ya no existen en el banco se descartan. Es importante NO purgar por rango
// de id en cada build: purgar a diario reiniciaba el progreso (contador en 0)
// de las preguntas del lote 605+ y hacía que siempre se repitieran las mismas
// 8-10 preguntas sin que el contador avanzara.
function migrateDataVersion(){
  var changed = false;
  ["flashcards","simSeen","bankAdded","correctDays"].forEach(function(mapName){
    var map = DB[mapName];
    if(!map || typeof map !== "object") return;
    for(var k in map){
      var old = +k;
      var target = (FC_REMAP || {})[old];
      if(target){
        if(mapName === "correctDays"){
          var src = Array.isArray(map[k]) ? map[k] : [];
          var dst = Array.isArray(map[target]) ? map[target] : [];
          var seen = {};
          dst.forEach(function(d){ seen[d] = true; });
          src.forEach(function(d){ if(!seen[d]){ dst.push(d); seen[d] = true; } });
          dst.sort(function(a,b){ return a-b; });
          map[target] = dst;
        } else if(mapName === "flashcards" && map[k] && typeof map[k] === "object" && map[target] && typeof map[target] === "object"){
          var a = map[k], b = map[target];
          var last = [b.lastReviewedAt, a.lastReviewedAt].filter(Boolean).sort().pop() || null;
          map[target] = {
            correctCount: Math.max(b.correctCount||0, a.correctCount||0),
            learned: !!(b.learned || a.learned),
            lastReviewedAt: last,
            wrong: false,
          };
        } else {
          map[target] = map[k]; // booleans de simSeen / bankAdded
        }
        delete map[k];
        changed = true;
      } else if(!isHistoryId(old)){
        delete map[k];
        changed = true;
      }
    }
  });
  DB.dataVersion = APP_VERSION;
  saveDB();
  if(changed) saveDB();
}
function migrateFlashcards(){
  var fc=DB.flashcards||{};
  var seen=DB.simSeen||{};
  var added=DB.bankAdded||{};
  var changed=false;
  for(var qid in fc){
    var val=fc[qid];
    if(Array.isArray(val)){
      // Migrate from old format (array of marks) to new format (object)
      var correctCount=val.filter(function(x){return x==="facil";}).length;
      fc[qid]={correctCount:correctCount,learned:correctCount>=5,lastReviewedAt:null};
      changed=true;
      val=fc[qid];
    }
    // Solo preguntas de Historia/Cultura (del simulador o agregadas desde el
    // banco) pertenecen a flashcards. Se elimina lo de otras secciones (lectura).
    if(!isHistoryId(qid)){
      delete fc[qid];
      changed=true;
      continue;
    }
    // ...y solo si viene del simulador o se añadió desde el banco.
    if(wasAnswered(qid) && !seen[qid]){ seen[qid]=true; changed=true; }
    if(!cardAllowed(qid)){
      delete fc[qid];
      delete seen[qid];
      changed=true;
      continue;
    }
    // Una sola vez por versión de datos: si una tarjeta nueva o pendiente quedó
    // bloqueada con fecha por versiones anteriores, desbloquearla para que esté
    // disponible de inmediato. NO debe correr en cada carga: borraba el
    // lastReviewedAt de toda tarjeta con <=1 acierto, así que su historial nunca
    // cambiaba y volvía a salir todos los días aunque se respondiera bien.
    if(DATA_VERSION_CHANGED && val && !val.learned && (val.correctCount||0) <= 1 && val.lastReviewedAt){
      val.lastReviewedAt = null;
      changed = true;
    }
  }
  for(var sid in seen){
    if(!isHistoryId(sid)){ delete seen[sid]; changed=true; }
  }
  for(var aid in added){
    if(!isHistoryId(aid)){ delete added[aid]; changed=true; continue; }
    // Una pregunta añadida desde el banco siempre tiene su tarjeta (disponible para repasar).
    if(!fc[aid]){ fc[aid]={correctCount:0,learned:false,lastReviewedAt:null}; changed=true; }
  }
  DB.simSeen=seen;
  DB.bankAdded=added;
  DB.flashcards=fc;
  // Keep the displayed mastered count in sync after the cleanup.
  var u=user();
  var newCount=learnedIds().length;
  if(u.masteredCount!==newCount){ u.masteredCount=newCount; DB.user=u; changed=true; }
  if(changed){ saveDB(); }
}
// Día local del usuario (antes se usaba toISOString(), que es UTC: para UTC-6

// a las pocas horas en vez de al día siguiente).
function localDay(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function today(){ return localDay(); }
function setUser(patch){ DB.user = Object.assign({}, user(), patch); saveDB(); }

}
