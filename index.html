:root{--bg:#022c22;--bg2:#064e3b;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--ink:#ecfdf5;--mut:#a7f3d0;--gold:#fcd34d;--rose:#fb7185;--green:#6ee7b7;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;font-weight:700;padding:10px 18px;border-radius:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.ghost[aria-pressed="true"]{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.55);color:#fde68a}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d1fae5;border:1px solid var(--line)}
.pill.gold{background:rgba(252,211,77,.15);color:#fde68a;border-color:rgba(252,211,77,.3)}
.pill.green{background:rgba(110,231,183,.15);color:#a7f3d0;border-color:rgba(110,231,183,.3)}
.pill.rose{background:rgba(251,113,133,.15);color:#fecdd3;border-color:rgba(251,113,133,.3)}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px}
.mut{color:var(--mut)}
.small{font-size:12px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;transition:background .15s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.sel{border-color:var(--gold);background:rgba(252,211,77,.18)}
.opt.ok{border-color:var(--green);background:rgba(110,231,183,.15)}
.opt.bad{border-color:var(--rose);background:rgba(251,113,133,.15)}
.opt.locked{opacity:.4}
.translation{color:#bfdbfe;font-style:italic;font-size:14px;margin-top:6px;padding:8px 10px;background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;border-radius:6px;white-space:pre-wrap}
.translation.fa{direction:rtl;text-align:right;font-style:normal;font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.8;border-left:0;border-right:3px solid #3b82f6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tab.on{background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:24px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#fcd34d,#fb7185);border-radius:999px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loginbox{max-width:420px;margin:8vh auto}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;margin:6px 0 12px}
textarea.field{min-height:120px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.passage{max-height:46vh;overflow:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.55}
#flashcard{margin:20px 0}
.qtext{font-size:19px;font-weight:700;line-height:1.4;margin:12px 0}
.footer{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}
.marker{color:#34d399;font-weight:700}
.badmark{color:#fda4af;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.badge.ok{background:rgba(110,231,183,.18);color:#6ee7b7}
.badge.no{background:rgba(251,113,133,.18);color:#fb7185}
</style>

akes it compulsory through upper secondary.", "pregunta_fa": null, "opciones_fa": null, "explicacion_fa": null}, {"id": 725, "pregunta": "¿Cuánto dura cada nivel de la educación básica?", "opciones": ["3, 5 y 3 años", "2, 5 y 2 años", "Preescolar 3 años, primaria 6 y secundaria 3.", "4, 6 y 2 años"], "correct": 2, "explicacion": "Suma 12 años de educación básica.", "categoria": "Cívica", "subtema": "Educación", "dificultad": "media", "pregunta_en": "How long does each level of basic education last?", "opciones_en": ["3, 5 and 3 years", "2, 5 and 2 years", "Preschool 3 years, primary 6 and secondary 3.", "4, 6 and 2 years"], "explicacion_en": "It adds up to 12 years of basic education.", "pregunta_fa": null, "opciones_fa": null, "explicacion_fa": null}, {"id": 726, "pregunta": "¿Cuándo y por quién se fundó la Escuela Nacional Preparatoria?", "opciones": ["En 1910 por Porfirio Díaz", "El 2 de diciembre de 1867, durante el periodo de Benito Juárez.", "En 1929 por la UNAM", "En 1833 por Gómez Farías"], "correct": 1, "explicacion": "Fue impulsada por el positivismo de Gabino Barreda.", "categoria": "Historia", "subtema": "Educación", "dificultad": "media", "pregunta_en": "When and by whom was the National Preparatory School founded?", "opciones_en": ["In 1910 by Porfirio Díaz", "On December 2, 1867, during Benito Juárez's period.", "In 1929 by UNAM", "In 1833 by Gómez Farías"], "explicacion_en": "It was driven by Gabino Barreda's positivism.", "pregunta_fa": null, "opciones_fa": null, "explicacion_fa": null}, {"id": 727, "pregunta": "¿Cuánto dura el ciclo escolar primario en México?", "opciones": ["Diez meses", "Un año (la primaria completa son 6 años).", "Seis meses", "Dos años"], "correct": 1, "explicacion": "Cada ciclo escolar corresponde a un año lectivo.", "categoria": "Cívica", "subtema": "Educación", "dificultad": "media", "pregunta_en": "How long does the primary school year last in Mexico?", "opciones_en": ["Ten months", "One year (full primary is 6 years).", "Six months", "Two years"], "explicacion_en": "Each school cycle corresponds to one school year.", "pregunta_fa": null, "opciones_fa": null, "explicacion_fa": null}, {"id": 728, "pregunta": "¿Qué lugar ocupa México en la economía mundial?", "opciones": ["El lugar 16 entre las economías más grandes del mundo.", "Entre las 100", "Entre las 5", "Entre las 50"], "correct": 0, "explicacion": "México es una economía emergente relevante.", "categoria": "Historia", "subtema": "Economía", "dificultad": "media", "pregunta_en": "What place does Mexico hold in the world economy?", "opciones_en": ["16th place among the world's largest economies.", "Among the top 100", "Among the top 5", "Among the top 50"], "explicacion_en": "Mexico is a relevant emerging economy.", "pregunta_fa": null, "opciones_fa": null, "explicacion_fa": null}], "passages": [{"id": 1, "title": "El Grito de Dolores y el mes patrio", "topic": "Historia y cultura civica", "text": "En México, la noche del 15 de septiembre tiene un significado especial. En plazas de todo el país, miles de personas se reúnen para escuchar la ceremonia conocida como el Grito. Esta conmemoración recuerda el llamado a levantarse contra el dominio español realizado en 1810 por Miguel Hidalgo y Costilla, en Dolores. Aunque no existe un registro textual único de las palabras exactas de ese primer llamado, históricamente se reconoce como el inicio de la lucha de Independencia. Con el paso del tiempo, la ceremonia evolucionó y se convirtió en un acto cívico nacional. Hoy, autoridades de distintos niveles repiten la ceremonia en sus localidades, mientras la gente porta banderas, escucha música regional y participa en festejos comunitarios. En ese contexto, el simbolismo patrio tiene un papel central: los colores verde, blanco y rojo aparecen en edificios, ropa y decoraciones. Comprender esta celebración ayuda a entender por qué septiembre es considerado mes patrio y por qué el Grito no es solo una fiesta, sino también una memoria compartida de identidad histórica.", "text_en": "In Mexico, the night of September 15 has special meaning. In plazas across the country, thousands of people gather to hear the ceremony known as the Grito. This commemoration recalls the call to rise up against Spanish rule made in 1810 by Miguel Hidalgo y Costilla in Dolores. Although there is no single written record of the exact words of that first call, it is historically recognized as the start of the struggle for Independence. Over time the ceremony evolved and became a national civic act. Today, authorities at different levels repeat the ceremony in their localities while people carry flags, listen to regional music, and take part in community festivities. In this context, patriotic symbolism plays a central role: the green, white, and red colors appear on buildings, clothing, and decorations. Understanding this celebration helps explain why September is considered the patriotic month and why the Grito is not only a party, but also a shared memory of historical identity.", "text_fa": null, "questions": [{"id": 10100, "question": "¿Qué se conmemora en la ceremonia del Grito?", "options": ["La promulgación de la Constitución de 1917", "La consumación de la Independencia", "El inicio de la lucha de Independencia", "La Revolución Mexicana"], "correct": 2, "question_en": "What is commemorated in the Grito ceremony?", "options_en": ["The enactment of the 1917 Constitution", "The consummation of Independence", "The start of the Independence struggle", "The Mexican Revolution"], "question_fa": null, "options_fa": null}, {"id": 10101, "question": "¿En qué año se ubica históricamente el llamado de Hidalgo?", "options": ["1821", "1810", "1910", "1857"], "correct": 1, "question_en": "In what year is Hidalgo's call historically placed?", "options_en": ["1821", "1810", "1910", "1857"], "question_fa": null, "options_fa": null}, {"id": 10102, "question": "¿Qué elemento se menciona como parte del simbolismo patrio?", "options": ["Escudos regionales extranjeros", "Solo fuegos artificiales", "Únicamente música clásica", "Los colores verde, blanco y rojo"], "correct": 3, "question_en": "Which element is mentioned as part of the patriotic symbolism?", "options_en": ["Foreign regional coats of arms", "Only fireworks", "Only classical music", "The green, white and red colors"], "question_fa": null, "options_fa": null}, {"id": 10103, "question": "Según el texto, el Grito actual se entiende principalmente como:", "options": ["Un acto comercial", "Una ceremonia cívica con memoria histórica", "Un evento deportivo", "Una celebración privada"], "correct": 1, "question_en": "According to the text, today's Grito is mainly understood as:", "options_en": ["A commercial event", "A civic ceremony with historical memory", "A sporting event", "A private celebration"], "question_fa": null, "options_fa": null}, {"id": 10104, "question": "¿Qué afirma el texto sobre las palabras exactas del primer Grito?", "options": ["Se escribieron un siglo después por decreto", "Se conservan en audio original", "Fueron dictadas por el Congreso", "No existe un registro textual único"], "correct": 3, "question_en": "What does the text state about the exact words of the first Grito?", "options_en": ["They were written a century later by decree", "They survive in original audio", "They were dictated by Congress", "There is no single written record"], "question_fa": null, "options_fa": null}, {"id": 10105, "question": "¿Por qué septiembre se considera mes patrio en el texto?", "options": ["Por una tradición exclusivamente religiosa", "Por ser fin de cosecha", "Por el inicio de clases", "Por la conmemoración del inicio de la Independencia"], "correct": 3, "question_en": "Why is September considered the patriotic month in the text?", "options_en": ["Because of an exclusively religious tradition", "Because it marks the end of harvest", "Because school starts", "Because it commemorates the start of Independence"], "question_fa": null, "options_fa": null}]}, {"id": 2, "title": "Refranes mexicanos y lenguaje cotidiano", "topic": "Lengua y cultura popular", "text": "Los refranes forman parte de la vida cotidiana en México. Son frases breves que transmiten experiencia, consejo o una forma de ver la realidad. Muchas veces se usan para orientar una decisión sin dar una explicación larga. Por ejemplo, cuando alguien dice «Más vale tarde que nunca», sugiere que es preferible completar una acción, aunque sea después del momento ideal. Otro refrán muy conocido es «Al mal tiempo, buena cara», que invita a mantener una actitud positiva frente a las dificultades. También se escucha «A darle que es mole de olla», expresión que anima a comenzar una tarea con energía. El valor de estos dichos no está solo en su significado literal, sino en su función social: permiten resumir ideas complejas en pocas palabras y facilitan la comunicación entre generaciones. En muchos hogares, abuelos y padres comparten refranes con niñas, niños y jóvenes como parte de una educación informal. Así, el lenguaje popular se convierte en una vía para conservar memoria cultural y fortalecer la identidad comunitaria.", "text_en": "Proverbs (refranes) are part of everyday life in Mexico. They are short phrases that convey experience, advice, or a way of seeing reality. They are often used to guide a decision without a long explanation. For example, when someone says \"Better late than never\" (Más vale tarde que nunca), they suggest it is preferable to complete an action even after the ideal moment. Another well-known saying is \"Al mal tiempo, buena cara\" (put on a good face in bad weather), which invites keeping a positive attitude toward difficulties. People also hear \"A darle que es mole de olla\" (let's get to it — it's mole de olla), an expression that encourages starting a task with energy. The value of these sayings lies not only in their literal meaning but in their social function: they summarize complex ideas in few words and ease communication between generations. In many homes, grandparents and parents share proverbs with children and young people as informal education. In this way, popular language becomes a way to preserve cultural memory and strengthen community identity.", "text_fa": null, "questions": [{"id": 10200, "question": "¿Para qué se usan principalmente los refranes en el texto?", "options": ["Para traducir idiomas extranjeros", "Para reemplazar leyes", "Para escribir documentos técnicos", "Para resumir consejos y experiencias"], "correct": 3, "question_en": "According to the text, what are proverbs mainly used for?", "options_en": ["To translate foreign languages", "To replace laws", "To write technical documents", "To summarize advice and experience"], "question_fa": null, "options_fa": null}, {"id": 10201, "question": "¿Qué idea transmite «Más vale tarde que nunca»?", "options": ["Es preferible hacer algo tarde que no hacerlo", "Nunca hay que intentar", "Es mejor no actuar", "Solo importa la rapidez"], "correct": 0, "question_en": "What idea does \"Más vale tarde que nunca\" convey?", "options_en": ["It is better to do something late than not at all", "Never try", "It is better not to act", "Only speed matters"], "question_fa": null, "options_fa": null}, {"id": 10202, "question": "¿Qué sugiere «Al mal tiempo, buena cara»?", "options": ["Ignorar los problemas", "Cambiar de ciudad", "Mantener actitud positiva ante dificultades", "Evitar conversar"], "correct": 2, "question_en": "What does \"Al mal tiempo, buena cara\" suggest?", "options_en": ["Ignore problems", "Move to another city", "Keep a positive attitude toward difficulties", "Avoid conversation"], "question_fa": null, "options_fa": null}, {"id": 10203, "question": "¿Cómo interpreta el texto «A darle que es mole de olla»?", "options": ["Evitar el trabajo en equipo", "Comenzar una tarea con energía", "Preparar comida diariamente", "Detener una actividad"], "correct": 1, "question_en": "How does the text interpret \"A darle que es mole de olla\"?", "options_en": ["Avoid teamwork", "Start a task with energy", "Prepare food daily", "Stop an activity"], "question_fa": null, "options_fa": null}, {"id": 10204, "question": "¿Qué papel tienen las familias en la transmisión de refranes?", "options": ["Los comparten como educación informal", "Solo los escriben en libros", "Los sustituyen por lenguaje técnico", "No participan"], "correct": 0, "question_en": "What role do families play in passing on proverbs?", "options_en": ["They share them as informal education", "They only write them in books", "They replace them with technical language", "They do not participate"], "question_fa": null, "options_fa": null}, {"id": 10205, "question": "Según el texto, los refranes ayudan a:", "options": ["Eliminar diferencias regionales", "Conservar memoria cultural", "Debilitar la identidad comunitaria", "Reducir vocabulario"], "correct": 1, "question_en": "According to the text, proverbs help to:", "options_en": ["Erase regional differences", "Preserve cultural memory", "Weaken community identity", "Reduce vocabulary"], "question_fa": null, "options_fa": null}]}, {"id": 3, "title": "Parque Nacional Cañón del Sumidero", "topic": "Geografía y patrimonio natural", "text": "El Cañón del Sumidero es uno de los paisajes naturales más impresionantes de México. Su origen se debe a un largo proceso de fallas geológicas. Tiene un alto valor ecológico y cuenta con 21,789 hectáreas distribuidas en cinco municipios del estado de Chiapas, a pocos kilómetros de su capital, Tuxtla Gutiérrez.\n\nEl cañón consiste en un imponente acantilado que se eleva sobre el cauce del río Grijalva. Sus muros alcanzan más de mil metros de altura y, por su belleza, el lugar ha sido nominado para formar parte de las Siete Nuevas Maravillas Naturales del mundo.\n\nLa luz y el calor sobre las paredes del acantilado, junto con sus abundantes escurrimientos de agua, han permitido que surjan varios microclimas con vegetación y fauna propias en las distintas alturas del cañón. Entre las especies endémicas, es decir, exclusivas de esta zona, se encuentran la salamandra Lengua Hongueada, la cuija mexicana, el chupaflor canelo, el sapo jaspeado, la mojarra de Chiapa de Corzo y el encino enano.\n\nDentro del parque se ubica la presa hidroeléctrica de Chicoasén, una de las mayores obras de ingeniería hidráulica de México, cuyo embalse de 32 kilómetros abarca la totalidad del cañón. Por su riqueza ecológica, el lugar fue decretado Parque Nacional el 8 de diciembre de 1980 y, en 2004, fue clasificado como sitio Ramsar, es decir, un humedal de importancia internacional.", "text_en": "The Sumidero Canyon is one of Mexico's most impressive natural landscapes. Its origin is due to a long process of geological faults. It has high ecological value and covers 21,789 hectares across five municipalities in the state of Chiapas, a few kilometers from its capital, Tuxtla Gutiérrez. The canyon consists of an imposing cliff that rises over the course of the Grijalva River. Its walls reach more than one thousand meters high and, for its beauty, the place has been nominated to be part of the Seven New Natural Wonders of the world. Light and heat on the cliff walls, together with abundant water runoff, have allowed several microclimates with their own vegetation and fauna to emerge at the different heights of the canyon. Among the endemic species — that is, exclusive to this area — are the Lengua Hongueada salamander, the Mexican cuija, the canelo hummingbird, the speckled toad, the Chiapa de Corzo mojarra, and the dwarf oak. Inside the park is the Chicoasén hydroelectric dam, one of Mexico's greatest hydraulic engineering works, whose 32-kilometer reservoir covers the entire canyon. For its ecological richness, the place was declared a National Park on December 8, 1980, and in 2004 it was classified as a Ramsar site, a wetland of international importance.", "text_fa": null, "questions": [{"id": 10300, "question": "¿En qué estado de México se ubica el Cañón del Sumidero?", "options": ["Veracruz", "Chiapas", "Tabasco", "Oaxaca"], "correct": 1, "question_en": "In which Mexican state is the Sumidero Canyon located?", "options_en": ["Veracruz", "Chiapas", "Tabasco", "Oaxaca"], "question_fa": null, "options_fa": null}, {"id": 10301, "question": "¿Cuántas hectáreas abarca el Parque Nacional Cañón del Sumidero?", "options": ["10,000", "45,000", "21,789", "32,000"], "correct": 2, "question_en": "How many hectares does the Sumidero Canyon National Park cover?", "options_en": ["10,000", "45,000", "21,789", "32,000"], "question_fa": null, "options_fa": null}, {"id": 10302, "question": "¿Sobre qué río se eleva el acantilado del cañón?", "options": ["Río Grijalva", "Río Balsas", "Río Usumacinta", "Río Lerma"], "correct": 0, "question_en": "Over which river does the canyon cliff rise?", "options_en": ["Grijalva River", "Balsas River", "Usumacinta River", "Lerma River"], "question_fa": null, "options_fa": null}, {"id": 10303, "question": "¿Qué es la presa de Chicoasén?", "options": ["Un parque de diversiones", "Una reserva de peces", "Un embalse de agua potable", "Una presa hidroeléctrica"], "correct": 3, "question_en": "What is the Chicoasén dam?", "options_en": ["An amusement park", "A fish reserve", "A drinking water reservoir", "A hydroelectric dam"], "question_fa": null, "options_fa": null}, {"id": 10304, "question": "¿En qué fecha fue decretado Parque Nacional el Cañón del Sumidero?", "options": ["8 de diciembre de 1980", "5 de mayo de 1980", "20 de noviembre de 2004", "16 de septiembre de 1980"], "correct": 0, "question_en": "On what date was the Sumidero Canyon declared a National Park?", "options_en": ["December 8, 1980", "May 5, 1980", "November 20, 2004", "September 16, 1980"], "question_fa": null, "options_fa": null}, {"id": 10305, "question": "En 2004, ¿cómo fue clasificado el lugar?", "options": ["Maravilla natural del mundo", "Patrimonio Cultural de la Humanidad", "Sitio Ramsar (humedal de importancia internacional)", "Área urbana protegida"], "correct": 2, "question_en": "In 2004, how was the place classified?", "options_en": ["Natural wonder of the world", "World Cultural Heritage", "Ramsar site (wetland of international importance)", "Protected urban area"], "question_fa": null, "options_fa": null}]}, {"id": 4, "title": "La celebración del Día de Muertos", "topic": "Tradición cultural", "text": "El Día de Muertos se celebra el 1 y 2 de noviembre. En esta festividad se agasaja a los difuntos con ofrendas que incluyen sus alimentos preferidos, agua, flores de cempasúchil, velas, papel picado, pan de muerto y calaveritas de azúcar y chocolate. El objetivo es convidar a los seres queridos que ya no están.\n\nEl Día de Muertos es una muestra de la gran riqueza cultural de México. Esta festividad de origen indígena fue declarada en 2008 por la UNESCO como Patrimonio Cultural Inmaterial de la Humanidad. De raíces prehispánicas, combinadas con la celebración católica del Día de Todos los Santos, busca rendir culto a los antepasados, pues se cree que el 1 y 2 de noviembre las almas de los fallecidos regresan para convivir con los vivos.\n\nEntre los lugares más emblemáticos de esta celebración están Pátzcuaro, en Michoacán, y San Andrés Mixquic, en la Ciudad de México, así como la Huasteca Potosina, Huaquechula, en Puebla, y Ocotepec, en Morelos. En estos sitios se ha mantenido la tradición ancestral de convivencia entre vivos y muertos en casas, calles y cementerios.\n\nMixquic, al sur de la Ciudad de México, en la Delegación Tláhuac, tiene una de las celebraciones más impactantes: todo el pueblo participa en la fiesta para recibir a las almas de los difuntos. El 1 de noviembre llegan las ánimas de los niños y el día 2 las de los adultos, en medio de ofrendas, oraciones y el repique de las campanas. La alumbrada, o noche de las velas, es el evento más significativo: el 2 de noviembre, a partir de las seis de la tarde, los habitantes de Mixquic van al panteón con velas, incienso y flores, iluminan todas las tumbas y permanecen junto a ellas para que la luz de las velas guíe a las ánimas en su camino de regreso.", "text_en": "The Day of the Dead is celebrated on November 1 and 2. During this festivity, the deceased are honored with offerings that include their favorite foods, water, marigold flowers, candles, papel picado, pan de muerto, and sugar or chocolate skulls. The goal is to share with the loved ones who are no longer here. The Day of the Dead is a sign of Mexico's great cultural richness. This festivity of indigenous origin was declared in 2008 by UNESCO as Intangible Cultural Heritage of Humanity. Of pre-Hispanic roots, combined with the Catholic celebration of All Saints' Day, it seeks to honor ancestors, since it is believed that on November 1 and 2 the souls of the deceased return to live with the living. Among the most emblematic places for this celebration are Pátzcuaro in Michoacán and San Andrés Mixquic in Mexico City, as well as the Huasteca Potosina, Huaquechula in Puebla, and Ocotepec in Morelos. In these places the ancestral tradition of coexistence between the living and the dead has been kept in houses, streets, and cemeteries. Mixquic, south of Mexico City in the Tláhuac borough, has one of the most striking celebrations: the whole town takes part in the party to receive the souls of the dead. On November 1 the souls of the children arrive, and on day 2 those of the adults, amid offerings, prayers, and the ringing of bells. The alumbrada, or night of candles, is the most significant event: on November 2, starting at six in the evening, the people of Mixquic go to the cemetery with candles, incense, and flowers, light all the graves, and stay beside them so the candlelight guides the souls on their way back.", "text_fa": null, "questions": [{"id": 10400, "question": "¿En qué fechas se celebra el Día de Muertos?", "options": ["24 y 25 de diciembre", "15 y 16 de septiembre", "1 y 2 de enero", "1 y 2 de noviembre"], "correct": 3, "question_en": "On which dates is the Day of the Dead celebrated?", "options_en": ["December 24 and 25", "September 15 and 16", "January 1 and 2", "November 1 and 2"], "question_fa": null, "options_fa": null}, {"id": 10401, "question": "¿Qué elementos se incluyen en las ofrendas según el texto?", "options": ["Solo juguetes y dulces", "Únicamente fotografías", "Alimentos preferidos, flores, velas y pan de muerto", "Ropa y zapatos nuevos"], "correct": 2, "question_en": "Which elements are included in the offerings according to the text?", "options_en": ["Only toys and candy", "Only photographs", "Favorite foods, flowers, candles and pan de muerto", "New clothes and shoes"], "question_fa": null, "options_fa": null}, {"id": 10402, "question": "¿En qué año fue declarada Patrimonio Cultural Inmaterial de la Humanidad por la UNESCO?", "options": ["1998", "2012", "2008", "2004"], "correct": 2, "question_en": "In what year was it declared Intangible Cultural Heritage of Humanity by UNESCO?", "options_en": ["1998", "2012", "2008", "2004"], "question_fa": null, "options_fa": null}, {"id": 10403, "question": "Según la creencia descrita, ¿qué ocurre el 1 y 2 de noviembre?", "options": ["Termina la temporada de lluvias", "Se siembran los campos", "Las almas de los fallecidos regresan a convivir con los vivos", "Se cierran los mercados"], "correct": 2, "question_en": "According to the belief described, what happens on November 1 and 2?", "options_en": ["The rainy season ends", "The fields are sown", "The souls of the deceased return to live with the living", "The markets close"], "question_fa": null, "options_fa": null}, {"id": 10404, "question": "¿Qué ánimas llegan el 1 de noviembre en Mixquic?", "options": ["Las de los adultos", "Las de los ancianos", "Las de los niños", "Las de los animales"], "correct": 2, "question_en": "Whose souls arrive on November 1 in Mixquic?", "options_en": ["The adults", "The elderly", "The children", "The animals"], "question_fa": null, "options_fa": null}, {"id": 10405, "question": "¿Qué es la alumbrada según el texto?", "options": ["La noche en que se iluminan las tumbas con velas", "Una feria gastronómica", "Un desfile de carros alegóricos", "Una carrera con antorchas"], "correct": 0, "question_en": "What is the alumbrada according to the text?", "options_en": ["The night when the graves are lit with candles", "A food fair", "A parade of floats", "A torch race"], "question_fa": null, "options_fa": null}]}, {"id": 5, "title": "La leyenda del Cenote Zací", "topic": "Leyendas y memoria regional", "text": "Un cenote es un pozo de agua dulce que se forma por la erosión de las rocas calizas. En el interior de la ciudad de Valladolid, Yucatán, se encuentra el cenote Zací: una impresionante caverna parcialmente colapsada, de unos 45 metros de diámetro.\n\nDurante el imperio de los Cupules y los Cocomes se fundó, en 1543, la ciudad maya de Zací, cuyo nombre significa «gavilán blanco». Dentro de la ciudad estaba este cenote, y sobre su bóveda vivía la curandera y hechicera del pueblo, una anciana poderosa, patrona de la familia Cocom. En Zací existían dos familias que se disputaban el poder. El cacique Halach-Huinic, «el hombre verdadero», gobernaba en ese tiempo y tenía un hijo llamado Hul-Kin, «rayo de sol», de la familia de los Cupules.\n\nLa nieta de la hechicera se había quedado huérfana al nacer. La abuela la quería doblemente: era la hermosa Sac-Nicte, «flor blanca». Al principio Hul-Kin y Sac-Nicte parecían odiarse y peleaban constantemente; sin embargo, al llegar a la juventud surgió entre ellos un apasionado amor. Se veían a escondidas, pero el cacique se enteró y, enfurecido, envió a su hijo a un pueblo del sur para casarlo con una princesa, como parte de una alianza.\n\nSac-Nicte perdió la alegría y, entre llantos, le contó a su abuela su secreto: estaba embarazada y no quería vivir más. La abuela le prometió traer de vuelta a Hul-Kin. Un día, Sac-Nicte se enteró de que Hul-Kin se casaba; entonces amarró una piedra a su larga cabellera y se arrojó a las aguas del cenote. En ese momento, Hul-Kin sintió un fuerte dolor en el pecho y regresó esa misma noche. Al enterarse de lo ocurrido, se arrojó al cenote para morir con su verdadero amor. La hechicera, en un arranque de ira, maldijo el cenote: cada año, cuando el manto verde del agua se tornara oscuro, el cenote cobraría una vida en sacrificio por aquel amor prohibido.", "text_en": "A cenote is a freshwater pool formed by the erosion of limestone rock. Inside the city of Valladolid, Yucatán, lies the Zací cenote: an impressive, partially collapsed cavern about 45 meters in diameter. During the rule of the Cupules and the Cocomes, the Maya city of Zací — whose name means \"white hawk\" — was founded in 1543. This cenote was inside the city, and over its vault lived the town's healer and sorceress, a powerful old woman, matron of the Cocom family. In Zací there were two families that permanently disputed power. The chief Halach-Huinic, \"the true man,\" governed at that time and had a son named Hul-Kin, \"sunbeam,\" of the Cupul family. The sorceress's granddaughter had been orphaned at birth. The grandmother loved her doubly: she was the beautiful Sac-Nicte, \"white flower.\" At first Hul-Kin and Sac-Nicte seemed to hate each other and fought constantly; however, in their youth a passionate love grew between them. They met in secret, but the chief found out and, enraged, sent his son to a southern town to marry a princess as part of an alliance. Sac-Nicte lost her joy and, in tears, told her grandmother her secret: she was pregnant and did not want to live anymore. The grandmother promised to bring Hul-Kin back. One day Sac-Nicte learned that Hul-Kin was getting married; she tied a stone to her long hair and threw herself into the cenote's waters. At that moment Hul-Kin felt a strong pain in his chest and returned that same night. Upon learning what had happened, he threw himself into the cenote to die with his true love. The sorceress, in a fit of rage, cursed the cenote: every year, when the green veil of the water turned dark, the cenote would take a life as a sacrifice for that forbidden love.", "text_fa": null, "questions": [{"id": 10500, "question": "¿Qué es un cenote según el texto?", "options": ["Un volcán apagado", "Un pozo de agua dulce formado por la erosión de rocas calizas", "Un río subterráneo salado", "Una laguna artificial"], "correct": 1, "question_en": "What is a cenote according to the text?", "options_en": ["An extinct volcano", "A freshwater pool formed by the erosion of limestone rock", "An underground saltwater river", "An artificial lagoon"], "question_fa": null, "options_fa": null}, {"id": 10501, "question": "¿En qué ciudad se ubica el cenote Zací?", "options": ["Cancún", "Campeche", "Mérida", "Valladolid"], "correct": 3, "question_en": "In which city is the Zací cenote located?", "options_en": ["Cancún", "Campeche", "Mérida", "Valladolid"], "question_fa": null, "options_fa": null}, {"id": 10502, "question": "¿Qué significa Sac-Nicte?", "options": ["Agua oscura", "Rayo de sol", "Gavilán blanco", "Flor blanca"], "correct": 3, "question_en": "What does Sac-Nicte mean?", "options_en": ["Dark water", "Sunbeam", "White hawk", "White flower"], "question_fa": null, "options_fa": null}, {"id": 10503, "question": "¿Qué hizo el cacique al enterarse del amor de Hul-Kin y Sac-Nicte?", "options": ["Envió a su hijo a un pueblo del sur para casarlo con una princesa", "Desterró a la hechicera", "Bendijo la unión", "Cerró el cenote"], "correct": 0, "question_en": "What did the chief do upon learning of the love between Hul-Kin and Sac-Nicte?", "options_en": ["Sent his son to a southern town to marry a princess", "Banished the sorceress", "Blessed the union", "Closed the cenote"], "question_fa": null, "options_fa": null}, {"id": 10504, "question": "¿Qué se ató Sac-Nicte a la cabellera antes de arrojarse al cenote?", "options": ["Un collar de oro", "Una cuerda", "Una flor blanca", "Una piedra"], "correct": 3, "question_en": "What did Sac-Nicte tie to her hair before throwing herself into the cenote?", "options_en": ["A gold necklace", "A rope", "A white flower", "A stone"], "question_fa": null, "options_fa": null}, {"id": 10505, "question": "¿Qué maldición lanzó la hechicera sobre el cenote?", "options": ["Que cada año, al oscurecerse el agua, cobraría una vida", "Que nadie volvería a enamorarse en Zací", "Que la ciudad desaparecería", "Que sus aguas se secarían para siempre"], "correct": 0, "question_en": "What curse did the sorceress place on the cenote?", "options_en": ["That every year, when the water darkened, it would take a life", "That no one would fall in love in Zací again", "That the city would disappear", "That its waters would dry up forever"], "question_fa": null, "options_fa": null}]}, {"id": 6, "title": "Los volcanes: Popocatépetl e Iztaccíhuatl", "topic": "Leyenda prehispánica y paisaje", "text": "Hace miles de lunas vivió un joven destacado en las artes de la guerra, famoso por sus hazañas. Un día, en su camino, se encontró con una hermosa joven y quedó inmediatamente enamorado. Decidió pedir su mano, pero el padre de ella, un hombre poco destacado en la guerra, puso una condición: entregaría a su hija a cambio de que el guerrero luchara en favor de su pueblo. El joven aceptó, pues lo prometido era regresar victorioso y obtener el amor de aquella joven.\n\nLa guerra se prolongó y la joven comenzó a angustiarse y a sufrir por amor. Llegó a sus oídos la versión de que el guerrero había muerto en batalla; enfermó de dolor del alma y, una mañana, su padre la encontró sumida en el sueño eterno. Al día siguiente, el sol iluminaba el valle y se escucharon sonidos de victoria: el ejército regresaba y, al frente, avanzaba el joven con la alegría de reunirse con su amada.\n\nSu corazón se rompió al conocer la noticia. Gritó al cielo pidiendo explicaciones a los dioses, tomó el cuerpo de su amada, subió al valle, la recostó en la cima y decidió velar su sueño eterno con una antorcha encendida. Los dioses, al ver aquel acto de amor, eternizaron a la pareja: cubrieron sus cuerpos con nieve y los petrificaron para siempre. Con el paso de los siglos aún podemos ver a los dos enamorados en dos grandes montañas: el Popocatépetl y el Iztaccíhuatl.\n\nEl nombre Popocatépetl viene del náhuatl y significa «montaña que humea», porque desde tiempos prehispánicos permanece activo. Iztaccíhuatl significa «mujer blanca», pues se asemeja a una mujer dormida cubierta por un manto blanco. Ambos volcanes se ubican en los límites de la Ciudad de México y Puebla, y están unidos por el norte mediante el Paso de Cortés.", "text_en": "Thousands of moons ago there lived a young man outstanding in the arts of war, famous for his deeds. One day, on his path, he met a beautiful young woman and fell in love at once. He decided to ask for her hand, but her father, a man of little renown in war, set a condition: he would give his daughter in exchange for the warrior fighting on behalf of his people. The young man accepted, for what was promised was to return victorious and win that young woman's love. The war dragged on and the young woman began to grow anxious and to suffer for love. Word reached her that the warrior had died in battle; she fell ill with sorrow and, one morning, her father found her lost in eternal sleep. The next day the sun shone over the valley and sounds of victory were heard: the army was returning and, at the front, the young man advanced with the joy of reuniting with his beloved. His heart broke when he learned the news. He cried out to the sky asking the gods for answers, took his beloved's body, climbed to the valley, laid her on the summit, and decided to watch over her eternal sleep with a lit torch. The gods, seeing that act of love, made the couple eternal: they covered their bodies with snow and turned them to stone forever. Over the centuries we can still see the two lovers in two great mountains: Popocatépetl and Iztaccíhuatl. The name Popocatépetl comes from Nahuatl and means \"smoking mountain,\" because it has remained active since pre-Hispanic times. Iztaccíhuatl means \"white woman,\" since it resembles a sleeping woman covered by a white mantle. Both volcanoes stand on the border of Mexico City and Puebla, and are joined on the north by the Paso de Cortés.", "text_fa": null, "questions": [{"id": 10600, "question": "¿Qué condición puso el padre de la joven para entregar a su hija?", "options": ["Que le pagara con oro", "Que abandonara la guerra", "Que construyera un templo", "Que el guerrero luchara en favor de su pueblo"], "correct": 3, "question_en": "What condition did the young woman's father set to give away his daughter?", "options_en": ["That he pay in gold", "That he abandon the war", "That he build a temple", "That the warrior fight on behalf of his people"], "question_fa": null, "options_fa": null}, {"id": 10601, "question": "¿Qué noticia enfermó de tristeza a la joven?", "options": ["Que el guerrero había muerto en batalla", "Que debía abandonar su hogar", "Que la guerra nunca terminaría", "Que su padre la casaría con otro"], "correct": 0, "question_en": "What news made the young woman sick with sadness?", "options_en": ["That the warrior had died in battle", "That she had to leave her home", "That the war would never end", "That her father would marry her to another"], "question_fa": null, "options_fa": null}, {"id": 10602, "question": "¿Qué hizo el guerrero al encontrar muerta a su amada?", "options": ["La enterró junto al río", "La llevó a la cima y veló su sueño con una antorcha encendida", "Se marchó a otra tierra", "Declaró la guerra a los dioses"], "correct": 1, "question_en": "What did the warrior do upon finding his beloved dead?", "options_en": ["Buried her beside the river", "Took her to the summit and watched over her sleep with a lit torch", "Left for another land", "Declared war on the gods"], "question_fa": null, "options_fa": null}, {"id": 10603, "question": "¿Qué hicieron los dioses al ver el acto de amor?", "options": ["Los castigaron con el olvido", "Les devolvieron la vida", "Los convirtieron en estrellas", "Cubrieron sus cuerpos con nieve y los petrificaron"], "correct": 3, "question_en": "What did the gods do when they saw the act of love?", "options_en": ["Punished them with oblivion", "Brought them back to life", "Turned them into stars", "Covered their bodies with snow and turned them to stone"], "question_fa": null, "options_fa": null}, {"id": 10604, "question": "¿Qué significa Popocatépetl en náhuatl?", "options": ["Montaña que humea", "Valle de fuego", "Mujer blanca", "Cerro dormido"], "correct": 0, "question_en": "What does Popocatépetl mean in Nahuatl?", "options_en": ["Smoking mountain", "Valley of fire", "White woman", "Sleeping hill"], "question_fa": null, "options_fa": null}, {"id": 10605, "question": "¿Qué significa Iztaccíhuatl según el texto?", "options": ["Rayo de sol", "Flor blanca", "Mujer blanca", "Montaña que humea"], "correct": 2, "question_en": "What does Iztaccíhuatl mean according to the text?", "options_en": ["Sunbeam", "White flower", "White woman", "Smoking mountain"], "question_fa": null, "options_fa": null}]}, {"id": 7, "title": "El Mayab, la tierra del faisán y del venado", "topic": "Tradición maya", "text": "Hace mucho tiempo, el dios Itzamná decidió crear una tierra tan hermosa que todo aquel que la conociera quisiera vivir allí. Entonces creó El Mayab, la tierra de los elegidos: sembró las más bellas flores para adornar los caminos, creó enormes cenotes de aguas cristalinas y profundas cavernas llenas de misterio.\n\nDespués, Itzamná entregó la nueva tierra a los mayas y escogió tres animales para que vivieran por siempre en El Mayab: el faisán, el venado y la serpiente de cascabel. Los mayas vivieron felices y construyeron palacios y ciudades de piedra. El faisán volaba hasta los árboles más altos y su grito era tan poderoso que todos los habitantes podían escucharlo; el venado corría ligero como el viento, y la serpiente movía sus cascabeles para producir música a su paso.\n\nUn día, los chilam, los adivinos mayas, vieron en el futuro algo que les causó gran tristeza y anunciaron: «Pronto nos invadirán hombres venidos de muy lejos; traerán armas y pelearán contra nosotros para quitarnos nuestra tierra». Al oírlo, el faisán huyó a la selva y se escondió entre las hierbas para que los invasores no lo encontraran. El venado lloró tanto que sus lágrimas formaron muchas aguadas y desde entonces le quedaron los ojos húmedos, como si estuviera siempre triste. La serpiente de cascabel, en cambio, decidió olvidar su música y luchar: creó un nuevo sonido al mover la cola, que ahora usa antes de atacar.\n\nComo anunciaron los chilam, los extranjeros conquistaron El Mayab. Sin embargo, un famoso adivino maya dijo que los tres animales cumplirían una misión importante y que llegaría el día en que los mayas recuperarían su tierra. Las señales serían tres: el faisán volaría sobre los árboles más altos y su sombra se vería en todo El Mayab; el venado atravesaría la tierra de un solo salto, y la serpiente produciría música de nuevo. Mientras ese día llega, el faisán alisa sus alas, el venado afila sus pezuñas y la serpiente frota sus cascabeles.", "text_en": "Long ago, the god Itzamná decided to create a land so beautiful that anyone who knew it would want to live there. So he created El Mayab, the land of the chosen: he planted the most beautiful flowers to adorn the paths, created enormous cenotes of crystalline waters, and deep caverns full of mystery. Then Itzamná gave the new land to the Maya and chose three animals to live forever in El Mayab: the pheasant, the deer, and the rattlesnake. The Maya lived happily and built palaces and stone cities. The pheasant flew to the highest trees and its cry was so powerful that all the inhabitants could hear it; the deer ran light as the wind, and the snake shook its rattles to make music as it passed. One day the chilam, the Maya seers, saw in the future something that filled them with sadness and announced: \"Soon men from far away will invade us; they will bring weapons and fight us to take our land.\" Upon hearing this, the pheasant fled into the jungle and hid among the grasses so the invaders would not find it. The deer wept so much that its tears formed many waterholes, and since then its eyes have stayed moist, as if always sad. The rattlesnake, in contrast, decided to forget its music and fight: it created a new sound by shaking its tail, which it now uses before attacking. As the chilam had announced, the foreigners conquered El Mayab. However, a famous Maya seer said the three animals would fulfill an important mission and that the day would come when the Maya recover their land. The signs would be three: the pheasant would fly over the highest trees and its shadow would be seen across all El Mayab; the deer would cross the land in a single leap, and the snake would make music again. Until that day comes, the pheasant preens its wings, the deer sharpens its hooves, and the snake rubs its rattles.", "text_fa": null, "questions": [{"id": 10700, "question": "¿Quién creó El Mayab según la leyenda?", "options": ["Quetzalcóatl", "Itzamná", "Halach-Huinic", "Hul-Kin"], "correct": 1, "question_en": "Who created El Mayab according to the legend?", "options_en": ["Quetzalcóatl", "Itzamná", "Halach-Huinic", "Hul-Kin"], "question_fa": null, "options_fa": null}, {"id": 10701, "question": "¿Qué tres animales escogió Itzamná para vivir en El Mayab?", "options": ["El colibrí, el coyote y el armadillo", "El águila, el jaguar y la serpiente", "El quetzal, el mono y el tucán", "El faisán, el venado y la serpiente de cascabel"], "correct": 3, "question_en": "Which three animals did Itzamná choose to live in El Mayab?", "options_en": ["The hummingbird, the coyote and the armadillo", "The eagle, the jaguar and the snake", "The quetzal, the monkey and the toucan", "The pheasant, the deer and the rattlesnake"], "question_fa": null, "options_fa": null}, {"id": 10702, "question": "¿Quiénes anunciaron la llegada de los invasores?", "options": ["Los sacerdotes católicos", "Los chilam (adivinos mayas)", "Los guerreros aztecas", "Los mercaderes"], "correct": 1, "question_en": "Who announced the arrival of the invaders?", "options_en": ["The Catholic priests", "The chilam (Maya seers)", "The Aztec warriors", "The merchants"], "question_fa": null, "options_fa": null}, {"id": 10703, "question": "¿Qué formaron las lágrimas del venado?", "options": ["Muchas aguadas", "Ríos de agua salada", "Cascadas", "Cenotes secos"], "correct": 0, "question_en": "What did the deer's tears form?", "options_en": ["Many waterholes", "Saltwater rivers", "Waterfalls", "Dry cenotes"], "question_fa": null, "options_fa": null}, {"id": 10704, "question": "¿Qué hizo la serpiente de cascabel al saber de la conquista?", "options": ["Creó un nuevo sonido para luchar", "Se escondió en una caverna", "Lloró hasta quedarse dormida", "Huyó a la selva"], "correct": 0, "question_en": "What did the rattlesnake do upon learning of the conquest?", "options_en": ["Created a new sound to fight", "Hid in a cavern", "Wept until it fell asleep", "Fled to the jungle"], "question_fa": null, "options_fa": null}, {"id": 10705, "question": "¿Cuáles serán las tres señales para recuperar la tierra?", "options": ["La salida del sol, la luna llena y la estrella", "La sombra del faisán, el salto del venado y la música de la serpiente", "El canto del gallo, el ladrido y el maullido", "El trueno, el rayo y la lluvia"], "correct": 1, "question_en": "What will be the three signs to recover the land?", "options_en": ["Sunrise, full moon and star", "The pheasant's shadow, the deer's leap and the snake's music", "The rooster's crow, the bark and the meow", "Thunder, lightning and rain"], "question_fa": null, "options_fa": null}]}, {"id": 8, "title": "La leyenda del maíz", "topic": "Mundo mesoamericano", "text": "Cuentan las historias de los primeros habitantes de Mesoamérica que, antes de la llegada del dios Quetzalcóatl, los aztecas sobrevivían alimentándose únicamente de raíces y de los animales que cazaban. Ellos no tenían el maíz, pues este cereal tan alimenticio estaba escondido detrás de las montañas y no tenían acceso a él.\n\nLos antiguos dioses intentaron obtenerlo y trataron de separar las montañas con su colosal fuerza, pero no lo lograron. Entonces los aztecas pidieron ayuda al dios Quetzalcóatl. Él no quiso emplear la fuerza, sino la inteligencia y la astucia, y se transformó en una hormiga negra. Decidió dirigirse a las montañas acompañado de una hormiga roja, dispuesto a conseguir el maíz para su pueblo.\n\nTras mucho esfuerzo y sin perder el ánimo, Quetzalcóatl subió las montañas. Al llegar a su destino, tomó entre sus mandíbulas un grano maduro de maíz e inició el duro camino de regreso. Entregó el grano prometido a los hambrientos indígenas, quienes plantaron la semilla, y desde entonces tuvieron maíz para alimentarse.\n\nEl preciado grano aumentó sus riquezas: se volvieron más fuertes y construyeron ciudades, palacios y templos. Desde entonces vivieron felices, y los aztecas veneraron al generoso Quetzalcóatl, el dios amigo de los hombres, el dios que les trajo el maíz.", "text_en": "The stories of the first inhabitants of Mesoamerica tell that, before the arrival of the god Quetzalcóatl, the Aztecs survived eating only roots and the animals they hunted. They did not have maize, because this nutritious grain was hidden behind the mountains and they had no access to it. The ancient gods tried to obtain it and attempted to separate the mountains with their colossal strength, but they failed. So the Aztecs asked the god Quetzalcóatl for help. He did not wish to use force, but rather intelligence and cunning, and he transformed himself into a black ant. He decided to head to the mountains accompanied by a red ant, determined to get the maize for his people. After much effort and without losing heart, Quetzalcóatl climbed the mountains. Upon reaching his destination, he took a ripe grain of maize between his jaws and began the hard journey back. He gave the promised grain to the hungry people, who planted the seed, and from then on they had maize to feed themselves. The precious grain increased their wealth: they became stronger and built cities, palaces, and temples. From then on they lived happily, and the Aztecs revered the generous Quetzalcóatl, the god who was a friend to men, the god who brought them maize.", "text_fa": null, "questions": [{"id": 10800, "question": "Antes de tener maíz, ¿de qué se alimentaban los aztecas?", "options": ["De pescado y mariscos", "De tortillas y frijoles", "De raíces y de los animales que cazaban", "De frutas y verduras"], "correct": 2, "question_en": "Before having maize, what did the Aztecs eat?", "options_en": ["Fish and seafood", "Tortillas and beans", "Roots and the animals they hunted", "Fruits and vegetables"], "question_fa": null, "options_fa": null}, {"id": 10801, "question": "¿Por qué los aztecas no podían obtener el maíz?", "options": ["Porque estaba escondido detrás de las montañas", "Porque era muy caro", "Porque los dioses lo habían prohibido", "Porque no sabían sembrar"], "correct": 0, "question_en": "Why couldn't the Aztecs obtain the maize?", "options_en": ["Because it was hidden behind the mountains", "Because it was very expensive", "Because the gods had forbidden it", "Because they didn't know how to sow"], "question_fa": null, "options_fa": null}, {"id": 10802, "question": "¿Qué hicieron primero los antiguos dioses para obtener el maíz?", "options": ["Plantaron semillas", "Pidieron ayuda a Quetzalcóatl", "Negociaron con otros pueblos", "Intentaron separar las montañas con su fuerza"], "correct": 3, "question_en": "What did the ancient gods do first to obtain the maize?", "options_en": ["They planted seeds", "They asked Quetzalcóatl for help", "They negotiated with other peoples", "They tried to separate the mountains with their strength"], "question_fa": null, "options_fa": null}, {"id": 10803, "question": "¿En qué animal se transformó Quetzalcóatl para conseguir el maíz?", "options": ["En una serpiente", "En un águila", "En una hormiga negra", "En un venado"], "correct": 2, "question_en": "Into what animal did Quetzalcóatl transform to get the maize?", "options_en": ["A snake", "An eagle", "A black ant", "A deer"], "question_fa": null, "options_fa": null}, {"id": 10804, "question": "¿Quién acompañó a Quetzalcóatl a las montañas?", "options": ["Un faisán", "Un venado", "Un guerrero azteca", "Una hormiga roja"], "correct": 3, "question_en": "Who accompanied Quetzalcóatl to the mountains?", "options_en": ["A pheasant", "A deer", "An Aztec warrior", "A red ant"], "question_fa": null, "options_fa": null}, {"id": 10805, "question": "¿Qué hicieron los aztecas con el grano que les entregó Quetzalcóatl?", "options": ["Lo guardaron como ofrenda", "Lo plantaron y desde entonces tuvieron maíz", "Lo regalaron a otros pueblos", "Lo vendieron"], "correct": 1, "question_en": "What did the Aztecs do with the grain Quetzalcóatl gave them?", "options_en": ["They kept it as an offering", "They planted it and from then on had maize", "They gave it to other peoples", "They sold it"], "question_fa": null, "options_fa": null}]}, {"id": 9, "title": "Chinampas de Xochimilco", "topic": "Tecnicas agricolas tradicionales", "text": "Las chinampas son un sistema agrícola tradicional desarrollado en zonas lacustres del Valle de México. Consisten en parcelas construidas de forma artificial sobre aguas someras, con técnicas que permiten alta productividad y manejo cuidadoso del entorno. En Xochimilco, este método ha sostenido por siglos la producción de hortalizas, flores y plantas de consumo local. Su valor no es solo económico: también representa conocimiento histórico sobre suelos, agua y biodiversidad. Por esa razón, se considera un patrimonio cultural y ambiental de gran relevancia. Aunque hoy enfrenta presiones urbanas y ambientales, diversas comunidades y proyectos trabajan para conservarlo mediante restauración ecológica, reforestación y fortalecimiento productivo. En una lectura de examen, este tipo de texto puede incluir preguntas sobre la función de las chinampas, su origen histórico y los riesgos actuales que enfrentan. Comprenderlo exige relacionar técnica tradicional con sostenibilidad y vida comunitaria en la ciudad.", "text_en": "Chinampas are a traditional agricultural system developed in the lake areas of the Valley of Mexico. They consist of plots built artificially over shallow waters, with techniques that allow high productivity and careful management of the environment. In Xochimilco, this method has sustained for centuries the production of vegetables, flowers, and plants for local consumption. Its value is not only economic: it also represents historical knowledge about soil, water, and biodiversity. For this reason, it is considered a cultural and environmental heritage of great relevance. Although today it faces urban and environmental pressures, various communities and projects work to conserve it through ecological restoration, reforestation, and productive strengthening. In an exam reading, this type of text may include questions about the function of the chinampas, their historical origin, and the current risks they face. Understanding it requires relating traditional technique with sustainability and community life in the city.", "text_fa": null, "questions": [{"id": 10900, "question": "¿Qué son las chinampas según el texto?", "options": ["Mercados flotantes", "Fortalezas de piedra", "Parcelas agrícolas tradicionales construidas sobre aguas someras", "Canales de riego para ganado"], "correct": 2, "question_en": "According to the text, what are chinampas?", "options_en": ["Floating markets", "Stone fortresses", "Traditional agricultural plots built over shallow waters", "Irrigation canals for cattle"], "question_fa": null, "options_fa": null}, {"id": 10901, "question": "¿Qué ha sostenido por siglos el método de Xochimilco?", "options": ["Pesca marítima", "Producción de hortalizas, flores y plantas", "Fabricación textil", "Extracción minera"], "correct": 1, "question_en": "What has Xochimilco's method sustained for centuries?", "options_en": ["Maritime fishing", "Production of vegetables and flowers", "Textile manufacturing", "Mining extraction"], "question_fa": null, "options_fa": null}, {"id": 10902, "question": "Además del valor económico, ¿qué representan las chinampas?", "options": ["Rutas de comercio internacional", "Ceremonias religiosas", "Conocimiento histórico sobre suelos, agua y biodiversidad", "Tecnología militar"], "correct": 2, "question_en": "Besides economic value, what do chinampas represent?", "options_en": ["International trade routes", "Religious ceremonies", "Historical knowledge about soil, water and biodiversity", "Military technology"], "question_fa": null, "options_fa": null}, {"id": 10903, "question": "¿Qué presiones enfrenta hoy este sistema?", "options": ["Solo cambios de clima", "Presiones urbanas y ambientales", "Falta de turistas", "Exceso de tierras"], "correct": 1, "question_en": "What pressures does this system face today?", "options_en": ["Only weather changes", "Urban and environmental pressures", "Lack of tourists", "Too much farmland"], "question_fa": null, "options_fa": null}, {"id": 10904, "question": "¿Cómo intentan conservar las chinampas las comunidades?", "options": ["Construyendo viviendas", "Cerrando los canales", "Eliminando vegetación", "Restauración ecológica y reforestación"], "correct": 3, "question_en": "How do communities try to conserve the chinampas?", "options_en": ["Building housing", "Closing the canals", "Removing vegetation", "Ecological restoration and reforestation"], "question_fa": null, "options_fa": null}, {"id": 10905, "question": "¿Qué relación exige comprender las chinampas?", "options": ["Técnica tradicional, sostenibilidad y vida comunitaria", "Moda y espectáculo", "Minería y puertos", "Industria y banca"], "correct": 0, "question_en": "What relationship does understanding the chinampas require?", "options_en": ["Traditional technique, sustainability and community life", "Fashion and entertainment", "Mining and ports", "Industry and banking"], "question_fa": null, "options_fa": null}]}, {"id": 10, "title": "Reserva de la Biosfera Mariposa Monarca", "topic": "Patrimonio natural y cultural", "text": "Cada año, millones de mariposas monarca viajan miles de kilómetros desde Norteamérica hasta los bosques templados de México, principalmente en Michoacán y el Estado de México. Este fenómeno migratorio destaca por su precisión y continuidad, pues las colonias regresan de manera recurrente a zonas de hibernación. La región ha sido reconocida por su relevancia ecológica y por el valor cultural que las comunidades locales le atribuyen. En algunos contextos, la llegada de la monarca coincide con temporadas de memoria y celebración comunitaria, lo que fortalece su simbolismo. La conservación de estos bosques requiere acciones coordinadas: manejo forestal, vigilancia, restauración y participación social. Por eso, estudiar la monarca no significa solo conocer una especie; implica entender la relación entre biodiversidad, territorio y cultura. En ejercicios de comprensión, suelen preguntarse datos de ubicación, finalidad de protección y mensaje central del texto.", "text_en": "Every year, millions of monarch butterflies travel thousands of kilometers from North America to the temperate forests of Mexico, mainly in Michoacán and the State of Mexico. This migratory phenomenon stands out for its precision and continuity, since the colonies return repeatedly to hibernation areas. The region has been recognized for its ecological relevance and for the cultural value that local communities give it. In some contexts, the monarch's arrival coincides with seasons of remembrance and community celebration, which strengthens its symbolism. Conserving these forests requires coordinated actions: forest management, monitoring, restoration, and social participation. That is why studying the monarch does not mean only knowing a species; it implies understanding the relationship between biodiversity, territory, and culture. In comprehension exercises, questions are usually asked about location data, the purpose of protection, and the central message of the text.", "text_fa": null, "questions": [{"id": 11000, "question": "¿A dónde llegan las mariposas monarca según el texto?", "options": ["Valles de Sonora", "Bosques de Michoacán y Estado de México", "Selvas de Chiapas y Tabasco", "Playas de Baja California"], "correct": 1, "question_en": "According to the text, where do monarch butterflies arrive?", "options_en": ["Valleys of Sonora", "Forests of Michoacán and the State of Mexico", "Jungles of Chiapas and Tabasco", "Beaches of Baja California"], "question_fa": null, "options_fa": null}, {"id": 11001, "question": "¿Qué destaca del fenómeno migratorio?", "options": ["Migración exclusivamente nocturna urbana", "Ausencia de ciclos", "Precisión y continuidad anual", "Cambio diario de ruta local"], "correct": 2, "question_en": "What stands out about the migratory phenomenon?", "options_en": ["Exclusively urban night migration", "Absence of cycles", "Precision and annual continuity", "Daily change of local route"], "question_fa": null, "options_fa": null}, {"id": 11002, "question": "¿Qué tipo de valor tiene la región además del ecológico?", "options": ["Uso industrial pesado", "Solo valor deportivo", "Valor cultural comunitario", "Únicamente valor inmobiliario"], "correct": 2, "question_en": "Besides ecological value, what kind of value does the region have?", "options_en": ["Heavy industrial use", "Only sporting value", "Community cultural value", "Only real estate value"], "question_fa": null, "options_fa": null}, {"id": 11003, "question": "¿Qué requiere su conservación?", "options": ["Eliminar vegetación local", "Solo publicidad", "Acciones coordinadas de manejo y participación social", "Cierre total de comunidades"], "correct": 2, "question_en": "What does its conservation require?", "options_en": ["Removing local vegetation", "Only advertising", "Coordinated management actions and social participation", "Total closure of communities"], "question_fa": null, "options_fa": null}, {"id": 11004, "question": "¿Qué relación central propone el texto?", "options": ["Moneda y comercio internacional", "Minería y puertos", "Biodiversidad, territorio y cultura", "Moda y espectáculo"], "correct": 2, "question_en": "What central relationship does the text propose?", "options_en": ["Currency and international trade", "Mining and ports", "Biodiversity, territory and culture", "Fashion and spectacle"], "question_fa": null, "options_fa": null}, {"id": 11005, "question": "¿Qué tipo de preguntas menciona el texto para comprensión?", "options": ["Solo ortografía técnica", "Ubicación, protección y mensaje central", "Historia de inventos europeos", "Cálculo de impuestos"], "correct": 1, "question_en": "What kind of questions does the text mention for comprehension?", "options_en": ["Only technical spelling", "Location, protection and central message", "History of European inventions", "Tax calculation"], "question_fa": null, "options_fa": null}]}, {"id": 11, "title": "Mariachi: musica de cuerdas, canto y trompeta", "topic": "Musica tradicional mexicana", "text": "El mariachi es una expresión musical ampliamente reconocida como símbolo de México. Su evolución incluye una vertiente tradicional de cuerdas y otra moderna que incorpora trompetas, vihuela, guitarrón y violines en formaciones más amplias. A lo largo del tiempo, su repertorio ha integrado sones, jarabes, corridos, valses y canciones rancheras, entre otros géneros. Más que un estilo sonoro, el mariachi funciona como práctica social: se interpreta en fiestas familiares, celebraciones comunitarias y actos cívicos. También ha sido una vía de transmisión intergeneracional de memoria local, lenguaje y afecto por la región de origen. En diversos espacios culturales se reconoce su papel como patrimonio inmaterial por su capacidad de articular identidad y pertenencia. En lectura de comprensión, este tema suele evaluar si la persona distingue entre características del mariachi tradicional y del moderno, y si identifica su importancia cultural más allá de la música.", "text_en": "The mariachi is a musical expression widely recognized as a symbol of Mexico. Its evolution includes a traditional string style and a modern one that adds trumpets, vihuela, guitarrón, and violins in larger ensembles. Over time, its repertoire has included sones, jarabes, corridos, waltzes, and rancheras, among other genres. More than a sound style, the mariachi works as a social practice: it is performed at family parties, community celebrations, and civic events. It has also been a way of passing local memory, language, and affection for one's region from generation to generation. In various cultural spaces its role as intangible heritage is recognized for its capacity to articulate identity and belonging. In reading comprehension, this topic usually evaluates whether the person distinguishes the characteristics of traditional and modern mariachi, and whether they identify its cultural importance beyond music.", "text_fa": null, "questions": [{"id": 11100, "question": "¿Qué instrumentos se mencionan en la variante moderna?", "options": ["Trompetas, violines, vihuela y guitarrón", "Solo batería eléctrica", "Saxofón y acordeón exclusivamente", "Piano y flauta transversal"], "correct": 0, "question_en": "Which instruments are mentioned in the modern style?", "options_en": ["Trumpets, violins, vihuela and guitarrón", "Only electric drums", "Saxophone and accordion exclusively", "Piano and transverse flute"], "question_fa": null, "options_fa": null}, {"id": 11101, "question": "¿Qué géneros se citan dentro del repertorio?", "options": ["Música electrónica de club", "Sones, jarabes y corridos", "Ópera italiana exclusivamente", "Jazz contemporáneo únicamente"], "correct": 1, "question_en": "Which genres are cited within the repertoire?", "options_en": ["Electronic club music", "Sones, jarabes and corridos", "Only Italian opera", "Only contemporary jazz"], "question_fa": null, "options_fa": null}, {"id": 11102, "question": "¿Cómo define el texto al mariachi además de estilo musical?", "options": ["Sistema de transporte", "Disciplina militar", "Método de construcción", "Práctica social y cultural"], "correct": 3, "question_en": "How does the text define mariachi besides a musical style?", "options_en": ["A transportation system", "A military discipline", "A construction method", "A social and cultural practice"], "question_fa": null, "options_fa": null}, {"id": 11103, "question": "¿En qué espacios suele interpretarse?", "options": ["Solo auditorios cerrados", "Solo universidades extranjeras", "Solo ceremonias deportivas", "Fiestas familiares, comunidad y actos cívicos"], "correct": 3, "question_en": "In which spaces is it usually performed?", "options_en": ["Only closed auditoriums", "Only foreign universities", "Only sports ceremonies", "Family parties, community and civic events"], "question_fa": null, "options_fa": null}, {"id": 11104, "question": "¿Qué reconoce su declaratoria cultural?", "options": ["Su función bancaria", "Su papel en identidad y pertenencia", "Su utilidad industrial", "Su uso médico"], "correct": 1, "question_en": "What does its cultural declaration recognize?", "options_en": ["Its banking function", "Its role in identity and belonging", "Its industrial utility", "Its medical use"], "question_fa": null, "options_fa": null}, {"id": 11105, "question": "¿Qué puede evaluar una pregunta de comprensión sobre este tema?", "options": ["Diferencias entre mariachi tradicional y moderno", "Caligrafía artística", "Solo velocidad de lectura", "Memoria de fechas sin contexto"], "correct": 0, "question_en": "What can a comprehension question on this topic evaluate?", "options_en": ["Differences between traditional and modern mariachi", "Artistic calligraphy", "Only reading speed", "Memorizing dates without context"], "question_fa": null, "options_fa": null}]}, {"id": 12, "title": "Cocina tradicional mexicana", "topic": "Patrimonio alimentario", "text": "La cocina tradicional mexicana se entiende como un patrimonio vivo que une ingredientes, técnicas, saberes comunitarios y celebraciones. Su valor cultural no depende de un solo platillo, sino de una red de prácticas que inicia en el campo y continúa en mercados, cocinas familiares y fiestas locales. El maíz ocupa un lugar central en ese sistema, junto con procesos como la nixtamalización, el uso de comales y las preparaciones regionales que cambian según territorio y temporada. En 2010, esta cocina fue inscrita en la Lista Representativa del Patrimonio Cultural Inmaterial de la Humanidad, reconocimiento que subraya su relevancia social y su capacidad de transmitir conocimiento entre generaciones. El texto también destaca la dimensión de sostenibilidad: proteger semillas, valorar a los productores locales y mantener las técnicas tradicionales fortalece comunidades y ecosistemas. En comprensión lectora, suelen aparecer preguntas sobre la idea principal, la fecha de reconocimiento y la relación entre alimentación e identidad.", "text_en": "Traditional Mexican cuisine is understood as a living heritage that unites ingredients, techniques, community knowledge, and celebrations. Its cultural value does not depend on a single dish, but on a network of practices that begins in the countryside and continues in markets, family kitchens, and local festivals. Maize holds a central place in that system, together with processes such as nixtamalization, the use of comales, and regional preparations that change according to territory and season. In 2010, this cuisine was inscribed on the Representative List of the Intangible Cultural Heritage of Humanity, a recognition that highlights its social relevance and its capacity to pass knowledge between generations. The text also highlights the sustainability dimension: protecting seeds, valuing local producers, and maintaining traditional techniques strengthens communities and ecosystems. In reading comprehension, questions often appear about the main idea, the date of recognition, and the relationship between food and identity.", "text_fa": null, "questions": [{"id": 11200, "question": "¿Cómo define el texto la cocina tradicional mexicana?", "options": ["Lista fija de un solo estado", "Patrimonio vivo de prácticas comunitarias", "Conjunto de recetas importadas", "Industria exclusivamente urbana"], "correct": 1, "question_en": "How does the text define traditional Mexican cuisine?", "options_en": ["A fixed list from a single state", "Living heritage of community practices", "A set of imported recipes", "An exclusively urban industry"], "question_fa": null, "options_fa": null}, {"id": 11201, "question": "¿Qué ingrediente se menciona como central?", "options": ["Maíz", "Trigo", "Centeno", "Avena"], "correct": 0, "question_en": "Which ingredient is mentioned as central?", "options_en": ["Maize", "Wheat", "Rye", "Oats"], "question_fa": null, "options_fa": null}, {"id": 11202, "question": "¿En qué año se reconoce en la Lista Representativa?", "options": ["2010", "2020", "2015", "2008"], "correct": 0, "question_en": "In what year was it recognized on the Representative List?", "options_en": ["2010", "2020", "2015", "2008"], "question_fa": null, "options_fa": null}, {"id": 11203, "question": "¿Qué aspecto resalta el reconocimiento internacional?", "options": ["Transmisión social y cultural del conocimiento", "Uso exclusivo de maquinaria", "Sustitución total de técnicas tradicionales", "Homogeneidad nacional obligatoria"], "correct": 0, "question_en": "What aspect does the international recognition highlight?", "options_en": ["Social and cultural transmission of knowledge", "Exclusive use of machinery", "Total replacement of traditional techniques", "Obligatory national homogeneity"], "question_fa": null, "options_fa": null}, {"id": 11204, "question": "¿Qué dimensión adicional menciona el texto?", "options": ["Turismo de lujo exclusivamente", "Espectáculo deportivo", "Mercados financieros", "Sostenibilidad y apoyo a productores locales"], "correct": 3, "question_en": "What additional dimension does the text mention?", "options_en": ["Luxury tourism exclusively", "Sporting spectacle", "Financial markets", "Sustainability and support for local producers"], "question_fa": null, "options_fa": null}, {"id": 11205, "question": "¿Qué tipo de pregunta de comprensión puede aparecer?", "options": ["Idea principal y fecha de reconocimiento", "Pronunciación en latín", "Historia de la aviación", "Fórmulas químicas avanzadas"], "correct": 0, "question_en": "What kind of comprehension question can appear?", "options_en": ["Main idea and date of recognition", "Pronunciation in Latin", "History of aviation", "Advanced chemical formulas"], "question_fa": null, "options_fa": null}]}, {"id": 13, "title": "Alebrijes y cartoneria", "topic": "Arte popular", "text": "Los alebrijes son figuras fantásticas del arte popular mexicano, elaboradas tradicionalmente en cartonería y madera policromada, según la región. En la narrativa más difundida, su origen moderno se asocia al artesano Pedro Linares, quien imaginó criaturas de formas inesperadas y gran colorido. Con el tiempo, esta expresión creció en talleres familiares, ferias, desfiles y espacios culturales. Más allá de lo visual, los alebrijes representan creatividad colectiva y transmisión de oficio entre generaciones. Muchas piezas combinan rasgos de varios animales para construir un ser simbólico único, lo que permite experimentar con identidad, imaginación y memoria local. En algunas ciudades, su elaboración se ha reconocido como patrimonio cultural intangible por su importancia artística y comunitaria. En una lectura de comprensión, este tema permite evaluar si se identifican origen, materiales y función cultural de la artesanía sin reducirla a un objeto decorativo.", "text_en": "Alebrijes are fantastic figures of Mexican folk art, traditionally made of cartonería (papier-mâché) and polychrome wood, depending on the region. In the most widespread account, their modern origin is associated with the artisan Pedro Linares, who imagined creatures of unexpected shapes and great color. Over time, this expression grew in family workshops, fairs, parades, and cultural spaces. Beyond the visual, alebrijes represent collective creativity and the passing of a craft between generations. Many pieces combine features of several animals to build a unique symbolic being, which allows experimenting with identity, imagination, and local memory. In some cities, their making has been recognized as intangible cultural heritage for its artistic and community importance. In a reading comprehension, this topic allows evaluating whether one identifies the origin, materials, and cultural function of the craft without reducing it to a decorative object.", "text_fa": null, "questions": [{"id": 11300, "question": "¿Qué son los alebrijes según el texto?", "options": ["Trajes ceremoniales", "Instrumentos musicales", "Figuras fantásticas del arte popular", "Edificios históricos"], "correct": 2, "question_en": "What are alebrijes according to the text?", "options_en": ["Ceremonial costumes", "Musical instruments", "Fantastic figures of folk art", "Historic buildings"], "question_fa": null, "options_fa": null}, {"id": 11301, "question": "¿Con qué artesano se asocia su origen moderno?", "options": ["Pedro Linares", "Diego Rivera", "Enrique Carbajal", "José María Velasco"], "correct": 0, "question_en": "With which artisan is their modern origin associated?", "options_en": ["Pedro Linares", "Diego Rivera", "Enrique Carbajal", "José María Velasco"], "question_fa": null, "options_fa": null}, {"id": 11302, "question": "¿Qué materiales se mencionan?", "options": ["Solo acero", "Concreto y mármol", "Cartonería y madera policromada", "Solo vidrio"], "correct": 2, "question_en": "Which materials are mentioned?", "options_en": ["Only steel", "Concrete and marble", "Cartonería and polychrome wood", "Only glass"], "question_fa": null, "options_fa": null}, {"id": 11303, "question": "¿Qué representan culturalmente además de su aspecto visual?", "options": ["Creatividad colectiva y oficio familiar", "Tecnología militar", "Normas fiscales", "Manual de arquitectura"], "correct": 0, "question_en": "What do they represent culturally besides their visual aspect?", "options_en": ["Collective creativity and family craft", "Military technology", "Tax rules", "An architecture manual"], "question_fa": null, "options_fa": null}, {"id": 11304, "question": "¿Cómo se construye un ser simbólico en estas piezas?", "options": ["Usando fotografía oficial", "Copiando planos técnicos", "Repitiendo una sola forma", "Combinando rasgos de varios animales"], "correct": 3, "question_en": "How is a symbolic being built in these pieces?", "options_en": ["By using official photography", "By copying technical plans", "By repeating a single shape", "By combining features of several animals"], "question_fa": null, "options_fa": null}, {"id": 11305, "question": "¿Qué busca evaluar el texto en comprensión lectora?", "options": ["Origen, materiales y función cultural", "Solo cantidad de pintura", "Solo longitud de la pieza", "Solo precio de mercado"], "correct": 0, "question_en": "What does the text seek to evaluate in reading comprehension?", "options_en": ["Origin, materials and cultural function", "Only amount of paint", "Only length of the piece", "Only market price"], "question_fa": null, "options_fa": null}]}, {"id": 14, "title": "
