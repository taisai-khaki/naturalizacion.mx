<!doctype html>
<html lang="es">
<head>

<title>Naturalización MX — Examen de Ciudadanía</title>
<style>
:root{--bg:#022c22;--bg2:#064e3b;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--ink:#ecfdf5;--mut:#a7f3d0;--gold:#fcd34d;--rose:#fb7185;--green:#6ee7b7;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;font-weight:700;padding:10px 18px;border-radius:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.ghost[aria-pressed="true"]{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.55);color:#fde68a}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d1fae5;border:1px solid var(--line)}
.pill.gold{background:rgba(252,211,77,.15);color:#fde68a;border-color:rgba(252,211,77,.3)}
.pill.green{background:rgba(110,231,183,.15);color:#a7f3d0;border-color:rgba(110,231,183,.3)}
.pill.rose{background:rgba(251,113,133,.15);color:#fecdd3;border-color:rgba(251,113,133,.3)}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px}
.mut{color:var(--mut)}
.small{font-size:12px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;transition:background .15s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.sel{border-color:var(--gold);background:rgba(252,211,77,.18)}
.opt.ok{border-color:var(--green);background:rgba(110,231,183,.15)}
.opt.bad{border-color:var(--rose);background:rgba(251,113,133,.15)}
.opt.locked{opacity:.4}
.translation{color:#bfdbfe;font-style:italic;font-size:14px;margin-top:6px;padding:8px 10px;background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;border-radius:6px;white-space:pre-wrap}
.translation.fa{direction:rtl;text-align:right;font-style:normal;font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.8;border-left:0;border-right:3px solid #3b82f6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tab.on{background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:24px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#fcd34d,#fb7185);border-radius:999px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loginbox{max-width:420px;margin:8vh auto}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;margin:6px 0 12px}
textarea.field{min-height:120px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.passage{max-height:46vh;overflow:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.55}
#flashcard{margin:20px 0}
.qtext{font-size:19px;font-weight:700;line-height:1.4;margin:12px 0}
.footer{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}
.marker{color:#34d399;font-weight:700}
.badmark{color:#fda4af;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.badge.ok{background:rgba(110,231,183,.18);color:#6ee7b7}
.badge.no{background:rgba(251,113,133,.18);color:#fb7185}
</style>
</head>

 1, "title": "El Grito de Dolores y el mes patrio", "topic": "Historia y cultura civica", "text": "En México, la noche del 15 de septiembre tiene un significado especial. En plazas de todo el país, miles de personas se reúnen para escuchar la ceremonia conocida como el Grito. Esta conmemoración recuerda el llamado a levantarse contra el dominio español realizado en 1810 por Miguel Hidalgo y Costilla, en Dolores. Aunque no existe un registro textual único de las palabras exactas de ese primer llamado, históricamente se reconoce como el inicio de la lucha de Independencia. Con el paso del tiempo, la ceremonia evolucionó y se convirtió en un acto cívico nacional. Hoy, autoridades de distintos niveles repiten la ceremonia en sus localidades, mientras la gente porta banderas, escucha música regional y participa en festejos comunitarios. En ese contexto, el simbolismo patrio tiene un papel central: los colores verde, blanco y rojo aparecen en edificios, ropa y decoraciones. Comprender esta celebración ayuda a entender por qué septiembre es considerado mes patrio y por qué el Grito no es solo una fiesta, sino también una memoria compartida de identidad histórica.", "text_en": "In Mexico, the night of September 15 has special meaning. In plazas across the country, thousands of people gather to hear the ceremony known as the Grito. This commemoration recalls the call to rise up against Spanish rule made in 1810 by Miguel Hidalgo y Costilla in Dolores. Although there is no single written record of the exact words of that first call, it is historically recognized as the start of the struggle for Independence. Over time the ceremony evolved and became a national civic act. Today, authorities at different levels repeat the ceremony in their localities while people carry flags, listen to regional music, and take part in community festivities. In this context, patriotic symbolism plays a central role: the green, white, and red colors appear on buildings, clothing, and decorations. Understanding this celebration helps explain why September is considered the patriotic month and why the Grito is not only a party, but also a shared memory of historical identity.", "text_fa": null, "questions": [{"id": 10100, "question": "¿Qué se conmemora en la ceremonia del Grito?", "options": ["La Revolución Mexicana", "La promulgación de la Constitución de 1917", "La consumación de la Independencia", "El inicio de la lucha de Independencia"], "correct": 3, "question_en": "What is commemorated in the Grito ceremony?", "options_en": ["The Mexican Revolution", "The enactment of the 1917 Constitution", "The consummation of Independence", "The start of the Independence struggle"], "question_fa": null, "options_fa": null}, {"id": 10101, "question": "¿En qué año se ubica históricamente el llamado de Hidalgo?", "options": ["1857", "1910", "1810", "1821"], "correct": 2, "question_en": "In what year is Hidalgo's call historically placed?", "options_en": ["1857", "1910", "1810", "1821"], "question_fa": null, "options_fa": null}, {"id": 10102, "question": "¿Qué elemento se menciona como parte del simbolismo patrio?", "options": ["Escudos regionales extranjeros", "Únicamente música clásica", "Los colores verde, blanco y rojo", "Solo fuegos artificiales"], "correct": 2, "question_en": "Which element is mentioned as part of the patriotic symbolism?", "options_en": ["Foreign regional coats of arms", "Only classical music", "The green, white and red colors", "Only fireworks"], "question_fa": null, "options_fa": null}, {"id": 10103, "question": "Según el texto, el Grito actual se entiende principalmente como:", "options": ["Una ceremonia cívica con memoria histórica", "Un acto comercial", "Una celebración privada", "Un evento deportivo"], "correct": 0, "question_en": "According to the text, today's Grito is mainly understood as:", "options_en": ["A civic ceremony with historical memory", "A commercial event", "A private celebration", "A sporting event"], "question_fa": null, "options_fa": null}, {"id": 10104, "question": "¿Qué afirma el texto sobre las palabras exactas del primer Grito?", "options": ["Se escribieron un siglo después por decreto", "Fueron dictadas por el Congreso", "Se conservan en audio original", "No existe un registro textual único"], "correct": 3, "question_en": "What does the text state about the exact words of the first Grito?", "options_en": ["They were written a century later by decree", "They were dictated by Congress", "They survive in original audio", "There is no single written record"], "question_fa": null, "options_fa": null}, {"id": 10105, "question": "¿Por qué septiembre se considera mes patrio en el texto?", "options": ["Por el inicio de clases", "Por ser fin de cosecha", "Por la conmemoración del inicio de la Independencia", "Por una tradición exclusivamente religiosa"], "correct": 2, "question_en": "Why is September considered the patriotic month in the text?", "options_en": ["Because school starts", "Because it marks the end of harvest", "Because it commemorates the start of Independence", "Because of an exclusively religious tradition"], "question_fa": null, "options_fa": null}]}, {"id": 2, "title": "Refranes mexicanos y lenguaje cotidiano", "topic": "Lengua y cultura popular", "text": "Los refranes forman parte de la vida cotidiana en México. Son frases breves que transmiten experiencia, consejo o una forma de ver la realidad. Muchas veces se usan para orientar una decisión sin dar una explicación larga. Por ejemplo, cuando alguien dice «Más vale tarde que nunca», sugiere que es preferible completar una acción, aunque sea después del momento ideal. Otro refrán muy conocido es «Al mal tiempo, buena cara», que invita a mantener una actitud positiva frente a las dificultades. También se escucha «A darle que es mole de olla», expresión que anima a comenzar una tarea con energía. El valor de estos dichos no está solo en su significado literal, sino en su función social: permiten resumir ideas complejas en pocas palabras y facilitan la comunicación entre generaciones. En muchos hogares, abuelos y padres comparten refranes con niñas, niños y jóvenes como parte de una educación informal. Así, el lenguaje popular se convierte en una vía para conservar memoria cultural y fortalecer la identidad comunitaria.", "text_en": "Proverbs (refranes) are part of everyday life in Mexico. They are short phrases that convey experience, advice, or a way of seeing reality. They are often used to guide a decision without a long explanation. For example, when someone says \"Better late than never\" (Más vale tarde que nunca), they suggest it is preferable to complete an action even after the ideal moment. Another well-known saying is \"Al mal tiempo, buena cara\" (put on a good face in bad weather), which invites keeping a positive attitude toward difficulties. People also hear \"A darle que es mole de olla\" (let's get to it — it's mole de olla), an expression that encourages starting a task with energy. The value of these sayings lies not only in their literal meaning but in their social function: they summarize complex ideas in few words and ease communication between generations. In many homes, grandparents and parents share proverbs with children and young people as informal education. In this way, popular language becomes a way to preserve cultural memory and strengthen community identity.", "text_fa": null, "questions": [{"id": 10200, "question": "¿Para qué se usan principalmente los refranes en el texto?", "options": ["Para reemplazar leyes", "Para escribir documentos técnicos", "Para resumir consejos y experiencias", "Para traducir idiomas extranjeros"], "correct": 2, "question_en": "According to the text, what are proverbs mainly used for?", "options_en": ["To replace laws", "To write technical documents", "To summarize advice and experience", "To translate foreign languages"], "question_fa": null, "options_fa": null}, {"id": 10201, "question": "¿Qué idea transmite «Más vale tarde que nunca»?", "options": ["Es preferible hacer algo tarde que no hacerlo", "Es mejor no actuar", "Solo importa la rapidez", "Nunca hay que intentar"], "correct": 0, "question_en": "What idea does \"Más vale tarde que nunca\" convey?", "options_en": ["It is better to do something late than not at all", "It is better not to act", "Only speed matters", "Never try"], "question_fa": null, "options_fa": null}, {"id": 10202, "question": "¿Qué sugiere «Al mal tiempo, buena cara»?", "options": ["Cambiar de ciudad", "Mantener actitud positiva ante dificultades", "Evitar conversar", "Ignorar los problemas"], "correct": 1, "question_en": "What does \"Al mal tiempo, buena cara\" suggest?", "options_en": ["Move to another city", "Keep a positive attitude toward difficulties", "Avoid conversation", "Ignore problems"], "question_fa": null, "options_fa": null}, {"id": 10203, "question": "¿Cómo interpreta el texto «A darle que es mole de olla»?", "options": ["Evitar el trabajo en equipo", "Detener una actividad", "Comenzar una tarea con energía", "Preparar comida diariamente"], "correct": 2, "question_en": "How does the text interpret \"A darle que es mole de olla\"?", "options_en": ["Avoid teamwork", "Stop an activity", "Start a task with energy", "Prepare food daily"], "question_fa": null, "options_fa": null}, {"id": 10204, "question": "¿Qué papel tienen las familias en la transmisión de refranes?", "options": ["Los sustituyen por lenguaje técnico", "Solo los escriben en libros", "Los comparten como educación informal", "No participan"], "correct": 2, "question_en": "What role do families play in passing on proverbs?", "options_en": ["They replace them with technical language", "They only write them in books", "They share them as informal education", "They do not participate"], "question_fa": null, "options_fa": null}, {"id": 10205, "question": "Según el texto, los refranes ayudan a:", "options": ["Conservar memoria cultural", "Debilitar la identidad comunitaria", "Reducir vocabulario", "Eliminar diferencias regionales"], "correct": 0, "question_en": "According to the text, proverbs help to:", "options_en": ["Preserve cultural memory", "Weaken community identity", "Reduce vocabulary", "Erase regional differences"], "question_fa": null, "options_fa": null}]}, {"id": 3, "title": "Parque Nacional Cañón del Sumidero", "topic": "Geografía y patrimonio natural", "text": "El Cañón del Sumidero es uno de los paisajes naturales más impresionantes de México. Su origen se debe a un largo proceso de fallas geológicas. Tiene un alto valor ecológico y cuenta con 21,789 hectáreas distribuidas en cinco municipios del estado de Chiapas, a pocos kilómetros de su capital, Tuxtla Gutiérrez.\n\nEl cañón consiste en un imponente acantilado que se eleva sobre el cauce del río Grijalva. Sus muros alcanzan más de mil metros de altura y, por su belleza, el lugar ha sido nominado para formar parte de las Siete Nuevas Maravillas Naturales del mundo.\n\nLa luz y el calor sobre las paredes del acantilado, junto con sus abundantes escurrimientos de agua, han permitido que surjan varios microclimas con vegetación y fauna propias en las distintas alturas del cañón. Entre las especies endémicas, es decir, exclusivas de esta zona, se encuentran la salamandra Lengua Hongueada, la cuija mexicana, el chupaflor canelo, el sapo jaspeado, la mojarra de Chiapa de Corzo y el encino enano.\n\nDentro del parque se ubica la presa hidroeléctrica de Chicoasén, una de las mayores obras de ingeniería hidráulica de México, cuyo embalse de 32 kilómetros abarca la totalidad del cañón. Por su riqueza ecológica, el lugar fue decretado Parque Nacional el 8 de diciembre de 1980 y, en 2004, fue clasificado como sitio Ramsar, es decir, un humedal de importancia internacional.", "text_en": "The Sumidero Canyon is one of Mexico's most impressive natural landscapes. Its origin is due to a long process of geological faults. It has high ecological value and covers 21,789 hectares across five municipalities in the state of Chiapas, a few kilometers from its capital, Tuxtla Gutiérrez. The canyon consists of an imposing cliff that rises over the course of the Grijalva River. Its walls reach more than one thousand meters high and, for its beauty, the place has been nominated to be part of the Seven New Natural Wonders of the world. Light and heat on the cliff walls, together with abundant water runoff, have allowed several microclimates with their own vegetation and fauna to emerge at the different heights of the canyon. Among the endemic species — that is, exclusive to this area — are the Lengua Hongueada salamander, the Mexican cuija, the canelo hummingbird, the speckled toad, the Chiapa de Corzo mojarra, and the dwarf oak. Inside the park is the Chicoasén hydroelectric dam, one of Mexico's greatest hydraulic engineering works, whose 32-kilometer reservoir covers the entire canyon. For its ecological richness, the place was declared a National Park on December 8, 1980, and in 2004 it was classified as a Ramsar site, a wetland of international importance.", "text_fa": null, "questions": [{"id": 10300, "question": "¿En qué estado de México se ubica el Cañón del Sumidero?", "options": ["Oaxaca", "Veracruz", "Tabasco", "Chiapas"], "correct": 3, "question_en": "In which Mexican state is the Sumidero Canyon located?", "options_en": ["Oaxaca", "Veracruz", "Tabasco", "Chiapas"], "question_fa": null, "options_fa": null}, {"id": 10301, "question": "¿Cuántas hectáreas abarca el Parque Nacional Cañón del Sumidero?", "options": ["45,000", "10,000", "32,000", "21,789"], "correct": 3, "question_en": "How many hectares does the Sumidero Canyon National Park cover?", "options_en": ["45,000", "10,000", "32,000", "21,789"], "question_fa": null, "options_fa": null}, {"id": 10302, "question": "¿Sobre qué río se eleva el acantilado del cañón?", "options": ["Río Usumacinta", "Río Balsas", "Río Lerma", "Río Grijalva"], "correct": 3, "question_en": "Over which river does the canyon cliff rise?", "options_en": ["Usumacinta River", "Balsas River", "Lerma River", "Grijalva River"], "question_fa": null, "options_fa": null}, {"id": 10303, "question": "¿Qué es la presa de Chicoasén?", "options": ["Una reserva de peces", "Una presa hidroeléctrica", "Un embalse de agua potable", "Un parque de diversiones"], "correct": 1, "question_en": "What is the Chicoasén dam?", "options_en": ["A fish reserve", "A hydroelectric dam", "A drinking water reservoir", "An amusement park"], "question_fa": null, "options_fa": null}, {"id": 10304, "question": "¿En qué fecha fue decretado Parque Nacional el Cañón del Sumidero?", "options": ["5 de mayo de 1980", "20 de noviembre de 2004", "16 de septiembre de 1980", "8 de diciembre de 1980"], "correct": 3, "question_en": "On what date was the Sumidero Canyon declared a National Park?", "options_en": ["May 5, 1980", "November 20, 2004", "September 16, 1980", "December 8, 1980"], "question_fa": null, "options_fa": null}, {"id": 10305, "question": "En 2004, ¿cómo fue clasificado el lugar?", "options": ["Área urbana protegida", "Patrimonio Cultural de la Humanidad", "Maravilla natural del mundo", "Sitio Ramsar (humedal de importancia internacional)"], "correct": 3, "question_en": "In 2004, how was the place classified?", "options_en": ["Protected urban area", "World Cultural Heritage", "Natural wonder of the world", "Ramsar site (wetland of international importance)"], "question_fa": null, "options_fa": null}]}, {"id": 4, "title": "La celebración del Día de Muertos", "topic": "Tradición cultural", "text": "El Día de Muertos se celebra el 1 y 2 de noviembre. En esta festividad se agasaja a los difuntos con ofrendas que incluyen sus alimentos preferidos, agua, flores de cempasúchil, velas, papel picado, pan de muerto y calaveritas de azúcar y chocolate. El objetivo es convidar a los seres queridos que ya no están.\n\nEl Día de Muertos es una muestra de la gran riqueza cultural de México. Esta festividad de origen indígena fue declarada en 2008 por la UNESCO como Patrimonio Cultural Inmaterial de la Humanidad. De raíces prehispánicas, combinadas con la celebración católica del Día de Todos los Santos, busca rendir culto a los antepasados, pues se cree que el 1 y 2 de noviembre las almas de los fallecidos regresan para convivir con los vivos.\n\nEntre los lugares más emblemáticos de esta celebración están Pátzcuaro, en Michoacán, y San Andrés Mixquic, en la Ciudad de México, así como la Huasteca Potosina, Huaquechula, en Puebla, y Ocotepec, en Morelos. En estos sitios se ha mantenido la tradición ancestral de convivencia entre vivos y muertos en casas, calles y cementerios.\n\nMixquic, al sur de la Ciudad de México, en la Delegación Tláhuac, tiene una de las celebraciones más impactantes: todo el pueblo participa en la fiesta para recibir a las almas de los difuntos. El 1 de noviembre llegan las ánimas de los niños y el día 2 las de los adultos, en medio de ofrendas, oraciones y el repique de las campanas. La alumbrada, o noche de las velas, es el evento más significativo: el 2 de noviembre, a partir de las seis de la tarde, los habitantes de Mixquic van al panteón con velas, incienso y flores, iluminan todas las tumbas y permanecen junto a ellas para que la luz de las velas guíe a las ánimas en su camino de regreso.", "text_en": "The Day of the Dead is celebrated on November 1 and 2. During this festivity, the deceased are honored with offerings that include their favorite foods, water, marigold flowers, candles, papel picado, pan de muerto, and sugar or chocolate skulls. The goal is to share with the loved ones who are no longer here. The Day of the Dead is a sign of Mexico's great cultural richness. This festivity of indigenous origin was declared in 2008 by UNESCO as Intangible Cultural Heritage of Humanity. Of pre-Hispanic roots, combined with the Catholic celebration of All Saints' Day, it seeks to honor ancestors, since it is believed that on November 1 and 2 the souls of the deceased return to live with the living. Among the most emblematic places for this celebration are Pátzcuaro in Michoacán and San Andrés Mixquic in Mexico City, as well as the Huasteca Potosina, Huaquechula in Puebla, and Ocotepec in Morelos. In these places the ancestral tradition of coexistence between the living and the dead has been kept in houses, streets, and cemeteries. Mixquic, south of Mexico City in the Tláhuac borough, has one of the most striking celebrations: the whole town takes part in the party to receive the souls of the dead. On November 1 the souls of the children arrive, and on day 2 those of the adults, amid offerings, prayers, and the ringing of bells. The alumbrada, or night of candles, is the most significant event: on November 2, starting at six in the evening, the people of Mixquic go to the cemetery with candles, incense, and flowers, light all the graves, and stay beside them so the candlelight guides the souls on their way back.", "text_fa": null, "questions": [{"id": 10400, "question": "¿En qué fechas se celebra el Día de Muertos?", "options": ["1 y 2 de noviembre", "1 y 2 de enero", "24 y 25 de diciembre", "15 y 16 de septiembre"], "correct": 0, "question_en": "On which dates is the Day of the Dead celebrated?", "options_en": ["November 1 and 2", "January 1 and 2", "December 24 and 25", "September 15 and 16"], "question_fa": null, "options_fa": null}, {"id": 10401, "question": "¿Qué elementos se incluyen en las ofrendas según el texto?", "options": ["Solo juguetes y dulces", "Alimentos preferidos, flores, velas y pan de muerto", "Ropa y zapatos nuevos", "Únicamente fotografías"], "correct": 1, "question_en": "Which elements are included in the offerings according to the text?", "options_en": ["Only toys and candy", "Favorite foods, flowers, candles and pan de muerto", "New clothes and shoes", "Only photographs"], "question_fa": null, "options_fa": null}, {"id": 10402, "question": "¿En qué año fue declarada Patrimonio Cultural Inmaterial de la Humanidad por la UNESCO?", "options": ["2004", "2008", "2012", "1998"], "correct": 1, "question_en": "In what year was it declared Intangible Cultural Heritage of Humanity by UNESCO?", "options_en": ["2004", "2008", "2012", "1998"], "question_fa": null, "options_fa": null}, {"id": 10403, "question": "Según la creencia descrita, ¿qué ocurre el 1 y 2 de noviembre?", "options": ["Las almas de los fallecidos regresan a convivir con los vivos", "Se siembran los campos", "Termina la temporada de lluvias", "Se cierran los mercados"], "correct": 0, "question_en": "According to the belief described, what happens on November 1 and 2?", "options_en": ["The souls of the deceased return to live with the living", "The fields are sown", "The rainy season ends", "The markets close"], "question_fa": null, "options_fa": null}, {"id": 10404, "question": "¿Qué ánimas llegan el 1 de noviembre en Mixquic?", "options": ["Las de los niños", "Las de los ancianos", "Las de los adultos", "Las de los animales"], "correct": 0, "question_en": "Whose souls arrive on November 1 in Mixquic?", "options_en": ["The children", "The elderly", "The adults", "The animals"], "question_fa": null, "options_fa": null}, {"id": 10405, "question": "¿Qué es la alumbrada según el texto?", "options": ["Una carrera con antorchas", "La noche en que se iluminan las tumbas con velas", "Un desfile de carros alegóricos", "Una feria gastronómica"], "correct": 1, "question_en": "What is the alumbrada according to the text?", "options_en": ["A torch race", "The night when the graves are lit with candles", "A parade of floats", "A food fair"], "question_fa": null, "options_fa": null}]}, {"id": 5, "title": "La leyenda del Cenote Zací", "topic": "Leyendas y memoria regional", "text": "Un cenote es un pozo de agua dulce que se forma por la erosión de las rocas calizas. En el interior de la ciudad de Valladolid, Yucatán, se encuentra el cenote Zací: una impresionante caverna parcialmente colapsada, de unos 45 metros de diámetro.\n\nDurante el imperio de los Cupules y los Cocomes se fundó, en 1543, la ciudad maya de Zací, cuyo nombre significa «gavilán blanco». Dentro de la ciudad estaba este cenote, y sobre su bóveda vivía la curandera y hechicera del pueblo, una anciana poderosa, patrona de la familia Cocom. En Zací existían dos familias que se disputaban el poder. El cacique Halach-Huinic, «el hombre verdadero», gobernaba en ese tiempo y tenía un hijo llamado Hul-Kin, «rayo de sol», de la familia de los Cupules.\n\nLa nieta de la hechicera se había quedado huérfana al nacer. La abuela la quería doblemente: era la hermosa Sac-Nicte, «flor blanca». Al principio Hul-Kin y Sac-Nicte parecían odiarse y peleaban constantemente; sin embargo, al llegar a la juventud surgió entre ellos un apasionado amor. Se veían a escondidas, pero el cacique se enteró y, enfurecido, envió a su hijo a un pueblo del sur para casarlo con una princesa, como parte de una alianza.\n\nSac-Nicte perdió la alegría y, entre llantos, le contó a su abuela su secreto: estaba embarazada y no quería vivir más. La abuela le prometió traer de vuelta a Hul-Kin. Un día, Sac-Nicte se enteró de que Hul-Kin se casaba; entonces amarró una piedra a su larga cabellera y se arrojó a las aguas del cenote. En ese momento, Hul-Kin sintió un fuerte dolor en el pecho y regresó esa misma noche. Al enterarse de lo ocurrido, se arrojó al cenote para morir con su verdadero amor. La hechicera, en un arranque de ira, maldijo el cenote: cada año, cuando el manto verde del agua se tornara oscuro, el cenote cobraría una vida en sacrificio por aquel amor prohibido.", "text_en": "A cenote is a freshwater pool formed by the erosion of limestone rock. Inside the city of Valladolid, Yucatán, lies the Zací cenote: an impressive, partially collapsed cavern about 45 meters in diameter. During the rule of the Cupules and the Cocomes, the Maya city of Zací — whose name means \"white hawk\" — was founded in 1543. This cenote was inside the city, and over its vault lived the town's healer and sorceress, a powerful old woman, matron of the Cocom family. In Zací there were two families that permanently disputed power. The chief Halach-Huinic, \"the true man,\" governed at that time and had a son named Hul-Kin, \"sunbeam,\" of the Cupul family. The sorceress's granddaughter had been orphaned at birth. The grandmother loved her doubly: she was the beautiful Sac-Nicte, \"white flower.\" At first Hul-Kin and Sac-Nicte seemed to hate each other and fought constantly; however, in their youth a passionate love grew between them. They met in secret, but the chief found out and, enraged, sent his son to a southern town to marry a princess as part of an alliance. Sac-Nicte lost her joy and, in tears, told her grandmother her secret: she was pregnant and did not want to live anymore. The grandmother promised to bring Hul-Kin back. One day Sac-Nicte learned that Hul-Kin was getting married; she tied a stone to her long hair and threw herself into the cenote's waters. At that moment Hul-Kin felt a strong pain in his chest and returned that same night. Upon learning what had happened, he threw himself into the cenote to die with his true love. The sorceress, in a fit of rage, cursed the cenote: every year, when the green veil of the water turned dark, the cenote would take a life as a sacrifice for that forbidden love.", "text_fa": null, "questions": [{"id": 10500, "question": "¿Qué es un cenote según el texto?", "options": ["Un pozo de agua dulce formado por la erosión de rocas calizas", "Un volcán apagado", "Un río subterráneo salado", "Una laguna artificial"], "correct": 0, "question_en": "What is a cenote according to the text?", "options_en": ["A freshwater pool formed by the erosion of limestone rock", "An extinct volcano", "An underground saltwater river", "An artificial lagoon"], "question_fa": null, "options_fa": null}, {"id": 10501, "question": "¿En qué ciudad se ubica el cenote Zací?", "options": ["Valladolid", "Cancún", "Campeche", "Mérida"], "correct": 0, "question_en": "In which city is the Zací cenote located?", "options_en": ["Valladolid", "Cancún", "Campeche", "Mérida"], "question_fa": null, "options_fa": null}, {"id": 10502, "question": "¿Qué significa Sac-Nicte?", "options": ["Gavilán blanco", "Rayo de sol", "Agua oscura", "Flor blanca"], "correct": 3, "question_en": "What does Sac-Nicte mean?", "options_en": ["White hawk", "Sunbeam", "Dark water", "White flower"], "question_fa": null, "options_fa": null}, {"id": 10503, "question": "¿Qué hizo el cacique al enterarse del amor de Hul-Kin y Sac-Nicte?", "options": ["Desterró a la hechicera", "Cerró el cenote", "Bendijo la unión", "Envió a su hijo a un pueblo del sur para casarlo con una princesa"], "correct": 3, "question_en": "What did the chief do upon learning of the love between Hul-Kin and Sac-Nicte?", "options_en": ["Banished the sorceress", "Closed the cenote", "Blessed the union", "Sent his son to a southern town to marry a princess"], "question_fa": null, "options_fa": null}, {"id": 10504, "question": "¿Qué se ató Sac-Nicte a la cabellera antes de arrojarse al cenote?", "options": ["Una flor blanca", "Un collar de oro", "Una cuerda", "Una piedra"], "correct": 3, "question_en": "What did Sac-Nicte tie to her hair before throwing herself into the cenote?", "options_en": ["A white flower", "A gold necklace", "A rope", "A stone"], "question_fa": null, "options_fa": null}, {"id": 10505, "question": "¿Qué maldición lanzó la hechicera sobre el cenote?", "options": ["Que cada año, al oscurecerse el agua, cobraría una vida", "Que la ciudad desaparecería", "Que nadie volvería a enamorarse en Zací", "Que sus aguas se secarían para siempre"], "correct": 0, "question_en": "What curse did the sorceress place on the cenote?", "options_en": ["That every year, when the water darkened, it would take a life", "That the city would disappear", "That no one would fall in love in Zací again", "That its waters would dry up forever"], "question_fa": null, "options_fa": null}]}, {"id": 6, "title": "Los volcanes: Popocatépetl e Iztaccíhuatl", "topic": "Leyenda prehispánica y paisaje", "text": "Hace miles de lunas vivió un joven destacado en las artes de la guerra, famoso por sus hazañas. Un día, en su camino, se encontró con una hermosa joven y quedó inmediatamente enamorado. Decidió pedir su mano, pero el padre de ella, un hombre poco destacado en la guerra, puso una condición: entregaría a su hija a cambio de que el guerrero luchara en favor de su pueblo. El joven aceptó, pues lo prometido era regresar victorioso y obtener el amor de aquella joven.\n\nLa guerra se prolongó y la joven comenzó a angustiarse y a sufrir por amor. Llegó a sus oídos la versión de que el guerrero había muerto en batalla; enfermó de dolor del alma y, una mañana, su padre la encontró sumida en el sueño eterno. Al día siguiente, el sol iluminaba el valle y se escucharon sonidos de victoria: el ejército regresaba y, al frente, avanzaba el joven con la alegría de reunirse con su amada.\n\nSu corazón se rompió al conocer la noticia. Gritó al cielo pidiendo explicaciones a los dioses, tomó el cuerpo de su amada, subió al valle, la recostó en la cima y decidió velar su sueño eterno con una antorcha encendida. Los dioses, al ver aquel acto de amor, eternizaron a la pareja: cubrieron sus cuerpos con nieve y los petrificaron para siempre. Con el paso de los siglos aún podemos ver a los dos enamorados en dos grandes montañas: el Popocatépetl y el Iztaccíhuatl.\n\nEl nombre Popocatépetl viene del náhuatl y significa «montaña que humea», porque desde tiempos prehispánicos permanece activo. Iztaccíhuatl significa «mujer blanca», pues se asemeja a una mujer dormida cubierta por un manto blanco. Ambos volcanes se ubican en los límites de la Ciudad de México y Puebla, y están unidos por el norte mediante el Paso de Cortés.", "text_en": "Thousands of moons ago there lived a young man outstanding in the arts of war, famous for his deeds. One day, on his path, he met a beautiful young woman and fell in love at once. He decided to ask for her hand, but her father, a man of little renown in war, set a condition: he would give his daughter in exchange for the warrior fighting on behalf of his people. The young man accepted, for what was promised was to return victorious and win that young woman's love. The war dragged on and the young woman began to grow anxious and to suffer for love. Word reached her that the warrior had died in battle; she fell ill with sorrow and, one morning, her father found her lost in eternal sleep. The next day the sun shone over the valley and sounds of victory were heard: the army was returning and, at the front, the young man advanced with the joy of reuniting with his beloved. His heart broke when he learned the news. He cried out to the sky asking the gods for answers, took his beloved's body, climbed to the valley, laid her on the summit, and decided to watch over her eternal sleep with a lit torch. The gods, seeing that act of love, made the couple eternal: they covered their bodies with snow and turned them to stone forever. Over the centuries we can still see the two lovers in two great mountains: Popocatépetl and Iztaccíhuatl. The name Popocatépetl comes from Nahuatl and means \"smoking mountain,\" because it has remained active since pre-Hispanic times. Iztaccíhuatl means \"white woman,\" since it resembles a sleeping woman covered by a white mantle. Both volcanoes stand on the border of Mexico City and Puebla, and are joined on the north by the Paso de Cortés.", "text_fa": null, "questions": [{"id": 10600, "question": "¿Qué condición puso el padre de la joven para entregar a su hija?", "options": ["Que abandonara la guerra", "Que construyera un templo", "Que el guerrero luchara en favor de su pueblo", "Que le pagara con oro"], "correct": 2, "question_en": "What condition did the young woman's father set to give away his daughter?", "options_en": ["That he abandon the war", "That he build a temple", "That the warrior fight on behalf of his people", "That he pay in gold"], "question_fa": null, "options_fa": null}, {"id": 10601, "question": "¿Qué noticia enfermó de tristeza a la joven?", "options": ["Que el guerrero había muerto en batalla", "Que debía abandonar su hogar", "Que su padre la casaría con otro", "Que la guerra nunca terminaría"], "correct": 0, "question_en": "What news made the young woman sick with sadness?", "options_en": ["That the warrior had died in battle", "That she had to leave her home", "That her father would marry her to another", "That the war would never end"], "question_fa": null, "options_fa": null}, {"id": 10602, "question": "¿Qué hizo el guerrero al encontrar muerta a su amada?", "options": ["Declaró la guerra a los dioses", "La enterró junto al río", "La llevó a la cima y veló su sueño con una antorcha encendida", "Se marchó a otra tierra"], "correct": 2, "question_en": "What did the warrior do upon finding his beloved dead?", "options_en": ["Declared war on the gods", "Buried her beside the river", "Took her to the summit and watched over her sleep with a lit torch", "Left for another land"], "question_fa": null, "options_fa": null}, {"id": 10603, "question": "¿Qué hicieron los dioses al ver el acto de amor?", "options": ["Cubrieron sus cuerpos con nieve y los petrificaron", "Los convirtieron en estrellas", "Les devolvieron la vida", "Los castigaron con el olvido"], "correct": 0, "question_en": "What did the gods do when they saw the act of love?", "options_en": ["Covered their bodies with snow and turned them to stone", "Turned them into stars", "Brought them back to life", "Punished them with oblivion"], "question_fa": null, "options_fa": null}, {"id": 10604, "question": "¿Qué significa Popocatépetl en náhuatl?", "options": ["Mujer blanca", "Montaña que humea", "Cerro dormido", "Valle de fuego"], "correct": 1, "question_en": "What does Popocatépetl mean in Nahuatl?", "options_en": ["White woman", "Smoking mountain", "Sleeping hill", "Valley of fire"], "question_fa": null, "options_fa": null}, {"id": 10605, "question": "¿Qué significa Iztaccíhuatl según el texto?", "options": ["Mujer blanca", "Flor blanca", "Montaña que humea", "Rayo de sol"], "correct": 0, "question_en": "What does Iztaccíhuatl mean according to the text?", "options_en": ["White woman", "White flower", "Smoking mountain", "Sunbeam"], "question_fa": null, "options_fa": null}]}, {"id": 7, "title": "El Mayab, la tierra del faisán y del venado", "topic": "Tradición maya", "text": "Hace mucho tiempo, el dios Itzamná decidió crear una tierra tan hermosa que todo aquel que la conociera quisiera vivir allí. Entonces creó El Mayab, la tierra de los elegidos: sembró las más bellas flores para adornar los caminos, creó enormes cenotes de aguas cristalinas y profundas cavernas llenas de misterio.\n\nDespués, Itzamná entregó la nueva tierra a los mayas y escogió tres animales para que vivieran por siempre en El Mayab: el faisán, el venado y la serpiente de cascabel. Los mayas vivieron felices y construyeron palacios y ciudades de piedra. El faisán volaba hasta los árboles más altos y su grito era tan poderoso que todos los habitantes podían escucharlo; el venado corría ligero como el viento, y la serpiente movía sus cascabeles para producir música a su paso.\n\nUn día, los chilam, los adivinos mayas, vieron en el futuro algo que les causó gran tristeza y anunciaron: «Pronto nos invadirán hombres venidos de muy lejos; traerán armas y pelearán contra nosotros para quitarnos nuestra tierra». Al oírlo, el faisán huyó a la selva y se escondió entre las hierbas para que los invasores no lo encontraran. El venado lloró tanto que sus lágrimas formaron muchas aguadas y desde entonces le quedaron los ojos húmedos, como si estuviera siempre triste. La serpiente de cascabel, en cambio, decidió olvidar su música y luchar: creó un nuevo sonido al mover la cola, que ahora usa antes de atacar.\n\nComo anunciaron los chilam, los extranjeros conquistaron El Mayab. Sin embargo, un famoso adivino maya dijo que los tres animales cumplirían una misión importante y que llegaría el día en que los mayas recuperarían su tierra. Las señales serían tres: el faisán volaría sobre los árboles más altos y su sombra se vería en todo El Mayab; el venado atravesaría la tierra de un solo salto, y la serpiente produciría música de nuevo. Mientras ese día llega, el faisán alisa sus alas, el venado afila sus pezuñas y la serpiente frota sus cascabeles.", "text_en": "Long ago, the god Itzamná decided to create a land so beautiful that anyone who knew it would want to live there. So he created El Mayab, the land of the chosen: he planted the most beautiful flowers to adorn the paths, created enormous cenotes of crystalline waters, and deep caverns full of mystery. Then Itzamná gave the new land to the Maya and chose three animals to live forever in El Mayab: the pheasant, the deer, and the rattlesnake. The Maya lived happily and built palaces and stone cities. The pheasant flew to the highest trees and its cry was so powerful that all the inhabitants could hear it; the deer ran light as the wind, and the snake shook its rattles to make music as it passed. One day the chilam, the Maya seers, saw in the future something that filled them with sadness and announced: \"Soon men from far away will invade us; they will bring weapons and fight us to take our land.\" Upon hearing this, the pheasant fled into the jungle and hid among the grasses so the invaders would not find it. The deer wept so much that its tears formed many waterholes, and since then its eyes have stayed moist, as if always sad. The rattlesnake, in contrast, decided to forget its music and fight: it created a new sound by shaking its tail, which it now uses before attacking. As the chilam had announced, the foreigners conquered El Mayab. However, a famous Maya seer said the three animals would fulfill an important mission and that the day would come when the Maya recover their land. The signs would be three: the pheasant would fly over the highest trees and its shadow would be seen across all El Mayab; the deer would cross the land in a single leap, and the snake would make music again. Until that day comes, the pheasant preens its wings, the deer sharpens its hooves, and the snake rubs its rattles.", "text_fa": null, "questions": [{"id": 10700, "question": "¿Quién creó El Mayab según la leyenda?", "options": ["Itzamná", "Hul-Kin", "Quetzalcóatl", "Halach-Huinic"], "correct": 0, "question_en": "Who created El Mayab according to the legend?", "options_en": ["Itzamná", "Hul-Kin", "Quetzalcóatl", "Halach-Huinic"], "question_fa": null, "options_fa": null}, {"id": 10701, "question": "¿Qué tres animales escogió Itzamná para vivir en El Mayab?", "options": ["El faisán, el venado y la serpiente de cascabel", "El águila, el jaguar y la serpiente", "El quetzal, el mono y el tucán", "El colibrí, el coyote y el armadillo"], "correct": 0, "question_en": "Which three animals did Itzamná choose to live in El Mayab?", "options_en": ["The pheasant, the deer and the rattlesnake", "The eagle, the jaguar and the snake", "The quetzal, the monkey and the toucan", "The hummingbird, the coyote and the armadillo"], "question_fa": null, "options_fa": null}, {"id": 10702, "question": "¿Quiénes anunciaron la llegada de los invasores?", "options": ["Los guerreros aztecas", "Los sacerdotes católicos", "Los chilam (adivinos mayas)", "Los mercaderes"], "correct": 2, "question_en": "Who announced the arrival of the invaders?", "options_en": ["The Aztec warriors", "The Catholic priests", "The chilam (Maya seers)", "The merchants"], "question_fa": null, "options_fa": null}, {"id": 10703, "question": "¿Qué formaron las lágrimas del venado?", "options": ["Ríos de agua salada", "Cenotes secos", "Muchas aguadas", "Cascadas"], "correct": 2, "question_en": "What did the deer's tears form?", "options_en": ["Saltwater rivers", "Dry cenotes", "Many waterholes", "Waterfalls"], "question_fa": null, "options_fa": null}, {"id": 10704, "question": "¿Qué hizo la serpiente de cascabel al saber de la conquista?", "options": ["Se escondió en una caverna", "Lloró hasta quedarse dormida", "Creó un nuevo sonido para luchar", "Huyó a la selva"], "correct": 2, "question_en": "What did the rattlesnake do upon learning of the conquest?", "options_en": ["Hid in a cavern", "Wept until it fell asleep", "Created a new sound to fight", "Fled to the jungle"], "question_fa": null, "options_fa": null}, {"id": 10705, "question": "¿Cuáles serán las tres señales para recuperar la tierra?", "options": ["El trueno, el rayo y la lluvia", "El canto del gallo, el ladrido y el maullido", "La sombra del faisán, el salto del venado y la música de la serpiente", "La salida del sol, la luna llena y la estrella"], "correct": 2, "question_en": "What will be the three signs to recover the land?", "options_en": ["Thunder, lightning and rain", "The rooster's crow, the bark and the meow", "The pheasant's shadow, the deer's leap and the snake's music", "Sunrise, full moon and star"], "question_fa": null, "options_fa": null}]}, {"id": 8, "title": "La leyenda del maíz", "topic": "Mundo mesoamericano", "text": "Cuentan las historias de los primeros habitantes de Mesoamérica que, antes de la llegada del dios Quetzalcóatl, los aztecas sobrevivían alimentándose únicamente de raíces y de los animales que cazaban. Ellos no tenían el maíz, pues este cereal tan alimenticio estaba escondido detrás de las montañas y no tenían acceso a él.\n\nLos antiguos dioses intentaron obtenerlo y trataron de separar las montañas con su colosal fuerza, pero no lo lograron. Entonces los aztecas pidieron ayuda al dios Quetzalcóatl. Él no quiso emplear la fuerza, sino la inteligencia y la astucia, y se transformó en una hormiga negra. Decidió dirigirse a las montañas acompañado de una hormiga roja, dispuesto a conseguir el maíz para su pueblo.\n\nTras mucho esfuerzo y sin perder el ánimo, Quetzalcóatl subió las montañas. Al llegar a su destino, tomó entre sus mandíbulas un grano maduro de maíz e inició el duro camino de regreso. Entregó el grano prometido a los hambrientos indígenas, quienes plantaron la semilla, y desde entonces tuvieron maíz para alimentarse.\n\nEl preciado grano aumentó sus riquezas: se volvieron más fuertes y construyeron ciudades, palacios y templos. Desde entonces vivieron felices, y los aztecas veneraron al generoso Quetzalcóatl, el dios amigo de los hombres, el dios que les trajo el maíz.", "text_en": "The stories of the first inhabitants of Mesoamerica tell that, before the arrival of the god Quetzalcóatl, the Aztecs survived eating only roots and the animals they hunted. They did not have maize, because this nutritious grain was hidden behind the mountains and they had no access to it. The ancient gods tried to obtain it and attempted to separate the mountains with their colossal strength, but they failed. So the Aztecs asked the god Quetzalcóatl for help. He did not wish to use force, but rather intelligence and cunning, and he transformed himself into a black ant. He decided to head to the mountains accompanied by a red ant, determined to get the maize for his people. After much effort and without losing heart, Quetzalcóatl climbed the mountains. Upon reaching his destination, he took a ripe grain of maize between his jaws and began the hard journey back. He gave the promised grain to the hungry people, who planted the seed, and from then on they had maize to feed themselves. The precious grain increased their wealth: they became stronger and built cities, palaces, and temples. From then on they lived happily, and the Aztecs revered the generous Quetzalcóatl, the god who was a friend to men, the god who brought them maize.", "text_fa": null, "questions": [{"id": 10800, "question": "Antes de tener maíz, ¿de qué se alimentaban los aztecas?", "options": ["De frutas y verduras", "De tortillas y frijoles", "De raíces y de los animales que cazaban", "De pescado y mariscos"], "correct": 2, "question_en": "Before having maize, what did the Aztecs eat?", "options_en": ["Fruits and vegetables", "Tortillas and beans", "Roots and the animals they hunted", "Fish and seafood"], "question_fa": null, "options_fa": null}, {"id": 10801, "question": "¿Por qué los aztecas no podían obtener el maíz?", "options": ["Porque era muy caro", "Porque estaba escondido detrás de las montañas", "Porque no sabían sembrar", "Porque los dioses lo habían prohibido"], "correct": 1, "question_en": "Why couldn't the Aztecs obtain the maize?", "options_en": ["Because it was very expensive", "Because it was hidden behind the mountains", "Because they didn't know how to sow", "Because the gods had forbidden it"], "question_fa": null, "options_fa": null}, {"id": 10802, "question": "¿Qué hicieron primero los antiguos dioses para obtener el maíz?", "options": ["Plantaron semillas", "Intentaron separar las montañas con su fuerza", "Pidieron ayuda a Quetzalcóatl", "Negociaron con otros pueblos"], "correct": 1, "question_en": "What did the ancient gods do first to obtain the maize?", "options_en": ["They planted seeds", "They tried to separate the mountains with their strength", "They asked Quetzalcóatl for help", "They negotiated with other peoples"], "question_fa": null, "options_fa": null}, {"id": 10803, "question": "¿En qué animal se transformó Quetzalcóatl para conseguir el maíz?", "options": ["En una hormiga negra", "En un venado", "En un águila", "En una serpiente"], "correct": 0, "question_en": "Into what animal did Quetzalcóatl transform to get the maize?", "options_en": ["A black ant", "A deer", "An eagle", "A snake"], "question_fa": null, "options_fa": null}, {"id": 10804, "question": "¿Quién acompañó a Quetzalcóatl a las montañas?", "options": ["Un faisán", "Un venado", "Una hormiga roja", "Un guerrero azteca"], "correct": 2, "question_en": "Who accompanied Quetzalcóatl to the mountains?", "options_en": ["A pheasant", "A deer", "A red ant", "An Aztec warrior"], "question_fa": null, "options_fa": null}, {"id": 10805, "question": "¿Qué hicieron los aztecas con el grano que les entregó Quetzalcóatl?", "options": ["Lo plantaron y desde entonces tuvieron maíz", "Lo regalaron a otros pueblos", "Lo guardaron como ofrenda", "Lo vendieron"], "correct": 0, "question_en": "What did the Aztecs do with the grain Quetzalcóatl gave them?", "options_en": ["They planted it and from then on had maize", "They gave it to other peoples", "They kept it as an offering", "They sold it"], "question_fa": null, "options_fa": null}]}, {"id": 9, "title": "Chinampas de Xochimilco", "topic": "Tecnicas agricolas tradicionales", "text": "Las chinampas son un sistema agrícola tradicional desarrollado en zonas lacustres del Valle de México. Consisten en parcelas construidas de forma artificial sobre aguas someras, con técnicas que permiten alta productividad y manejo cuidadoso del entorno. En Xochimilco, este método ha sostenido por siglos la producción de hortalizas, flores y plantas de consumo local. Su valor no es solo económico: también representa conocimiento histórico sobre suelos, agua y biodiversidad. Por esa razón, se considera un patrimonio cultural y ambiental de gran relevancia. Aunque hoy enfrenta presiones urbanas y ambientales, diversas comunidades y proyectos trabajan para conservarlo mediante restauración ecológica, reforestación y fortalecimiento productivo. En una lectura de examen, este tipo de texto puede incluir preguntas sobre la función de las chinampas, su origen histórico y los riesgos actuales que enfrentan. Comprenderlo exige relacionar técnica tradicional con sostenibilidad y vida comunitaria en la ciudad.", "text_en": "Chinampas are a traditional agricultural system developed in the lake areas of the Valley of Mexico. They consist of plots built artificially over shallow waters, with techniques that allow high productivity and careful management of the environment. In Xochimilco, this method has sustained for centuries the production of vegetables, flowers, and plants for local consumption. Its value is not only economic: it also represents historical knowledge about soil, water, and biodiversity. For this reason, it is considered a cultural and environmental heritage of great relevance. Although today it faces urban and environmental pressures, various communities and projects work to conserve it through ecological restoration, reforestation, and productive strengthening. In an exam reading, this type of text may include questions about the function of the chinampas, their historical origin, and the current risks they face. Understanding it requires relating traditional technique with sustainability and community life in the city.", "text_fa": null, "questions": [{"id": 10900, "question": "¿Qué son las chinampas según el texto?", "options": ["Fortalezas de piedra", "Mercados flotantes", "Parcelas agrícolas tradicionales construidas sobre aguas someras", "Canales de riego para ganado"], "correct": 2, "question_en": "According to the text, what are chinampas?", "options_en": ["Stone fortresses", "Floating markets", "Traditional agricultural plots built over shallow waters", "Irrigation canals for cattle"], "question_fa": null, "options_fa": null}, {"id": 10901, "question": "¿Qué ha sostenido por siglos el método de Xochimilco?", "options": ["Pesca marítima", "Fabricación textil", "Extracción minera", "Producción de hortalizas, flores y plantas"], "correct": 3, "question_en": "What has Xochimilco's method sustained for centuries?", "options_en": ["Maritime fishing", "Textile manufacturing", "Mining extraction", "Production of vegetables and flowers"], "question_fa": null, "options_fa": null}, {"id": 10902, "question": "Además del valor económico, ¿qué representan las chinampas?", "options": ["Tecnología militar", "Ceremonias religiosas", "Rutas de comercio internacional", "Conocimiento histórico sobre suelos, agua y biodiversidad"], "correct": 3, "question_en": "Besides economic value, what do chinampas represent?", "options_en": ["Military technology", "Religious ceremonies", "International trade routes", "Historical knowledge about soil, water and biodiversity"], "question_fa": null, "options_fa": null}, {"id": 10903, "question": "¿Qué presiones enfrenta hoy este sistema?", "options": ["Falta de turistas", "Presiones urbanas y ambientales", "Exceso de tierras", "Solo cambios de clima"], "correct": 1, "question_en": "What pressures does this system face today?", "options_en": ["Lack of tourists", "Urban and environmental pressures", "Too much farmland", "Only weather changes"], "question_fa": null, "options_fa": null}, {"id": 10904, "question": "¿Cómo intentan conservar las chinampas las comunidades?", "options": ["Eliminando vegetación", "Restauración ecológica y reforestación", "Construyendo viviendas", "Cerrando los canales"], "correct": 1, "question_en": "How do communities try to conserve the chinampas?", "options_en": ["Removing vegetation", "Ecological restoration and reforestation", "Building housing", "Closing the canals"], "question_fa": null, "options_fa": null}, {"id": 10905, "question": "¿Qué relación exige comprender las chinampas?", "options": ["Minería y puertos", "Moda y espectáculo", "Industria y banca", "Técnica tradicional, sostenibilidad y vida comunitaria"], "correct": 3, "question_en": "What relationship does understanding the chinampas require?", "options_en": ["Mining and ports", "Fashion and entertainment", "Industry and banking", "Traditional technique, sustainability and community life"], "question_fa": null, "options_fa": null}]}, {"id": 10, "title": "Reserva de la Biosfera Mariposa Monarca", "topic": "Patrimonio natural y cultural", "text": "Cada año, millones de mariposas monarca viajan miles de kilómetros desde Norteamérica hasta los bosques templados de México, principalmente en Michoacán y el Estado de México. Este fenómeno migratorio destaca por su precisión y continuidad, pues las colonias regresan de manera recurrente a zonas de hibernación. La región ha sido reconocida por su relevancia ecológica y por el valor cultural que las comunidades locales le atribuyen. En algunos contextos, la llegada de la monarca coincide con temporadas de memoria y celebración comunitaria, lo que fortalece su simbolismo. La conservación de estos bosques requiere acciones coordinadas: manejo forestal, vigilancia, restauración y participación social. Por eso, estudiar la monarca no significa solo conocer una especie; implica entender la relación entre biodiversidad, territorio y cultura. En ejercicios de comprensión, suelen preguntarse datos de ubicación, finalidad de protección y mensaje central del texto.", "text_en": "Every year, millions of monarch butterflies travel thousands of kilometers from North America to the temperate forests of Mexico, mainly in Michoacán and the State of Mexico. This migratory phenomenon stands out for its precision and continuity, since the colonies return repeatedly to hibernation areas. The region has been recognized for its ecological relevance and for the cultural value that local communities give it. In some contexts, the monarch's arrival coincides with seasons of remembrance and community celebration, which strengthens its symbolism. Conserving these forests requires coordinated actions: forest management, monitoring, restoration, and social participation. That is why studying the monarch does not mean only knowing a species; it implies understanding the relationship between biodiversity, territory, and culture. In comprehension exercises, questions are usually asked about location data, the purpose of protection, and the central message of the text.", "text_fa": null, "questions": [{"id": 11000, "question": "¿A dónde llegan las mariposas monarca según el texto?", "options": ["Selvas de Chiapas y Tabasco", "Bosques de Michoacán y Estado de México", "Playas de Baja California", "Valles de Sonora"], "correct": 1, "question_en":  "Fashion and spectacle", "Biodiversity, territory and culture", "Mining and ports"], "question_fa": null, "options_fa": null}, {"id": 11005, "question": "¿Qué tipo de preguntas menciona el texto para comprensión?", "options": ["Solo ortografía técnica", "Cálculo de impuestos", "Historia de inventos europeos", "Ubicación, protección y mensaje central"], "correct": 3, "question_en": "What kind of questions does the text mention for comprehension?", "options_en": ["Only technical spelling", "Tax calculation", "History of European inventions", "Location, protection and central message"], "question_fa": null, "options_fa": null}]}, {"id": 11, "title": "Mariachi: musica de cuerdas, canto y trompeta", "topic": "Musica tradicional mexicana", "text": "El mariachi es una expresión musical ampliamente reconocida como símbolo de México. Su evolución incluye una vertiente tradicional de cuerdas y otra moderna que incorpora trompetas, vihuela, guitarrón y violines en formaciones más amplias. A lo largo del tiempo, su repertorio ha integrado sones, jarabes, corridos, valses y canciones rancheras, entre otros géneros. Más que un estilo sonoro, el mariachi funciona como práctica social: se interpreta en fiestas familiares, celebraciones comunitarias y actos cívicos. También ha sido una vía de transmisión intergeneracional de memoria local, lenguaje y afecto por la región de origen. En diversos espacios culturales se reconoce su papel como patrimonio inmaterial por su capacidad de articular identidad y pertenencia. En lectura de comprensión, este tema suele evaluar si la persona distingue entre características del mariachi tradicional y del moderno, y si identifica su importancia cultural más allá de la música.", "text_en": "The mariachi is a musical expression widely recognized as a symbol of Mexico. Its evolution includes a traditional string style and a modern one that adds trumpets, vihuela, guitarrón, and violins in larger ensembles. Over time, its repertoire has included sones, jarabes, corridos, waltzes, and rancheras, among other genres. More than a sound style, the mariachi works as a social practice: it is performed at family parties, community celebrations, and civic events. It has also been a way of passing local memory, language, and affection for one's region from generation to generation. In various cultural spaces its role as intangible heritage is recognized for its capacity to articulate identity and belonging. In reading comprehension, this topic usually evaluates whether the person distinguishes the characteristics of traditional and modern mariachi, and whether they identify its cultural importance beyond music.", "text_fa": null, "questions": [{"id": 11100, "question": "¿Qué instrumentos se mencionan en la variante moderna?", "options": ["Saxofón y acordeón exclusivamente", "Piano y flauta transversal", "Trompetas, violines, vihuela y guitarrón", "Solo batería eléctrica"], "correct": 2, "question_en": "Which instruments are mentioned in the modern style?", "options_en": ["Saxophone and accordion exclusively", "Piano and transverse flute", "Trumpets, violins, vihuela and guitarrón", "Only electric drums"], "question_fa": null, "options_fa": null}, {"id": 11101, "question": "¿Qué géneros se citan dentro del repertorio?", "options": ["Música electrónica de club", "Jazz contemporáneo únicamente", "Ópera italiana exclusivamente", "Sones, jarabes y corridos"], "correct": 3, "question_en": "Which genres are cited within the repertoire?", "options_en": ["Electronic club music", "Only contemporary jazz", "Only Italian opera", "Sones, jarabes and corridos"], "question_fa": null, "options_fa": null}, {"id": 11102, "question": "¿Cómo define el texto al mariachi además de estilo musical?", "options": ["Disciplina militar", "Práctica social y cultural", "Método de construcción", "Sistema de transporte"], "correct": 1, "question_en": "How does the text define mariachi besides a musical style?", "options_en": ["A military discipline", "A se sistema, junto con procesos como la nixtamalización, el uso de comales y las preparaciones regionales que cambian según territorio y temporada. En 2010, esta cocina fue inscrita en la Lista Representativa del Patrimonio Cultural Inmaterial de la Humanidad, reconocimiento que subraya su relevancia social y su capacidad de transmitir conocimiento entre generaciones. El texto también destaca la dimensión de sostenibilidad: proteger semillas, valorar a los productores locales y mantener las técnicas tradicionales fortalece comunidades y ecosistemas. En comprensión lectora, suelen aparecer preguntas sobre la idea principal, la fecha de reconocimiento y la relación entre alimentación e identidad.", "text_en": "Traditional Mexican cuisine is understood as a living heritage that unites ingredients, techniques, community knowledge, and celebrations. Its cultural value does not depend on a single dish, but on a network of practices that begins in the countryside and continues in markets, family kitchens, and local festivals. Maize holds a central place in that system, together with processes such as nixtamalization, the use of comales, and regional preparations that change according to territory and season. In 2010, this cuisine was inscribed on the Representative List of the Intangible Cultural Heritage of Humanity, a recognition that highlights its social relevance and its capacity to pass knowledge between generations. The text also highlights the sustainability dimension: protecting seeds, valuing local producers, and maintaining traditional techniques strengthens communities and ecosystems. In reading comprehension, questions often appear about the main idea, the date of recognition, and the relationship between food and identity.", "text_fa": null, "questions": [{"id": 11200, "question": "¿Cómo define el texto la cocina tradicional mexicana?", "options": ["Lista fija de un solo estado", "Patrimonio vivo de prácticas comunitarias", "Conjunto de recetas importadas", "Industria exclusivamente urbana"], "correct": 1, "question_en": "How does the text define traditional Mexican cuisine?", "options_en": ["A fixed list from a single state", "Living heritage of community practices", "A set of imported recipes", "An exclusively urban industry"], "question_fa": null, "options_fa": null}, {"id": 11201, "question": "¿Qué ingrediente se menciona como central?", "options": ["Avena", "Centeno", "Trigo", "Maíz"], "correct": 3, "question_en": "Which ingredient is mentioned as central?", "options_en": ["Oats", "Rye", "Wheat", "Maize"], "question_fa": null, "options_fa": null}, {"id": 11202, "question": "¿En qué año se reconoce en la Lista Representativa?", "options": ["2008", "2020", "2010", "2015"], "correct": 2, "question_en": "In what year was it recognized on the Representative List?", "options_en": ["2008", "2020", "2010", "2015"], "question_fa": null, "options_fa": null}, {"id": 11203, "question": "¿Qué aspecto resalta el reconocimiento internacional?", "options": ["Homogeneidad nacional obligatoria", "Transmisión social y cultural del conocimiento", "Sustitución total de técnicas tradicionales", "Uso exclusivo de maquinaria"], "correct": 1, "question_en": "What aspect does the international recognition highlight?", "options_en": ["Obligatory national homogeneity", "Social and cultural transmission of knowledge", "Total replacement of traditional techniques", "Exclusive use of machinery"], "question_fa": null, "options_fa": null}, {"id": 11204, "question": "¿Qué dimensión adicional menciona el texto?", "options": ["Mercados financieros", "Turismo de lujo exclusivamente", "Sostenibilidad y apoyo a productores locales", "Espectáculo deportivo"], "correct": 2, "question_en": "What additional dimension does the text mention?", "options_en": ["Financial markets", "Luxury tourism exclusively", "Sustainability and support for local producers", "Sporting spectacle"], "question_fa": null, "options_fa": null}, {"id": 11205, "question": "¿Qué tipo de pregunta de comprensión puede aparecer?", "options": ["Historia de la aviación", "Pronunciación en latín", "Fórmulas químicas avanzadas", "Idea principal y fecha de reconocimiento"], "correct": 3, "question_en": "What kind of comprehension question can appear?", "options_en": ["History of aviation", "Pronunciation in Latin", "Advanced chemical formulas", "Main idea and date of recognition"], "question_fa": null, "options_fa": null}]}, {"id": 13, "title": "Alebrijes y cartoneria", "topic": "Arte popular", "text": "Los alebrijes son figuras fantásticas del arte popular mexicano, elaboradas tradicionalmente en cartonería y madera policromada, según la región. En la narrativa más difundida, su origen moderno se asocia al artesano Pedro Linares, quien imaginó criaturas de formas inesperadas y gran colorido. Con el tiempo, esta expresión creció en talleres familiares, ferias, desfiles y espacios culturales. Más allá de lo visual, los alebrijes representan creatividad colectiva y transmisión de oficio entre generaciones. Muchas piezas combinan rasgos de varios animales para construir un ser simbólico único, lo que permite experimentar con identidad, imaginación y memoria local. En algunas ciudades, su elaboración se ha reconocido como patrimonio cultural intangible por su importancia artística y comunitaria. En una lectura de comprensión, este tema permite evaluar si se identifican origen, materiales y función cultural de la artesanía sin reducirla a un objeto decorativo.", "text_en": "Alebrijes are fantastic figures of Mexican folk art, traditionally made of cartonería (papier-mâché) and polychrome wood, depending on the region. In the most widespread account, their modern origin is associated with the artisan Pedro Linares, who imagined creatures of unexpected shapes and great color. Over time, this expression grew in family workshops, fairs, parades, and cultural spaces. Beyond the visual, alebrijes represent collective creativity and the passing of a craft between generations. Many pieces combine features of several animals to build a unique symbolic being, which allows experimenting with identity, imagination, and local memory. In some cities, their making has been recognized as intangible cultural heritage for its artistic and community importance. In a reading comprehension, this topic allows evaluating whether one identifies the origin, materials, and cultural function of the craft without reducing it to a decorative object.", "text_fa": null, "questions": [{"id": 11300, "question": "¿Qué son los alebrijes según el texto?", "options": ["Trajes ceremoniales", "Figuras fantásticas del arte popular", "Edificios históricos", "Instrumentos musicales"], "correct": 1, "question_en": "What are alebrijes according to the text?", "options_en": ["Ceremonial costumes", "Fantastic figures of folk art", "Historic buildings", "Musical instruments"], "question_fa": null, "options_fa": null}, {"id": 11301, "question": "¿Con qué artesano se asocia su origen moderno?", "options": ["José María Velasco", "Pedro Linares", "Enrique Carbajal", "Diego Rivera"], "correct": 1, "question_en": "With which artisan is their modern origin associated?", "options_en": ["José María Velasco", "Pedro Linares", "Enrique Carbajal", "Diego Rivera"], "question_fa": null, "options_fa": null}, {"id": 11302, "question": "¿Qué materiales se mencionan?", "options": ["Cartonería y madera policromada", "Concreto y mármol", "Solo acero", "Solo vidrio"], "correct": 0, "question_en": "Which materials are mentioned?", "options_en": ["Cartonería and polychrome wood", "Concrete and marble", "Only steel", "Only glass"], "question_fa": null, "options_fa": null}, {"id": 11303, "question": "¿Qué representan culturalmente además de su aspecto visual?", "options": ["Tecnología militar", "Normas fiscales", "Creatividad colectiva y oficio familiar", "Manual de arquitectura"], "correct": 2, "question_en": "What do they represent culturally besides their visual aspect?", "options_en": ["Military technology", "Tax rules", "Collective creativity and family craft", "An architecture manual"], "question_fa": null, "options_fa": null}, {"id": 11304, "question": "¿Cómo se construye un ser simbólico en estas piezas?", "options": ["Repitiendo una sola forma", "Copiando planos técnicos", "Combinando rasgos de varios animales", "Usando fotografía oficial"], "correct": 2, "question_en": "How is a symbolic being built in these pieces?", "options_en": ["By repeating a single shape", "By copying technical plans", "By combining features of several animals", "By using official photography"], "question_fa": null, "options_fa": null}, {"id": 11305, "question": "¿Qué busca evaluar el texto en comprensión lectora?", "options": ["Origen, materiales y función cultural", "Solo longitud de la pieza", "Solo cantidad de pintura", "Solo precio de mercado"], "correct": 0, "question_en": "What does the text seek to evaluate in reading comprehension?", "options_en": ["Origin, materials and cultural function", "Only length of the piece", "Only amount of paint", "Only market price"], "question_fa": null, "options_fa": null}]}, {"id": 14, "title": "Popocatepetl: la montana que humea", "topic": "Geografia, lengua y simbolismo", "text": "El nombre Popocatépetl proviene del náhuatl y se interpreta como «montaña que humea». Esta denominación refleja la observación histórica de su actividad volcánica y la relación que los pueblos del altiplano han mantenido con el entorno. Desde tiempos prehispánicos, las fumarolas del volcán se han asociado con fuerza, respeto y significado ritual. Su presencia domina el paisaje de regiones cercanas a Puebla, Estado de México y Morelos, donde ha influido en rutas, asentamientos y relatos locales. El texto subraya que un volcán puede leerse desde dos planos: el científico, que estudia procesos geológicos, y el cultural, que conserva memorias, leyendas y prácticas comunitarias. En comprensión lectora, esta combinación de perspectivas obliga a distinguir dato lingüístico, descripción natural e interpretación simbólica. Al hacerlo, la persona lectora demuestra que no solo identifica información puntual, sino también la estructura de sentido que une territorio e historia.", "text_en": "The name Popocatépetl comes from Nahuatl and is interpreted as \"smoking mountain.\" This name reflects the historical observation of its volcanic activity and the relationship that highland peoples have kept with their surroundings. Since pre-Hispanic times, the volcano's fumaroles have been associated with strength, respect, and ritual meaning. Its presence dominates the landscape of regions near Puebla, the State of Mexico, and Morelos, where it has influenced routes, settlements, and local stories. The text stresses that a volcano can be read on two levels: the scientific one, which studies geological processes, and the cultural one, which keeps memories, legends, and community practices. In reading comprehension, this combination of perspectives requires distinguishing linguistic data, natural description, and symbolic interpretation. In doing so, the reader shows not only that they identify specific information, but also the structure of meaning that unites territory and history.", "text_fa": null, "questions": [{"id": 11400, "question": "¿Qué significa Popocatépetl en náhuatl según el texto?", "options": ["Agua profunda", "Tierra del faisán", "Mujer blanca", "Montaña que humea"], "correct": 3, "question_en": "What does Popocatépetl mean in Nahuatl according to the text?", "options_en": ["Deep water", "Land of the pheasant", "White woman", "Smoking mountain"], "question_fa": null, "options_fa": null}, {"id": 11401, "question": "¿Qué elemento histórico refleja ese nombre?", "options": ["Observación de su actividad volcánica", "Uso de calendarios europeos", "Diseño colonial de rutas", "Traducción francesa moderna"], "correct": 0, "question_en": "What historical element does that name reflect?", "options_en": ["Observation of its vol  null}]}, {"id": 15, "title": "Parque Nacional Izta-Popo", "topic": "Area natural protegida", "text": "El Parque Nacional Iztaccíhuatl-Popocatépetl es una de las áreas naturales protegidas más conocidas del centro de México. Su importancia radica en la biodiversidad, los servicios ambientales y la función hidrológica que cumple para regiones cercanas. En sus montañas y valles existen ecosistemas que ayudan a regular el clima, conservar suelos y mantener procesos biológicos clave. También tiene valor histórico: en su entorno se desarrollaron comunidades que domesticaron cultivos fundamentales para la dieta local, como maíz, frijol y calabaza. Este doble carácter, natural y cultural, explica por qué su conservación exige estrategias de largo plazo y participación social. No se trata solo de proteger paisajes: se trata de sostener condiciones de vida para poblaciones humanas y no humanas. En comprensión lectora, un texto así puede preguntar por el objetivo de protección, ejemplos de biodiversidad o la relación entre patrimonio natural y conocimiento comunitario.", "text_en": "The Iztaccíhuatl–Popocatépetl National Park is one of the best-known protected natural areas in central Mexico. Its importance lies in the biodiversity, the environmental services, and the hydrological function it provides for nearby regions. In its mountains and valleys there are ecosystems that help regulate climate, conserve soils, and maintain key biological processes. It also has historical value: communities developed in its surroundings and domesticated crops fundamental to the local diet, such as maize, beans, and squash. This double natural and cultural character explains why its conservation requires long-term strategies and social participation. It is not only about protecting landscapes: it is about sustaining living conditions for human and non-human populations. In reading comprehension, a text like this can ask about the purpose of protection, examples of biodiversity, or the relationship between natural heritage and community knowledge.", "text_fa": null, "questions": [{"id": 11500, "question": "¿Qué tipo de espacio es Izta-Popo según el texto?", "options": ["Puerto comercial", "Corredor ferroviario", "Zona industrial", "Área natural protegida"], "correct": 3, "question_en": "What type of space is Izta-Popo according to the text?", "options_en": ["Commercial port", "Railway corridor", "Industrial zone", "Protected natural area"], "question_fa": null, "options_fa": null}, {"id": 11501, "question": "¿Qué razón principal se menciona para su importancia?", "options": ["Turismo de playa", "Biodiversidad y servicios ambientales", "Comercio marítimo", "Explotación minera"], "correct": 1, "question_en": "What main reason is mentioned for its importance?", "options_en": ["Beach tourism", "Biodiversity and environmental services", "Maritime trade", "Mining exploitation"], "question_fa": null, "options_fa": null}, {"id": 11502, "question": "¿Qué cultivos se nombran como parte de su valor histórico?", "options": ["Trigo y centeno", "Maíz, frijol y calabaza", "Café y cacao", "Cebada y avena"], "correct": 1, "question_en": "Which crops are named as part of its historical value?", "options_en": ["Wheat and rye", "Maize, beans and squash", "Coffee and cacao", "Barley and oats"], "question_fa": null, "options_fa": null}, {"id": 11503, "question": "¿Qué exige su conservación según el texto?", "options": ["Solo campañas publicitarias", "Estrategias de largo plazo y participación social", "Privatización completa", "Cierre total de acceso"], "correct": 1, "question_en": "What does its conservation demand according to the text?", "options_en": ["Only advertising campaigns", "Long-term strategies and social participation", "Complete privatization", "Total closure of access"], "question_fa": null, "options_fa": null}, {"id": 11504, "question": "¿Qué diferencia destaca el texto sobre conservar?", "options": ["Es solo deporte de montaña", "Es solo regulación de tráfic
