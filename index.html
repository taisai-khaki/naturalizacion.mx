:root{--bg:#022c22;--bg2:#064e3b;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--ink:#ecfdf5;--mut:#a7f3d0;--gold:#fcd34d;--rose:#fb7185;--green:#6ee7b7;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;font-weight:700;padding:10px 18px;border-radius:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.ghost[aria-pressed="true"]{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.55);color:#fde68a}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d1fae5;border:1px solid var(--line)}
.pill.gold{background:rgba(252,211,77,.15);color:#fde68a;border-color:rgba(252,211,77,.3)}
.pill.green{background:rgba(110,231,183,.15);color:#a7f3d0;border-color:rgba(110,231,183,.3)}
.pill.rose{background:rgba(251,113,133,.15);color:#fecdd3;border-color:rgba(251,113,133,.3)}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px}
.mut{color:var(--mut)}
.small{font-size:12px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;transition:background .15s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.sel{border-color:var(--gold);background:rgba(252,211,77,.18)}
.opt.ok{border-color:var(--green);background:rgba(110,231,183,.15)}
.opt.bad{border-color:var(--rose);background:rgba(251,113,133,.15)}
.opt.locked{opacity:.4}
.translation{color:#bfdbfe;font-style:italic;font-size:14px;margin-top:6px;padding:8px 10px;background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;border-radius:6px;white-space:pre-wrap}
.translation.fa{direction:rtl;text-align:right;font-style:normal;font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.8;border-left:0;border-right:3px solid #3b82f6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tab.on{background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#06281e;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:24px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#fcd34d,#fb7185);border-radius:999px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loginbox{max-width:420px;margin:8vh auto}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;margin:6px 0 12px}
textarea.field{min-height:120px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.passage{max-height:46vh;overflow:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.55}
#flashcard{margin:20px 0}
.qtext{font-size:19px;font-weight:700;line-height:1.4;margin:12px 0}
.footer{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}
.marker{color:#34d399;font-weight:700}
.badmark{color:#fda4af;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.badge.ok{background:rgba(110,231,183,.18);color:#6ee7b7}
.badge.no{background:rgba(251,113,133,.18);color:#fb7185}
</style>

rrect": 0, "explicacion": "México es una economía emergente relevante.", "categoria": "Historia", "subtema": "Economía", "dificultad": "media", "pregunta_en": "What place does Mexico hold in the world economy?", "opciones_en": ["16th place among the world's largest economies.", "Among the top 50", "Among the top 100", "Among the top 5"], "explicacion_en": "Mexico is a relevant emerging economy.", "pregunta_fa": null, "opciones_fa": null, "explicacion_fa": null}], "lectura": [{"id": 1, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 1, "title": "Párrafo 1 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Cuentan las historias de los primeros habitantes de Mesoamérica, que en el periodo anterior a la llegada del dios Quetzalcóatl, los aztecas sobrevivían alimentándose únicamente de las raíces y de los animales que cazaban.", "questions": [{"id": 50100, "question": "¿Qué comían los primeros habitantes de Mesoamérica antes de la llegada de Quetzalcóatl?", "options": ["Solo frutas silvestres de los árboles", "Raíces y animales que cazaban", "Cereales cultivados en grandes valles", "Pescado que capturaban en el mar"], "correct": 1}, {"id": 50101, "question": "¿Cuál era la situación de los aztecas antes de la llegada del dios Quetzalcóatl?", "options": ["Comerciaban con pueblos de la costa", "Tenían grandes ciudades y templos", "Cultivaban maíz en abundancia", "Sobrevivían solo con raíces y animales cazados"], "correct": 3}, {"id": 50102, "question": "¿En qué periodo se sitúa la falta de maíz según la leyenda?", "options": ["En los años posteriores a la muerte del dios", "Durante la construcción de los grandes templos", "En el periodo anterior a la llegada de Quetzalcóatl", "Después de la llegada de los conquistadores"], "correct": 2}, {"id": 50103, "question": "¿A qué pueblo se refiere el primer párrafo como el que vivía de raíces y de la cacería?", "options": ["A los olmecas de la costa", "A los aztecas", "A los incas del sur", "A los mayas de la península"], "correct": 1}, {"id": 50104, "question": "¿Qué tipo de vida llevaban los habitantes mencionados en el primer párrafo?", "options": ["Se alimentaban de raíces y de animales que cazaban", "Se alimentaban de pescado de río", "Vivían de la agricultura intensiva de regadío", "Se dedicaban al comercio marítimo"], "correct": 0}, {"id": 50105, "question": "¿Qué dios aparece en la leyenda como el que llegó a Mesoamérica?", "options": ["Xipe Tótec", "Tláloc", "Quetzalcóatl", "Huitzilopochtli"], "correct": 2}, {"id": 50106, "question": "¿Qué expresa la frase «periodo anterior a la llegada del dios Quetzalcóatl»?", "options": ["Un tiempo previo a su llegada", "Un momento de celebración religiosa", "Una época de paz total", "Un tiempo posterior a su muerte"], "correct": 0}, {"id": 50107, "question": "¿Qué significa la palabra «únicamente» en «se alimentaban únicamente de las raíces»?", "options": ["Principalmente, aunque no solo", "De forma ocasional", "Solo, exclusivamente", "Además de otros alimentos"], "correct": 2}, {"id": 50108, "question": "¿De qué modo obtenían los aztecas parte de su alimento según el primer párrafo?", "options": ["Cazando animales", "Comprándolos en mercados", "Pescándolos en el mar", "Criándolos en granjas"], "correct": 0}]}, {"id": 2, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 2, "title": "Párrafo 2 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Ellos no tenían el maíz, pues este cereal tan alimenticio, estaba escondido detrás de las montañas y ellos no tenían acceso a él. Los antiguos dioses trataron de obtenerlo e intentaron separar las montañas con su colosal fuerza, pero no lo lograron, así que los aztecas pidieron ayuda al dios Quezalcóatl.", "questions": [{"id": 50200, "question": "¿Por qué no tenían maíz los aztecas?", "options": ["Porque estaba escondido detrás de las montañas y no tenían acceso a él", "Porque lo habían quemado en una guerra", "Porque los dioses lo habían prohibido", "Porque se había acabado en las cosechas"], "correct": 0}, {"id": 50201, "question": "¿Dónde estaba escondido el maíz?", "options": ["Bajo tierra, en cuevas profundas", "Detrás de las montañas", "En una isla lejana", "En el fondo de un lago"], "correct": 1}, {"id": 50202, "question": "¿Cómo describe el texto al maíz?", "options": ["Como una planta venenosa", "Como un cereal muy alimenticio", "Como un alimento de lujo sin valor", "Como una fruta silvestre y amarga"], "correct": 1}, {"id": 50203, "question": "¿Qué intentaron hacer los antiguos dioses para obtener el maíz?", "options": ["Separar las montañas con su fuerza", "Construir un puente hacia el cielo", "Robar el maíz de los pueblos vecinos", "Pedir el maíz a los dioses del mar"], "correct": 0}, {"id": 50204, "question": "¿Lograron los antiguos dioses obtener el maíz por la fuerza?", "options": ["Sí, separaron las montañas en un solo día", "No, no lograron separar las montañas", "Sí, mediante un acuerdo con los aztecas", "Sí, con ayuda de los animales"], "correct": 1}, {"id": 50205, "question": "¿A quién pidieron ayuda los aztecas?", "options": ["A un cacique de la costa", "Al dios de la lluvia", "Al dios Quetzalcóatl", "A los antiguos dioses del fuego"], "correct": 2}, {"id": 50206, "question": "¿Qué pasó con el intento de los antiguos dioses de separar las montañas?", "options": ["No tuvo éxito; no lograron obtener el maíz", "Creó un lago entre los montes", "Abrió un paso hacia el maíz", "Hizo que las montañas se elevaran aún más"], "correct": 0}, {"id": 50207, "question": "¿Cómo se describe la fuerza de los antiguos dioses?", "options": ["Moderada", "Colosal", "Insignificante", "Débil"], "correct": 1}, {"id": 50208, "question": "¿Qué hicieron los aztecas al no poder obtener el maíz por sí mismos?", "options": ["Abandonaron la región para siempre", "Pidieron ayuda al dios Quetzalcóatl", "Se rindieron sin intentar nada más", "Atacaron a los dioses antiguos"], "correct": 1}, {"id": 50209, "question": "¿Qué significa la expresión «no tenían acceso a él»?", "options": ["Lo rechazaban por costumbre", "No podían alcanzarlo ni obtenerlo", "Lo vendían en los mercados", "Lo tenían guardado en sus casas"], "correct": 1}, {"id": 50210, "question": "¿Qué relación indica «así que» en «así que los aztecas pidieron ayuda»?", "options": ["Una consecuencia: como no lo lograron, pidieron ayuda", "Una comparación entre dos dioses", "Una condición que debe cumplirse", "Un contraste entre dos ideas"], "correct": 0}, {"id": 50211, "question": "¿Qué elemento de la naturaleza bloqueaba el acceso al maíz?", "options": ["Los desiertos", "El mar", "Las montañas", "Los ríos"], "correct": 2}, {"id": 50212, "question": "¿Quién intentó separar las montañas?", "options": ["Quetzalcóatl", "Los antiguos dioses", "Los pueblos de la costa", "Los aztecas"], "correct": 1}]}, {"id": 3, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 3, "title": "Párrafo 3 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Quezalcóatl no quiso emplear la fuerza, sino la inteligencia y la astucia, y se transformó en una hormiga negra. Decidió dirigirse a las montañas acompañado de una hormiga roja, dispuesto a conseguir el maíz para su pueblo.", "questions": [{"id": 50300, "question": "¿Qué tipo de recurso eligió Quetzalcóatl para conseguir el maíz?", "options": ["La magia de los sacerdotes", "La fuerza física", "La inteligencia y la astucia", "El dinero y los regalos"], "correct": 2}, {"id": 50301, "question": "¿En qué animal se transformó Quetzalcóatl?", "options": ["En un venado", "En una hormiga negra", "En un jaguar", "En un águila real"], "correct": 1}, {"id": 50302, "question": "¿Quién acompañó a Quetzalcóatl en su viaje?", "options": ["Un sacerdote del templo", "Un perro fiel", "Un guerrero azteca", "Una hormiga roja"], "correct": 3}, {"id": 50303, "question": "¿Hacia dónde se dirigió Quetzalcóatl?", "options": ["Hacia el mar", "Hacia las montañas", "Hacia un lago sagrado", "Hacia un cenote de la selva"], "correct": 1}, {"id": 50304, "question": "¿Para quién buscaba Quetzalcóatl el maíz?", "options": ["Para venderlo en mercados lejanos", "Para los dioses antiguos", "Para su pueblo", "Para sus enemigos"], "correct": 2}, {"id": 50305, "question": "¿Por qué no quiso usar la fuerza Quetzalcóatl?", "options": ["Las montañas eran demasiado bajas", "Prefería la inteligencia y la astucia", "Le faltaba fuerza física", "Los dioses se lo habían prohibido"], "correct": 1}, {"id": 50306, "question": "¿De qué color era la hormiga que acompañó a Quetzalcóatl?", "options": ["Roja", "Dorada", "Verde", "Negra"], "correct": 0}, {"id": 50307, "question": "¿Qué significa «astucia» en el texto?", "options": ["Miedo a los riesgos del viaje", "Fuerza bruta para vencer obstáculos", "Costumbre de los antiguos dioses", "Habilidad para resolver problemas con ingenio"], "correct": 3}, {"id": 50308, "question": "¿Qué decidió hacer Quetzalcóatl después de transformarse?", "options": ["Pedir perdón a los dioses antiguos", "Dirigirse a las montañas con la hormiga roja", "Viajar al mar en una canoa", "Quedarse en el templo a rezar"], "correct": 1}]}, {"id": 4, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 4, "title": "Párrafo 4 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Tras mucho esfuerzo y sin perder el ánimo, Quezalcóatl subió las montañas y cuando llegó a su destino, tomó entre sus mandíbulas un grano maduro de maíz e inició el duro regreso. Al llegar entregó el prometido grano de maíz a los hambrientos indígenas que plantaron la semilla, y desde entonces, tuvieron maíz para alimentarse.", "questions": [{"id": 50400, "question": "¿Qué hizo Quetzalcóatl al llegar a su destino?", "options": ["Tomó con sus mandíbulas un grano maduro de maíz", "Llamó a la lluvia para regar la tierra", "Construyó un templo en la montaña", "Peleó contra las montañas"], "correct": 0}, {"id": 50401, "question": "¿Qué parte de su cuerpo usó Quetzalcóatl para tomar el grano?", "options": ["La cola", "Las mandíbulas", "Las antenas", "Las patas delanteras"], "correct": 1}, {"id": 50402, "question": "¿Qué característica tenía el grano que tomó Quetzalcóatl?", "options": ["Estaba seco y roto", "Estaba todavía verde", "Estaba mojado por la lluvia", "Estaba maduro"], "correct": 3}, {"id": 50403, "question": "¿Cómo describe el texto el regreso de Quetzalcóatl?", "options": ["Como un viaje fácil y corto", "Como un duro regreso", "Como una huida sin esfuerzo", "Como una celebración alegre"], "correct": 1}, {"id": 50404, "question": "¿A quiénes entregó Quetzalcóatl el grano de maíz?", "options": ["A los guerreros de otros pueblos", "A los dioses de las montañas", "A los mercaderes de la costa", "A los hambrientos indígenas"], "correct": 3}, {"id": 50405, "question": "¿Qué hicieron los indígenas con el grano recibido?", "options": ["Lo guardaron en un templo", "Lo ofrecieron a los dioses sin plantarlo", "Lo vendieron a extranjeros", "Lo plantaron como semilla"], "correct": 3}, {"id": 50406, "question": "¿Qué les había prometido Quetzalcóatl a los indígenas?", "options": ["Una nueva ciudad", "La protección de los dioses", "Riquezas de oro", "Un grano de maíz"], "correct": 3}, {"id": 50407, "question": "¿Qué actitud mostró Quetzalcóatl durante la subida a las montañas?", "options": ["Esfuerzo sin perder el ánimo", "Enojo contra los indígenas", "Miedo y desánimo constante", "Indiferencia ante el peligro"], "correct": 0}, {"id": 50408, "question": "¿Desde cuándo tuvieron maíz los indígenas?", "options": ["Desde que plantaron la semilla que les dio Quetzalcóatl", "Desde el año de la conquista", "Desde antes de la llegada de Quetzalcóatl", "Desde que construyeron sus ciudades"], "correct": 0}, {"id": 50409, "question": "¿Qué significa «mandíbulas» en el texto?", "options": ["Antenas que sirven para oler", "Partes de la boca que sujetan y muerden", "Patas delanteras del insecto", "Alas con las que vuela"], "correct": 1}, {"id": 50410, "question": "¿Qué significa «maduro» referido al grano?", "options": ["Verde y todavía muy duro", "Listo para consumirse o sembrarse", "Podrido por el tiempo", "Pequeño y sin valor"], "correct": 1}, {"id": 50411, "question": "¿Qué hizo Quetzalcóatl después de tomar el grano?", "options": ["Inició el regreso", "Se quedó en la montaña a descansar", "Se escondió en una cueva", "Subió a un templo para orar"], "correct": 0}, {"id": 50412, "question": "¿Quién plantó la semilla del maíz?", "options": ["Los antiguos dioses", "Los hambrientos indígenas", "Los guerreros aztecas", "Quetzalcóatl solo, sin ayuda"], "correct": 1}, {"id": 50413, "question": "¿Qué beneficio obtuvieron los indígenas desde entonces?", "options": ["Tuvieron maíz para alimentarse", "Se trasladaron a otra región", "Obtuvieron oro para comerciar", "Ganaron guerras contra sus vecinos"], "correct": 0}]}, {"id": 5, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 5, "title": "Párrafo 5 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "El preciado grano, aumentó sus riquezas, y se volvieron más fuertes, construyeron ciudades, palacios, templos… Y desde entonces vivieron felices.", "questions": [{"id": 50500, "question": "¿Qué efecto tuvo el maíz en la riqueza de los pueblos?", "options": ["Aumentó sus riquezas", "No cambió nada en su vida", "Las trasladó a otros pueblos", "Las redujo de forma notable"], "correct": 0}, {"id": 50501, "question": "¿Qué construyeron los pueblos después de tener maíz?", "options": ["Carreteras y puentes de hierro", "Barcos de guerra para el mar", "Ciudades, palacios y templos", "Fortalezas bajo el agua"], "correct": 2}, {"id": 50502, "question": "¿Cómo quedaron los pueblos después de tener maíz?", "options": ["Dispersos y sin hogar", "Más débiles y enfermos", "Más fuertes", "Igual que antes"], "correct": 2}, {"id": 50503, "question": "¿Qué frase resume cómo terminó el párrafo?", "options": ["Vivieron felices", "Se dividieron en dos pueblos", "Se marcharon de la región", "Perdieron sus tierras"], "correct": 0}, {"id": 50504, "question": "¿Qué significa «preciado» en «el preciado grano»?", "options": ["Podrido e inservible", "Barato y fácil de conseguir", "Valioso y muy apreciado", "Escaso y sin valor"], "correct": 2}, {"id": 50505, "question": "¿Cuál de estos elementos NO aparece como resultado del maíz?", "options": ["Templos", "Ciudades", "Guerras de conquista", "Palacios"], "correct": 2}]}, {"id": 6, "passage_id": 1, "passage": "Leyenda del maíz", "paragraph": 6, "title": "Párrafo 6 · Leyenda del maíz", "topic": "Mitología prehispánica", "text": "Y a partir de ese momento, los aztecas veneraron al generoso Quetzalcóatl, el dios amigo de los hombres, el dios que les trajo el maíz.", "questions": [{"id": 50600, "question": "¿Qué hicieron los aztecas a partir de ese momento?", "options": ["Destruyeron sus templos", "Emigraron hacia el norte", "Veneraron a Quetzalcóatl", "Abandonaron el maíz por completo"], "correct": 2}, {"id": 50601, "question": "¿Cómo describe el texto a Quetzalcóatl en el último párrafo?", "options": ["Como un dios cruel y distante", "Como un dios que los abandonó", "Como un dios guerrero y violento", "Como el dios amigo de los hombres"], "correct": 3}, {"id": 50602, "question": "¿Qué les trajo Quetzalcóatl a los aztecas?", "options": ["El caballo", "El agua de los ríos", "Un nuevo idioma", "El maíz"], "correct": 3}, {"id": 50603, "question": "¿Qué sentimiento hacia Quetzalcóatl expresa el párrafo?", "options": ["Burla y desprecio", "Veneración y gratitud", "Miedo y rechazo", "Indiferencia total"], "correct": 1}, {"id": 50604, "question": "¿Por qué los aztecas veneraban a Quetzalcóatl?", "options": ["Porque les trajo el maíz", "Porque construyó sus templos", "Porque les enseñó a cazar", "Porque los derrotó en batalla"], "correct": 0}, {"id": 50605, "question": "¿Qué palabra describe el carácter de Quetzalcóatl en el último párrafo?", "options": ["Generoso", "Cruel", "Temeroso", "Egoísta"], "correct": 0}]}, {"id": 7, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 1, "title": "Párrafo 1 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "El majestuoso balcón natural del Sumidero tuvo como origen un largo proceso de fallas geológicas. Tiene un alto valor ecológico y cuenta con 21,789 hectáreas en cinco municipios del estado de Chiapas, a pocos kilómetros de su capital, Tuxtla Gutiérrez.", "questions": [{"id": 50700, "question": "¿Qué originó el majestuoso balcón natural del Sumidero?", "options": ["Un largo proceso de fallas geológicas", "Un terremoto repentino en la costa", "La erosión de un volcán activo", "La construcción de una presa hace siglos"], "correct": 0}, {"id": 50701, "question": "¿Qué valor tiene el Sumidero según el primer párrafo?", "options": ["Únicamente un valor histórico", "Un alto valor ecológico", "Ninguno, es un área urbana", "Solo un valor comercial"], "correct": 1}, {"id": 50702, "question": "¿Cuántas hectáreas abarca el área protegida?", "options": ["2,178 hectáreas", "12,000 hectáreas", "217,890 hectáreas", "21,789 hectáreas"], "correct": 3}, {"id": 50703, "question": "¿En cuántos municipios se extiende el parque?", "options": ["En uno solo", "En cinco municipios", "En tres municipios", "En siete municipios"], "correct": 1}, {"id": 50704, "question": "¿En qué estado de la República se encuentra el Sumidero?", "options": ["Yucatán", "Chiapas", "Michoacán", "Oaxaca"], "correct": 1}, {"id": 50705, "question": "¿Qué ciudad es la capital del estado donde se ubica el cañón?", "options": ["Villahermosa", "Tapachula", "Campeche", "Tuxtla Gutiérrez"], "correct": 3}, {"id": 50706, "question": "¿Qué significa que el cañón esté «a pocos kilómetros» de la capital?", "options": ["Que se encuentra dentro del mar", "Que está cerca de Tuxtla Gutiérrez", "Que está a cientos de kilómetros de Tuxtla", "Que ya no forma parte de Chiapas"], "correct": 1}, {"id": 50707, "question": "¿Qué significa «majestuoso» en el primer párrafo?", "options": ["Pequeño y sencillo", "Oscuro y peligroso", "Impresionante, grandioso", "Abandonado y descuidado"], "correct": 2}, {"id": 50708, "question": "¿Qué tipo de origen tiene el balcón natural según el texto?", "options": ["Humano, por una obra de ingeniería", "Volcánico, por una erupción reciente", "Biológico, por la acción de animales", "Geológico, por fallas"], "correct": 3}, {"id": 50709, "question": "¿Cuál de estos datos NO aparece en el primer párrafo?", "options": ["Su cercanía a Tuxtla Gutiérrez", "Que fue decretado Parque Nacional en 1980", "21,789 hectáreas", "Cinco municipios de Chiapas"], "correct": 1}]}, {"id": 8, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 2, "title": "Párrafo 2 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "El cañón consiste en un imponente acantilado que se eleva sobre el cauce del río Grijalva. Sus muros, que alcanzan los más de 1000 metros de altura, se han convertido en uno de los paisajes más impresionantes de México, nominado desde hace tiempo para ser una de las Siete Nuevas Maravillas Naturales.", "questions": [{"id": 50800, "question": "¿Qué adjetivo se usa para describir el acantilado?", "options": ["Imponente", "Dudoso", "Diminuto", "Llano"], "correct": 0}, {"id": 50801, "question": "¿Qué significa «cauce» en el segundo párrafo?", "options": ["Un lago artificial", "El lecho por donde corre un río", "Un tipo de roca calcárea", "Una planta de la zona"], "correct": 1}, {"id": 50802, "question": "¿Sobre qué cauce se eleva el imponente acantilado?", "options": ["El río Usumacinta", "El río Grijalva", "El río Papaloapan", "El río Balsas"], "correct": 1}, {"id": 50803, "question": "¿Cuánto alcanzan de altura los muros del cañón?", "options": ["Menos de 50 metros", "Más de 1000 metros", "Unos 100 metros", "Unos 300 metros"], "correct": 1}, {"id": 50804, "question": "¿Cómo se describe el cañón en este párrafo?", "options": ["Como una llanura seca", "Como un imponente acantilado", "Como una playa de arena", "Como un bosque plano"], "correct": 1}, {"id": 50805, "question": "¿Para qué ha sido propuesto el Sumidero según el texto?", "options": ["Para convertirse en una ciudad industrial", "Para ser una reserva marina", "Para ser una de las Siete Nuevas Maravillas Naturales", "Para albergar un aeropuerto internacional"], "correct": 2}, {"id": 50806, "question": "¿Desde cuándo está nominado el Sumidero para esa distinción?", "options": ["Desde hace tiempo", "Desde el año 2004", "Desde la construcción de la presa", "Desde la fecha de su decreto como parque"], "correct": 0}, {"id": 50807, "question": "¿Qué paisaje se menciona como uno de los más impresionantes de México?", "options": ["Los muros del cañón", "Las playas del Caribe", "Los desiertos del norte", "Los volcanes nevados"], "correct": 0}, {"id": 50808, "question": "¿Qué significa «nominado» en el segundo párrafo?", "options": ["Ya premiado con un galardón", "Retirado de una lista oficial", "Nombrado por un decreto presidencial", "Propuesto o candidato para recibir un reconocimiento"], "correct": 3}, {"id": 50809, "question": "¿Qué relación hay entre la altura de los muros y el paisaje?", "options": ["Los muros altos hacen del paisaje uno de los más impresionantes", "La altura no tiene relación con el paisaje", "Los muros impiden ver el río", "Los muros bajos hacen el paisaje más atractivo"], "correct": 0}, {"id": 50810, "question": "¿Qué elemento hídrico recorre la base del cañón?", "options": ["El río Grijalva", "Una laguna de agua salada", "Un canal artificial de riego", "Un arroyo de montaña temporal"], "correct": 0}, {"id": 50811, "question": "¿Qué forma geológica describe el segundo párrafo?", "options": ["Una planicie que se hunde en el mar", "Una meseta de piedra caliza sin relieve", "Un acantilado que se eleva sobre el cauce del río", "Una cueva que atraviesa una montaña"], "correct": 2}]}, {"id": 9, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 3, "title": "Párrafo 3 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "La luz y el calor sobre las paredes del acantilado, así como sus abundantes escurrimientos han propiciado el surgimiento de varios microclimas en la vegetación y fauna en diferentes alturas del cañón. Algunas de sus especies endémicas (exclusivas de esta zona) son la salamandra Lengua Hongueada, la cuija Mexicana, el chupaflor Canelo, el sapo Jaspeado, la mojarra de Chiapa de Corzo y el encino Enano.", "questions": [{"id": 50900, "question": "¿Qué han propiciado la luz, el calor y los escurrimientos sobre el acantilado?", "options": ["La desaparición de toda la vegetación", "Varios microclimas en la vegetación y la fauna", "Un clima uniforme en todo el cañón", "La formación de un desierto"], "correct": 1}, {"id": 50901, "question": "¿Qué son las especies endémicas?", "options": ["Especies que llegaron de otro continente", "Especies comunes en todo el mundo", "Especies exclusivas de esta zona", "Especies introducidas por el hombre"], "correct": 2}, {"id": 50902, "question": "¿Cuál de estas especies se menciona como endémica?", "options": ["El águila calva", "El oso pardo", "El lobo gris", "La salamandra Lengua Hongueada"], "correct": 3}, {"id": 50903, "question": "¿Qué ave endémica aparece en el texto?", "options": ["El pelícano blanco", "El chupaflor Canelo", "El cóndor andino", "El águila real"], "correct": 1}, {"id": 50904, "question": "¿Qué tipo de encino aparece en la lista de especies?", "options": ["El encino Gigante", "El encino Enano", "El encino Blanco", "El encino Rojo"], "correct": 1}, {"id": 50905, "question": "¿Qué pez de la lista recibe su nombre de la ciudad de Chiapa de Corzo?", "options": ["La mojarra de Chiapa de Corzo", "El bagre de Chiapa de Corzo", "El robalo de Chiapa de Corzo", "La trucha de Chiapa de Corzo"], "correct": 0}, {"id": 50906, "question": "¿Qué ser vivo se llama «cuija Mexicana» en el texto?", "options": ["Un mamífero nocturno", "Un insecto acuático", "Un ave de gran tamaño", "Un reptil de la zona"], "correct": 3}, {"id": 50907, "question": "¿Qué especie de anfibio aparece en la lista?", "options": ["El ajolote mexicano", "El sapo gigante", "La rana de cristal", "El sapo Jaspeado"], "correct": 3}, {"id": 50908, "question": "¿Qué significa «microclimas»?", "options": ["Climas locales distintos dentro de una zona pequeña", "Climas artificiales creados por el hombre", "Climas desaparecidos por la sequía", "Climas de todo el país"], "correct": 0}, {"id": 50909, "question": "¿Qué factor no aparece como causante de los microclimas?", "options": ["La luz sobre las paredes", "Los abundantes escurrimientos", "La construcción de carreteras", "El calor sobre las paredes"], "correct": 2}, {"id": 50910, "question": "¿Qué se entiende por «diferentes alturas del cañón» en el texto?", "options": ["Distancias entre dos ciudades", "Medidas de la presa de Chicoasén", "Cumbres que no tienen vegetación", "Distintos niveles donde cambian el clima y la vida"], "correct": 3}, {"id": 50911, "question": "¿Cuántas especies endémicas se citan en el párrafo?", "options": ["Doce", "Seis", "Diez", "Tres"], "correct": 1}, {"id": 50912, "question": "¿Qué tipo de vegetación se menciona en el párrafo?", "options": ["Palmeras de coco", "Mangle rojo", "Cactus del desierto", "Encino enano"], "correct": 3}, {"id": 50913, "question": "¿Cuál de estas NO es una especie endémica citada en el párrafo?", "options": ["El sapo Jaspeado", "La salamandra Lengua Hongueada", "El encino Enano", "El jaguar"], "correct": 3}, {"id": 50914, "question": "¿Qué especie endémica citada es un reptil?", "options": ["El chupaflor Canelo", "La mojarra de Chiapa de Corzo", "El sapo Jaspeado", "La cuija Mexicana"], "correct": 3}, {"id": 50915, "question": "¿Qué significa «escurrimientos» en el texto?", "options": ["Derrumbes de piedra", "Corrientes de agua que bajan por las paredes", "Hongos que crecen en la roca", "Pinturas rupestres"], "correct": 1}, {"id": 50916, "question": "¿Qué palabra indica que los microclimas se distribuyen en distintos niveles?", "options": ["Profundidades", "Latitudes", "Longitudes", "Alturas"], "correct": 3}]}, {"id": 10, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 4, "title": "Párrafo 4 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "El parque es frecuentado por decenas de miles de visitantes que gustan de practicar la bicicleta de montaña, el nado, el kayak y el rapel.", "questions": [{"id": 51000, "question": "¿Quiénes frecuentan el parque?", "options": ["Solo militares en entrenamiento", "Solo científicos y biólogos", "Únicamente pescadores locales", "Decenas de miles de visitantes"], "correct": 3}, {"id": 51001, "question": "¿Cuál de estas actividades NO aparece en el párrafo?", "options": ["Esquí sobre nieve", "Bicicleta de montaña", "Nado", "Kayak"], "correct": 0}, {"id": 51002, "question": "¿Qué actividad de cuerda se menciona?", "options": ["El paracaidismo", "El puenting", "La escalada en hielo", "El rapel"], "correct": 3}, {"id": 51003, "question": "¿Qué significa «frecuentado» en este párrafo?", "options": ["Olvidado por completo", "Visitado con frecuencia", "Evitado por peligroso", "Cerrado al público"], "correct": 1}, {"id": 51004, "question": "¿Qué vehículo de dos ruedas usan los visitantes para recorrer el parque?", "options": ["El patinete eléctrico", "El triciclo", "La bicicleta de montaña", "La motocicleta de carrera"], "correct": 2}, {"id": 51005, "question": "¿Qué deporte acuático se practica según el párrafo?", "options": ["El buceo profundo", "El surf", "El esquí acuático", "El kayak"], "correct": 3}, {"id": 51006, "question": "¿Cuál es el propósito principal de la visita según el párrafo?", "options": ["Participar en ceremonias religiosas", "Practicar actividades al aire libre", "Estudiar la historia colonial", "Comprar artesanías en mercados"], "correct": 1}, {"id": 51007, "question": "¿Qué tipo de turismo describe este párrafo?", "options": ["Turismo de playa", "Turismo de compras y comercio", "Turismo de aventura y naturaleza", "Turismo de congresos"], "correct": 2}]}, {"id": 11, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 5, "title": "Párrafo 5 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "Dentro de la zona se encuentra la presa hidroeléctrica de Chicoasén, una de las mayores obras mexicanas de ingeniería hidráulica, con un embalse de 32 kilómetros de largo que abarca la totalidad del cañón.", "questions": [{"id": 51100, "question": "¿Qué obra hidroeléctrica se encuentra dentro de la zona?", "options": ["La presa de Malpaso", "La presa de Chicoasén", "La presa de El Infiernillo", "La presa de Angostura"], "correct": 1}, {"id": 51101, "question": "¿Cómo se describe la presa de Chicoasén?", "options": ["Como una pequeña obra de riego local", "Como un proyecto que nunca se terminó", "Como una de las mayores obras mexicanas de ingeniería hidráulica", "Como una presa abandonada desde hace años"], "correct": 2}, {"id": 51102, "question": "¿Qué longitud tiene el embalse?", "options": ["32 kilómetros", "3.2 kilómetros", "320 kilómetros", "6 kilómetros"], "correct": 0}, {"id": 51103, "question": "¿Qué parte del cañón abarca el embalse?", "options": ["La totalidad del cañón", "Solo la parte alta del cañón", "Solo la entrada del cañón", "Una pequeña laguna en el fondo"], "correct": 0}, {"id": 51104, "question": "¿Qué tipo de obra es la presa de Chicoasén?", "options": ["Ferroviaria", "Minera", "Petrolera", "Hidroeléctrica"], "correct": 3}, {"id": 51105, "question": "¿Qué significa «embalse» en el texto?", "options": ["Parte alta de una montaña", "Tipo de vegetación del cañón", "Depósito artificial de agua contenida por una presa", "Canal de drenaje urbano"], "correct": 2}, {"id": 51106, "question": "¿Qué relación tiene la presa con el cañón?", "options": ["Fue construida fuera del estado de Chiapas", "Divide el parque en dos partes separadas", "Está a cientos de kilómetros del parque", "Se encuentra dentro de la zona del parque"], "correct": 3}, {"id": 51107, "question": "¿Qué tipo de ingeniería destaca el texto?", "options": ["Ingeniería minera", "Ingeniería hidráulica", "Ingeniería nuclear", "Ingeniería aeronáutica"], "correct": 1}, {"id": 51108, "question": "¿Qué función cumple una presa hidroeléctrica?", "options": ["Regar cultivos de cacao", "Proteger la costa de huracanes", "Generar electricidad a partir del agua embalsada", "Extraer petróleo del subsuelo"], "correct": 2}]}, {"id": 12, "passage_id": 2, "passage": "Parque Nacional Cañón del Sumidero", "paragraph": 6, "title": "Párrafo 6 · Parque Nacional Cañón del Sumidero", "topic": "Geografía y medio ambiente", "text": "Por su riqueza ecológica fue decretado Parque Nacional el 8 de diciembre de 1980. En 2004 fue clasificado como sitio Ramsar (humedal de importancia internacional).", "questions": [{"id": 51200, "question": "¿En qué fecha fue decretado Parque Nacional el Sumidero?", "options": ["El 8 de diciembre de 1980", "El 15 de septiembre de 1810", "El 20 de noviembre de 1910", "El 2 de noviembre de 2004"], "correct": 0}, {"id": 51201, "question": "¿En qué año fue clasificado como sitio Ramsar?", "options": ["En 1980", "En 2008", "En 1994", "En 2004"], "correct": 3}, {"id": 51202, "question": "¿Qué significa «sitio Ramsar» según el párrafo?", "options": ["Zona de uso exclusivo militar", "Área urbana con servicios públicos", "Reserva de caza deportiva", "Humedal de importancia internacional"], "correct": 3}, {"id": 51203, "question": "¿Por qué fue decretado el parque según el párrafo?", "options": ["Por su potencial minero", "Por ser una antigua fortaleza", "Por su riqueza ecológica", "Por su valor como zona industrial"], "correct": 2}, {"id": 51204, "question": "¿Qué tipo de reconocimiento recibió el Sumidero en 2004?", "options": ["Una distinción gastronómica", "Internacional, como humedal", "Un galardón deportivo", "Un premio literario nacional"], "correct": 1}, {"id": 51205, "question": "¿Qué orden cronológico es correcto en el párrafo?", "options": ["Decreto en 2004 y clasificación en 1980", "Clasificación Ramsar en 1980 y decreto en 2004", "Decreto como parque en 1980 y clasificación Ramsar en 2004", "Ambos eventos ocurrieron el mismo año"], "correct": 2}]}, {"id": 13, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 1, "title": "Párrafo 1 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "El Día de Muertos, que se realiza el 1 y 2 de noviembre, en la cual se agasaja a los difuntos con ofrendas que incluyen sus alimentos preferidos, agua, flores de cempasúchil, velas, papel picado, pan de muerto y calaveritas de azúcar y chocolate, para convidar a los seres queridos que ya no están.", "questions": [{"id": 51300, "question": "¿En qué fechas se realiza el Día de Muertos?", "options": ["El 15 y 16 de septiembre", "El 25 de diciembre", "El 12 de octubre", "El 1 y 2 de noviembre"], "correct": 3}, {"id": 51301, "question": "¿Para qué se preparan las ofrendas?", "options": ["Para pagar impuestos a los dioses", "Para convidar a los seres queridos que ya no están", "Para festejar la llegada del verano", "Para celebrar una cosecha de maíz"], "correct": 1}, {"id": 51302, "question": "¿Cuál de estos elementos NO aparece en la descripción de las ofrendas?", "options": ["Globos de helio", "Pan de muerto", "Flores de cempasúchil", "Velas"], "correct": 0}, {"id": 51303, "question": "¿Qué tipo de flor se menciona en las ofrendas?", "options": ["Orquídea silvestre", "Rosa de Castilla", "Cempasúchil", "Lirio blanco"], "correct": 2}, {"id": 51304, "question": "¿Qué alimentos se colocan en las ofrendas?", "options": ["Solo alimentos enlatados", "Únicamente frutas tropicales", "Solo carne asada", "Los alimentos preferidos de los difuntos"], "correct": 3}, {"id": 51305, "question": "¿Qué son las calaveritas mencionadas en el texto?", "options": ["Dulces de azúcar y chocolate", "Juguetes de madera", "Cráneos de animales", "Piezas de cerámica"], "correct": 0}, {"id": 51306, "question": "¿Qué significa «agasaja» en el primer párrafo?", "options": ["Vende o intercambia", "Castiga o reprende", "Honra o recibe con atenciones", "Olvida o desprecia"], "correct": 2}, {"id": 51307, "question": "¿Qué elemento de papel se usa en la decoración?", "options": ["Papel de china sin recortar", "Papel tapiz", "Papel picado", "Cartón corrugado"], "correct": 2}, {"id": 51308, "question": "¿Qué se incluye en la ofrenda además de la comida?", "options": ["Monedas de oro", "Armas y herramientas", "Ropa nueva", "Agua, flores y velas"], "correct": 3}, {"id": 51309, "question": "¿Qué expresa la frase «para convidar a los seres queridos que ya no están»?", "options": ["Que los vivos deben abandonar sus casas", "Que la ofrenda invita a recordar y acoger a los difuntos", "Que la fiesta solo es para niños", "Que los difuntos deben pagar una deuda"], "correct": 1}, {"id": 51310, "question": "¿Qué pan se coloca en la ofrenda?", "options": ["Pan de muerto", "Pan dulce de canela", "Pan integral de centeno", "Bolillo recién horneado"], "correct": 0}, {"id": 51311, "question": "¿Qué líquido se incluye en la ofrenda?", "options": ["Atole de chocolate", "Agua", "Jugo de naranja", "Pulque"], "correct": 1}, {"id": 51312, "question": "¿De quién son los alimentos preferidos que se colocan en la ofrenda?", "options": ["De los difuntos", "De los sacerdotes del templo", "De los visitantes extranjeros", "De los niños de la familia"], "correct": 0}]}, {"id": 14, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 2, "title": "Párrafo 2 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "El Día de Muertos es muestra de la gran riqueza cultural de México. La festividad indígena fue declarada en 2008 por la Organización de las Naciones Unidas para la Educación, la Ciencia y la Cultura (UNESCO) como Patrimonio Cultural Inmaterial de la Humanidad. De raíces prehispánicas, combinada con la celebración católica del Día de Todos los Santos, la celebración busca rendir culto a los antepasados, pues se cree que los días 1 y 2 de noviembre, las almas de los fallecidos regresan para convivir con los vivos.", "questions": [{"id": 51400, "question": "¿Por qué el Día de Muertos es muestra de la riqueza cultural de México?", "options": ["Porque es una festividad solo para turistas", "Porque fue creada en el siglo XXI", "Porque expresa una gran diversidad de tradiciones", "Porque se celebra únicamente en la capital"], "correct": 2}, {"id": 51401, "question": "¿En qué año fue declarada la festividad por la UNESCO?", "options": ["En 1980", "En 1810", "En 2008", "En 2004"], "correct": 2}, {"id": 51402, "question": "¿Qué organismo declaró la festividad Patrimonio Cultural Inmaterial de la Humanidad?", "options": ["La Organización de Estados Americanos", "La Organización Mundial de la Salud", "El Fondo Monetario Internacional", "La UNESCO"], "correct": 3}, {"id": 51403, "question": "¿Qué significa «Patrimonio Cultural Inmaterial»?", "options": ["Una obra de arte guardada en un museo", "Una expresión cultural viva que se transmite de generación en generación", "Un documento de archivo oficial", "Un edificio histórico de piedra"], "correct": 1}, {"id": 51404, "question": "¿Qué tradiciones se combinan en la celebración?", "options": ["Ritos africanos y celebraciones navideñas", "Raíces prehispánicas y la celebración católica de Todos los Santos", "Costumbres del norte y del Caribe", "Tradiciones japonesas y europeas"], "correct": 1}, {"id": 51405, "question": "¿Qué busca la celebración según el texto?", "options": ["Conmemorar una batalla militar", "Rendir culto a los antepasados", "Promover el turismo internacional", "Festejar el fin de la cosecha de café"], "correct": 1}, {"id": 51406, "questi  51414, "question": "¿Qué origen tienen las raíces de la festividad según el texto?", "options": ["Prehispánico", "Asiático", "Africano", "Europeo medieval"], "correct": 0}, {"id": 51415, "question": "¿Qué cualidad atribuye el texto a la festividad?", "options": ["Muestra la gran riqueza cultural del país", "Solo interesa a las generaciones mayores", "Es una festividad aburrida y sin interés", "Se celebra con el mismo ritual en todo el mundo"], "correct": 0}, {"id": 51416, "question": "¿Cuál es la sigla de la organización que declaró la festividad?", "options": ["OEA", "OMS", "UNESCO", "ONU"], "correct": 2}, {"id": 51417, "question": "¿Qué tipo de celebración es la festividad según su origen?", "options": ["Mestiza, combina raíces indígenas y católicas", "Totalmente moderna y comercial", "Solo española e importada", "Solo indígena, sin influencias externas"], "correct": 0}, {"id": 51418, "question": "¿Qué palabra del texto significa honrar a los antepasados con prácticas religiosas?", "options": ["Olvido", "Castigo", "Culto", "Mercado"], "correct": 2}]}, {"id": 15, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 3, "title": "Párrafo 3 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "Entre los lugares más emblemáticos en la celebración del Día de Muertos están Pátzcuaro, en Michoacán, y San Andrés Mixquic, en el Distrito Federal, así como la Huasteca Potosina, Huaquechula, Puebla y Ocotepec en Morelos, donde se ha logrado mantener esta tradición ancestral de convivencia entre vivos y muertos en casas, calles y cementerios.", "questions": [{"id": 51500, "question": "¿Cuál de estos lugares se menciona como emblemático de la celebración?", "options": ["Monterrey, en Nuevo León", "Tulum, en Quintana Roo", "Pátzcuaro, en Michoacán", "Oaxaca, en Oaxaca"], "correct": 2}, {"id": 51501, "question": "¿En qué estado se encuentra Huaquechula?", "options": ["Michoacán", "Morelos", "Potosí", "Puebla"], "correct": 3}, {"id": 51502, "question": "¿En qué estado está Ocotepec?", "options": ["Hidalgo", "Puebla", "Guerrero", "Morelos"], "correct": 3}, {"id": 51503, "question": "¿Qué región de San Luis Potosí se menciona en el párrafo?", "options": ["La Sierra Gorda", "La Huasteca Potosina", "La Sierra Madre Oriental", "El Altiplano"], "correct": 1}, {"id": 51504, "question": "¿Qué relación aparece entre vivos y muertos en estos lugares?", "options": ["Una convivencia que se mantiene en casas, calles y cementerios", "Ninguna relación, sólo recuerdos", "Un conflicto que se resuelve con la fiesta", "Una separación total durante toda la festividad"], "correct": 0}, {"id": 51505, "question": "¿En qué espacios se mantiene la tradición según el texto?", "options": ["Solo en iglesias", "Solo en escuelas y oficinas", "En casas, calles y cementerios", "Solo en mercados y plazas comerciales"], "correct": 2}, {"id": 51506, "question": "¿Qué palabra indica que la tradición se ha conservado en estos lugares?", "options": ["Abandonar", "Ocultar", "Prohibir", "Mantener"], "correct": 3}, {"id": 51507, "question": "¿Qué tipo de tradición se describe en este párrafo?", "options": ["Una celebración importada del extranjero", "Una moda reciente de internet", "Una fiesta deportiva", "Una tradición ancestral"], "correct": 3}, {"id": 51508, "question": "¿Qué significa «emblemáticos» en el texto?", "options": ["Sin importancia ni fama", "Recientemente construidos", "Desconocidos por la población", "Representativos o característicos"], "correct": 3}, {"id": 51509, "question": "¿Cuántos lugares emblemáticos se mencionan en el tercer párrafo?", "options": ["Cinco", "Tres", "Diez", "Siete"], "correct": 0}, {"id": 51510, "question": "¿A qué se refiere «Distrito Federal» en el texto?", "options": ["A un estado del norte del país", "A una isla del Caribe", "A una región de Michoacán", "Al actual territorio de la Ciudad de México"], "correct": 3}, {"id": 51511, "question": "¿Cuál es el nombre del lugar de Michoacán men re"], "correct": 3}, {"id": 51605, "question": "¿Qué elementos acompañan la llegada de las ánimas?", "options": ["Concursos de disfraces", "Fuegos artificiales y música de banda", "Desfiles de carros alegóricos", "Ofrendas, oraciones y el repique de las campanas"], "correct": 3}, {"id": 51606, "question": "¿Qué significa «repique» en el texto?", "options": ["Sonido fuerte y repetido de campanas", "Un baile típico", "Una prenda de vestir", "Un tipo de comida tradicional"], "correct": 0}, {"id": 51607, "question": "¿Qué tipo de celebración es la de Mixquic según el párrafo?", "options": ["Una celebración apagada y discreta", "Una festividad sin ofrendas", "Una fiesta que se celebra solo en privado", "Una de las más impactantes del país"], "correct": 3}, {"id": 51608, "question": "¿Qué relación tiene la llegada de las ánimas con las ofrendas?", "options": ["No tienen relación alguna", "Las ofrendas se preparan para recibirlas", "Las ofrendas se venden a los turistas", "Las ofrendas se queman para ahuyentarlas"], "correct": 1}, {"id": 51609, "question": "¿Qué se entiende por «ánimas» en el texto?", "options": ["Los músicos de la fiesta", "Los habitantes del pueblo", "Los turistas que visitan el pueblo", "Las almas de los difuntos"], "correct": 3}, {"id": 51610, "question": "¿Qué grupo de personas llega primero según el texto?", "options": ["Los niños", "Los adultos", "Los ancianos", "Los sacerdotes"], "correct": 0}, {"id": 51611, "question": "¿Cuál es el sonido característico que se menciona?", "options": ["El de los cohetes", "El de las trompetas", "El de los tambores", "El de las campanas"], "correct": 3}]}, {"id": 17, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 5, "title": "Párrafo 5 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "La alumbrada o noche de las velas es el evento más significativo de la celebración, ya que el 2 de noviembre, a partir de las 18:00 horas, los habitantes de Mixquic se encaminan hacia el panteón con velas, incienso y flores. En el cementerio, todas las tumbas son iluminadas con velas y se hace arder el incienso, lo que crea un ambiente místico, de comunión entre vivos y muertos.", "questions": [{"id": 51700, "question": "¿Qué es la alumbrada según el texto?", "options": ["Un concurso de cocina tradicional", "El evento más significativo de la celebración", "Un desfile de catrinas", "Un mercado nocturno de artesanías"], "correct": 1}, {"id": 51701, "question": "¿Por qué se le llama también noche de las velas?", "options": ["Porque el evento dura toda la semana", "Porque la fiesta se hace sin luz eléctrica", "Porque las tumbas se iluminan con velas", "Porque todos participan con linternas de colores"], "correct": 2}, {"id": 51702, "question": "¿A qué hora empiezan a encaminarse los habitantes hacia el panteón?", "options": ["A partir de las 18:00 horas", "A las 12:00 del mediodía", "A las 21:00 horas", "A las 6:00 de la mañana"], "correct": 0}, {"id": 51703, "question": "¿Qué llevan los habitantes al panteón?", "options": ["Instrumentos musicales", "Comida enlatada", "Juguetes y globos", "Velas, incienso y flores"], "correct": 3}, {"id": 51704, "question": "¿Qué ocurre con las tumbas en el cementerio?", "options": ["Son pintadas de colores brillantes", "Son retiradas para hacer obras", "Son cerradas al público", "Son iluminadas con velas"], "correct": 3}, {"id": 51705, "question": "¿Qué se hace arder en el cementerio?", "options": ["Incienso", "Leña para calentarse", "Hojas secas", "Papel moneda"], "correct": 0}, {"id": 51706, "question": "¿Qué tipo de ambiente se crea según el párrafo?", "options": ["Un ambiente místico, de comunión entre vivos y muertos", "Un ambiente de competencia deportiva", "Un ambiente comercial y festivo", "Un ambiente de temor y silencio total"], "correct": 0}, {"id": 51707, "question": "¿Qué día se realiza la alumbrada en Mixquic?", "options": ["El 25 de diciembre", "El 1 de noviembre", "El 2 de noviembre", "El
