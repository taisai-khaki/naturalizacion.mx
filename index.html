a estridente de bandas", "Por la oscuridad total del panteón", "Por la luz de las velas, el incienso y la comunión con los difuntos"], "correct": 3}]}, {"id": 18, "passage_id": 3, "passage": "La celebración del día de muertos", "paragraph": 6, "title": "Párrafo 6 · La celebración del día de muertos", "topic": "Tradiciones y cultura", "text": "Durante esa noche, en medio de oraciones y cantos, los habitantes del pueblo de Mixquic permanecen al lado de las tumbas de sus deudos. Mientras transcurre la noche, la luz de las velas es la que alumbrará a las ánimas en su camino de regreso.", "questions": [{"id": 51800, "question": "¿Qué se realiza durante la noche de la alumbrada?", "options": ["Oraciones y cantos", "Desfiles de carros", "Concursos de canto nacional", "Carreras de bicicletas"], "correct": 0}, {"id": 51801, "question": "¿Quiénes permanecen al lado de las tumbas?", "options": ["Solo los sacerdotes del templo", "Los funcionarios municipales", "Únicamente los turistas", "Los habitantes del pueblo de Mixquic"], "correct": 3}, {"id": 51802, "question": "¿A quiénes pertenecen las tumbas junto a las que se permanece?", "options": ["A personas desconocidas del pueblo", "A sus deudos, es decir, a sus familiares y seres queridos", "A los animales del panteón", "A los conquistadores españoles"], "correct": 1}, {"id": 51803, "question": "¿Qué alumbra a las ánimas en su camino de regreso?", "options": ["La luna llena", "La luz de las velas", "Los faros de los autos", "Las luces de la ciudad"], "correct": 1}, {"id": 51804, "question": "¿Cuál es el propósito de las velas según el último párrafo?", "options": ["Espantar a los animales del cementerio", "Decorar los caminos del pueblo", "Guiar a las ánimas en su regreso", "Calentar a los visitantes"], "correct": 2}, {"id": 51805, "question": "¿Qué se entiende por «deudos» en el texto?", "options": ["Familiares y seres queridos del difunto", "Sacerdotes encargados del panteón", "Acreedores de dinero del pueblo", "Vecinos de la misma calle"], "correct": 0}, {"id": 51806, "question": "¿Cuándo permanecen los habitantes junto a las tumbas?", "options": ["Únicamente en Navidad", "Durante la semana completa", "Solo al mediodía", "Durante esa noche"], "correct": 3}, {"id": 51807, "question": "¿Qué transcurre durante la noche según el texto?", "options": ["Oraciones y cantos en medio de la luz de las velas", "Carreras de caballos", "Una competencia de cocina", "Un mercado de flores"], "correct": 0}, {"id": 51808, "question": "¿Qué hacen los habitantes mientras transcurre la noche?", "options": ["Acompañan a sus difuntos junto a las tumbas", "Se van a dormir a sus casas", "Viajan a otra ciudad", "Organizan partidos de fútbol"], "correct": 0}, {"id": 51809, "question": "¿Qué ocurre con las ánimas al final de la noche según el párrafo?", "options": ["Se transforman en aves", "Regresan a su mundo siguiendo la luz de las velas", "Se quedan para siempre en el pueblo", "Desaparecen sin rastro"], "correct": 1}, {"id": 51810, "question": "¿Qué sentimiento transmite la escena de los habitantes junto a las tumbas?", "options": ["Indiferencia total hacia los muertos", "Alegría desbordada y competencia", "Temor a los fantasmas", "Acompañamiento y cercanía con los difuntos"], "correct": 3}, {"id": 51811, "question": "¿Qué significa «camino de regreso» en el último párrafo?", "options": ["Un atajo entre dos barrios del pueblo", "El recorrido del panteón a la iglesia", "El viaje de las ánimas de vuelta a su mundo", "Una ruta de peregrinación turística"], "correct": 2}]}, {"id": 19, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 1, "title": "Párrafo 1 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Hace mucho, pero mucho tiempo, Itzamná decidió crear una tierra que fuera tan hermosa que todo aquél que la conociera quisiera vivir allí, enamorado de su belleza. Entonces creó El Mayab, la tierra de los elegidos, y sembró en ella las más bellas flores que adornaran los caminos, creó enormes cenotes cuyas aguas cristalinas reflejaran la luz del sol y también profundas cavernas llenas de misterio.", "questions": [{"id": 51900, "question": "¿Quién decidió crear una tierra muy hermosa?", "options": ["Quetzalcóatl", "Itzamná", "Tláloc", "Hunab Ku"], "correct": 1}, {"id": 51901, "question": "¿Por qué querría la gente vivir en esa tierra?", "options": ["Porque el clima era frío", "Porque los invasores la protegían", "Porque quedaría enamorada de su belleza", "Porque allí había mucho oro"], "correct": 2}, {"id": 51902, "question": "¿Cómo se llamó la tierra creada por Itzamná?", "options": ["El Mayab", "Tierra de los elegidos del norte", "Tierra de las ceibas", "El Yucatán colonial"], "correct": 0}, {"id": 51903, "question": "¿Cómo se describe El Mayab?", "options": ["Como una montaña de hielo", "Como un desierto árido y sin agua", "Como la tierra de los elegidos", "Como una isla sin habitantes"], "correct": 2}, {"id": 51904, "question": "¿Qué sembró Itzamná en la tierra?", "options": ["Enormes bosques de pinos", "Las más bellas flores que adornaran los caminos", "Cañaverales de azúcar", "Campos de trigo y cebada"], "correct": 1}, {"id": 51905, "question": "¿Qué tipo de agua tenían los cenotes creados por Itzamná?", "options": ["Aguas turbias y sucias", "Aguas cristalinas", "Aguas heladas de montaña", "Aguas saladas del mar"], "correct": 1}, {"id": 51906, "question": "¿Qué efecto producían los cenotes sobre la luz?", "options": ["Absorbían toda la luz", "La convertían en fuego", "La oscurecían por completo", "Reflejaban la luz del sol"], "correct": 3}, {"id": 51907, "question": "¿Qué otra creación de Itzamná se menciona además de los cenotes?", "options": ["Murallas de hierro", "Pirámides de cristal", "Profundas cavernas llenas de misterio", "Puentes colgantes"], "correct": 2}, {"id": 51908, "question": "¿Qué significa «cenote» según el contexto?", "options": ["Una piedra preciosa", "Un tipo de flor silvestre", "Un ave de la selva", "Un pozo natural de agua"], "correct": 3}, {"id": 51909, "question": "¿Qué sentimiento provocaba la creación de Itzamná?", "options": ["Miedo a la oscuridad", "Admiración por su belleza", "Enojo entre los habitantes", "Indiferencia total"], "correct": 1}, {"id": 51910, "question": "¿Qué adjetivo describe las cavernas?", "options": ["Diminutas", "Luminosas", "Calurosas", "Misteriosas"], "correct": 3}, {"id": 51911, "question": "¿Qué relación hay entre los cenotes y la luz del sol?", "options": ["Se secaban con el sol", "No tenían relación alguna con el sol", "El sol los iluminaba desde abajo", "Sus aguas reflejaban la luz del sol"], "correct": 3}, {"id": 51912, "question": "¿Qué quería Itzamná que sintiera quien conociera la tierra?", "options": ["El deseo de olvidarla", "El deseo de vivir allí", "El deseo de abandonarla", "El deseo de conquistarla"], "correct": 1}, {"id": 51913, "question": "¿Cuál de estas creaciones NO aparece en la leyenda de Itzamná?", "options": ["Profundas cavernas", "Flores en los caminos", "Enormes cenotes", "Templos de piedra con escalinatas"], "correct": 3}, {"id": 51914, "question": "¿Qué creó Itzamná que reflejaba la luz del sol?", "options": ["Los templos de piedra", "Las montañas de cristal", "Los palacios dorados", "Los cenotes de aguas cristalinas"], "correct": 3}, {"id": 51915, "question": "¿Cuál era el propósito de sembrar flores en los caminos?", "options": ["Alimentar a los animales", "Marcar los límites de la tierra", "Ocultar las cavernas", "Adornarlos"], "correct": 3}]}, {"id": 20, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 2, "title": "Párrafo 2 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Después, Itzamná le entregó la nueva tierra a los mayas y escogió tres animales para que vivieran por siempre en El Mayab y quien pensara en ellos lo recordara de inmediato. Los elegidos por Itzamná fueron el faisán, el venado y la serpiente de cascabel. Los mayas vivieron felices y se encargaron de construir palacios y ciudades de piedra.", "questions": [{"id": 52000, "question": "¿A quién le entregó Itzamná la nueva tierra?", "options": ["A los incas", "A los aztecas", "A los olmecas", "A los mayas"], "correct": 3}, {"id": 52001, "question": "¿Cuántos animales escogió Itzamná?", "options": ["Dos", "Cuatro", "Tres", "Cinco"], "correct": 2}, {"id": 52002, "question": "¿Qué animales fueron elegidos por Itzamná?", "options": ["El tucán, el jabalí y el puma", "El faisán, el venado y la serpiente de cascabel", "El jaguar, el águila y el colibrí", "El lobo, el coyote y la tortuga"], "correct": 1}, {"id": 52003, "question": "¿Para qué escogió Itzamná a los animales?", "options": ["Para que vendieran la tierra", "Para que vivieran por siempre en El Mayab", "Para que trabajaran en los campos", "Para que cazaran a los invasores"], "correct": 1}, {"id": 52004, "question": "¿Qué debía ocurrir cuando alguien pensaba en los animales?", "options": ["Lo recordaba de inmediato", "Se alejaba de la tierra", "Los cazaba en el bosque", "Lo olvidaba por completo"], "correct": 0}, {"id": 52005, "question": "¿Cómo vivieron los mayas según el texto?", "options": ["En la pobreza", "Felices", "En guerra constante", "Atemorizados"], "correct": 1}, {"id": 52006, "question": "¿Qué construyeron los mayas?", "options": ["Casas de paja en la selva", "Presas de tierra en los ríos", "Palacios y ciudades de piedra", "Barcos de madera para el mar"], "correct": 2}, {"id": 52007, "question": "¿De qué material eran las ciudades construidas por los mayas?", "options": ["De adobe y paja", "De piedra", "De vidrio", "De hierro"], "correct": 1}, {"id": 52008, "question": "¿Qué tipo de construcciones se mencionan en el segundo párrafo?", "options": ["Puertos marítimos", "Palacios", "Estaciones de tren", "Presas hidroeléctricas"], "correct": 1}, {"id": 52009, "question": "¿Qué significa «entregó» en la frase «Itzamná le entregó la nueva tierra»?", "options": ["Dio o concedió", "Quitó o arrebató", "Vendió a crédito", "Perdió de vista"], "correct": 0}, {"id": 52010, "question": "¿Qué sentimiento tenían los mayas según el segundo párrafo?", "options": ["Vivieron felices", "Vivieron con miedo", "Vivieron con rabia", "Vivieron con tristeza"], "correct": 0}, {"id": 52011, "question": "¿Qué se dice sobre la permanencia de los animales?", "options": ["Vivirían por siempre en El Mayab", "Solo vivirían un año en la tierra", "Se irían cuando llegaran los extranjeros", "Serían llevados a otro continente"], "correct": 0}, {"id": 52012, "question": "¿Qué relación tienen los animales con el pueblo maya según el párrafo?", "options": ["Son animales domésticos que sirven de alimento", "Son símbolos elegidos por el dios para recordar la tierra", "No tienen relación alguna con los mayas", "Son enemigos que deben ser cazados"], "correct": 1}, {"id": 52013, "question": "¿Qué expresión indica que los animales vivirían para siempre en El Mayab?", "options": ["«Por siempre»", "«De vez en cuando»", "«Hasta mañana»", "«Por un año»"], "correct": 0}, {"id": 52014, "question": "¿Qué hicieron los mayas con la tierra que recibieron?", "options": ["La vendieron a extranjeros", "La cubrieron de agua", "La abandonaron para siempre", "Construyeron palacios y ciudades de piedra"], "correct": 3}]}, {"id": 21, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 3, "title": "Párrafo 3 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Mientras, los animales que escogió Itzamná no se cansaban de recorrer El Mayab. El faisán volaba hasta los árboles más altos y su grito era tan poderoso que podían escucharle todos los habitantes de esa tierra. El venado corría ligero como el viento y la serpiente movía sus cascabeles para producir música a su paso.", "questions": [{"id": 52100, "question": "¿Qué hacían los animales escogidos por Itzamná?", "options": ["Emigrar hacia el mar", "Construir ciudades de piedra", "Dormir en cuevas durante todo el día", "Recorrer El Mayab sin cansarse"], "correct": 3}, {"id": 52101, "question": "¿Hasta dónde volaba el faisán?", "options": ["Hasta los árboles más altos", "Hasta el fondo de los cenotes", "Hasta la costa del mar", "Hasta las montañas nevadas"], "correct": 0}, {"id": 52102, "question": "¿Por qué podían escucharlo todos los habitantes?", "options": ["Porque cantaba en coro con los mayas", "Porque lo transmitía por radio", "Porque hablaba en voz baja", "Porque su grito era muy poderoso"], "correct": 3}, {"id": 52103, "question": "¿Cómo corría el venado?", "options": ["Solo a saltos cortos", "Lento como una tortuga", "Torpe y pesado", "Ligero como el viento"], "correct": 3}, {"id": 52104, "question": "¿Qué producía la serpiente a su paso?", "options": ["Pequeñas piedras", "Un olor fuerte", "Música con sus cascabeles", "Humo y fuego"], "correct": 2}, {"id": 52105, "question": "¿Qué significa «ligero» en el texto?", "options": ["Pesado y lento", "Veloz y ágil", "Claro de color", "Ligero de peso, sin fuerza"], "correct": 1}, {"id": 52106, "question": "¿Qué animal emite un grito que se oye en toda la tierra?", "options": ["El faisán", "El venado", "La serpiente", "El jaguar"], "correct": 0}, {"id": 52107, "question": "¿Qué animal produce música?", "options": ["El venado", "El colibrí", "El faisán", "La serpiente de cascabel"], "correct": 3}, {"id": 52108, "question": "¿Qué animal recorre la tierra con gran rapidez?", "options": ["El venado", "La serpiente de cascabel", "El tapir", "El faisán"], "correct": 0}, {"id": 52109, "question": "¿Qué características se atribuyen al faisán?", "options": ["Cava túneles en la tierra", "Nada en los cenotes y canta bajo el agua", "Camina sobre el agua de los lagos", "Vuela sobre los árboles más altos y tiene un grito poderoso"], "correct": 3}, {"id": 52110, "question": "¿Para qué movía sus cascabeles la serpiente?", "options": ["Para atraer presas a su cueva", "Para avisar de un peligro inminente", "Para asustar a los visitantes", "Para producir música a su paso"], "correct": 3}, {"id": 52111, "question": "¿Qué idea se expresa con la frase «no se cansaban de recorrer»?", "options": ["Recorrían la tierra con constancia y entusiasmo", "Eran animales perezosos", "Se aburrían en la selva", "Estaban agotados y dormían mucho"], "correct": 0}, {"id": 52112, "question": "¿Qué tipo de sonido produce el faisán?", "options": ["Un canto melodioso", "Un zumbido grave", "Un silbido suave", "Un grito potente"], "correct": 3}, {"id": 52113, "question": "¿Qué efecto tenía la música de la serpiente en su paso?", "options": ["No se oía a distancia", "Apagaba el sonido de los ríos", "Se oía por donde pasaba", "Espantaba a todas las aves"], "correct": 2}]}, {"id": 22, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 4, "title": "Párrafo 4 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Así era la vida en El Mayab, hasta que un día, los chilam, o sea los adivinos mayas, vieron en el futuro algo que les causó gran tristeza. Entonces, llamaron a todos los habitantes, para anunciar lo siguiente: —Tenemos que dar noticias que les causarán mucha pena. Pronto nos invadirán hombres venidos de muy lejos; traerán armas y pelearán contra nosotros para quitarnos nuestra tierra. Tal vez no podamos defender El Mayab y lo perderemos.", "questions": [{"id": 52200, "question": "¿Quiénes vieron en el futuro algo que causó tristeza?", "options": ["Los sacerdotes de Itzamná", "Los invasores extranjeros", "Los animales elegidos", "Los chilam, o adivinos mayas"], "correct": 3}, {"id": 52201, "question": "¿Qué significa «chilam» en el texto?", "options": ["Adivinos mayas", "Constructores de palacios", "Guerreros de la selva", "Jefes de los cenotes"], "correct": 0}, {"id": 52202, "question": "¿Qué hicieron los chilam después de su visión?", "options": ["Atacaron a los extranjeros", "Huyeron de la tierra en secreto", "Llamaron a todos los habitantes para anunciar lo que vieron", "Ocultaron la visión a todos"], "correct": 2}, {"id": 52203, "question": "¿Quiénes llegarían a El Mayab según el anuncio?", "options": ["Los animales de la selva", "Hombres venidos de muy lejos", "Los dioses de la lluvia", "Los pobladores del norte"], "correct": 1}, {"id": 52204, "question": "¿Qué traerían los invasores?", "options": ["Semillas y herramientas", "Armas", "Libros y papeles", "Telas y colores"], "correct": 1}, {"id": 52205, "question": "¿Qué querían los invasores según el anuncio?", "options": ["Enseñarles una nueva religión", "Visitar los cenotes", "Crear una alianza comercial", "Quitarles su tierra"], "correct": 3}, {"id": 52206, "question": "¿Qué advirtieron los chilam sobre la defensa de El Mayab?", "options": ["Que nadie intentaría defenderla", "Tal vez no podrían defenderla y la perderían", "Que la defensa sería muy sencilla", "Que los dioses la defenderían solos"], "correct": 1}, {"id": 52207, "question": "¿Cómo describe el texto el anuncio de los chilam?", "options": ["Como noticias que causarían mucha pena", "Como un mensaje sin importancia", "Como una fiesta de bienvenida", "Como una canción alegre"], "correct": 0}, {"id": 52208, "question": "¿Qué sentimiento causó el anuncio entre los habitantes?", "options": ["Alegría y celebración", "Tristeza y preocupación", "Entusiasmo guerrero", "Indiferencia total"], "correct": 1}, {"id": 52209, "question": "¿Qué significa «invadirán» en el anuncio?", "options": ["Abandonarán la tierra", "Comprarán tierras pacíficamente", "Visitarán amablemente la región", "Entrarán por la fuerza en un territorio ajeno"], "correct": 3}, {"id": 52210, "question": "¿Cuál era la visión de los chilam?", "options": ["Un terremoto bajo las montañas", "Una gran fiesta en los cenotes", "Una invasión extranjera que conquistaría El Mayab", "Una lluvia que destruiría las ciudades"], "correct": 2}, {"id": 52211, "question": "¿Qué tipo de noticia dieron los chilam?", "options": ["Una noticia dolorosa sobre el futuro", "Una noticia sobre una cosecha abundante", "Una noticia de paz y prosperidad", "Una noticia sobre un nuevo rey"], "correct": 0}, {"id": 52212, "question": "¿Qué expresión indica que la invasión aún no había ocurrido?", "options": ["Pronto nos invadirán", "Nos invadieron en el pasado", "Nunca nos invadirán", "Ya nos conquistaron"], "correct": 0}, {"id": 52213, "question": "¿Qué palabra indica que el peligro era incierto?", "options": ["Tal vez", "Seguramente", "Siempre", "Nunca"], "correct": 0}, {"id": 52214, "question": "¿Qué relación hay entre los chilam y los habitantes?", "options": ["Los habitantes dirigen a los chilam", "Los chilam informan a los habitantes sobre lo que vieron en el futuro", "No se conocen entre sí", "Los chilam trabajan para los invasores"], "correct": 1}, {"id": 52215, "question": "¿Cuál es la consecuencia de la visión para los mayas?", "options": ["Se preparan para defender su tierra", "Pierden la memoria de los animales", "Abandonan la tierra de inmediato", "Destruyen los cenotes"], "correct": 0}, {"id": 52216, "question": "¿Qué se busca transmitir al decir «tenemos que dar noticias»?", "options": ["Una advertencia seria y urgente", "Una petición de ayuda comercial", "Un anuncio festivo", "Una invitación a un banquete"], "correct": 0}, {"id": 52217, "question": "¿Qué tipo de texto es este párrafo?", "options": ["Un informe de un viaje comercial", "Un anuncio de los adivinos sobre una invasión", "Una receta de cocina tradicional", "Una carta de amor entre dos personas"], "correct": 1}]}, {"id": 23, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 5, "title": "Párrafo 5 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Al oír las palabras de los chilam, el faisán huyó de inmediato a la selva y se escondió entre las yerbas, pues prefirió dejar de volar para que los invasores no lo encontraran.", "questions": [{"id": 52300, "question": "¿Qué hizo el faisán al oír las palabras de los chilam?", "options": ["Se unió al ejército de los invasores", "Voló hasta el sol para pedir ayuda", "Huyó a la selva y se escondió entre las yerbas", "Corrió a la costa para esperarlos"], "correct": 2}, {"id": 52301, "question": "¿Por qué dejó de volar el faisán?", "options": ["Porque los chilam se lo ordenaron", "Porque estaba cansado y enfermo", "Para que los invasores no lo encontraran", "Porque no le gustaba la altura"], "correct": 2}, {"id": 52302, "question": "¿Dónde se escondió el faisán?", "options": ["En lo alto de una montaña", "Entre las yerbas de la selva", "En el fondo de un cenote", "En una cueva de piedra"], "correct": 1}, {"id": 52303, "question": "¿Qué significa «de inmediato» en el texto?", "options": ["Sin tardar, al momento", "Nunca", "Solo en la noche", "Después de mucho tiempo"], "correct": 0}, {"id": 52304, "question": "¿Qué prefirió el faisán en lugar de seguir volando?", "options": ["Dejar de volar para no ser visto", "Volar más alto que los árboles", "Pelear contra los extranjeros", "Cantar para atraer a los invasores"], "correct": 0}, {"id": 52305, "question": "¿Qué quería evitar el faisán?", "options": ["Que lo viera el venado", "Que llegara la noche", "Que sus plumas se mojaran", "Que los invasores lo encontraran"], "correct": 3}]}, {"id": 24, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 6, "title": "Párrafo 6 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Cuando el venado supo que perdería su tierra, sintió una gran tristeza; entonces lloró tanto, que sus lágrimas formaron muchas aguadas. A partir de ese momento, al venado le quedaron los ojos muy húmedos, como si estuviera triste siempre. Sin duda, quien más se enojó al saber de la conquista fue la serpiente de cascabel; ella decidió olvidar su música y luchar con los enemigos; así que creó un nuevo sonido que produce al mover la cola y que ahora usa antes de atacar.", "questions": [{"id": 52400, "question": "¿Qué ocurrió cuando el venado supo que perdería su tierra?", "options": ["Se alegró y celebró la noticia", "Huyó hacia el mar", "Sintió una gran tristeza y lloró", "Se unió a los invasores"], "correct": 2}, {"id": 52401, "question": "¿Qué formaron las lágrimas del venado?", "options": ["Muchas aguadas", "Una montaña de piedra", "Un lago de fuego", "Un río de agua salada"], "correct": 0}, {"id": 52402, "question": "¿Qué le quedó al venado a partir de ese momento?", "options": ["Los ojos muy húmedos", "Un cuerno dorado", "Las patas rotas", "Las alas para volar"], "correct": 0}, {"id": 52403, "question": "¿Por qué parece el venado siempre triste?", "options": ["Porque lo tratan mal en el bosque", "Porque ya no puede correr", "Porque tiene los ojos húmedos desde que lloró", "Porque no tiene amigos"], "correct": 2}, {"id": 52404, "question": "¿Quién se enojó más al saber de la conquista?", "options": ["El faisán", "La serpiente de cascabel", "El venado", "Los mayas"], "correct": 1}, {"id": 52405, "question": "¿Qué decidió hacer la serpiente?", "options": ["Esconderse en una cueva", "Olvidar su música y luchar contra los enemigos", "Irse a vivir al mar", "Pedir perdón a los invasores"], "correct": 1}, {"id": 52406, "question": "¿Qué nuevo sonido creó la serpiente?", "options": ["Un silbido al amanecer", "Un canto con la boca", "Uno que produce al mover la cola", "Un zumbido con las alas"], "correct": 2}, {"id": 52407, "question": "¿Cuándo usa la serpiente su nuevo sonido?", "options": ["Solo para dormir", "Al despertar cada mañana", "Antes de atacar", "Cuando llueve en la selva"], "correct": 2}, {"id": 52408, "question": "¿Qué significa «aguadas» en el texto?", "options": ["Árboles de la selva", "Charcos o lagunas formados por agua", "Tipos de flores", "Montañas de arena"], "correct": 1}, {"id": 52409, "question": "¿Qué sentimiento provocó la conquista en la serpiente?", "options": ["Un gran enojo", "Un miedo paralizante", "Una enorme indiferencia", "Una profunda alegría"], "correct": 0}, {"id": 52410, "question": "¿Por qué lloró tanto el venado?", "options": ["Porque tuvo un accidente en el bosque", "Porque supo que perdería su tierra", "Porque se había perdido en la selva", "Porque perdió su cuerno"], "correct": 1}, {"id": 52411, "question": "¿Qué hizo la serpiente con su música?", "options": ["La enseñó a los mayas", "La grabó en piedra", "La compartió con los invasores", "La olvidó para luchar"], "correct": 3}, {"id": 52412, "question": "¿Qué relación hay entre la tristeza del venado y sus ojos?", "options": ["Su tristeza dejó sus ojos húmedos para siempre", "Sus ojos se volvieron de color rojo", "Sus ojos perdieron la vista", "No hubo cambios en sus ojos"], "correct": 0}, {"id": 52413, "question": "¿Qué sentimiento compartió el venado con la serpiente?", "options": ["El amor por los invasores", "La indiferencia ante la pérdida", "La alegría por la llegada de extranjeros", "La tristeza y el enojo por la conquista"], "correct": 3}, {"id": 52414, "question": "¿Cuál es el efecto de la conquista en la serpiente?", "options": ["La convirtió en una piedra", "No tuvo ningún efecto", "Cambió su canto y se preparó para luchar", "La hizo desaparecer del bosque"], "correct": 2}, {"id": 52415, "question": "¿Qué características tiene la serpiente tras la conquista?", "options": ["Es ciega y no oye nada", "Es una serpiente de agua que vive en los lagos", "Es pacífica y canta todo el día", "Es combativa y su sonido ahora sirve para atacar"], "correct": 3}, {"id": 52416, "question": "¿Qué tipo de relato es este párrafo?", "options": ["Una noticia de un periódico", "Un informe científico sobre serpientes", "Un manual de caza", "Una explicación de por qué los animales tienen esas características"], "correct": 3}, {"id": 52417, "question": "¿Qué significa «a partir de ese momento» en el texto?", "options": ["Desde entonces", "Durante la noche", "Antes de ese suceso", "Hasta el fin del año"], "correct": 0}, {"id": 52418, "question": "¿Qué expresa la frase «sin duda»?", "options": ["Duda constante", "Certeza de que algo es verdadero", "Una pregunta abierta", "Una negación rotunda"], "correct": 1}]}, {"id": 25, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 7, "title": "Párrafo 7 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "Como dijeron los chilam, los extranjeros conquistaron El Mayab. Pero aún así, un famoso adivino maya anunció que los tres animales elegidos por Itzamná cumplirán una importante misión en su tierra. Los mayas aún recuerdan las palabras que una vez dijo:", "questions": [{"id": 52500, "question": "¿Quiénes conquistaron El Mayab?", "options": ["Los chilam", "Los mayas del sur", "Los extranjeros", "Los animales de la selva"], "correct": 2}, {"id": 52501, "question": "¿Qué anunció un famoso adivino maya?", "options": ["Que los mayas abandonarían El Mayab", "Que los extranjeros se marcharían", "Que el mundo llegaría a su fin", "Que los tres animales elegidos cumplirían una importante misión"], "correct": 3}, {"id": 52502, "question": "¿Qué misión tendrían los animales?", "options": ["Vigilar las fronteras del mar", "Llevar el maíz a otros pueblos", "Una importante misión en la tierra", "Construir un nuevo templo"], "correct": 2}, {"id": 52503, "question": "¿Quién recuerda las palabras del adivino?", "options": ["Nadie las recuerda", "Los mayas", "Los extranjeros", "Solo los animales"], "correct": 1}, {"id": 52504, "question": "¿Qué expresión indica que el adivino habló después de la conquista?", "options": ["Tras la muerte de Itzamná", "Antes de que comenzaran las lluvias", "Como dijeron los chilam, los extranjeros conquistaron El Mayab", "Mientras los animales dormían"], "correct": 2}, {"id": 52505, "question": "¿Qué significa «aún así» en «Pero aún así»?", "options": ["Antes de que sucediera", "A pesar de eso, de todos modos", "Por eso mismo", "Como consecuencia de eso"], "correct": 1}, {"id": 52506, "question": "¿Qué significa «conquistaron» en el texto?", "options": ["Compraron un territorio al gobierno", "Se apoderaron de un territorio por la fuerza", "Visitaron un territorio con curiosidad", "Se fueron de un territorio en paz"], "correct": 1}, {"id": 52507, "question": "¿Qué relación tiene el anuncio del adivino con los chilam?", "options": ["Los chilam fueron acusados de mentir", "Se contradice la predicción de los chilam", "Se confirma la predicción de los chilam sobre la conquista", "No tiene relación con ellos"], "correct": 2}, {"id": 52508, "question": "¿Cuál es el tono del anuncio del adivino?", "options": ["Esperanzador, pues anuncia una recuperación futura", "Indiferente al destino de los mayas", "Burlón y desesperanzado", "Enojado con los animales"], "correct": 0}, {"id": 52509, "question": "¿Qué cumplirán los tres animales según el adivino?", "options": ["Un castigo para los invasores", "Un viaje al mar", "Una misión importante en su tierra", "Un ritual de purificación"], "correct": 2}, {"id": 52510, "question": "¿Qué hecho ocurrió antes del anuncio del adivino?", "options": ["Los mayas construyeron un nuevo imperio", "Los extranjeros conquistaron El Mayab", "Los animales recuperaron la tierra", "Los cenotes se secaron"], "correct": 1}]}, {"id": 26, "passage_id": 4, "passage": "Leyenda del Mayab, la tierra del faisán y del venado", "paragraph": 8, "title": "Párrafo 8 · Leyenda del Mayab, la tierra del faisán y del venado", "topic": "Mitología maya", "text": "—Mientras las ceibas estén en pie y las cavernas de El Mayab sigan abiertas, habrá esperanza. Llegará el día en que recobraremos nuestra tierra, entonces los mayas deberán reunirse y combatir. Sabrán que la fecha ha llegado cuando reciban tres señales. La primera será del faisán, quien volará sobre los árboles más altos y su sombra podrá verse en todo El Mayab. La segunda señal la traerá el venado, pues atravesará esta tierra de un solo salto. La tercera mensajera será la serpiente de cascabel, que producirá música de nuevo y ésta se oirá por todas partes. Con estas tres señales, los animales avisarán a los mayas que es tiempo de recuperar la tierra que les quitaron.", "questions": [{"id": 52600, "question": "¿Qué condición da esperanza según el adivino?", "options": ["Que los mayas construyan más palacios", "Que los animales vuelvan a volar en el cielo", "Que las ceibas estén en pie y las cavernas sigan abiertas", "Que los extranjeros se marchen de la tierra"], "correct": 2}, {"id": 52601, "question": "¿Qué cosas deben seguir en pie para que haya esperanza?", "options": ["Los puentes de madera", "Las ceibas", "Las presas de agua", "Los palacios de piedra"], "correct": 1}, {"id": 52602, "question": "¿Qué cavidades deben seguir abiertas para que haya esperanza?", "options": ["Las cavernas de El Mayab", "Los pozos de las minas", "Las ventanas de los palacios", "Las puertas de los templos"], "correct": 0}, {"id": 52603, "question": "¿Qué llegará en el futuro según el adivino?", "options": ["El final de los animales", "El día en que recobrarán su tierra", "La llegada de nuevos invasores", "Una gran sequía"], "correct": 1}, {"id": 52604, "question": "¿Qué deberán hacer los mayas cuando llegue ese día?", "options": ["Reunirse y combatir", "Huir al bosque", "Rendirse a los extranjeros", "Abandonar la tierra"], "correct": 0}, {"id": 52605, "question": "¿Cómo sabrán los mayas que la fecha ha llegado?", "options": ["Cuando los extranjeros se marchen", "Cuando aparezca un cometa", "Cuando llueva durante siete días", "Cuando reciban tres señales"], "correct": 3}, {"id": 52606, "question": "¿Qué traerá la primera señal?", "options": ["El venado", "El faisán", "La serpiente de cascabel", "El jaguar"], "correct": 1}, {"id": 52607, "question": "¿Qué traerá la segunda señal?", "options": ["El faisán", "El tucán", "El venado", "La serpiente"], "correct": 2}, {"id": 52608, "question": "¿Qué traerá la tercera señal?", "options": ["El faisán", "El venado", "La lluvia", "La serpiente de cascabel"], "correct": 3}, {"id": 52609, "question": "¿Qué hará el faisán en la primera señal?", "options": ["Se esconderá en las yerbas", "Cantará en la ceiba sagrada", "Nadará en un cenote", "Volará sobre los árboles más altos"], "correct": 3}, {"id": 52610, "question": "¿Dónde podrá verse la sombra del faisán?", "options": ["En el fondo de los cenotes", "En una sola ciudad", "En todo El Mayab", "Solo en la costa"], "correct": 2}, {"id": 52611, "question": "¿Qué hará el venado en la segunda señal?", "options": ["Bajará a una caverna", "Atravesará la tierra de un solo salto", "Huirá hacia el mar", "Se quedará quieto en el bosque"], "correct": 1}, {"id": 52612, "question": "¿Qué hará la serpiente en la tercera señal?", "options": ["Volará sobre los árboles", "Atacará a los extranjeros con veneno", "Producirá música de nuevo", "Se esconderá en las cavernas"], "correct": 2}, {"id": 52613, "question": "¿Hasta dónde se oirá la música de la serpiente?", "options": ["Por todas partes", "A ninguna parte", "Solo de noche, en la selva", "Solo entre los animales del bosque"], "correct": 0}, {"id": 52614, "question": "¿Qué avisarán los animales a los mayas?", "options": ["Que deben abandonar El Mayab", "Que los extranjeros llegarán mañana", "Que es tiempo de recuperar la tierra que les quitaron", "Que la lluvia destruirá las ceibas"], "correct": 2}, {"id": 52615, "question": "¿Cuál es la idea central del último párrafo?", "options": ["La huida de los mayas a otras tierras", "La destrucción total de El Mayab", "La esperanza de recuperar la tierra con las señales de los animales", "La llegada de nuevos dioses"], "correct": 2}, {"id": 52616, "question": "¿Qué significa «recobraremos» en el texto?", "options": ["Destruiremos lo que nos queda", "Venderemos la tierra", "Olvidaremos lo que nos pertenece", "Recuperaremos lo que se había perdido"], "correct": 3}, {"id": 52617, "question": "¿Qué palabra expresa que la esperanza depende de algo que debe mantenerse?", "options": ["Nunca", "Jamás", "Aunque", "Mientras"], "correct": 3}, {"id": 52618, "question": "¿Qué tono tiene el mensaje final del adivino?", "options": ["Esperanzado y de llamado a la unión", "Desesperanzado y resignado", "Amenazante hacia los extranjeros", "Burlón hacia los animales"], "correct": 0}, {"id": 52619, "question": "¿Qué significa «atravesará» en la segunda señal?", "options": ["Lo olvidará por completo", "Lo mirará desde lejos", "Se quedará parado en un lugar", "Cruzará de un lado a otro"], "correct": 3}, {"id": 52620, "question": "¿Qué significa «mensajera» aplicado a la serpiente?", "options": ["Quien guarda los secretos del templo", "Quien lleva un aviso o señal", "Quien construye palacios", "Quien vende productos en el mercado"], "correct": 1}, {"id": 52621, "question": "¿Qué entenderán los mayas al reconocer las señales?", "options": ["Que los animales los abandonan", "Que deben huir de la selva", "Que ha llegado el tiempo de recuperar su tierra", "Que han perdido toda esperanza"], "correct": 2}, {"id": 52622, "question": "¿Qué significa «combatir» en el texto?", "options": ["Luchar para defender algo", "Construir una muralla", "Huir de un peligro", "Celebrar una fiesta"], "correct": 0}, {"id": 52623, "question": "¿A quién se dirige el mensaje del adivino?", "options": ["A los mayas", "A los dioses", "A los extranjeros", "A los animales"], "correct": 0}, {"id": 52624, "question": "¿Qué significa «sombra» en la primera señal?", "options": ["Una mancha en el agua de los cenotes", "Un tipo de árbol de la selva", "Un refugio contra el calor", "La presencia visible del vuelo del faisán sobre la tierra"], "correct": 3}]}, {"id": 27, "passage_id": 5, "passage": "Los volcanes", "paragraph": 1, "title": "Párrafo 1 · Los volcanes", "topic": "Leyendas y geografía", "text": "Hace ya miles de lunas, existió en nuestro mundo un joven destacado en las artes de la guerra, famoso por sus hazañas, quien un día en su caminar se encontró con una hermosa joven de la que quedó inmediatamente enamorado. Decidió ir para con el padre de ella y poder unir sus vidas para siempre, sin embargo, el padre de ella era un hombre poco destacado en la guerra y toma una decisión a su favor.", "questions": [{"id": 52700, "question": "¿En qué destacaba el joven de la historia?", "options": ["En la agricultura de maíz", "En las artes de la guerra", "En la pintura y la poesía", "En el comercio de telas"], "correct": 1}, {"id": 52701, "question": "¿Por qué era famoso el joven?", "options": ["Por su riqueza heredada", "Por sus hazañas", "Por su gran sabiduría religiosa", "Por haber fundado una ciudad"], "correct": 1}, {"id": 52702, "question": "¿Con quién se encontró el joven en su caminar?", "options": ["Con un sacerdote del templo", "Con una hermosa joven", "Con un anciano sabio", "Con un comerciante extranjero"], "correct": 1}, {"id": 52703, "question": "¿Qué sintió el joven al conocer a la joven?", "options": ["Se sintió indiferente", "Sintió miedo y huyó", "Quedó enojado con ella", "Quedó inmediatamente enamorado"], "correct": 3}, {"id": 52704, "question": "¿Qué decidió hacer el joven?", "options": ["Partir a una guerra lejana sin despedirse", "Construir una casa en la montaña", "Ir con el padre de la joven para unir sus vidas", "Regresar a su aldea natal"], "correct": 2}, {"id": 52705, "question": "¿Cómo era el padre de la joven en la guerra?", "options": ["Invencible en combate", "Un guerrero legendario", "Poco destacado", "Muy famoso y temido"], "correct": 2}, {"id": 52706, "question": "¿Qué decisión tomó el padre de la joven?", "options": ["Casar a su hija con otro guerrero", "Una decisión a su favor", "Expulsar al joven del pueblo", "Enviar a su hija lejos del valle"], "correct": 1}, {"id": 52707, "question": "¿Qué significa «miles de lunas» en el texto?", "options": ["Miles de estrellas en el cielo", "Miles de meses, un tiempo muy antiguo", "Miles de años de lluvia", "Miles de noches de luna llena"], "correct": 1}, {"id": 52708, "question": "¿Qué quería el joven para siempre con la joven?", "options": ["Unir sus vidas para siempre", "Mudarse a otra región", "Separarse cuanto antes", "Olvidar el amor de su juventud"], "correct": 0}, {"id": 52709, "question": "¿Quién tomaba la decisión final sobre la boda?", "options": ["El joven guerrero", "La joven misma", "El padre de la joven", "Los dioses"], "correct": 2}, {"id": 52710, "question": "¿Qué expresión indica que la historia ocurrió hace mucho tiempo?", "options": ["«Esta misma semana»", "«Ayer por la tarde»", "«Hace ya miles de lunas»", "«El año pasado»"], "correct": 2}, {"id": 52711, "question": "¿Qué hizo el joven antes de decidir ir con el padre?", "options": ["Se fue a estudiar a la ciudad", "Se enamoró de la joven", "Vendió su casa", "Partió a la guerra"], "correct": 1}, {"id": 52712, "question": "¿Qué relación había entre el joven y la guerra?", "options": ["Era un guerrero destacado", "Era un comerciante que vendía armas", "Era un sacerdote que bendecía a los soldados", "Era un pacifista que rechazaba la guerra"], "correct": 0}, {"id": 52713, "question": "¿Qué papel jugó la decisión del padre en la historia?", "options": ["Impidió que la joven se casara jamás", "Ayudó a la pareja a huir", "Ofreció dinero para la boda", "Puso condiciones para aceptar la unión"], "correct": 3}, {"id": 52714, "question": "¿Qué significa «a su favor» en la frase «toma una decisión a su favor»?", "options": ["Que la decisión es neutral", "Que la decisión favorece a los enemigos", "Que la decisión beneficia al padre", "Que la decisión beneficia al joven"], "correct": 2}, {"id": 52715, "question": "¿Qué relación tenía el padre con el joven?", "options": ["Era el futuro suegro del joven", "Era un enemigo del pueblo", "Era su maestro de guerra", "Era su hermano mayor"], "correct": 0}, {"id": 52716, "question": "¿Qué tipo de vínculo se busca al decidir la unión de la pareja?", "options": ["Un vínculo matrimonial", "Un acuerdo comercial", "Un pacto de sangre", "Una alianza política entre pueblos"], "correct": 0}, {"id": 52717, "question": "¿Cuál es la cualidad destacada del joven en el primer párrafo?", "options": ["Su valentía y destreza en la guerra", "Su talento para la música", "Su gran riqueza", "Su habilidad como comerciante"], "correct": 0}, {"id": 52718, "question": "¿Qué tipo de relato narra el primer párrafo de los volcanes?", "options": ["Un informe histórico", "Un manual de guerra", "Una leyenda de amor", "Una receta tradicional"], "correct": 2}, {"id": 52719, "question": "¿Qué idea expresa «sin embargo» en el primer párrafo?", "options": ["Un resumen del relato", "Contraste entre el valor del joven y la falta de gloria del padre", "Una comparación entre dos pueblos", "Una consecuencia del amor del joven"], "correct": 1}]}, {"id": 28, "passage_id": 5, "passage": "Los volcanes", "paragraph": 2, "title": "Párrafo 2 · Los volcanes", "topic": "Leyendas y geografía", "text": "Daría la mano de su hija a aquel joven guerrero a cambio de que luchara en favor de su guerra; él decidió aceptar, pues lo prometido era regresar victoriosos y obtener el amor de aquella joven. Fue una guerra prolongada y no se veía la llegada del guerrero, la joven comenzó a angustiarse y a sufrir por amor.", "questions": [{"id": 52800, "question": "¿Qué propuso el padre al joven guerrero?", "options": ["Darle la mano de su hija a cambio de que luchara en su guerra", "Pagarle un salario de oro", "Darle un pedazo de tierra fértil", "Enviarlo a estudiar a otra ciudad"], "correct": 0}, {"id": 52801, "question": "¿Qué decidió el joven?", "options": ["Aceptar la propuesta", "Rechazarla de inmediato", "Huir del valle para siempre", "Pedir ayuda a los dioses del cielo"], "correct": 0}, {"id": 52802, "question": "¿Qué esperaba obtener el joven al regresar?", "options": ["Una gran fortuna de oro y plata", "El perdón de sus enemigos", "Regresar victorioso y obtener el amor de la joven", "Un puesto como jefe de la tribu"], "correct": 2}, {"id": 52803, "question": "¿Cómo describe el texto la guerra en la que luchó el joven?", "options": ["Una batalla de un solo día", "Una guerra prolongada", "Una guerra civil entre hermanos", "Un duelo individual"], "correct": 1}, {"id": 52804, "question": "¿Cómo se sentía la joven mientras el guerrero estaba fuera?", "options": ["Enojada con su padre", "Feliz y despreocupada", "Indiferente a la espera", "Angustiada y sufriendo por amor"], "correct": 3}, {"id": 52805, "question": "¿Por qué la joven sufría?", "options": ["Por la ausencia del joven", "Por la pérdida de su hogar", "Por una enfermedad de la infancia", "Por la muerte de su madre"], "correct": 0}, {"id": 52806, "question": "¿Qué significa «prolongada» en el texto?", "options": ["Que ocurre de noche", "Que dura mucho tiempo", "Que termina muy pronto", "Que se realiza en secreto"], "correct": 1}, {"id": 52807, "question": "¿Qué pasó con la llegada del guerrero según el párrafo?", "options": ["Llegó antes de lo esperado", "Fue recibido con una gran fiesta", "Se quedó en otro pueblo para siempre", "No se veía su llegada"], "correct": 3}, {"id": 52808, "question": "¿Qué había prometido el joven al aceptar la propuesta?", "options": ["Regresar con un nuevo hogar lejano", "Casarse con otra mujer", "No volver a ver a la joven", "Regresar victorioso"], "correct": 3}, {"id": 52809, "question": "¿Qué tipo de pacto se estableció entre el padre y el joven?", "options": ["Un juramento de lealtad al rey", "Un acuerdo en el que el joven luchaba a cambio de la mano de la joven", "Un tratado de paz entre dos pueblos", "Un contrato de comercio de maíz"], "correct": 1}, {"id": 52810, "question": "¿Qué sentimiento provocó la larga ausencia del guerrero en la joven?", "options": ["Angustia y dolor de amor", "Orgullo por la guerra", "Ira contra los dioses", "Alegría por su i ión del rey", "Olvidar su pasado de guerra"], "correct": 1}, {"id": 52910, "question": "¿Qué significa «ahora sí» en la frase «ahora sí podría ser feliz»?", "options": ["Que por fin se cumpliría su deseo", "Que ya era demasiado tarde", "Que ya no quería casarse", "Que estaba arrepentido"], "correct": 0}, {"id": 52911, "question": "¿Qué tipo de cambio provoca el regreso del ejército?", "options": ["Pasa de la tristeza a la celebración", "Pasa de la riqueza a la pobreza", "Pasa de la paz a la guerra", "Pasa del día a la noche"], "correct": 0}, {"id": 52912, "question": "¿Qué significa «relumbraba» en la frase «el sol relumbraba el valle»?", "options": ["Brillaba con intensidad", "Llovía sobre el valle", "Se ocultaba tras las montañas", "Estaba nublado"], "correct": 0}, {"id": 52913, "question": "¿Qué ocurrió primero según el párrafo?", "options": ["La joven se recuperó del dolor", "El ejército regresó al pueblo", "El padre firmó un tratado de paz", "Llegó la noticia de la muerte del guerrero"], "correct": 3}, {"id": 52914, "question": "¿Qué significa «versión» en «la versión de que el joven guerrero había muerto»?", "options": ["Una prenda de vestir", "Un documento oficial", "Noticia o relato que se cuenta", "Un tipo de canción"], "correct": 2}, {"id": 52915, "question": "¿Qué relación tiene la mañana siguiente con la noche anterior?", "options": ["La mañana es un recuerdo de la noche", "El mismo día cambia la tristeza por el regreso del guerrero", "La noche fue más alegre que la mañana", "Son dos historias sin relación"], "correct": 1}, {"id": 52916, "question": "¿Qué provocó que la joven se enfermara?", "options": ["El frío de las montañas", "Una epidemia en el valle", "Una caída en el río", "El dolor del alma por la noticia de la muerte del guerrero"], "correct": 3}, {"id": 52917, "question": "¿Cómo se refiere el texto al estado de la joven al morir?", "options": ["Cantando en el templo", "Sentada frente al espejo", "Perdida en el bosque", "Sumida en el sueño eterno"], "correct": 3}, {"id": 52918, "question": "¿Qué sentimiento domina la primera parte del párrafo?", "options": ["Euforia y celebración", "Ira contra los extranjeros", "Indiferencia total", "Angustia y tristeza"], "correct": 3}, {"id": 52919, "question": "¿Qué sentimiento domina la segunda parte del párrafo?", "options": ["Odio y venganza", "Alegría y esperanza", "Tristeza profunda", "Miedo y huida"], "correct": 1}, {"id": 52920, "question": "¿Qué papel tiene el padre en la escena final del párrafo?", "options": ["Encuentra a su hija sin vida", "Se retira a su casa sin decir nada", "Lidera al ejército victorioso", "Organiza la fiesta del pueblo"], "correct": 0}, {"id": 52921, "question": "¿Quién se alegraba de volver al valle?", "options": ["El joven y su ejército", "Los sacerdotes del templo", "Los comerciantes del mercado", "Solo los enemigos derrotados"], "correct": 0}, {"id": 52922, "question": "¿Cuál fue el destino final de la joven en el tercer párrafo?", "options": ["Quedó sumida en el sueño eterno", "Regresó a la casa de su padre", "Huyó a la montaña", "Se casó con un comerciante"], "correct": 0}, {"id": 52923, "question": "¿Cómo describe el texto el sol de la mañana siguiente?", "options": ["Estaba cubierto de nubes", "Relumbraba sobre el valle", "No llegó a salir", "Se ocultaba tras las montañas"], "correct": 1}]}, {"id": 30, "passage_id": 5, "passage": "Los volcanes", "paragraph": 4, "title": "Párrafo 4 · Los volcanes", "topic": "Leyendas y geografía", "text": "Su corazón se rompió al encontrarse tan lamentable noticia. El enamorado gritó al cielo pidiendo explicaciones a los dioses, y tomó el cuerpo de su amada y subió al valle, ahí la recostó en la cima y decidió velar su sueño eterno con una antorcha encendida.", "questions": [{"id": 53000, "question": "¿Qué le ocurrió al corazón del guerrero?", "options": ["Se endureció para siempre", "Se llenó de alegría al verla", "Dejó de latir en el campo de batalla", "Se rompió al enterarse de la noticia"], "correct": 3}, {"id": 53001, "question": "¿Cómo reaccionó el enamorado?", "options": ["Se quedó callado sin decir nada", "Huyó del valle para siempre", "Gritó al cielo pidiendo explicaciones a los dioses", "Se unió a los enemigos"], "correct": 2}, {"id": 53002, "question": "¿Qué hizo el guerrero con el cuerpo de su amada?", "options": ["Lo llevó a la costa del mar", "Lo enterró en el bosque", "Lo tomó y subió al valle", "Lo dejó en el pueblo sin cuidado"], "correct": 2}, {"id": 53003, "question": "¿Dónde recostó el guerrero a su amada?", "options": ["En la cima del valle", "En el templo principal", "En una cueva oscura", "En el fondo de un río"], "correct": 0}, {"id": 53004, "question": "¿Qué decidió hacer el guerrero junto a su amada?", "options": ["Velar su sueño eterno con una antorcha encendida", "Construir una tumba de piedra", "Partir a otra guerra", "Pedir ayuda a los sacerdotes"], "correct": 0}, {"id": 53005, "question": "¿Qué significa «velar» en el texto?", "options": ["Acompañar y cuidar durante la noche", "Olvidar la pena", "Dormir profundamente", "Cubrir con un manto de tela"], "correct": 0}, {"id": 53006, "question": "¿Qué llevaba el guerrero en la mano?", "options": ["Una lanza de guerra", "Un ramo de flores", "Un escudo de piedra", "Una antorcha encendida"], "correct": 3}, {"id": 53007, "question": "¿Qué tipo de acto realizó el guerrero?", "options": ["Un acto de venganza", "Un acto de amor y devoción", "Un acto de burla", "Un acto de traición"], "correct": 1}, {"id": 53008, "question": "¿Qué significa «la cima» en el texto?", "options": ["La parte más alta del valle", "La parte más baja de la costa", "El borde de un río", "El interior de una cueva"], "correct": 0}, {"id": 53009, "question": "¿Qué tipo de vigilia realizó el guerrero?", "options": ["Una vigilia en batalla contra enemigos", "Una vigilia para cazar animales", "Una vigilia de festejo en el pueblo", "Una vigilia junto al cuerpo de su amada"], "correct": 3}, {"id": 53010, "question": "¿Qué estado de ánimo se describe en el guerrero?", "options": ["Felicidad completa por el regreso", "Dolor profundo por la pérdida", "Miedo al castigo de los dioses", "Indiferencia ante la muerte"], "correct": 1}, {"id": 53011, "question": "¿A quién pidió explicaciones el enamorado?", "options": ["Al cacique del pueblo", "A su padre", "A los dioses", "Al ejército enemigo"], "correct": 2}, {"id": 53012, "question": "¿Qué tiempo del día sugiere la antorcha encendida con la que vela a la joven?", "options": ["La tarde soleada", "La noche", "El amanecer", "El mediodía"], "correct": 1}, {"id": 53013, "question": "¿Qué motivó al guerrero a velar a su amada?", "options": ["El deseo de venganza", "El miedo al castigo", "El odio hacia los dioses", "El amor y la devoción"], "correct": 3}, {"id": 53014, "question": "¿Qué efecto tuvo la pérdida en el corazón del guerrero?", "options": ["Un dolor tan grande que lo llevó a gritar al cielo", "Un sueño profundo y tranquilo", "Una alegría repentina", "Un olvido inmediato de su amada"], "correct": 0}]}, {"id": 31, "passage_id": 5, "passage": "Los volcanes", "paragraph": 5, "title": "Párrafo 5 · Los volcanes", "topic": "Leyendas y geografía", "text": "Los dioses al ver aquel acto de amor, decidieron eternizar a la pareja cubriendo de nieve sus cuerpos y petrificándolos por la eternidad. Y ahí sigue la mujer dormida y a un lado su guerrero enamorado con su antorcha de fuego. Con el paso de los siglos aún podemos observar a esos dos enamorados, en dos grandes montañas conocidas como Iztaccíhuatl y Popocatépetl.", "questions": [{"id": 53100, "question": "¿Qué decidieron los dioses al ver el acto de amor?", "options": ["Eternizar a la pareja", "Separar a la pareja para siempre", "Castigar a los dos enamorados", "Enviar a la pareja al mar"], "correct": 0}, {"id": 53101, "question": "¿Cómo eternizaron los dioses a la pareja?", "options": ["Con una gran inundación", "Convirtiéndolos en aves del cielo", "Con un rayo de fuego sobre el valle", "Cubriendo sus cuerpos de nieve y petrificándolos"], "correct": 3}, {"id": 53102, "question": "¿Qué significa «petrificar» en el texto?", "options": ["Convertir en piedra", "Iluminar con luz", "Cubrir con tierra", "Dormir en silencio"], "correct": 0}, {"id": 53103, "question": "¿En qué posición permanece la mujer?", "options": ["De pie frente al valle", "Dormida", "Sentada junto al río", "Despierta y sonriente"], "correct": 1}, {"id": 53104, "question": "¿Qué sostiene a su lado el guerrero?", "options": ["Su antorcha de fuego", "Una lanza de madera", "Un ramo de flores", "Un escudo de guerra"], "correct": 0}, {"id": 53105, "question": "¿Qué nombres reciben las montañas donde se encuentran los enamorados?", "options": ["Cerro del Chiquihuite y Cerro de la Estrella", "Iztaccíhuatl y Popocatépetl", "Nevado de Toluca y Tláloc", "Pico de Orizaba y Cofre de Perote"], "correct": 1}, {"id": 53106, "question": "¿Cuánto tiempo han observado las montañas a los enamorados?", "options": ["Solo durante un año", "Con el paso de los siglos", "Desde la última erupción de una década", "Desde la semana pasada"], "correct": 1}, {"id": 53107, "question": "¿Qué forma tienen las montañas según la leyenda?", "options": ["La de dos enamorados", "La de un volcán aislado", "La de una pirámide escalonada", "La de dos torres de piedra"], "correct": 0}, {"id": 53108, "question": "¿Cuántas montañas forman la pareja?", "options": ["Cuatro", "Tres", "Una", "Dos"], "correct": 3}, {"id": 53109, "question": "¿Qué significa «eternizar» en el texto?", "options": ["Olvidar algo por completo", "Hacer que algo dure para siempre", "Hacer que algo termine pronto", "Cambiar de lugar"], "correct": 1}, {"id": 53110, "question": "¿Qué relación hay entre la nieve y los cuerpos de los enamorados?", "options": ["La nieve los derrite y los borra", "La nieve los cubre y los transforma en montañas", "La nieve no tiene relación con ellos", "La nieve los protege del frío"], "correct": 1}, {"id": 53111, "question": "¿Qué sucede con el guerrero y su antorcha en la montaña?", "options": ["Se apagan con la nieve", "Permanecen a un lado de la mujer", "Vuelan hacia el cielo", "Se pierden en el valle"], "correct": 1}, {"id": 53112, "question": "¿Qué expresa la frase «aún podemos observar»?", "options": ["Que la leyenda se olvidó", "Que la leyenda sigue presente en el paisaje actual", "Que las montañas ya no existen", "Que nadie puede ver los volcanes"], "correct": 1}, {"id": 53113, "question": "¿Qué tipo de castigo recibieron los enamorados?", "options": ["Fueron condenados a la guerra", "Fueron separados para siempre", "Fueron desterrados del valle", "Ninguno: fueron eternizados por su acto de amor"], "correct": 3}, {"id": 53114, "question": "¿Qué fenómeno explica la leyenda de los volcanes?", "options": ["La llegada de los españoles", "Una gran inundación en el valle", "La formación de dos montañas con forma de pareja", "Un terremoto que partió el suelo"], "correct": 2}, {"id": 53115, "question": "¿Qué cubrió los cuerpos de la pareja?", "options": ["Nieve", "Ceniza", "Hojas secas", "Arena"], "correct": 0}, {"id": 53116, "question": "¿En qué se convirtieron los cuerpos de los enamorados?", "options": ["En flores", "En humo", "En agua", "En piedra"], "correct": 3}, {"id": 53117, "question": "¿Qué significa «siglos» en el texto?", "options": ["Estaciones del año", "Noches de luna", "Días de lluvia", "Periodos de cien años"], "correct": 3}]}, {"id": 32, "passage_id": 5, "passage": "Los volcanes", "paragraph": 6, "title": "Párrafo 6 · Los volcanes", "topic": "Leyendas y geografía", "text": "Nota: El Popocatépetl e Iztaccíhuatl son icónicos por su forma que asemeja una pareja de enamorados. El guerrero lleva por nombre Popocatépetl del náhuatl popo-ca ‘que humea’ y te-petl ‘montaña o monte’, debido a que desde tiempos prehispánicos permanece activo. Mientras que la princesa llamada Iztaccíhuatl, del náhuatl Iztac, ‘blanco’ y ‘cihuatl ‘mujer’, porque asemeja a la figura de una mujer dormida cubierta de un manto blanco. Ubicados en los límites de la Ciudad de México y Puebla. La pareja de volcanes están unidos por la parte norte, mediante un paso montañoso conocido como Paso de Cortés.", "questions": [{"id": 53200, "question": "¿Por qué los volcanes son icónicos?", "options": ["Por su gran riqueza mineral", "Por su forma, que asemeja una pareja de enamorados", "Por ser los más altos del mundo", "Por tener lagos en la cima"], "correct": 1}, {"id": 53201, "question": "¿Qué significa «Popocatépetl» en náhuatl?", "options": ["«Que humea» y «montaña»", "«Mujer dormida» y «blanco»", "«Guerrero valiente» y «fuego»", "«Montaña nevada» y «agua»"], "correct": 0}, {"id": 53202, "question": "¿Qué significa «Iztaccíhuatl» en náhuatl?", "options": ["«Guerrera» y «sol»", "«Que humea» y «montaña»", "«Princesa» y «nieve»", "«Blanco» y «mujer»"], "correct": 3}, {"id": 53203, "question": "¿Por qué se llama Popocatépetl al volcán del guerrero?", "options": ["Porque es el más antiguo de México", "Porque tiene forma de pirámide", "Porque desde tiempos prehispánicos permanece activo", "Porque hay un templo en su cima"], "correct": 2}, {"id": 53204, "question": "¿Qué significa «popo-ca» en el nombre del volcán?", "options": ["«Que duerme»", "«Que crece»", "«Que humea»", "«Que brilla»"], "correct": 2}, {"id": 53205, "question": "¿Qué significa «te-petl»?", "options": ["«Valle o río»", "«Fuego o luz»", "«Montaña o monte»", "«Lago o agua»"], "correct": 2}, {"id": 53206, "question": "¿Por qué se llama Iztaccíhuatl a la princesa?", "options": ["Porque nació en un valle blanco", "Porque su padre se llamaba así", "Porque asemeja una mujer dormida cubierta de un manto blanco", "Porque es la diosa de la nieve"], "correct": 2}, {"id": 53207, "question": "¿Qué relación tienen los volcanes con los límites de la Ciudad de México y Puebla?", "options": ["Están en el centro de la capital", "Están ubicados en esos límites", "Están fuera de México", "Están dentro del estado de Morelos"], "correct": 1}, {"id": 53208, "question": "¿Cómo están unidos los volcanes por la parte norte?", "options": ["Mediante el Paso de Cortés", "Mediante una carretera de montaña", "Mediante un puente de piedra", "Mediante un túnel subterráneo"], "correct": 0}, {"id": 53209, "question": "¿Qué es el Paso de Cortés según la nota?", "options": ["Un paso montañoso que une los dos volcanes", "Un puerto marítimo de la costa", "Una calle histórica de Puebla", "Un canal de riego del valle"], "correct": 0}, {"id": 53210, "question": "¿Qué ciudad se menciona en la nota junto con Puebla?", "options": ["Querétaro", "Monterrey", "Guadalajara", "Ciudad de México"], "correct": 3}, {"id": 53211, "question": "¿Qué se dice de la forma del Iztaccíhuatl?", "options": ["Que parece una torre de vigilancia", "Que parece un guerrero con escudo", "Que parece un río de lava", "Que parece una mujer dormida cubierta con un manto blanco"], "correct": 3}, {"id": 53212, "question": "¿Qué palabra del texto indica que la pareja de volcanes está relacionada?", "options": ["Separados", "Olvidados", "Unidos", "Aislados"], "correct": 2}, {"id": 53213, "question": "¿De qué idioma provienen los nombres de los volcanes?", "options": ["Del otomí", "Del maya", "Del español antiguo", "Del náhuatl"], "correct": 3}, {"id": 53214, "question": "¿Qué significa «icónicos» en la nota?", "options": ["Que están bajo el mar", "Que son símbolos reconocibles y representativos", "Que son volcanes extintos", "Que son desconocidos por la población"], "correct": 1}, {"id": 53215, "question": "¿Qué significa «manto» en «cubierta de un manto blanco»?", "options": ["Tipo de árbol de la región", "Montaña de piedra caliza", "Canal de agua de lluvia", "Cobertura o capa de tela o de nieve"], "correct": 3}, {"id": 53216, "question": "¿Qué significa «activo» en la nota?", "options": ["Que está apagado por completo", "Que puede tener actividad volcánica", "Que nunca se mueve", "Que está en reposo eterno"], "correct": 1}, {"id": 53217, "question": "¿Qué se explica en la nota sobre el nombre Popocatépetl?", "options": ["La cantidad de habitantes de la zona", "La procedencia y el significado de sus raíces náhuatl", "La historia del guerrero en la batalla", "La ubicación exacta del volcán en el mapa"], "correct": 1}, {"id": 53218, "question": "¿Qué volcán se asocia con la princesa dormida?", "options": ["Pico de Orizaba", "Nevado de Toluca", "Popocatépetl", "Iztaccíhuatl"], "correct": 3}, {"id": 53219, "question": "¿Qué volcán se asocia con el guerrero que humea?", "options": ["Popocatépetl", "Cofre de Perote", "Iztaccíhuatl", "Nevado de Colima"], "correct": 0}, {"id": 53220, "question": "¿Qué significa «cihuatl» en el nombre Iztaccíhuatl?", "options": ["«Mujer»", "«Montaña»", "«Fuego»", "«Blanco»"], "correct": 0}, {"id": 53221, "question": "¿Qué significa «paso montañoso» en la nota?", "options": ["Un túnel de tren", "Un camino que atraviesa entre montañas", "Una presa de agua", "Un puerto marítimo"], "correct": 1}, {"id": 53222, "question": "¿Por qué parte se unen los dos volcanes?", "options": ["Por el sur", "Por el este", "Por el norte", "Por el oeste"], "correct": 2}, {"id": 53223, "question": "¿Con qué ciudad y estado limitan los volcanes según la nota?", "options": ["Toluca y Michoacán", "Morelos y Guerrero", "Ciudad de México y Puebla", "Querétaro e Hidalgo"], "correct": 2}, {"id": 53224, "question": "¿Qué significa «iztac» en el nombre de la princesa?", "options": ["«Nieve eterna»", "«Blanco»", "«Dormida»", "«Mujer»"], "correct": 1}, {"id": 53225, "question": "¿Qué tipo de texto es la nota del pasaje?", "options": ["Un manual de escalada", "Una receta de cocina tradicional", "Un poema de amor", "Una explicación sobre el origen y significado de los nombres de los volcanes"], "correct": 3}]}, {"id": 33, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 1, "title": "Párrafo 1 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "¿Qué es un cenote? Es un pozo de agua dulce que se forma por el desgaste o erosión de las rocas calizas.", "questions": [{"id": 53300, "question": "¿Qué es un cenote según el texto?", "options": ["Un río subterráneo de agua salada", "Un pozo de agua dulce", "Una montaña de roca volcánica", "Una laguna de agua de mar"], "correct": 1}, {"id": 53301, "question": "¿Cómo se forma un cenote?", "options": ["Por el choque de dos placas de hielo", "Por el desgaste o erosión de las rocas calizas", "Por la acción de la lava sobre la arena", "Por la erupción de un volcán"], "correct": 1}, {"id": 53302, "question": "¿Qué tipo de roca forma los cenotes según el texto?", "options": ["Rocas calizas", "Granito puro", "Mármol blanco", "Rocas volcánicas"], "correct": 0}, {"id": 53303, "question": "¿Qué clase de agua contiene un cenote?", "options": ["Agua dulce", "Agua de lluvia acidulada", "Agua salada", "Agua hirviendo"], "correct": 0}, {"id": 53304, "question": "¿Qué significa «erosión» en el primer párrafo?", "options": ["Formación rápida de una montaña", "Solidificación de la lava", "Pérdida progresiva de material por el paso del agua y del tiempo", "Construcción artificial de un pozo"], "correct": 2}, {"id": 53305, "question": "¿Qué significa «pozo» en el texto?", "options": ["Un tipo de planta acuática", "Una torre de vigilancia", "Una cavidad profunda que contiene agua", "Un camino de tierra"], "correct": 2}, {"id": 53306, "question": "¿Qué relación hay entre el agua y la roca caliza en la formación del cenote?", "options": ["La roca se disuelve en aceite", "El agua y la roca no tienen relación", "La roca caliza absorbe toda el agua", "El agua desgasta la roca y forma el pozo"], "correct": 3}, {"id": 53307, "question": "¿Qué se pregunta el primer párrafo del texto?", "options": ["Dónde se encuentra la ciudad de Mérida", "Cuándo se secó el cenote de Zací", "Quién construyó el primer cenote", "Qué es un cenote"], "correct": 3}]}, {"id": 34, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 2, "title": "Párrafo 2 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Ubicado en el interior de la ciudad de Valladolid, Yucatán el cenote Zací es una impresionante caverna, parcialmente colapsada, de unos 45 metros de diámetro.", "questions": [{"id": 53400, "question": "¿En qué ciudad se encuentra el cenote Zací?", "options": ["En Chichén Itzá, Yucatán", "En Campeche, Campeche", "En Mérida, Yucatán", "En Valladolid, Yucatán"], "correct": 3}, {"id": 53401, "question": "¿Cómo se describe el cenote Zací?", "options": ["Como una impresionante caverna parcialmente colapsada", "Como una pirámide escalonada de piedra", "Como un manantial de agua caliente", "Como un lago tranquilo en medio de un bosque"], "correct": 0}, {"id": 53402, "question": "¿Cuál es el diámetro aproximado del cenote Zací?", "options": ["Unos 45 metros", "Unos 15 metros", "Unos 4.5 metros", "Unos 450 metros"], "correct": 0}, {"id": 53403, "question": "¿Qué significa que la caverna esté «parcialmente colapsada»?", "options": ["Que una parte de su techo se ha derrumbado", "Que está pintada con colores brillantes", "Que está completamente cubierta de agua", "Que nunca ha sufrido daños"], "correct": 0}, {"id": 53404, "question": "¿Qué significa «impresionante» en el texto?", "options": ["Que es fácil de recorrer", "Que causa admiración por su tamaño o belleza", "Que está seco y vacío", "Que es pequeño y poco visible"], "correct": 1}, {"id": 53405, "question": "¿Qué tipo de formación es el cenote Zací?", "options": ["Una selva tropical", "Una montaña", "Una playa de arena", "Una caverna"], "correct": 3}, {"id": 53406, "question": "¿En qué estado mexicano se encuentra la ciudad de Valladolid?", "options": ["Quintana Roo", "Campeche", "Yucatán", "Tabasco"], "correct": 2}, {"id": 53407, "question": "¿Qué medida se da para el diámetro del cenote?", "options": ["15 kilómetros", "150 metros", "4.5 kilómetros", "45 metros"], "correct": 3}]}, {"id": 35, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 3, "title": "Párrafo 3 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "Durante el imperio de los Cupules y los Cocomes se fundó, en 1543, la ciudad maya de Zací (gavilán blanco) en lo que en la actualidad es la ciudad de Valladolid, Yucatán. Dentro de la ciudad se encontraba este cenote, y sobre su bóveda se encontraba la vivienda de la curandera y hechicera del pueblo. Era la patrona de la familia Cocom; una anciana poderosa e influyente. Desde siempre, habían existido en Zací dos familias que se disputaban permanentemente el poder. El cacique Halach-Huinic (el hombre verdadero) era el que gobernaba en ese tiempo, y tenía un hijo llamado Hul-Kin (rayo de sol), perteneciente a la familia de los cupules.", "questions": [{"id": 53500, "question": "¿Quiénes dominaban durante el imperio en el que se fundó Zací?", "options": ["Los olmecas y los toltecas", "Los zapotecas y los mixtecos", "Los mexicas y los tlaxcaltecas", "Los Cupules y los Cocomes"], "correct": 3}, {"id": 53501, "question": "¿En qué año se fundó la ciudad maya de Zací?", "options": ["En 1810", "En 1521", "En 1325", "En 1543"], "correct": 3}, {"id": 53502, "question": "¿Qué significa «Zací» según el texto?", "options": ["Serpiente de agua", "Flor de la selva", "Gavilán blanco", "Jaguar negro"], "correct": 2}, {"id": 53503, "question": "¿En qué ciudad actual se encontraba la ciudad de Zací?", "options": ["En Valladolid, Yucatán", "En Cancún", "En Mérida", "En Campeche"], "correct": 0}, {"id": 53504, "question": "¿Dónde estaba la vivienda de la curandera y hechicera?", "options": ["Dentro de un templo de piedra", "En la costa del mar Caribe", "Al pie de la montaña más alta", "Sobre la bóveda del cenote"], "correct": 3}, {"id": 53505, "question": "¿Qué papel tenía la anciana del pueblo?", "options": ["Era comerciante de sal", "Era gobernante de la ciudad", "Era curandera y hechicera", "Era guerrera del ejército"], "correct": 2}, {"id": 53506, "question": "¿De qué familia era patrona la anciana?", "options": ["La familia Sac-Nicte", "La familia Halach-Huinic", "La familia Cupul", "La familia Cocom"], "correct": 3}, {"id": 53507, "question": "¿Cómo se describe a la anciana en el texto?", "options": ["Como una joven aprendiz de la hechicería", "Como una mujer pobre y olvidada", "Como una sacerdotisa que vivía en el mar", "Como una anciana poderosa e influyente"], "correct": 3}, {"id": 53508, "question": "¿Qué existía desde siempre en Zací?", "options": ["Dos familias que se disputaban el poder", "Un templo abandonado", "Un mercado de esclavos", "Un solo gobierno sin conflictos"], "correct": 0}, {"id": 53509, "question": "¿Quién gobernaba en esa época?", "options": ["El rey de los Cocomes", "El cacique Hul-Kin", "El cacique Halach-Huinic", "La hechicera"], "correct": 2}, {"id": 53510, "question": "¿Qué significa «Halach-Huinic» según el texto?", "options": ["El gavilán blanco", "La flor blanca", "El rayo de sol", "El hombre verdadero"], "correct": 3}, {"id": 53511, "question": "¿Qué significa «Hul-Kin» según el texto?", "options": ["Flor blanca", "Rayo de sol", "Mujer noble", "Hombre verdadero"], "correct": 1}, {"id": 53512, "question": "¿A qué familia pertenecía Hul-Kin?", "options": ["A la familia del cacique Halach-Huinic", "A la familia de los cupules", "A la familia de los cocomes", "A la familia de la hechicera"], "correct": 1}, {"id": 53513, "question": "¿Quién era el hijo del cacique?", "options": ["Halach-Huinic", "Sac-Nicte", "El gavilán blanco", "Hul-Kin"], "correct": 3}, {"id": 53514, "question": "¿Qué se disputaban las dos familias de Zací?", "options": ["El poder", "Las tierras del norte", "La ciudad de Mérida", "El comercio de cacao"], "correct": 0}, {"id": 53515, "question": "¿Cuál de estos datos NO aparece en el tercer párrafo?", "options": ["La fundación de Mérida en 1542", "La familia a la que pertenecía Hul-Kin", "La fecha de fundación de Zací", "El nombre del cacique Halach-Huinic"], "correct": 0}, {"id": 53516, "question": "¿Qué significa «curandera» en el texto?", "options": ["Persona que vende telas", "Persona que construye casas", "Persona que cura enfermedades con remedios y ritos", "Persona que dirige la guerra"], "correct": 2}, {"id": 53517, "question": "¿Qué significa «bóveda» en el texto?", "options": ["La puerta principal del templo", "Un tipo de árbol de la selva", "El techo curvo de una cavidad", "El fondo de un pozo"], "correct": 2}, {"id": 53518, "question": "¿Qué representaba la anciana para la familia Cocom?", "options": ["Su patrona, es decir, su protectora espiritual", "Su enemiga política", "Su guerrera principal", "Su mayor comerciante"], "correct": 0}, {"id": 53519, "question": "¿Qué relación tenían los Cupules y los Cocomes en Zací?", "options": ["Se disputaban el poder en la ciudad", "Vivían en ciudades distintas sin contacto", "Eran aliados en todas las guerras", "Se habían unido por matrimonio"], "correct": 0}, {"id": 53520, "question": "¿Qué tipo de gobierno mantenía el cacique Halach-Huinic?", "options": ["Gobernaba desde el mar", "Gobernaba desde una selva lejana", "No gobernaba en la ciudad", "Gobernaba la ciudad en su tiempo"], "correct": 3}, {"id": 53521, "question": "¿En qué lugar se fundó la ciudad maya de Zací según el texto?", "options": ["En lo que hoy es la ciudad de Valladolid", "En el centro de la ciudad de México", "En lo que hoy es la ciudad de Campeche", "En la costa del golfo de México"], "correct": 0}, {"id": 53522, "question": "¿Qué relación tenía la vivienda de la hechicera con el cenote?", "options": ["Estaba a cientos de kilómetros del cenote", "Estaba dentro del agua del cenote", "Estaba situada justo sobre la bóveda del cenote", "No tenía ninguna relación con el cenote"], "correct": 2}, {"id": 53523, "question": "¿Qué significa «imperio» en el texto?", "options": ["Una familia de comerciantes", "Un pequeño pueblo de agricultores", "Un conjunto de pueblos gobernados por un poder central", "Una casa de piedra con jardines"], "correct": 2}, {"id": 53524, "question": "¿Qué tipo de ciudad era Zací?", "options": ["Una ciudad maya", "Un campamento militar", "Un puerto comercial", "Una colonia española"], "correct": 0}, {"id": 53525, "question": "¿Qué hechos ocurrían durante el imperio de los Cupules y los Cocomes?", "options": ["Comenzó la independencia de México", "Se construyó el Canal de Panamá", "Se fundó la ciudad de México", "Se fundó la ciudad de Zací en 1543"], "correct": 3}, {"id": 53526, "question": "¿Qué significa «gavilán» en el nombre Zací?", "options": ["Un ave rapaz", "Una serpiente de agua", "Un jaguar de la selva", "Una flor blanca"], "correct": 0}, {"id": 53527, "question": "¿Qué relación tenía el cacique Halach-Huinic con su hijo Hul-Kin?", "options": ["Era su padre", "Era su maestro", "Era su hermano", "Era su tío"], "correct": 0}, {"id": 53528, "question": "¿A qué familia rival pertenecía la familia de Hul-Kin?", "options": ["A los cupules", "A los mexicas", "A los cocomes", "A los tlaxcaltecas"], "correct": 0}, {"id": 53529, "question": "¿Qué significa «cacique» en el texto?", "options": ["Jefe o líder de un pueblo", "Comerciante de sal", "Sacerdote del templo", "Guerrero de élite"], "correct": 0}, {"id": 53530, "question": "¿Qué se entiende por «hechicera» en el texto?", "options": ["Comerciante de telas", "Mujer que practica magia y hechizos", "Reina del pueblo", "Maestra de escuela"], "correct": 1}]}, {"id": 36, "passage_id": 6, "passage": "La leyenda del Cenote Zací", "paragraph": 4, "title": "Párrafo 4 · La leyenda del Cenote Zací", "topic": "Leyendas y cultura maya", "text": "La nieta de la hechicera se había quedado huérfana al nacer, y por ello la abuela la quería doblemente, ya que en ella cifraba el amor a su hija y a su propia nieta, la hermosa “Sac-Nicte” (flor blanca), quien le habría de alegrar la vida en su ancianidad.", "questions": [{"id": 53600, "question": "¿Por qué se quedó huérfana la nieta de la hechicera?", "options": ["Su madre la abandonó en el bosque", "Quedó huérfana al nacer", "Murió en una guerra de su pueblo", "Falleció por una enfermedad en la juventud"], "correct": 1}, {"id": 53601, "question": "¿Cómo quería la abuela a su nieta?", "options": ["De manera distante", "Con indiferencia", "Doblemente", "Con temor"], "correct": 2}, {"id": 53602, "question": "¿En qué cifraba la abuela su amor?", "options": ["En las riquezas de la familia", "En su hija y en su nieta", "En los dioses del cenote", "En su propio pasado de guerrera"], "correct": 1}, {"id": 53603, "question": "¿Cómo se llamaba la nieta de la hechicera?", "options": ["Halach-Huinic", "Zací", "Hul-Kin", "Sac-Nicte"], "correct": 3}, {"id": 53604, "question": "¿Qué significa «Sac-Nicte» en el texto?", "options": ["Flor blanca", "Hombre verdadero", "Gavilán blanco", "Rayo de sol"], "correct": 0}, {"id": 53605, "question": "¿Qué papel tendría Sac-Nicte en la vejez de su abuela?", "options": ["Hacerla trabajar en la cocina", "Vender sus remedios en el mercado", "Alegrarle la vida en su ancianidad", "Dejarla sola en la casa"], "correct": 2}, {"id": 53606, "question": "¿Qué significa «ancianidad» en el texto?", "options": ["La juventud", "La vejez", "La edad adulta", "La niñez"], "correct": 1}, {"id": 53607, "question": "¿Qué sentimiento tenía la abuela hacia la nieta?", "options": ["Un temor a los dioses", "Un odio profundo", "Un amor doble, hacia su hija y hacia su nieta", "Una indiferencia total"], "correct": 2}, {"id": 53608, "question": "¿Qué significa «cifraba» en la frase «en ella cifraba el amor»?", "options": ["Vendía o cambiaba", "Dividía o repartía", "Depositaba o concentraba", "Escondía o perdía"], "correct": 2}, {"id": 53609, "question": "¿Qué calificativo recibe Sac-Nicte en el texto?", "options": ["Hermosa", "Fea y olvidada", "Anciana y enferma", "Cruel y violenta"], "correct": 0}, {"id": 53610, "question": "¿Qué significa «huérfana» en el texto?", "options": ["Persona que vive sola en el bosque", "Persona que ha perdido
