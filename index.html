, "title": "Popocatepetl: la montana que humea", "topic": "Geografia, lengua y simbolismo", "text": "El nombre Popocatépetl proviene del náhuatl y se interpreta como «montaña que humea». Esta denominación refleja la observación histórica de su actividad volcánica y la relación que los pueblos del altiplano han mantenido con el entorno. Desde tiempos prehispánicos, las fumarolas del volcán se han asociado con fuerza, respeto y significado ritual. Su presencia domina el paisaje de regiones cercanas a Puebla, Estado de México y Morelos, donde ha influido en rutas, asentamientos y relatos locales. El texto subraya que un volcán puede leerse desde dos planos: el científico, que estudia procesos geológicos, y el cultural, que conserva memorias, leyendas y prácticas comunitarias. En comprensión lectora, esta combinación de perspectivas obliga a distinguir dato lingüístico, descripción natural e interpretación simbólica. Al hacerlo, la persona lectora demuestra que no solo identifica información puntual, sino también la estructura de sentido que une territorio e historia.", "text_en": "The name Popocatépetl comes from Nahuatl and is interpreted as \"smoking mountain.\" This name reflects the historical observation of its volcanic activity and the relationship that highland peoples have kept with their surroundings. Since pre-Hispanic times, the volcano's fumaroles have been associated with strength, respect, and ritual meaning. Its presence dominates the landscape of regions near Puebla, the State of Mexico, and Morelos, where it has influenced routes, settlements, and local stories. The text stresses that a volcano can be read on two levels: the scientific one, which studies geological processes, and the cultural one, which keeps memories, legends, and community practices. In reading comprehension, this combination of perspectives requires distinguishing linguistic data, natural description, and symbolic interpretation. In doing so, the reader shows not only that they identify specific information, but also the structure of meaning that unites territory and history.", "text_fa": null, "questions": [{"id": 11400, "question": "¿Qué significa Popocatépetl en náhuatl según el texto?", "options": ["Montaña que humea", "Agua profunda", "Tierra del faisán", "Mujer blanca"], "correct": 0, "question_en": "What does Popocatépetl mean in Nahuatl according to the text?", "options_en": ["Smoking mountain", "Deep water", "Land of the pheasant", "White woman"], "question_fa": null, "options_fa": null}, {"id": 11401, "question": "¿Qué elemento histórico refleja ese nombre?", "options": ["Traducción francesa moderna", "Observación de su actividad volcánica", "Diseño colonial de rutas", "Uso de calendarios europeos"], "correct": 1, "question_en": "What historical element does that name reflect?", "options_en": ["Modern French translation", "Observation of its volcanic activity", "Colonial route design", "Use of European calendars"], "question_fa": null, "options_fa": null}, {"id": 11402, "question": "¿Qué regiones se mencionan alrededor del volcán?", "options": ["Puebla, Estado de México y Morelos", "Sonora, Sinaloa y Nayarit", "Chihuahua, Durango y Coahuila", "Campeche, Yucatán y Quintana Roo"], "correct": 0, "question_en": "Which regions are mentioned around the volcano?", "options_en": ["Puebla, the State of Mexico and Morelos", "Sonora, Sinaloa and Nayarit", "Chihuahua, Durango and Coahuila", "Campeche, Yucatán and Quintana Roo"], "question_fa": null, "options_fa": null}, {"id": 11403, "question": "¿Qué dos planos de lectura propone el texto?", "options": ["Militar y comercial", "Científico y cultural", "Eléctrico y digital", "Jurídico y financiero"], "correct": 1, "question_en": "What two levels of reading does the text propose?", "options_en": ["Military and commercial", "Scientific and cultural", "Electric and digital", "Legal and financial"], "question_fa": null, "options_fa": null}, {"id": 11404, "question": "¿Qué debe distinguir la persona lectora en comprensión?", "options": ["Dato lingüístico, descripción natural e interpretación simbólica", "Solo nombres propios", "Solo números de altitud", "Solo fechas históricas"], "correct": 0, "question_en": "What must the reader distinguish in comprehension?", "options_en": ["Linguistic data, natural description and symbolic interpretation", "Only proper names", "Only altitude figures", "Only historical dates"], "question_fa": null, "options_fa": null}, {"id": 11405, "question": "¿Qué relación general muestra el texto?", "options": ["Puertos y aduanas", "Medicina y farmacia", "Territorio e historia", "Mercado y bolsa"], "correct": 2, "question_en": "What general relationship does the text show?", "options_en": ["Ports and customs", "Medicine and pharmacy", "Territory and history", "Market and stock exchange"], "question_fa": null, "options_fa": null}]}, {"id": 15, "title": "Parque Nacional Izta-Popo", "topic": "Area natural protegida", "text": "El Parque Nacional Iztaccíhuatl-Popocatépetl es una de las áreas naturales protegidas más conocidas del centro de México. Su importancia radica en la biodiversidad, los servicios ambientales y la función hidrológica que cumple para regiones cercanas. En sus montañas y valles existen ecosistemas que ayudan a regular el clima, conservar suelos y mantener procesos biológicos clave. También tiene valor histórico: en su entorno se desarrollaron comunidades que domesticaron cultivos fundamentales para la dieta local, como maíz, frijol y calabaza. Este doble carácter, natural y cultural, explica por qué su conservación exige estrategias de largo plazo y participación social. No se trata solo de proteger paisajes: se trata de sostener condiciones de vida para poblaciones humanas y no humanas. En comprensión lectora, un texto así puede preguntar por el objetivo de protección, ejemplos de biodiversidad o la relación entre patrimonio natural y conocimiento comunitario.", "text_en": "The Iztaccíhuatl–Popocatépetl National Park is one of the best-known protected natural areas in central Mexico. Its importance lies in the biodiversity, the environmental services, and the hydrological function it provides for nearby regions. In its mountains and valleys there are ecosystems that help regulate climate, conserve soils, and maintain key biological processes. It also has historical value: communities developed in its surroundings and domesticated crops fundamental to the local diet, such as maize, beans, and squash. This double natural and cultural character explains why its conservation requires long-term strategies and social participation. It is not only about protecting landscapes: it is about sustaining living conditions for human and non-human populations. In reading comprehension, a text like this can ask about the purpose of protection, examples of biodiversity, or the relationship between natural heritage and community knowledge.", "text_fa": null, "questions": [{"id": 11500, "question": "¿Qué tipo de espacio es Izta-Popo según el texto?", "options": ["Corredor ferroviario", "Puerto comercial", "Zona industrial", "Área natural protegida"], "correct": 3, "question_en": "What type of space is Izta-Popo according to the text?", "options_en": ["Railway corridor", "Commercial port", "Industrial zone", "Protected natural area"], "question_fa": null, "options_fa": null}, {"id": 11501, "question": "¿Qué razón principal se menciona para su importancia?", "options": ["Comercio marítimo", "Turismo de playa", "Explotación minera", "Biodiversidad y servicios ambientales"], "correct": 3, "question_en": "What main reason is mentioned for its importance?", "options_en": ["Maritime trade", "Beach tourism", "Mining exploitation", "Biodiversity and environmental services"], "question_fa": null, "options_fa": null}, {"id": 11502, "question": "¿Qué cultivos se nombran como parte de su valor histórico?", "options": ["Cebada y avena", "Trigo y centeno", "Café y cacao", "Maíz, frijol y calabaza"], "correct": 3, "qu los símbolos patrios más queridos. La bandera actual está formada por tres franjas verticales: verde, blanco y rojo, con el Escudo Nacional en el centro de la franja blanca. El verde simboliza la esperanza, el blanco la unidad y el rojo la sangre de los héroes nacionales. El escudo muestra un águila real posada sobre un nopal devorando una serpiente, imagen que representa la fundación de Tenochtitlan. Junto con el Himno Nacional y el Escudo, la Bandera es uno de los tres símbolos patrios de México, y su uso está regulado por la ley. En las escuelas, los lunes se realizan honores a la bandera, una ceremonia en la que estudiantes y maestros la saludan y entonan el Himno Nacional. Respetar la bandera es una forma de expresar identidad, memoria y pertenencia a la nación.", "text_en": "In Mexico, February 24 is Flag Day, a date dedicated to one of the most beloved national symbols. The current flag is made up of three vertical stripes — green, white, and red — with the National Coat of Arms in the center of the white stripe. Green symbolizes hope, white unity, and red the blood of the national heroes. The coat of arms shows a golden eagle perched on a cactus devouring a snake, an image that represents the founding of Tenochtitlan. Along with the National Anthem and the Coat of Arms, the Flag is one of Mexico's three national symbols, and its use is regulated by law. In schools, flag ceremonies are held on Mondays, where students and teachers salute the flag and sing the National Anthem. Respecting the flag is a way to express identity, memory, and belonging to the nation.", "text_fa": null, "questions": [{"id": 11600, "question": "¿En qué fecha se celebra el Día de la Bandera?", "options": ["24 de febrero", "20 de noviembre", "16 de septiembre", "5 de mayo"], "correct": 0, "question_en": "On what date is Flag Day celebrated?", "options_en": ["February 24", "November 20", "September 16", "May 5"], "question_fa": null, "options_fa": null}, {"id": 11601, "question": "¿Qué c <script>
(function(){
"use strict";
var D = window.__APP_DATA__;
var APP_VERSION = "2026-09-03-728q-61037ba902"; // inyectado por build_standalone.py
var HIST = D.hist;       // Spanish questions with _en and _fa translation fields
var PASSAGES = D.passages; // Spanish readings with _en and _fa translation fields
var IW = D.iw;           // {interview:[{question,tip}], writing:[], writingChecklist:[], writingWordRange:[]}
var TRANSLATION = "";   // "", "en", or "fa"
var FA_CACHE = loadFarsiCache();
var FA_LOADING = false;
var FA_ERROR = "";
var FA_LAST_VIEW = "";
var phone = localStorage.getItem("nmx_phone") || "";

migrateFlashcards();

function key(){ return "nmx_db_" + (phone||"").trim(); }
function loadDB(){
  try { return JSON.parse(localStorage.getItem(key()) || "{}") || {}; }
  catch(e){ return {}; }
}
function saveDB(){ localStorage.setItem(key(), JSON.stringify(DB)); }
function loadFarsiCache(){
  try { return JSON.parse(localStorage.getItem("nmx_farsi_translations") || "{}") || {}; }
  catch(e){ return {}; }
}
function saveFarsiCache(){
  try { localStorage.setItem("nmx_farsi_translations",JSON.stringify(FA_CACHE)); }
  catch(e){ /* Translation still works for this session if storage is full. */ }
}
function user(){ return DB.user || {id:1,name:"",practiceSession:0,totalCorrect:0,totalAnswered:0,masteredCount:0,simuladorApproved:false,lecturaApproved:false}; }
function isHistoryId(qid){ qid=+qid; for(var i=0;i<HIST.length;i++){ if(HIST[i].id===qid) return true; } return false; }
// Una tarjeta es válida SOLO si la pregunta fue respondida en el simulador
// (DB.simSeen) o se añadió a mano desde el banco (DB.bankAdded). Cualquier otra
// tarjeta —incluidas las que dejaron versiones anteriores de la app— se descarta,
// así Flashcards nunca muestra una pregunta que no esté en tu progreso.
function cardAllowed(qid){
  qid=+qid;
  var seen=DB.simSeen||{}, added=DB.bankAdded||{};
  return !!seen[qid] || !!added[qid];
}
// Historial antiguo: antes de DB.simSeen solo quedaba registro de las preguntas
// contestadas correctamente (DB.correctDays). Eso también prueba que la pregunta
// se respondió en el simulador, así que cuenta como "respondida".
function wasAnswered(qid){
  var arr=(DB.correctDays||{})[qid];
  return Array.isArray(arr) && arr.length>0;
}
function migrateFlashcards(){
  var fc=DB.flashcards||{};
  var seen=DB.simSeen||{};
  var added=DB.bankAdded||{};
  var changed=false;
  for(var qid in fc){
    var val=fc[qid];
    if(Array.isArray(val)){
      // Migrate from old format (array of marks) to new format (object)
      var correctCount=val.filter(function(x){return x==="facil";}).length;
      fc[qid]={correctCount:correctCount,learned:correctCount>=5,lastReviewedAt:new Date().toISOString()};
      changed=true;
      val=fc[qid];
    }
    // Solo preguntas de Historia/Cultura (del simulador o agregadas desde el
    // banco) pertenecen a flashcards. Se elimina lo de otras secciones (lectura).
    if(!isHistoryId(qid)){
      delete fc[qid];
      changed=true;
      continue;
    }
    // ...y solo si viene del simulador o se añadió desde el banco.
    if(wasAnswered(qid) && !seen[qid]) seen[qid]=true;
    if(!cardAllowed(qid)){
      delete fc[qid];
      delete seen[qid];
      changed=true;
      continue;
    }
    // Sincronizar respuestas correctas registradas en el simulador si correctCount era 0
    var cDays=(DB.correctDays||{})[qid];
    if(Array.isArray(cDays) && cDays.length > (val.correctCount||0)){
      val.correctCount=cDays.length;
      if(val.correctCount>=FLASHCARD_LEARN_COUNT) val.learned=true;
      changed=true;
    }
    // Si la pregunta fue respondida en el simulador pero no tenía fecha de último repaso, registrar fecha
    if(wasAnswered(qid) && !val.lastReviewedAt){
      val.lastReviewedAt=new Date().toISOString();
      changed=true;
    }
  }
  for(var sid in seen){
    if(!isHistoryId(sid)){ delete seen[sid]; changed=true; }
  }
  for(var aid in added){
    if(!isHistoryId(aid)){ delete added[aid]; changed=true; continue; }
    // Una pregunta añadida desde el banco siempre tiene su tarjeta (disponible para repasar).
    if(!fc[aid]){ fc[aid]={correctCount:0,learned:false,lastReviewedAt:null}; changed=true; }
  }
  DB.simSeen=seen;
  DB.bankAdded=added;
  // Keep the displayed mastered count in sync after the cleanup.
  var u=user();
  var newCount=learnedIds().length;
  if(u.masteredCount!==newCount){ u.masteredCount=newCount; DB.user=u; changed=true; }
  if(changed){ DB.flashcards=fc; DB.simSeen=seen; DB.bankAdded=added; saveDB(); }
}
function today(){ return new Date().toISOString().slice(0,10); }
function setUser(patch){ DB.user = Object.assign({}, user(), patch); saveDB(); }
function correctDays(){
  var m = {};
  (DB.correctDays || {}).forEach ? null : null;
  var cd = DB.correctDays || {};
  for(var qid in cd){ m[qid] = (cd[qid]||[]).length; }
  return {map:m, cd:cd};
}
function sessionDay(){ var u=user(); return (u.practiceSession||0)+1; }

/* ---------- views ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function render(){ 
  var root=document.getElementById("app");

function loginHTML(){

    '<p class="mut" style="margin-bottom:18px">Simulador (10 preguntas, pasa con 8) · Lectura (6, pasa con 5) · Entrevista y Redacción · Flashcards · Banco. Tu progreso se guarda en este dispositivo.</p>'+
    '<label class="small" for="ph">Número de teléfono</label>'+

    '<label class="small" for="nm">Tu nombre (opcional)</label>'+

    '<p class="small mut" style="margin-top:14px">Funciona sin servidor. Español e inglés están disponibles sin conexión; el farsi requiere internet la primera vez y luego se guarda en este navegador.</p>'+

function bindLogin(){
  document.getElementById("go").onclick=function(){
    var ph=document.getElementById("ph").value.trim();
    if(ph.length<5){ alert("Escribe tu número de teléfono"); return; }
    phone=ph;
    var db=loadDB();
    if(!db.user){ db.user={id:1,name:document.getElementById("nm").value.trim(),practiceSession:0,totalCorrect:0,totalAnswered:0,masteredCount:0,simuladorApproved:false,lecturaApproved:false}; }
    else if(document.getElementById("nm").value.trim()){ db.user.name=document.getElementById("nm").value.trim(); }
    if(!db.correctDays) db.correctDays={};
    if(!db.attempts) db.attempts=[];
    if(!db.flashcards) db.flashcards={};
    if(!db.daily) db.daily={};
    DB=db; saveDB();
    render();
  };
}
function appHTML(){
  var u=user();
  var stats=[
    ["Aprendidas",u.masteredCount,"5 respuestas correctas en flashcards"],
    ["Correctas",u.totalCorrect,"respuestas correctas"],
    ["Sesión","#"+(u.practiceSession+1),"cada práctica cuenta como día"],
    ["Estado", u.simuladorApproved&&u.lecturaApproved?"¡Listo!":"En progreso", ""]
  ];
  var tabs=[["sim","Simulador"],["lec","Lectura"],["ent","Entrevista"],["fl","Flashcards"],["ban","Banco"],["pro","Progreso"]];
  var t=tabs.map(function(t){return '<button class="tab'+(t[0]===STATE.tab?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("");
  return '<div class="wrap">'+
    '<div class="top">'+
      '<div><div style="display:flex;gap:8px;align-items:center"><span style="font-size:22px">🇲🇽</span><h1>Naturalización <span style="color:#fcd34d">MX</span></h1></div>'+
      '<div class="small mut">Hola, '+(esc(u.name)||"estudiante")+' · '+esc(phone)+'</div></div>'+
      '<div class="row"><button class="btn ghost" id="en" aria-pressed="'+(TRANSLATION==="en")+'">EN '+(TRANSLATION==="en"?"on":"off")+'</button><button class="btn ghost" id="fa" aria-pressed="'+(TRANSLATION==="fa")+'">FA '+(TRANSLATION==="fa"?(FA_LOADING?"…":(FA_ERROR?"!":"on")):"off")+'</button><button class="btn ghost" id="out">Salir</button></div>'+
    '</div>'+
    '<div class="grid" style="margin-bottom:14px">'+stats.map(function(s){return '<div class="stat"><b>'+s[1]+'</b><div class="small mut">'+s[0]+'</div><div class="small" style="opacity:.6">'+s[2]+'</div></div>';}).join("")+'</div>'+
    '<div class="tabs">'+t+'</div>'+
    '<div id="content">'+viewHTML(STATE.tab)+'</div>'+
    '<div class="footer">Naturalización MX · datos del banco oficial de práctica · progreso guardado localmente (localStorage) · v<span id="appver"></span></div>'+
  '</div>';
}
function viewHTML(tab){
  if(tab==="sim") return simHTML();
  if(tab==="lec") return lecHTML();
  if(tab==="ent") return entHTML();
  if(tab==="fl") return flHTML();
  if(tab==="ban") return banHTML();
  if(tab==="pro") return proHTML();
  return "";
}
function bindApp(){
  document.querySelectorAll(".tab").forEach(function(b){ b.onclick=function(){
    var tab=b.getAttribute("data-tab");
    STATE.tab=tab;
    // Keep the flashcard card while navigating between sections; only the
    // exam views (simulador/lectura) reset so a new attempt starts fresh.
    if(tab!=="fl") STATE.view=null;
    render();
  }; });
  document.getElementById("out").onclick=function(){ phone=""; STATE.view=null; STATE.flash=null; render(); };
  document.getElementById("en").onclick=function(){ TRANSLATION=TRANSLATION==="en"?"":"en"; render(); };
  document.getElementById("fa").onclick=function(){ FA_ERROR=""; FA_LAST_VIEW=""; TRANSLATION=TRANSLATION==="fa"?"":"fa"; render(); };
  bindView();
  if(TRANSLATION==="fa") ensureFarsiForView();
}
var STATE={tab:"sim",view:null,flash:null,sel:{},timer:null};
function tr(enTxt,faTxt){
  var txt=TRANSLATION==="fa"?(faTxt||FA_CACHE[enTxt]):(TRANSLATION==="en"?enTxt:null);
  if(!txt&&TRANSLATION==="fa"&&enTxt) txt=FA_ERROR?"ترجمه در حال حاضر در دسترس نیست.":"در حال بارگذاری ترجمه…";
  if(!txt) return "";
  return '<div class="translation '+(TRANSLATION==="fa"?'fa':'en')+'" lang="'+TRANSLATION+'"'+(TRANSLATION==="fa"?' dir="rtl"':'')+'>'+esc(txt)+'</div>';
}
function trOption(enOptions,faOptions,index){
  var enTxt=enOptions&&enOptions[index];
  var txt=TRANSLATION==="fa"?((faOptions&&faOptions[index])||FA_CACHE[enTxt]):(TRANSLATION==="en"?enTxt:null);
  if(!txt&&TRANSLATION==="fa"&&enTxt) txt=FA_ERROR?"ترجمه در دسترس نیست.":"در حال بارگذاری…";
  if(!txt) return "";
  return '<div class="small translation '+(TRANSLATION==="fa"?'fa':'en')+'" lang="'+TRANSLATION+'"'+(TRANSLATION==="fa"?' dir="rtl"':'')+'>'+esc(txt)+'</div>';
}
function addFarsiSource(out,enTxt,faTxt){
  if(enTxt&&!faTxt&&!FA_CACHE[enTxt]&&out.indexOf(enTxt)<0) out.push(enTxt);
}
function addHistoryFarsiSources(out,q){
  addFarsiSource(out,q.pregunta_en,q.pregunta_fa);
  (q.opciones_en||[]).forEach(function(txt,i){addFarsiSource(out,txt,q.opciones_fa&&q.opciones_fa[i]);});
  addFarsiSource(out,q.explicacion_en,q.explicacion_fa);
}
function addReadingFarsiSources(out,q){
  addFarsiSource(out,q.question_en,q.question_fa);
  (q.options_en||[]).forEach(function(txt,i){addFarsiSource(out,txt,q.options_fa&&q.options_fa[i]);});
}
function currentFarsiWork(){
  var out=[],signature=STATE.tab;
  if(STATE.tab==="sim"&&STATE.view){
    var sv=STATE.view;
    var simqs=sv.phase==="review"?sv.qs:[sv.qs[sv.idx]];
    simqs.forEach(function(q){addHistoryFarsiSources(out,q);});
    signature+="-"+sv.phase+"-"+(sv.phase==="review"?"all":sv.qs[sv.idx].id);
  } else if(STATE.tab==="lec"&&STATE.view){
    var lv=STATE.view;
    addFarsiSource(out,lv.p.text_en,lv.p.text_fa);
    lv.qs.forEach(function(q){addReadingFarsiSources(out,q);});
    signature+="-"+lv.p.id;
  } else if(STATE.tab==="fl"&&STATE.flash){
    addHistoryFarsiSources(out,STATE.flash.q);
    signature+="-"+STATE.flash.q.id+"-"+STATE.flash.revealed;
  } else if(STATE.tab==="ban"){
    var mode=STATE.sel.banmode||"hist";
    var query=(STATE.sel.banq||"").toLowerCase();
    if(mode==="hist"){
      HIST.filter(function(x){if(!query)return true;return (x.pregunta+" "+(x.pregunta_en||"")+" "+(x.subtema||"")).toLowerCase().indexOf(query)>=0;}).slice(0,10).forEach(function(q){addHistoryFarsiSources(out,q);});
    } else if(mode==="lec"){
      PASSAGES.filter(function(p){if(!query)return true;return (p.title+" "+p.text+" "+(p.text_en||"")).toLowerCase().indexOf(query)>=0;}).slice(0,2).forEach(function(p){addFarsiSource(out,p.text_en,p.text_fa);p.questions.forEach(function(q){addReadingFarsiSources(out,q);});});
    }
    signature+="-"+mode+"-"+query;
  }
  return {sources:out,signature:signature};
}
function splitTranslationText(text){
  if(encodeURIComponent(text).length<=430) return [text];
  var words=text.split(/\s+/),chunks=[],current="";
  words.forEach(function(word){
    var next=current?current+" "+word:word;
    if(current&&encodeURIComponent(next).length>430){chunks.push(current);current=word;}
    else current=next;
  });
  if(current)chunks.push(current);
  return chunks;
}
function decodeTranslationEntities(text){
  var area=document.createElement("textarea"); area.innerHTML=text; return area.value;
}
function requestFarsi(text){
  var url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=en%7Cfa&mt=1";
  return fetch(url,{method:"GET",mode:"cors"}).then(function(response){
    if(!response.ok)throw new Error("Translation HTTP "+response.status);
    return response.json();
  }).then(function(data){
    if(!data.responseData||Number(data.responseStatus)!==200||data.quotaFinished)throw new Error(data.responseDetails||"Translation quota unavailable");
    var text=decodeTranslationEntities(data.responseData.translatedText||"").trim();
    if(!text)throw new Error("Empty translation");
    return text;
  });
}
function translateFarsiSource(source){
  var chunks=splitTranslationText(source);
  return Promise.all(chunks.map(requestFarsi)).then(function(parts){return parts.join(" ");});
}
function ensureFarsiForView(){
  if(TRANSLATION!=="fa"||FA_LOADING||FA_ERROR)return;
  var work=currentFarsiWork();
  if(work.signature===FA_LAST_VIEW)return;
  FA_LAST_VIEW=work.signature;
  if(!work.sources.length)return;
  FA_LOADING=true;
  var button=document.getElementById("fa"); if(button)button.textContent="FA …";
  var cursor=0;
  function worker(){
    var index=cursor++; if(index>=work.sources.length)return Promise.resolve();
    var source=work.sources[index];
    return translateFarsiSource(source).then(function(result){FA_CACHE[source]=result;}).then(worker);
  }
  var workers=[];
  for(var i=0;i<Math.min(4,work.sources.length);i++)workers.push(worker());
  Promise.all(workers).then(function(){
    saveFarsiCache(); FA_LOADING=false; render();
  }).catch(function(error){
    console.error("Farsi translation failed",error); saveFarsiCache(); FA_LOADING=false; FA_ERROR=String(error&&error.message||error); render();
  });
}
function qpills(q){ 
  var p='';
  if(q.categoria)p+='<span class="pill gold">'+esc(q.categoria)+'</span>';
  if(q.subtema)p+=' <span class="pill">'+esc(q.subtema)+'</span>';
  if(q.dificultad)p+=' <span class="pill green">'+esc(q.dificultad)+'</span>';

function startTimer(){

function submitSim(force){
  var v=STATE.view; if(!v||v.phase!=="active") return;
  clearInterval(STATE.timer);
  var list=v.qs.map(function(q){return {id:q.id, ans:v.ans[q.id], correct:q.correct};});
  var correct=list.filter(function(x){return x.ans===x.correct;}).length;

  var passed=correct>=8;
  recordAnswers(list,"simulador");
  recordAttempt("simulador",correct,total,passed);

  v.phase="review"; v.correct=correct; v.total=total; v.passed=passed; v.list=list;

function recordAnswers(list,type){
  var day=sessionDay();
  var cd=DB.correctDays||{};
  list.forEach(function(x){ if(x.ans===x.correct){ var arr=cd[x.id]||[]; if(arr.indexOf(day)<0){arr.push(day); arr.sort(function(a,b){return a-b;});} cd[x.id]=arr; } });
  DB.correctDays=cd;
  var u=user(); u.totalAnswered+=(list.filter(function(x){return x.ans!=null;}).length); u.totalCorrect+=(list.filter(function(x){return x.ans===x.correct;}).length); u.practiceSession=day;
  // El simulador agrega a flashcards de forma automática; el banco lo hace de
  // forma manual con addFromBank(). Lectura y otras secciones nunca aparecen.
  if(type==="simulador"){
    var seen=DB.simSeen=DB.simSeen||{};
    var fc=DB.flashcards=DB.flashcards||{};
    list.forEach(function(x){
      if(!isHistoryId(x.id)) return;
      if(x.ans==null) return; // only questions actually answered in the simulator
      seen[x.id]=true;
      var card=fc[x.id]||{correctCount:0,learned:false,lastReviewedAt:null};
      if(x.ans===x.correct){
        card.correctCount=(card.correctCount||0)+1;
        if(card.correctCount>=FLASHCARD_LEARN_COUNT) card.learned=true;
      }
      card.lastReviewedAt=new Date().toISOString();
      fc[x.id]=card;
    });
  }
  u.masteredCount=learnedIds().length;
  setUser(u);
  var d=DB.daily[today()]||{flashcards:0,simulador:false,lectura:false};
  d.simulador=type==="simulador";
  d.lectura=type==="lectura";
  DB.daily[today()]=d; saveDB();
}

/* ---------- Flashcards ---------- */
var FLASHCARD_LEARN_COUNT=5;
var FLASHCARD_MIN_DAYS=5;
var FL_MODE="reveal"; // "reveal" or "choice"
// Las flashcards provienen del simulador (automático) o del banco (manual).
function learnedIds(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push(+qid); }
  return out;
}
function pendingCards(){
  var fc=DB.flashcards||{}, out=[];
  for(var qid in fc){ var card=fc[qid]; if(card&&!card.learned&&isHistoryId(qid)&&cardAllowed(qid)) out.push({id:+qid,correctCount:card.correctCount||0,lastReviewedAt:card.lastReviewedAt||null}); }
  return out;
}
function daysSince(dateStr){
  if(!dateStr) return 9999;
  var d1=new Date(String(dateStr).slice(0,10)+"T00:00:00Z");
  var d2=new Date(today()+"T00:00:00Z");
  return Math.round((d2.getTime()-d1.getTime())/86400000);
}
function availablePool(){
  var fc=DB.flashcards||{};
  var pool=HIST.filter(function(q){
    var card=fc[q.id];
    if(!card) return false;              // must have been added (simulator or bank)
    if(!cardAllowed(q.id)) return false; // only simulator-answered or bank-added
    if(card.learned) return false;
    if(!card.lastReviewedAt) return true; // not reviewed yet
    return daysSince(card.lastReviewedAt) >= FLASHCARD_MIN_DAYS;
  });
  return pool;
}

  var learned=learnedIds();
  var pending=pendingCards();
  var studied=(DB.daily[today()]||{}).flashcards||0;

    }

  }

  var modeBtn='<button class="btn ghost" id="flmode" style="margin-left:auto;font-size:12px">'+
    (FL_MODE==="reveal"?"Cambiar a opciones":"Cambiar a autoevaluación")+'</button>';
  var header='<div class="row" style="margin-bottom:8px;flex-wrap:wrap"><span class="pill gold">Pendientes: '+pending.length+'</span><span class="pill green">Aprendidas: '+learned.length+'</span>'+modeBtn+'</div>';
  var cardInfo=getFlashcardInfo(q.id);

  var body='';
  if(FL_MODE==="reveal"){
    body=qpills(q)+'<div class="qtext">'+esc(q.pregunta)+progressText+'</div>'+tr(q.pregunta_en,q.pregunta_fa)+
      '<div id="flashcard">'+(v.revealed?('<div class="card" style="background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.3)"><b>Respuesta:</b> '+esc(q.opciones[q.correct])+trOption(q.opciones_en,q.opciones_fa,q.correct)+(q.explicacion?'<p class="small mut">'+esc(q.explicacion)+'</p>':'')+tr(q.explicacion_en,q.explicacion_fa)+'</div>'):'')+'</div>'+
      '<div class="row">'+(v.answered?'<p class="small mut">¡Respuesta registrada! Cargando siguiente...</p>':(v.revealed?
        '<button class="btn" id="flcorrect">✅ Correcta</button><button class="btn ghost" id="flwrong">❌ Incorrecta</button>'
        :'<button class="btn ghost" id="flshow">Mostrar respuesta</button>'))+
      '</div>';
  } else {
    body=qpills(q)+'<div class="qtext">'+esc(q.pregunta)+progressText+'</div>'+tr(q.pregunta_en,q.pregunta_fa)+
      (v.answered?'<div style="text-align:center;margin-bottom:8px;font-weight:700" class="'+(v.selectedOption===q.correct?'marker':'badmark')+'">'+(v.selectedOption===q.correct?'¡Correcta! ✅':'Incorrecta ❌')+'</div>':'')+

          (v.selectedOption!=null&&i===q.correct?' <span class="marker">✓</span>':'')+
          (v.selectedOption!=null&&i===v.selectedOption&&i!==q.correct?' <span class="badmark">✗</span>':'')+
          trOption(q.opciones_en,q.opciones_fa,i)+'</button>';
      }).join("")+'</div>'+
      (v.selectedOption==null?'<p class="small mut">Selecciona la opción correcta</p>':'');
  }
  return '<div class="card">'+header+body+
    '<p class="small mut" style="margin-top:8px">Modo '+(FL_MODE==="reveal"?"autoevaluación":"opciones múltiples")+' · Cada pregunta se presenta como máximo <b>1 vez al día</b> con un <b>intervalo de '+FLASHCARD_MIN_DAYS+' días</b>. Responde correctamente '+FLASHCARD_LEARN_COUNT+' veces para aprenderla.</p></div>';

    '<div class="stat"><b>'+learned.length+'</b><div class="small mut">Aprendidas</div></div>'+
    '<div class="stat"><b>'+u.totalCorrect+'</b><div class="small mut">Correctas totales</div></div>'+
    '<div class="stat"><b>'+u.totalAnswered+'</b><div class="small mut">Respondidas</div></div></div>'+
    '<div class="card"><h2 style="margin-bottom:8px">Últimos intentos</h2>'+(attempts.length?'<table><tr><th>Tipo</th><th>Resultado</th><th>Fecha</th></tr>'+attempts.slice(0,10).map(function(a){return '<tr><td>'+(a.type==="simulador"?"Simulador":"Lectura")+'</td><td>'+a.score+'/'+a.total+' <span class="badge '+(a.passed?'ok':'no')+'">'+(a.passed?'Aprobado':'No aprobado')+'</span></td><td class="small mut">'+new Date(a.at).toLocaleString()+'</td></tr>';}).join("")+'</table>':'<p class="small mut">Aún no hay intentos registrados.</p>')+'</div>'+
    '<div class="card"><h2 style="margin-bottom:8px">Preguntas aprendidas <span class="pill green">'+learned.length+'</span></h2>'+(learned.length?learned.slice(0,40).map(function(id){var q=byHistId(id);var card=getFlashcardInfo(id);return '<div class="small" style="margin:4px 0;display:flex;justify-content:space-between">'+
      '<span>• '+esc(q.pregunta)+'</span><span class="mut">✅ '+(card?card.correctCount:FLASHCARD_LEARN_COUNT)+'/'+FLASHCARD_LEARN_COUNT+'</span></div>';}).join(""):'<p class="small mut">Responde correctamente '+FLASHCARD_LEARN_COUNT+' veces en flashcards para aprender una pregunta.</p>')+'</div>'+
    '<div class="card"><h2 style="margin-bottom:8px">En repaso <span class="pill gold">'+pending.length+' pendientes</span></h2>'+(pending.length?pending.slice(0,40).map(function(p){var q=byHistId(p.id);var canReview=!p.lastReviewedAt||daysSince(p.lastReviewedAt)>=FLASHCARD_MIN_DAYS;return '<div class="small" style="margin:4px 0;display:flex;justify-content:space-between">'+
      '<span>• '+esc(q.pregunta)+' '+(canReview?'<span class="pill green" style="font-size:10px;padding:1px 6px">Disponible</span>':'<span class="pill rose" style="font-size:10px;padding:1px 6px">En espera</span>')+'</span><span class="mut">'+p.correctCount+'/'+FLASHCARD_LEARN_COUNT+'</span></div>';}).join(""):'<p class="small mut">Sin preguntas pendientes. Practica en el simulador o agrega preguntas desde el banco.</p>')+'</div>';
}

/* ---------- bind per view ---------- */
function bindView(){
  var tab=STATE.tab;
  if(tab==="sim"){
    var v=STATE.view;
    if(v.phase==="review"){ document.getElementById("again").onclick=function(){ STATE.view=null; render(); }; return; }
    document.querySelectorAll("#opts .opt").forEach(function(b){ b.onclick=function(){ v.ans[v.qs[v.idx].id]=+b.getAttribute("data-i"); render(); }; });
    var prev=document.getElementById("prev"); if(prev)prev.onclick=function(){v.idx--;render();};
    var next=document.getElementById("next"); if(next)next.onclick=function(){v.idx++;render();};
    var fin=document.getElementById("fin"); if(fin)fin.onclick=function(){submitSim(false);};
  }
  if(tab==="lec"){
    var lv=STATE.view;
    if(lv.phase==="review"){ document.getElementById("againlec").onclick=function(){ STATE.view=null; render(); }; return; }
    document.querySelectorAll(".opt[data-id]").forEach(function(b){ b.onclick=function(){ lv.ans[+b.getAttribute("data-id")]=+b.getAttribute("data-i"); render(); }; });
    document.getElementById("finlec").onclick=submitLec;
  }
  if(tab==="ent"){
    document.querySelectorAll(".opt[data-ent]").forEach(function(b){ b.onclick=function(){ STATE.sel.ent=+b.getAttribute("data-ent"); render(); }; });
    var pv=document.getElementById("prevwr"), nx=document.getElementById("nextwr");
    if(pv)pv.onclick=function(){ STATE.sel.wr=((STATE.sel.wr||0)-1+IW.writing.length)%IW.writing.length; render(); };
    if(nx)nx.onclick=function(){ STATE.sel.wr=((STATE.sel.wr||0)+1)%IW.writing.length; render(); };
  }
  if(tab==="fl"){
    var fv=STATE.flash;
    var modeBtn=document.getElementById("flmode"); if(modeBtn)modeBtn.onclick=function(){ FL_MODE=FL_MODE==="reveal"?"choice":"reveal"; if(fv){fv.revealed=false;fv.answered=false;fv.selectedOption=null;} render(); };
    var sh=document.getElementById("flshow"); if(sh)sh.onclick=function(){fv.revealed=true;render();};
    var fc=document.getElementById("flcorrect"); if(fc)fc.onclick=function(){markFlashCorrect(true);};
    var fw=document.getElementById("flwrong"); if(fw)fw.onclick=function(){markFlashCorrect(false);};
    document.querySelectorAll("[data-fli]").forEach(function(b){ b.onclick=function(){
      if(fv.selectedOption!=null) return;
      var idx=+b.getAttribute("data-fli");
      fv.selectedOption=idx;
      markFlashCorrect(idx===fv.q.correct);
    }; });
  }
  if(tab==="ban"){
    document.querySelectorAll(".tab[data-banmode]").forEach(function(b){ b.onclick=function(){ STATE.sel.banmode=b.getAttribute("data-banmode"); render(); }; });
    var bq=document.getElementById("banq"); if(bq){ bq.oninput=function(){ STATE.sel.banq=bq.value; }; }
    document.querySelectorAll("[data-addfl]").forEach(function(b){ b.onclick=function(){ addFromBank(+b.getAttribute("data-addfl")); }; });
  }
  if(tab==="pro"){ /* static */ }
}
function fmt(s){ s=Math.max(0,s|0); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
// Muestra la versión del build en el pie para verificar que el dispositivo
// (p. ej. un teléfono con caché) tenga la copia más reciente de la app.
var _av = document.getElementById("appver");
if (_av) _av.textContent = APP_VERSION;
render();
})();
</script>
